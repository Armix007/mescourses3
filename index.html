            <div style={{display:"flex",flexDirection:"column",gap:3,width:20,flexShrink:0,paddingTop:16}}>
              <div style={{height:9,display:"flex",alignItems:"center",paddingLeft:2}}>
                <span style={{fontSize:8,fontWeight:800,color:midiCount===7?SUC:midiCount>0?CARAMEL:TXT3}}>{midiCount}/7</span>
              </div>
              <div style={{height:9,display:"flex",alignItems:"center",paddingLeft:2}}>
                <span style={{fontSize:8,fontWeight:800,color:soirCount===7?SUC:soirCount>0?CARAMEL:TXT3}}>{soirCount}/7</span>
              </div>
            </div>
          </div>
        </div>

        {weekOffset!==0&&<button style={{...btn("out"),width:"100%",justifyContent:"center",fontSize:11,marginTop:8,padding:"5px"}} onClick={()=>setWeekOffset(0)}>Aujourd'hui</button>}
      </div>

      {/* Alerte anti-gaspi */}
      {redItems.length>0&&suggestions.length>0&&(
        <div style={{background:"rgba(212,96,74,.07)",border:"1px solid rgba(212,96,74,.2)",borderRadius:10,padding:"8px 12px",marginBottom:10}}>
          <div style={{fontSize:11,fontWeight:700,color:DNG,marginBottom:5}}>⚠️ À utiliser vite :</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {suggestions.map(r=>(
              <div key={r.id} style={{fontSize:11,background:SURF,border:`1px solid ${BDR}`,borderRadius:20,padding:"3px 9px",color:TXT2,cursor:"pointer",fontWeight:600}} onClick={()=>{
                let placed=false;
                for(const d of weekDates){for(const slot of MEAL_SLOTS){const dk=dateKey(d);if(getSlotIds(calendar,dk,slot).length===0){addMealToSlot(dk,slot,r.id);placed=true;break;}}if(placed)break;}
                if(!placed)showToast("⚠️ Toutes les cases sont prises");
              }}><EmojiImg emoji={guessRecipeEmoji(r.name)} size={12} style={{marginRight:3,verticalAlign:"middle"}}/>{r.name}</div>
            ))}
          </div>
        </div>
      )}

      {/* ══ JOURS ═══════════════════════════════════════════ */}
      {weekDates.map((d,di)=>{
        const dk=dateKey(d);
        const isToday=dk===todayKey;
        const isPast=new Date(dk)<new Date(new Date().setHours(0,0,0,0));
        const linkedIdx=getLinkedListIdx(dk);
        const linkedList=linkedIdx!=null?(db.shoppingHistory||[])[linkedIdx]:null;
        const midiIds=getSlotIds(calendar,dk,"midi");
        const soirIds=getSlotIds(calendar,dk,"soir");
        const hasAny=midiIds.length>0||soirIds.length>0;

        return(
          <div key={dk} style={{
            marginBottom:6,
            borderRadius:14,
            border:isToday?`2px solid ${CARAMEL2}`:hasAny?`1px solid ${BDR}`:`1px solid rgba(232,212,184,.5)`,
            background:isToday?"rgba(200,132,90,.07)":hasAny?"rgba(255,255,255,.9)":"rgba(255,255,255,.5)",
            opacity:isPast&&!isToday?.65:1,
            overflow:"hidden"
          }}>

            {/* En-tête : date + nom + chip liste */}
            <div style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",borderBottom:hasAny?`1px solid ${BDR}`:"none"}}>
              {/* Date */}
              <div style={{
                fontFamily:"'Fraunces',serif",fontSize:isToday?20:16,fontWeight:900,
                color:isToday?CARAMEL:isPast?TXT3:TXT,
                minWidth:26,textAlign:"center",flexShrink:0,lineHeight:1
              }}>{d.getDate()}</div>
              {/* Séparateur vertical */}
              <div style={{width:1,height:20,background:isToday?CARAMEL2:BDR,flexShrink:0}}/>
              {/* Nom du jour */}
              <div style={{flex:1,minWidth:0}}>
                <span style={{fontSize:13,fontWeight:isToday?800:600,color:isToday?CARAMEL:hasAny?TXT:TXT3}}>
                  {DAY_NAMES_FULL[di]}
                </span>
                {isToday&&<span style={{fontSize:10,color:CARAMEL2,fontWeight:600,marginLeft:6}}>· Aujourd'hui</span>}
              </div>
              {/* Chip liste */}
              {linkedList?(
                <div style={{display:"flex",alignItems:"center",gap:3,background:"rgba(90,138,58,.1)",border:"1px solid rgba(90,138,58,.25)",borderRadius:16,padding:"2px 7px",cursor:"pointer",flexShrink:0}} onClick={()=>setShowDayList({dk,listIdx:linkedIdx})}>
                  <span style={{fontSize:10}}>🛒</span>
                  <span style={{fontSize:8,fontWeight:700,color:SUC,maxWidth:55,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{linkedList.date}</span>
                </div>
              ):(
                <div style={{display:"flex",alignItems:"center",gap:2,border:`1px dashed rgba(232,212,184,.8)`,borderRadius:16,padding:"2px 7px",cursor:"pointer",flexShrink:0,opacity:.7}} onClick={()=>setShowListPicker(dk)}>
                  <span style={{fontSize:10,color:TXT3}}>🛒</span>
                  <span style={{fontSize:8,fontWeight:600,color:TXT3}}>lier</span>
                </div>
              )}
            </div>

            {/* Créneaux — seulement si le jour a du contenu OU pour ajouter */}
            <div style={{display:"flex",gap:0,padding:hasAny?"6px 8px":"0 8px 0"}}>
              {MEAL_SLOTS.map((slot,si)=>{
                const recipeIds=getSlotIds(calendar,dk,slot);
                const recipes=recipeIds.map(id=>(db.recipes||[]).find(r=>String(r.id)===String(id))).filter(Boolean);
                return(
                  <div key={slot} style={{
                    flex:1,
                    borderLeft:si>0?`1px solid ${BDR}`:"none",
                    paddingLeft:si>0?8:0,
                    paddingRight:si<MEAL_SLOTS.length-1?8:0,
                    paddingTop:6,paddingBottom:6,
                    minHeight:recipes.length?0:36,
                    display:"flex",flexDirection:"column"
                  }}>
                    {/* Label créneau */}
                    <div style={{fontSize:9,fontWeight:700,color:recipes.length?CARAMEL2:TXT3,marginBottom:recipes.length?5:4,letterSpacing:.3}}>
                      {MEAL_LABELS[slot]}
                    </div>
                    {/* Recettes */}
                    {recipes.map(recipe=>(
                      <div key={recipe.id} style={{display:"flex",alignItems:"center",gap:5,marginBottom:3,background:"rgba(255,255,255,.85)",borderRadius:8,padding:"4px 7px",cursor:"pointer",border:`1px solid rgba(200,132,90,.15)`}} onClick={()=>setShowActions({dk,slot,recipe,recipeId:recipe.id})}>
                        <EmojiImg emoji={guessRecipeEmoji(recipe.name)} size={13} style={{flexShrink:0}}/>
                        <div style={{fontSize:10,fontWeight:700,color:TXT,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{recipe.name}</div>
                        <span style={{fontSize:10,color:TXT3,cursor:"pointer",flexShrink:0,opacity:.6}} onClick={e=>{e.stopPropagation();removeMealFromSlot(dk,slot,recipe.id);}}>✕</span>
                      </div>
                    ))}
                    {/* Bouton ajouter */}
                    <div style={{
                      fontSize:10,color:recipes.length?CARAMEL2:TXT3,cursor:"pointer",
                      textAlign:"center",padding:"3px 0",borderRadius:6,
                      border:`1px dashed ${recipes.length?CARAMEL2:"rgba(200,132,90,.25)"}`,
                      background:recipes.length?"rgba(200,132,90,.03)":"transparent",
                      marginTop:"auto",opacity:recipes.length?1:.6
                    }} onClick={()=>setShowPicker({dk,slot,mode:"list"})}>+ Ajouter</div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}

      {/* CTA global — visible seulement si repas planifiés */}
      {(midiCount+soirCount)>0&&(
        <button style={{...btn("acc"),width:"100%",justifyContent:"center",fontSize:12,padding:"12px",marginTop:4,marginBottom:8}} onClick={generateShoppingList}>
          🛒 Générer la liste de courses ({midiCount+soirCount} repas planifiés)
        </button>
      )}

      {/* ── PICKER LISTE DU JOUR ── */}
      {showListPicker&&(
        <Modal open onClose={()=>setShowListPicker(null)}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:4,color:TXT}}>🛒 Lier une liste</div>
          <div style={{fontSize:11,color:TXT3,marginBottom:12}}>
            {new Date(showListPicker).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}
          </div>
          {!(db.shoppingHistory||[]).length?(
            <div style={{textAlign:"center",padding:"20px",color:TXT3,fontSize:12}}>
              <div style={{fontSize:32,marginBottom:8}}>📭</div>
              Aucune liste sauvegardée. Créez d'abord une liste de courses.
            </div>
          ):(
            <div style={{maxHeight:300,overflowY:"auto"}}>
              {(db.shoppingHistory||[]).map((sess,idx)=>(
                <div key={idx} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 4px",borderBottom:`1px solid ${BDR}`,cursor:"pointer"}} onClick={()=>linkListToDay(showListPicker,idx)}>
                  <span style={{fontSize:20}}>🛒</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:700,color:TXT,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{sess.date}</div>
                    <div style={{fontSize:10,color:TXT3}}>{(sess.items||[]).length} articles</div>
                  </div>
                  <span style={{color:TXT3,fontSize:16}}>›</span>
                </div>
              ))}
            </div>
          )}
        </Modal>
      )}

      {/* ── AFFICHAGE LISTE DU JOUR ── */}
      {showDayList&&(()=>{
        const{dk,listIdx}=showDayList;
        const sess=(db.shoppingHistory||[])[listIdx];
        if(!sess){setShowDayList(null);return null;}
        const dayLabel=new Date(dk).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
        return(
          <FullPage open onClose={()=>setShowDayList(null)}>
            {/* Header */}
            <div style={{background:"rgba(184,112,58,.92)",backdropFilter:"blur(10px)",padding:"14px 16px 12px",display:"flex",alignItems:"center",gap:12,flexShrink:0}}>
              <button style={{background:"rgba(255,255,255,.2)",border:"none",borderRadius:10,width:36,height:36,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:18}} onClick={()=>setShowDayList(null)}>←</button>
              <div style={{flex:1}}>
                <div style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:700,color:"white"}}>🛒 {sess.date}</div>
                <div style={{fontSize:10,color:"rgba(255,255,255,.75)",marginTop:1}}>{dayLabel} · {(sess.items||[]).length} articles</div>
              </div>
              <button style={{background:"rgba(212,96,74,.25)",border:"none",borderRadius:10,padding:"5px 10px",color:"white",fontSize:11,fontWeight:700,cursor:"pointer"}} onClick={()=>{unlinkListFromDay(dk);setShowDayList(null);}}>Détacher</button>
            </div>
            {/* Articles */}
            <div style={{flex:1,overflowY:"auto",padding:"12px 16px 20px"}}>
              {(sess.items||[]).length===0?(
                <div style={{textAlign:"center",padding:"40px 20px",color:TXT3,fontSize:13}}>Liste vide</div>
              ):(
                (sess.items||[]).map((item,i)=>(
                  <div key={item.id||i} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 0",borderBottom:i<sess.items.length-1?`1px solid ${BDR}`:"none"}}>
                    <EmojiImg emoji={getProductEmoji(item.name)} size={18} style={{flexShrink:0}}/>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:600,color:TXT}}>{item.name}</div>
                      {(item.quantities||[]).filter(q=>q.qty>0||q.unit).length>0&&(
                        <div style={{fontSize:10,color:TXT3}}>{(item.quantities||[]).map(q=>fmtQ(q.qty,q.unit)).filter(Boolean).join(" + ")}</div>
                      )}
                    </div>
                    <span style={{fontSize:10,color:TXT3}}>{(item.category||getCat(item.name)).split(" ")[0]}</span>
                  </div>
                ))
              )}
            </div>
            {/* Ajouter un article */}
            <div style={{borderTop:`1px solid ${BDR}`,padding:"10px 16px",background:"rgba(253,248,240,.97)",flexShrink:0}}>
              <div style={{fontSize:10,fontWeight:700,color:TXT3,marginBottom:6,textTransform:"uppercase",letterSpacing:.6}}>Ajouter un article</div>
              <div style={{display:"flex",gap:8}}>
                <input style={{...inp,flex:1,fontSize:13,padding:"9px 12px"}} placeholder="Nom de l'article…" value={dayListAddName}
                  onChange={e=>setDayListAddName(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&addItemToDayList(dk,listIdx,dayListAddName)}
                />
                <button style={{...btn("acc"),padding:"9px 16px",flexShrink:0}} onClick={()=>addItemToDayList(dk,listIdx,dayListAddName)}>+</button>
              </div>
            </div>
          </FullPage>
        );
      })()}

      {showPicker&&(
        <Modal open onClose={()=>{setShowPicker(null);setFreeText("");setAIWish("");setAiManualIngreds("");setAIPantrySelected(new Set());setPickerSearch("");setPickerFilterDiet("");setPickerFilterDiff("");setPickerFilterType("");setPickerFilterTime("");}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:17,marginBottom:4,color:TXT}}>Que planifier ?</div>
          <div style={{fontSize:11,color:TXT3,marginBottom:10}}>
            {DAY_NAMES_FULL[new Date(showPicker.dk).getDay()===0?6:new Date(showPicker.dk).getDay()-1]} · {MEAL_LABELS[showPicker.slot]}
          </div>
          <div style={{marginBottom:10}}>
            <div style={{position:"relative",marginBottom:7}}>
              <input style={{...inp,paddingLeft:30,fontSize:12,padding:"9px 9px 9px 30px"}} placeholder="Chercher par nom ou ingrédient…" value={pickerSearch} onChange={e=>setPickerSearch(e.target.value)}/>
              <span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",fontSize:12,pointerEvents:"none"}}>🔍</span>
              {pickerSearch&&<span style={{position:"absolute",right:9,top:"50%",transform:"translateY(-50%)",fontSize:12,cursor:"pointer",color:TXT3}} onClick={()=>setPickerSearch("")}>✕</span>}
            </div>
            <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:4}}>
              {[{id:"",label:"Tous régimes"},{id:"veg",label:"🌱 Végé"},{id:"vegan",label:"🌿 Vegan"},{id:"gf",label:"🚫🌾 Sans gluten"},{id:"lf",label:"🥛 Sans lactose"},{id:"fish",label:"🐟 Poisson"},{id:"meat",label:"🥩 Viande"}].map(f=>(
                <span key={f.id} style={{fontSize:10,padding:"3px 7px",borderRadius:12,cursor:"pointer",fontWeight:600,background:pickerFilterDiet===f.id?CARAMEL:CREAM2,color:pickerFilterDiet===f.id?"white":TXT3,border:`1px solid ${pickerFilterDiet===f.id?CARAMEL:BDR}`}} onClick={()=>setPickerFilterDiet(pickerFilterDiet===f.id?"":f.id)}>{f.label}</span>
              ))}
            </div>
            <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:4}}>
              {[{id:"",label:"Difficulté"},{id:"easy",label:"😊 Facile"},{id:"medium",label:"👨‍🍳 Moyen"},{id:"hard",label:"🎓 Expert"}].map(f=>(
                <span key={f.id} style={{fontSize:10,padding:"3px 7px",borderRadius:12,cursor:"pointer",fontWeight:600,background:pickerFilterDiff===f.id?CARAMEL:CREAM2,color:pickerFilterDiff===f.id?"white":TXT3,border:`1px solid ${pickerFilterDiff===f.id?CARAMEL:BDR}`}} onClick={()=>setPickerFilterDiff(pickerFilterDiff===f.id?"":f.id)}>{f.label}</span>
              ))}
            </div>
            <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:4}}>
              {[{id:"",label:"Type"},{id:"breakfast",label:"🌅 Petit-déj"},{id:"starter",label:"🥗 Entrée"},{id:"main",label:"🍽️ Plat"},{id:"dessert",label:"🍰 Dessert"},{id:"snack",label:"🫐 Snack"}].map(f=>(
                <span key={f.id} style={{fontSize:10,padding:"3px 7px",borderRadius:12,cursor:"pointer",fontWeight:600,background:pickerFilterType===f.id?CARAMEL:CREAM2,color:pickerFilterType===f.id?"white":TXT3,border:`1px solid ${pickerFilterType===f.id?CARAMEL:BDR}`}} onClick={()=>setPickerFilterType(pickerFilterType===f.id?"":f.id)}>{f.label}</span>
              ))}
            </div>
            <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
              {[{id:"",label:"Durée"},{id:"fast",label:"⚡ <30min"},{id:"mid",label:"🕐 30-60min"},{id:"slow",label:"🐢 >1h"}].map(f=>(
                <span key={f.id} style={{fontSize:10,padding:"3px 7px",borderRadius:12,cursor:"pointer",fontWeight:600,background:pickerFilterTime===f.id?CARAMEL:CREAM2,color:pickerFilterTime===f.id?"white":TXT3,border:`1px solid ${pickerFilterTime===f.id?CARAMEL:BDR}`}} onClick={()=>setPickerFilterTime(pickerFilterTime===f.id?"":f.id)}>{f.label}</span>
              ))}
            </div>
          </div>
          <div style={{display:"flex",gap:5,marginBottom:12}}>
            {[{id:"list",label:"📖 Mes recettes"},{id:"ai",label:"🤖 Créer via IA"},{id:"free",label:"✏️ Nom libre"}].map(m=>(
              <div key={m.id} style={{flex:1,textAlign:"center",padding:"7px 4px",borderRadius:10,fontSize:10,fontWeight:700,cursor:"pointer",background:(showPicker.mode||"list")===m.id?CARAMEL:CREAM2,color:(showPicker.mode||"list")===m.id?"white":TXT2,border:`1px solid ${(showPicker.mode||"list")===m.id?CARAMEL:BDR}`}} onClick={()=>setShowPicker(p=>({...p,mode:m.id}))}>{m.label}</div>
            ))}
          </div>
          {(showPicker.mode||"list")==="list"&&(()=>{
            const filtered=applyPickerFilters(db.recipes||[]);
            if(!(db.recipes||[]).filter(r=>r.source!=="libre").length){
              return(
                <div style={{textAlign:"center",padding:"20px",color:TXT3,fontSize:12}}>
                  Aucune recette — créez d'abord vos recettes
                  <button style={{...btn("out"),width:"100%",justifyContent:"center",marginTop:10,fontSize:11}} onClick={()=>{setShowPicker(null);goToRecettes();}}>→ Aller aux recettes</button>
                </div>
              );
            }
            return(
              <div style={{maxHeight:300,overflowY:"auto"}}>
                {hasPickerFilters&&filtered.length===0&&<div style={{textAlign:"center",padding:12,color:TXT3,fontSize:12}}>Aucune recette ne correspond aux filtres</div>}
                {suggestions.length>0&&!hasPickerFilters&&(
                  <div style={{marginBottom:8}}>
                    <div style={{fontSize:10,fontWeight:700,color:DNG,marginBottom:5}}>⚠️ Anti-gaspi :</div>
                    {suggestions.map(r=>(
                      <div key={"s"+r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 8px",borderRadius:10,background:"rgba(212,96,74,.06)",border:`1px solid rgba(212,96,74,.2)`,cursor:"pointer",marginBottom:5}} onClick={()=>addMealToSlot(showPicker.dk,showPicker.slot,r.id)}>
                        <EmojiImg emoji={guessRecipeEmoji(r.name)} size={20}/>
                        <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:TXT}}>{r.name}</div>{r.duration&&<div style={{fontSize:10,color:TXT3}}>⏱️ {r.duration}</div>}</div>
                      </div>
                    ))}
                    <div style={{borderBottom:`1px solid ${BDR}`,marginBottom:8}}/>
                  </div>
                )}
                {filtered.map(r=>(
                  <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 4px",borderBottom:`1px solid ${BDR}`,cursor:"pointer"}} onClick={()=>addMealToSlot(showPicker.dk,showPicker.slot,r.id)}>
                    <EmojiImg emoji={guessRecipeEmoji(r.name)} size={20} style={{flexShrink:0}}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:700,color:TXT,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}</div>
                      <div style={{fontSize:10,color:TXT3}}>{r.duration&&<span style={{marginRight:6}}>⏱️ {r.duration}</span>}{r.persons&&<span>👥 {r.persons} pers.</span>}</div>
                    </div>
                    <span style={{color:TXT3,fontSize:16}}>›</span>
                  </div>
                ))}
              </div>
            );
          })()}
          {(showPicker.mode)==="ai"&&(
            <div>
              {pantry.length>0&&(
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:700,color:TXT2,marginBottom:5}}>🏠 Depuis mon placard (cliquez pour sélectionner) :</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:5,maxHeight:90,overflowY:"auto"}}>
                    {pantry.map(item=>{
                      const isSel=aiPantrySelected.has(item.id);
                      return(
                        <div key={item.id} onClick={()=>{const s=new Set(aiPantrySelected);isSel?s.delete(item.id):s.add(item.id);setAIPantrySelected(s);}}
                          style={{padding:"4px 10px",borderRadius:16,fontSize:11,fontWeight:600,cursor:"pointer",
                            background:isSel?CARAMEL2:"rgba(255,255,255,.8)",color:isSel?"white":TXT2,
                            border:`1.5px solid ${isSel?CARAMEL2:BDR}`}}>
                          {getCat(item.name).split(" ")[0]} {item.name}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
              <div style={{marginBottom:10}}>
                <div style={{fontSize:11,fontWeight:700,color:TXT2,marginBottom:4}}>✍️ Ingrédients supplémentaires (optionnel) :</div>
                <input style={{...inp,fontSize:12}} placeholder="Ex: courgettes, riz, tomates…" value={aiManualIngreds} onChange={e=>setAiManualIngreds(e.target.value)}/>
              </div>
              <div style={{marginBottom:12}}>
                <div style={{fontSize:11,fontWeight:700,color:TXT2,marginBottom:4}}>✨ Remarques libres (optionnel) :</div>
                <textarea style={{...inp,resize:"none",minHeight:52,fontSize:12}} placeholder="Ex: Lasagne végétarienne, plat rapide, sans lactose…" value={aiWish} onChange={e=>setAIWish(e.target.value)}/>
              </div>
              {calAILoading?(
                <div style={{textAlign:"center",padding:"12px 0",fontSize:13,color:TXT3}}>⏳ Génération en cours…</div>
              ):(
                <button style={{...btn("acc"),width:"100%",justifyContent:"center"}} onClick={()=>{
                  const pantryNames=pantry.filter(i=>aiPantrySelected.has(i.id)).map(i=>i.name);
                  generateAIMeal(showPicker.dk,showPicker.slot,pantryNames,aiManualIngreds,aiWish);
                }}>🤖 Générer la recette</button>
              )}
            </div>
          )}
          {(showPicker.mode)==="free"&&(
            <div>
              <div style={{fontSize:12,color:TXT2,marginBottom:8}}>Entrez simplement le nom du repas :</div>
              <input style={{...inp,marginBottom:10}} placeholder="Ex: Raclette, Sushi maison, Pizza…" value={freeText} onChange={e=>setFreeText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&freeText.trim()&&addFreeTextMeal(showPicker.dk,showPicker.slot,freeText)} autoFocus/>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,cursor:"pointer",padding:"8px 10px",background:CREAM2,borderRadius:10,border:`1px solid ${BDR}`}} onClick={()=>setFreeAddToRecipes(!freeAddToRecipes)}>
                <div style={{width:18,height:18,borderRadius:5,border:freeAddToRecipes?"none":`1.5px solid ${BDR}`,background:freeAddToRecipes?CARAMEL:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  {freeAddToRecipes&&<span style={{color:"white",fontSize:10,fontWeight:800}}>✓</span>}
                </div>
                <span style={{fontSize:12,color:TXT2,fontWeight:500}}>Ajouter aussi aux Recettes</span>
              </div>
              <button style={{...btn("acc"),width:"100%",justifyContent:"center"}} disabled={!freeText.trim()} onClick={()=>addFreeTextMeal(showPicker.dk,showPicker.slot,freeText)}>✅ Planifier "{freeText||"…"}"</button>
            </div>
          )}
        </Modal>
      )}

      {showActions&&(
        <Modal open onClose={()=>setShowActions(null)}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
            <EmojiImg emoji={guessRecipeEmoji(showActions.recipe.name)} size={32}/>
            <div>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:16,color:TXT}}>{showActions.recipe.name}</div>
              <div style={{fontSize:11,color:TXT3}}>{DAY_NAMES_FULL[new Date(showActions.dk).getDay()===0?6:new Date(showActions.dk).getDay()-1]} · {MEAL_LABELS[showActions.slot]}</div>
            </div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            <button style={{...btn("out"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>{setShowPicker({dk:showActions.dk,slot:showActions.slot,mode:"list"});setShowActions(null);}}>+ Ajouter une autre recette à ce créneau</button>
            <button style={{...btn("dng"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>removeMealFromSlot(showActions.dk,showActions.slot,showActions.recipeId)}>🗑️ Retirer ce repas</button>
            <button style={{...btn("gh"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>setShowActions(null)}>Fermer</button>
          </div>
        </Modal>
      )}

      {/* Wizard Ajouter à la liste */}
      {showWizard&&wizardQueue.length>0&&(()=>{
        const current=wizardQueue[wizardStep];
        if(!current){setTimeout(()=>{setShowWizard(false);goToListe();},0);return null;}
        const recipe=current.recipe;
        if(!recipe||!recipe.name){setTimeout(()=>{setWizardStep(s=>s+1);},0);return null;}
        const isLast=wizardStep>=wizardQueue.length-1;
        const dayLabel=new Date(current.dk).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"short"});
        return(
          <WizardStep
            recipe={recipe}
            dayLabel={dayLabel}
            slot={MEAL_LABELS[current.slot]}
            stepNum={wizardStep+1}
            totalSteps={wizardQueue.length}
            isLast={isLast}
            priceDB={db.priceDB}
            onNext={(vp,haveIdxs)=>{
              const newItems=finishWizardStep(recipe,vp,haveIdxs,wizardItems);
              if(isLast){
                const nd={...db,items:newItems};setDb(nd);saveDB(nd);
                setShowWizard(false);setWizardStep(0);setWizardQueue([]);setWizardItems([]);
                // Proposer de sauvegarder comme liste du jour
                if(wizardSaveDk&&newItems.length){
                  saveWizardResultAsDayList(newItems,wizardSaveDk);
                }
                goToListe();showToast("✅ Liste générée ! Bon shopping 🛒");
              } else {setWizardItems(newItems);setWizardStep(s=>Math.min(s+1,wizardQueue.length-1));}
            }}
            onPrev={wizardStep>0?()=>setWizardStep(s=>s-1):null}
            onSkip={()=>{
              if(isLast){
                const nd={...db,items:wizardItems};setDb(nd);saveDB(nd);
                setShowWizard(false);setWizardStep(0);setWizardQueue([]);setWizardItems([]);
                goToListe();showToast("✅ Liste générée !");
              } else {setWizardStep(s=>Math.min(s+1,wizardQueue.length-1));}
            }}
            onCancel={()=>{setShowWizard(false);setWizardStep(0);setWizardQueue([]);setWizardItems([]);showToast("❌ Wizard annulé");}}
          />
        );
      })()}
    </div>
  );
}


// ─── WIZARD STEP (flux guidé Ajouter à la liste) ────────────────
function WizardStep({recipe,dayLabel,slot,stepNum,totalSteps,isLast,priceDB,onNext,onPrev,onSkip,onCancel}){
  const [vp,setVp]=useState(recipe.persons||2);
  const [have,setHave]=useState(new Set());
  const base=recipe.persons||1;
  const scale=vp/base;
  const cost=estimateRecipeCost(recipe,priceDB,vp);

  function togHave(i){const s=new Set(have);if(s.has(i))s.delete(i);else s.add(i);setHave(s);}
  function scaleQ(qty){const n=parseFloat(qty);if(isNaN(n))return qty;const r=n*scale;return r%1===0?String(r):r.toFixed(2).replace(/\.?0+$/,"");}

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:300,display:"flex",alignItems:"flex-end"}}>
      <div style={{width:"100%",background:SURF,borderRadius:"20px 20px 0 0",padding:"20px 16px 32px",maxHeight:"88vh",overflowY:"auto"}}>
        {/* Progress */}
        <div style={{display:"flex",gap:4,marginBottom:14}}>
          {Array.from({length:totalSteps}).map((_,i)=>(
            <div key={i} style={{flex:1,height:4,borderRadius:2,background:i<stepNum-1?SUC:i===stepNum-1?CARAMEL2:BDR}}/>
          ))}
        </div>
        {/* Header */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
          <div>
            <div style={{fontSize:11,color:TXT3,fontWeight:700,marginBottom:2}}>{stepNum}/{totalSteps} — {dayLabel} · {slot}</div>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:20,color:TXT,fontWeight:700}}>{recipe.name}</div>
          </div>
          <button style={{background:"none",border:"none",color:TXT3,fontSize:18,cursor:"pointer",padding:4}} onClick={onCancel}>✕</button>
        </div>
        {/* Personnes */}
        <div style={{display:"flex",alignItems:"center",gap:10,background:CREAM,border:`1px solid ${BDR}`,borderRadius:10,padding:"10px 14px",marginBottom:12}}>
          <label style={{fontSize:13,flex:1,color:TXT2}}>🍽️ Nombre de personnes</label>
          <Stepper value={vp} onChange={setVp}/>
        </div>
        {scale!==1&&<div style={{fontSize:11,color:CARAMEL2,textAlign:"center",marginBottom:10}}>Quantités ajustées ×{scale.toFixed(2).replace(/\.?0+$/,"")}</div>}
        {/* Ingrédients */}
        <div style={{fontSize:11,fontWeight:700,color:TXT2,marginBottom:6}}>Cochez ce que vous avez déjà :</div>
        <div style={{background:CREAM,border:`1px solid ${BDR}`,borderRadius:10,padding:"6px 12px",marginBottom:12}}>
          {(recipe.ingredients||[]).map((ing,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:i<recipe.ingredients.length-1?`1px solid ${BDR}`:"none",fontSize:13}}>
              <div onClick={()=>togHave(i)} style={{width:20,height:20,borderRadius:5,border:have.has(i)?"none":`1.5px solid ${BDR}`,background:have.has(i)?SUC:"transparent",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}>
                {have.has(i)&&<span style={{color:"white",fontSize:11,fontWeight:700}}>✓</span>}
              </div>
              <span style={{flex:1,textDecoration:have.has(i)?"line-through":"none",opacity:have.has(i)?.5:1}}>{ing.name}</span>
              <span style={{color:TXT3,fontSize:12}}>{scaleQ(ing.qty)}{ing.unit?" "+ing.unit:""}</span>
            </div>
          ))}
        </div>
        {cost&&<div style={{fontSize:11,color:SUC,textAlign:"center",marginBottom:12,fontWeight:700}}>~{cost.total.toFixed(2)}€ estimé · {cost.matched}/{cost.outOf} prix connus</div>}
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          {onPrev&&<button style={{...btn("gh"),padding:"10px 14px",fontSize:13}} onClick={onPrev}>← Retour</button>}
          <button style={{...btn("gh"),flex:1}} onClick={onSkip}>Passer →</button>
          <button style={{...btn(isLast?"suc":"acc"),flex:2}} onClick={()=>onNext(vp,have)}>
            {isLast?"✅ Ajouter à la liste":"Recette suivante →"}
          </button>
        </div>
        <button style={{...btn("dng"),width:"100%",justifyContent:"center",fontSize:12}} onClick={onCancel}>✕ Annuler le wizard</button>
      </div>
    </div>
  );
}


// ═══════════════════════════════════════════════════════════════
// PAGE PARAMÈTRES — Phase 9
// ═══════════════════════════════════════════════════════════════
function PageParametres({db,setDb,showToast,pseudo,setPseudo,docId,onLogout,setShowApiKeyGlobal}){
  const [newPseudo,setNewPseudo]=useState(pseudo);
  const [budgetInput,setBudgetInput]=useState(String(db.budget?.monthly||0));
  const [showPrices,setShowPrices]=useState(localStorage.getItem("ws_prices_visible")!=="false");
  const [defaultPersons,setDefaultPersons]=useState(localStorage.getItem("ws_default_persons")||"2");
  const foyerId=localStorage.getItem("ws_foyerid")||"";

  function savePseudo(){
    if(!newPseudo.trim())return;
    setPseudo(newPseudo.trim());localStorage.setItem("ws_pseudo",newPseudo.trim());
    showToast("✅ Pseudo mis à jour");
  }
  function saveBudget(){
    const v=parseFloat(budgetInput)||0;
    const nd={...db,budget:{...db.budget,monthly:v}};setDb(nd);saveDB(nd);
    showToast("💰 Budget mis à jour");
  }
  function togglePrices(v){
    setShowPrices(v);localStorage.setItem("ws_prices_visible",v?"true":"false");
    showToast(v?"🟢 Prix visibles":"🔴 Prix masqués");
  }
  function saveDefaultPersons(v){setDefaultPersons(v);localStorage.setItem("ws_default_persons",v);}
  function exportData(){
    const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;
    a.download=`wisely-export-${new Date().toISOString().slice(0,10)}.json`;
    a.click();URL.revokeObjectURL(url);showToast("📦 Export téléchargé !");
  }
  function copyInviteLink(){
    const fid=localStorage.getItem("ws_foyerid");
    if(!fid){showToast("⚠️ Reconnectez-vous d'abord");return;}
    const link=`${window.location.origin}${window.location.pathname}?invite=${fid}`;
    navigator.clipboard.writeText(link).then(()=>showToast("🔗 Lien copié !"));
  }

  const Row=({icon,label,children,border=true})=>(
    <div style={{display:"flex",alignItems:"center",gap:12,padding:"13px 16px",borderBottom:border?`1px solid ${BDR}`:"none"}}>
      <EmojiImg emoji={icon} size={20} style={{flexShrink:0}}/>
      <div style={{flex:1,fontSize:13,fontWeight:600,color:TXT}}>{label}</div>
      <div style={{flexShrink:0}}>{children}</div>
    </div>
  );
  const Section=({title,children})=>(
    <div style={{marginBottom:16}}>
      <div style={{fontSize:11,fontWeight:800,color:TXT3,letterSpacing:.8,textTransform:"uppercase",marginBottom:8,paddingLeft:4}}>{title}</div>
      <div style={{...card,background:"rgba(255,255,255,.9)",padding:0,overflow:"hidden"}}>{children}</div>
    </div>
  );

  return(
    <div style={{padding:14,paddingBottom:90}}>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:22,color:TXT,marginBottom:16}}>⚙️ Paramètres</div>
      <Section title="Profil">
        <div style={{padding:"13px 16px",borderBottom:`1px solid ${BDR}`}}>
          <div style={{fontSize:11,color:TXT3,marginBottom:5}}>Pseudo</div>
          <div style={{display:"flex",gap:8}}>
            <input style={{...inp,flex:1,marginBottom:0}} value={newPseudo} onChange={e=>setNewPseudo(e.target.value)}/>
            <button style={{...btn("acc"),padding:"8px 12px"}} onClick={savePseudo}>💾</button>
          </div>
        </div>
        <div style={{padding:"13px 16px",borderBottom:`1px solid ${BDR}`}}>
          <div style={{fontSize:11,color:TXT3,marginBottom:4}}>ID Foyer</div>
          <div style={{fontFamily:"monospace",fontSize:11,color:TXT2,background:CREAM2,padding:"6px 10px",borderRadius:8,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{foyerId||"—"}</div>
        </div>
        <div style={{padding:"13px 16px"}}>
          <button style={{...btn("out"),width:"100%",justifyContent:"center",fontSize:12}} onClick={copyInviteLink}>🔗 Copier le lien d'invitation</button>
        </div>
      </Section>
      <Section title="Préférences">
        <Row icon="💰" label="Afficher les prix" border>
          <div style={{width:40,height:22,borderRadius:11,background:showPrices?SUC:BDR,cursor:"pointer",position:"relative",transition:"background .2s"}} onClick={()=>togglePrices(!showPrices)}>
            <div style={{position:"absolute",top:3,left:showPrices?20:3,width:16,height:16,borderRadius:"50%",background:"white",transition:"left .2s"}}/>
          </div>
        </Row>
        <Row icon="👥" label="Personnes par défaut" border={false}>
          <select style={{...sel,width:60,marginBottom:0}} value={defaultPersons} onChange={e=>saveDefaultPersons(e.target.value)}>
            {[1,2,3,4,5,6].map(n=><option key={n} value={n}>{n}</option>)}
          </select>
        </Row>
      </Section>
      <Section title="Budget">
        <div style={{padding:"13px 16px"}}>
          <div style={{fontSize:11,color:TXT3,marginBottom:5}}>Budget mensuel (€)</div>
          <div style={{display:"flex",gap:8}}>
            <input style={{...inp,flex:1,marginBottom:0,fontSize:16,textAlign:"center"}} type="number" min="0" placeholder="400" value={budgetInput} onChange={e=>setBudgetInput(e.target.value)}/>
            <button style={{...btn("acc"),padding:"8px 12px"}} onClick={saveBudget}>💾</button>
          </div>
          <div style={{fontSize:10,color:TXT3,marginTop:4}}>Actuel : {db.budget?.monthly||0} €/mois</div>
        </div>
      </Section>
      <Section title="Clé API Anthropic">
        <div style={{padding:"13px 16px"}}>
          <div style={{fontSize:11,color:TXT3,marginBottom:6}}>Pour le scan IA & la génération de recettes</div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <div style={{flex:1,fontSize:12,color:localStorage.getItem("ws_apikey")?SUC:DNG,fontWeight:700}}>
              {localStorage.getItem("ws_apikey")?"✅ Configurée":"❌ Non configurée"}
            </div>
            <button style={{...btn("acc"),fontSize:11,padding:"7px 12px"}} onClick={()=>setShowApiKeyGlobal(true)}>🔑 Modifier</button>
          </div>
        </div>
      </Section>
      <Section title="Données">
        <Row icon="📦" label="Exporter mes données" border>
          <button style={{...btn("gh"),fontSize:11,padding:"6px 12px"}} onClick={exportData}>Export</button>
        </Row>
        <Row icon="🗑️" label="Vider la liste" border>
          <button style={{...btn("gh"),fontSize:11,padding:"6px 12px",color:DNG}} onClick={()=>{if(!confirm("Vider la liste ?"))return;const nd={...db,items:[]};setDb(nd);saveDB(nd);showToast("🗑️ Liste vidée");}}>Vider</button>
        </Row>
        <Row icon="🕐" label="Vider l'historique" border={false}>
          <button style={{...btn("gh"),fontSize:11,padding:"6px 12px",color:DNG}} onClick={()=>{if(!confirm("Supprimer l'historique ?"))return;const nd={...db,shoppingHistory:[],productHistory:{}};setDb(nd);saveDB(nd);showToast("🗑️ Historique effacé");}}>Effacer</button>
        </Row>
      </Section>
      <Section title="Compte">
        <Row icon="🔒" label="Se déconnecter" border={false}>
          <button style={{...btn("dng"),fontSize:11,padding:"6px 14px"}} onClick={onLogout}>Déconnexion</button>
        </Row>
      </Section>
      <div style={{textAlign:"center",padding:"12px 0 4px",fontSize:10,color:TXT3}}>
        🍽️ Wiselifood — Phase 9 · Fait avec ❤️
      </div>
    </div>
  );
}

// APP ROOT
// ═══════════════════════════════════════════════════════════════
function App(){
  const [page,setPage]=useState("liste");
  const [showSettings,setShowSettings]=useState(false);
  const [db,setDb]=useState(EMPTY_DB);
  const [toast,setToast]=useState("");
  const [pseudo,setPseudo]=useState(()=>localStorage.getItem("ws_pseudo")||"");
  const [docId,setDocId]=useState(()=>localStorage.getItem("ws_docid")||null);
  const [fbReady,setFbReady]=useState(true); // toujours démarrer, Firebase se sync en arrière-plan
  const [showApiKeyGlobal,setShowApiKeyGlobal]=useState(false);
  const ttRef=useRef(null);
  const localRef=useRef(false);

  // Attendre que Firebase soit prêt (fallback 3s)
  useEffect(()=>{
    loadProductsCatalog();
    loadLocalMealDB();
    if(window._firebaseReady){setFbReady(true);return;}
    const h=()=>setFbReady(true);
    window.addEventListener("firebaseReady",h);
    const t=setTimeout(()=>setFbReady(true),3000);
    return()=>{window.removeEventListener("firebaseReady",h);clearTimeout(t);};
  },[]);

  // Écouter les changements Firestore en temps réel
  useEffect(()=>{
    if(!docId||!fbReady)return;
    const{fsdb,doc,onSnapshot}=window._firebase;
    const ref=doc(fsdb,"households",docId);
    const unsub=onSnapshot(ref,snap=>{
      if(!snap.exists())return;
      if(localRef.current){localRef.current=false;return;}
      const data=snap.data();
      setDb({
        items:data.items||[],
        productHistory:data.productHistory||{},
        recipes:data.recipes||[],
        shoppingHistory:data.shoppingHistory||[],
        priceDB:data.priceDB||{},
        budget:data.budget||{monthly:0,sessions:[]},
        folders:data.folders||[],
        likedRecipes:data.likedRecipes||[],
        pantry:data.pantry||[],
        calendar:data.calendar||{},
        editSession:data.editSession||null
      });
    });
    return()=>unsub();
  },[docId,fbReady]);

  function showToast(msg,duration=2800){setToast(msg);clearTimeout(ttRef.current);ttRef.current=setTimeout(()=>setToast(""),duration);}

  // Sauvegarder dans Firestore + localStorage
  function setDbSync(newDb){
    setDb(newDb);
    // localStorage fallback
    try{localStorage.setItem("ws_r1",JSON.stringify(newDb));}catch(_e){}
    // Firestore sync
    if(docId&&fbReady){
      localRef.current=true;
      const{fsdb,doc,setDoc}=window._firebase;
      const ref=doc(fsdb,"households",docId);
      setDoc(ref,{
        items:newDb.items||[],
        productHistory:newDb.productHistory||{},
        recipes:newDb.recipes||[],
        shoppingHistory:newDb.shoppingHistory||[],
        priceDB:newDb.priceDB||{},
        budget:newDb.budget||{monthly:0,sessions:[]},
        folders:newDb.folders||[],
        likedRecipes:newDb.likedRecipes||[],
        pantry:newDb.pantry||[],
        calendar:newDb.calendar||{},
        editSession:newDb.editSession||null
      }).catch(e=>console.error("Sync error:",e));
    }
  }

  function handleLogin(id,name){
    setDocId(id);
    setPseudo(name||localStorage.getItem("ws_pseudo")||"");
  }

  function handleLogout(){
    localStorage.removeItem("ws_docid");
    localStorage.removeItem("ws_foyerid");
    // Ne pas supprimer ws_pseudo et ws_pwd_saved si "se souvenir" était coché
    setDocId(null);
    setDb(EMPTY_DB);
  }

  if(!fbReady){
    return(
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:TXT3,fontSize:14,fontWeight:600}}>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:40,marginBottom:12}}>🛒</div>
          Chargement…
        </div>
      </div>
    );
  }

  if(!docId){
    return <LoginScreen onLogin={handleLogin}/>;
  }

  return(
    <div style={{minHeight:"100vh",maxWidth:480,margin:"0 auto",fontFamily:"'Plus Jakarta Sans',sans-serif",color:TXT,position:"relative",overflowX:"hidden"}}>
      {/* HEADER */}
      <div style={{padding:"10px 14px 0",position:"relative"}}>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 80% 20%, rgba(255,255,255,.12) 0%, transparent 60%)",pointerEvents:"none"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",position:"relative",padding:"0"}}>
          {/* GAUCHE: Logo */}
          <div style={{display:"flex",alignItems:"center",flexShrink:0}}>
            <img src={window._WS_LOGO||""} alt="Wiselifood" style={{width:90,height:90,objectFit:"contain"}}/>
          </div>
          {/* CENTRE: Titre */}
          <div style={{textAlign:"center",flex:1}}>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:900,color:"white",letterSpacing:2,lineHeight:1.1}}>Wiselifood</div>
            <div style={{fontSize:10,color:"rgba(255,255,255,.55)",letterSpacing:1.5,textTransform:"uppercase",marginTop:2,fontWeight:600}}>Wise · Life · Food</div>
          </div>
          {/* DROITE: Settings + Pseudo */}
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",justifyContent:"center",gap:4,flexShrink:0}}>
            <button style={{background:"rgba(255,255,255,.2)",border:"1.5px solid rgba(255,255,255,.35)",color:"white",borderRadius:10,padding:"5px 10px",fontWeight:700,fontSize:14,cursor:"pointer",lineHeight:1}} title="Parametres" onClick={()=>setShowSettings(true)}>&#9881;&#65039;</button>
            {pseudo?<div style={{fontSize:10,color:"rgba(255,255,255,.85)",fontWeight:600,whiteSpace:"nowrap"}}>Bonjour {pseudo} 👋</div>:<div style={{fontSize:10,color:"rgba(255,255,255,.55)",fontWeight:600}}>☁️ Sync</div>}
          </div>
        </div>
        {/* NAV TABS — bottom, 4 onglets */}
      </div>
      {/* PAGE CONTENT */}
      <div style={{background:"rgba(255,255,255,.04)",minHeight:"calc(100vh - 120px)"}}>
        {page==="liste"&&<PageListe db={db} setDb={setDbSync} showToast={showToast} goToPlanning={()=>setPage("calendrier")}/>}
        {page==="recettes"&&<PageRecettes db={db} setDb={setDbSync} showToast={showToast}/>}
        {page==="prix"&&<PagePrix db={db} setDb={setDbSync} showToast={showToast}/>}
        {page==="placard"&&<PagePlacard db={db} setDb={setDbSync} showToast={showToast} goToRecettes={()=>setPage("recettes")} goToListe={()=>setPage("liste")}/>}
        {page==="calendrier"&&<PageCalendrier db={db} setDb={setDbSync} showToast={showToast} goToRecettes={()=>setPage("recettes")} goToListe={()=>setPage("liste")}/>}
        {page==="historique"&&<PageHistorique db={db} setDb={setDbSync} showToast={showToast} goToListe={()=>setPage("liste")}/>}
        {page==="parametres"&&<PageParametres db={db} setDb={setDbSync} showToast={showToast} pseudo={pseudo} setPseudo={setPseudo} docId={docId} setShowApiKeyGlobal={setShowApiKeyGlobal} onLogout={()=>{["ws_docid","ws_r1","ws_foyerid","ws_pwd_saved"].forEach(k=>localStorage.removeItem(k));window.location.reload();}}/>}
        {page==="maison"&&(
          <div style={{padding:14,paddingBottom:90}}>
            {(()=>{
              const sessions=db.budget?.sessions||[];
              const monthly=db.budget?.monthly||0;
              const spent=sessions.reduce((s,x)=>s+(x.total||0),0);
              const pct=monthly>0?Math.min(100,Math.round(spent/monthly*100)):0;
              const remaining=monthly>0?monthly-spent:null;
              return(
                <div>
                  <div style={{...card,marginBottom:14}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                      <div style={{fontFamily:"'Fraunces',serif",fontSize:16,color:TXT,fontWeight:700}}>Budget du mois</div>
                      {monthly>0&&<div style={{fontSize:12,fontWeight:700,color:remaining>=0?SUC:DNG}}>{remaining>=0?remaining.toFixed(2)+"&#8364; restants":"-"+Math.abs(remaining).toFixed(2)+"&#8364;"}</div>}
                    </div>
                    {monthly>0?(
                      <>
                        <div style={{background:CREAM2,borderRadius:20,height:10,marginBottom:6,overflow:"hidden"}}>
                          <div style={{width:`${pct}%`,height:"100%",borderRadius:20,background:pct>90?DNG:pct>70?CARAMEL:SUC,transition:"width .4s"}}/>
                        </div>
                        <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:TXT3}}>
                          <span>{spent.toFixed(2)}&#8364; depenses</span>
                          <span>sur {monthly}&#8364;</span>
                        </div>
                      </>
                    ):(
                      <div style={{fontSize:12,color:TXT3,textAlign:"center",padding:"8px 0"}}>Aucun budget defini - configurez-le dans Parametres</div>
                    )}
                  </div>
                  <div style={{marginBottom:14}}>
                    <div style={{fontFamily:"'Fraunces',serif",fontSize:16,color:TXT,fontWeight:700,marginBottom:10}}>Tickets de caisse</div>
                    <button style={{...btn("acc"),width:"100%",justifyContent:"center",fontSize:13,padding:"12px"}} onClick={()=>setPage("prix")}>Scanner un ticket</button>
                  </div>
                  {sessions.length>0&&(
                    <div style={{...card,padding:0,overflow:"hidden"}}>
                      <div style={{padding:"12px 14px",borderBottom:`1px solid ${BDR}`,fontWeight:700,fontSize:13,color:TXT}}>Derniers tickets</div>
                      {sessions.slice(-5).reverse().map((s,i)=>(
                        <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderBottom:i<Math.min(4,sessions.length-1)?`1px solid ${BDR}`:"none"}}>
                          <div style={{fontSize:18}}>&#x1F9FE;</div>
                          <div style={{flex:1}}>
                            <div style={{fontSize:13,fontWeight:600,color:TXT}}>{s.shop||"Magasin"}</div>
                            <div style={{fontSize:11,color:TXT3}}>{s.date||""}</div>
                          </div>
                          <div style={{fontSize:14,fontWeight:700,color:CARAMEL}}>{(s.total||0).toFixed(2)}&#8364;</div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })()}
          </div>
        )}
      </div>
      
      {showSettings&&(
        <Modal open onClose={()=>setShowSettings(false)}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:18,color:TXT,marginBottom:16}}>Parametres</div>
          <div style={{fontSize:11,fontWeight:800,color:TXT3,letterSpacing:.8,textTransform:"uppercase",marginBottom:6}}>Profil</div>
          <div style={{...card,padding:0,overflow:"hidden",marginBottom:14}}>
            <div style={{padding:"12px 14px",borderBottom:`1px solid ${BDR}`}}>
              <div style={{fontSize:11,color:TXT3,marginBottom:5}}>Pseudo</div>
              <div style={{display:"flex",gap:8}}>
                <input style={{...inp,flex:1,marginBottom:0}} defaultValue={pseudo} onBlur={e=>{if(e.target.value.trim()){setPseudo(e.target.value.trim());localStorage.setItem("ws_pseudo",e.target.value.trim());showToast("Pseudo mis a jour");}}}/>
              </div>
            </div>
            <div style={{padding:"12px 14px",borderBottom:`1px solid ${BDR}`}}>
              <div style={{fontSize:11,color:TXT3,marginBottom:4}}>ID Foyer</div>
              <div style={{fontFamily:"monospace",fontSize:11,color:TXT2,background:CREAM2,padding:"6px 10px",borderRadius:8}}>{localStorage.getItem("ws_foyerid")||"Non defini"}</div>
            </div>
            <div style={{padding:"12px 14px",borderBottom:`1px solid ${BDR}`}}>
              <button style={{...btn("out"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>{const fid=localStorage.getItem("ws_foyerid");if(!fid){showToast("Reconnectez-vous");return;}const link=`${window.location.origin}${window.location.pathname}?invite=${fid}`;navigator.clipboard.writeText(link).then(()=>showToast("🔗 Lien copié !"));}}>Partager le foyer</button>
            </div>
            <div style={{padding:"12px 14px"}}>
              <button style={{...btn("out"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>{setShowApiKeyGlobal(true);setShowSettings(false);}}>Cle API Anthropic</button>
            </div>
          </div>
          <div style={{fontSize:11,fontWeight:800,color:TXT3,letterSpacing:.8,textTransform:"uppercase",marginBottom:6}}>Preferences</div>
          <div style={{...card,padding:0,overflow:"hidden",marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderBottom:`1px solid ${BDR}`}}>
              <span style={{fontSize:18}}>💰</span>
              <div style={{flex:1,fontSize:13,fontWeight:600,color:TXT}}>Afficher les prix</div>
              <div style={{width:40,height:22,borderRadius:11,background:localStorage.getItem("ws_prices_visible")!=="false"?SUC:BDR,cursor:"pointer",position:"relative",flexShrink:0}} onClick={()=>{const v=localStorage.getItem("ws_prices_visible")!=="false";localStorage.setItem("ws_prices_visible",String(!v));showToast(!v?"Prix visibles":"Prix masques");}}>
                <div style={{position:"absolute",top:3,left:localStorage.getItem("ws_prices_visible")!=="false"?20:3,width:16,height:16,borderRadius:"50%",background:"white",transition:"left .2s"}}/>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px"}}>
              <span style={{fontSize:18}}>👥</span>
              <div style={{flex:1,fontSize:13,fontWeight:600,color:TXT}}>Personnes par defaut</div>
              <select style={{...sel,width:60,marginBottom:0}} defaultValue={localStorage.getItem("ws_default_persons")||"2"} onChange={e=>{localStorage.setItem("ws_default_persons",e.target.value);showToast("Mis a jour");}}>
                {[1,2,3,4,5,6].map(n=><option key={n} value={n}>{n}</option>)}
              </select>
            </div>
          </div>
          <div style={{fontSize:11,fontWeight:800,color:TXT3,letterSpacing:.8,textTransform:"uppercase",marginBottom:6}}>Donnees</div>
          <div style={{...card,padding:0,overflow:"hidden",marginBottom:14}}>
            <div style={{padding:"12px 14px",borderBottom:`1px solid ${BDR}`}}>
              <button style={{...btn("out"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>{setShowSettings(false);setPage("historique");}}>Historique des courses</button>
            </div>
            <div style={{padding:"12px 14px",borderBottom:`1px solid ${BDR}`}}>
              <button style={{...btn("out"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`wisely-export-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);showToast("Export telecharge");}}>Exporter mes donnees</button>
            </div>
            <div style={{padding:"12px 14px"}}>
              <button style={{...btn("dng"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>{if(window.confirm("Se deconnecter ?")){localStorage.clear();window.location.reload();}}}>Deconnexion</button>
            </div>
          </div>
        </Modal>
      )}

      {/* BOTTOM NAV — 4 onglets */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"white",borderTop:`1px solid ${BDR}`,display:"flex",padding:"8px 4px 12px",zIndex:20,boxShadow:"0 -4px 20px rgba(42,31,14,.06)"}}>
        {[
          {id:"liste",     icon:"🛒", label:"Liste"},
          {id:"recettes",  icon:"🍽️", label:"Recettes"},
          {id:"calendrier",icon:"📅", label:"Planning"},
          {id:"placard",   icon:"📦", label:"Placard"},
          {id:"maison",    icon:"🏠", label:"Maison"},
        ].map(t=>(
          <div key={t.id} onClick={()=>setPage(t.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,cursor:"pointer",padding:"4px 2px",borderRadius:12,background:page===t.id?"rgba(184,112,58,.1)":"transparent",transition:"background .2s"}}>
            <EmojiImg emoji={t.icon} size={22} style={{lineHeight:1}}/>
            <span style={{fontSize:9,fontWeight:700,color:page===t.id?CARAMEL:TXT3,letterSpacing:.2}}>{t.label}</span>
            {page===t.id&&<div style={{width:4,height:4,borderRadius:"50%",background:CARAMEL}}/>}
          </div>
        ))}
      </div>
      <Toast msg={toast}/>
      {showApiKeyGlobal&&<ApiKeyModal open onSave={()=>setShowApiKeyGlobal(false)} onClose={()=>setShowApiKeyGlobal(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{regs.forEach(r=>r.unregister());});
}
</script>
</body>
</html>
