const FLUENT_CDN="https://cdn.jsdelivr.net/npm/fluentui-emoji-cdn/icons/";
function emojiToHex(e){
  const codes=[];
  const pts=[...e];
  for(const ch of pts){
    const cp=ch.codePointAt(0);
    if(cp===0xFE0F)continue; // strip variation selector-16
    codes.push(cp.toString(16));
  }
  return codes.join('-');
}
// Cache des images vérifiées (évite les requêtes répétées)
const _emojiImgCache={};
function getEmojiImgUrl(emoji){
  if(!emoji||emoji.length===0)return null;
  if(_emojiImgCache[emoji]!==undefined)return _emojiImgCache[emoji];
  const hex=emojiToHex(emoji.trim());
  if(!hex)return(_emojiImgCache[emoji]=null);
  const url=`${FLUENT_CDN}${hex}.png`;
  return(_emojiImgCache[emoji]=url);
}
// Composant image Fluent Emoji avec fallback Unicode
function EmojiImg({emoji,size=20,style={}}){
  const [failed,setFailed]=useState(false);
  const url=getEmojiImgUrl(emoji);
  if(!url||failed){
    return<span style={{fontSize:size,...style}}>{emoji}</span>;
  }
  return<img src={url} alt={emoji} width={size} height={size} onError={()=>setFailed(true)} style={{display:"inline-block",verticalAlign:"middle",objectFit:"contain",...style}}/>;
}

// Calcule le prix de référence normalisé selon l'unité
// Poids/volume → prix au kg ou au litre
// Pièce/paquet/boîte/etc. → prix à l'unité
function pricePerKg(price,qty,unit){
  if(!price||!qty||!unit)return null;
  const q=parseFloat(qty);if(isNaN(q)||q<=0)return null;
  // Unités de poids → ramène au kg
  const toKg={g:1000,kg:1};
  // Unités de volume → ramène au litre
  const toL={ml:1000,cl:100,L:1,l:1};
  // Unités discrètes → prix à l'unité
  const discrete=["pièce","pièces","","pcs","tranche","tranches","sachet","sachets","boîte","boîtes","bouteille","bouteilles","paquet","paquets","botte","bottes","pot","pots","barquette","barquettes","rouleau","rouleaux"];
  if(toKg[unit]!==undefined)return{value:(price/q)*toKg[unit],label:"€/kg"};
  if(toL[unit]!==undefined)return{value:(price/q)*toL[unit],label:"€/L"};
  if(discrete.includes(unit.toLowerCase()))return{value:price/q,label:"€/pièce"};
  return null;
}
// Libellé court du prix de référence
function fmtPriceRef(price,qty,unit){
  const r=pricePerKg(price,qty,unit);
  if(!r)return null;
  return`${r.value.toFixed(2)}${r.label}`;
}
// Cherche le meilleur prix connu pour un produit
function getBestPrice(priceDB,name){
  const norm=name.toLowerCase().trim();
  const entries=Object.entries(priceDB||{});
  const match=entries.find(([k])=>k===norm);
  if(!match)return null;
  const shops=Object.entries(match[1].shops||{});
  if(!shops.length)return null;
  const best=shops.sort((a,b)=>{
    const ra=a[1].priceRef?.value??a[1].price;
    const rb=b[1].priceRef?.value??b[1].price;
    return ra-rb;
  })[0];
  return{shop:best[0],...best[1]};
}

let MEALDB_LOCAL = []; // tableau de recettes traduites, rempli au démarrage

async function loadLocalMealDB(){
  try{
    const r = await fetch('/recipes_mealdb_fr.json');
    if(!r.ok){ MEALDB_LOCAL = []; return; }
    const d = await r.json();
    // Accepte { recipes: [...] }, un tableau direct, ou un objet indexé
    let arr = null;

    else if(d && Array.isArray(d.recipes)) arr = d.recipes;
    else if(d && typeof d === 'object') arr = Object.values(d).find(v=>Array.isArray(v)) || [];
    MEALDB_LOCAL = Array.isArray(arr) ? arr : [];
    console.info('✅ MealDB local : ' + MEALDB_LOCAL.length + ' recettes chargées');
  } catch(e){
    MEALDB_LOCAL = [];
  }
}

// Sécurité : garantit toujours un tableau, même si le chargement a échoué
function _localArray(){ return Array.isArray(MEALDB_LOCAL) ? MEALDB_LOCAL : []; }

// Recherche dans la base locale : retourne jusqu'à maxResults résultats
function searchLocalMealDB(term, maxResults=10){
  const arr = _localArray();
  if(!term || !arr.length) return [];
  const q = term.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  return arr.filter(m=>{
    const haystack = [m.nom, m.nomEN, m.categorie, m.origine, ...(m.tags||[])].join(' ')
      .toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    return haystack.includes(q);
  }).slice(0, maxResults);
}

// Filtre la base locale selon catégorie EN (strCategory TheMealDB)
function filterLocalByCategory(categoryEN, maxResults=100){
  const arr = _localArray();
  if(!arr.length) return [];
  const q = categoryEN.toLowerCase();
  return arr.filter(m=>
    (m.categorieEN||"").toLowerCase() === q
    || (m.categorie||"").toLowerCase().includes(q)
  ).slice(0, maxResults);
}

// Filtre la base locale selon origine EN (strArea TheMealDB)

  const arr = _localArray();

// Convertit une recette du cache local au format interne Wisely
function parseMeasureLocal(measure){
  if(!measure) return {qty:"", unit:""};
  const s = measure.trim();
  if(/au go[uû]t|à volon|q\.s\.|qs/i.test(s)) return {qty:"", unit:"pincée"};
  const fracs={"1/2":"0.5","1/3":"0.33","1/4":"0.25","2/3":"0.67","3/4":"0.75"};
  let n = s;
  Object.entries(fracs).forEach(([f,v])=>{ n=n.replace(f,v); });
  const m = n.match(/^(\d+(?:[.,]\d+)?)\s*([a-zà-ÿ]*)\s*/i);
  if(!m) return {qty:"", unit:""};
  const unitMap={g:"g",gr:"g",kg:"kg",ml:"ml",cl:"cl",l:"L",L:"L",
    "càs":"càs","càc":"càc",tbsp:"càs",tsp:"càc",
    oz:"g",lb:"kg","pincée":"pincée",botte:"botte",
    gousse:"pièce",gousses:"pièce",tranche:"tranche",tranches:"tranche",
    "boîte":"boîte",sachet:"sachet",paquet:"paquet",bouteille:"bouteille"};
  const u = (m[2]||"").toLowerCase().trim();
  return {qty: m[1].replace(',','.'), unit: unitMap[u]!==undefined ? unitMap[u] : u};
}

function localMealToWisely(m){
  const reg = m.regimes || {};
  const diets = [];
  if(reg.vegetarien||reg["végétarien"]) diets.push("vegetarian");
  if(reg.vegan) diets.push("vegan");
  if(reg.sans_gluten) diets.push("gluten-free");
  if(reg.sans_lactose) diets.push("dairy-free");
  return {
    id: Date.now() + Math.random(),
    name: m.nom || m.nomEN || "",
    nameEN: m.nomEN || "",
    source: "mealdb",
    mealdbId: m.id || null,
    photo: m.photo || null,
    category: m.categorie || "",
    area: m.origine || "",
    duration: m.duration || null,
    persons: m.persons || null,
    diets,
    tags: m.tags || [],
    ingredients: (m.ingredients||[]).map(ing=>{
      const {qty,unit}=parseMeasureLocal(ing.measure||"");
      return {name:ing.name||ing.nom||"", qty, unit, category:ing.categorie||ing.category||getCat(ing.name||ing.nom||"")};
    }),
    steps: m.etapes || m.steps || [],
    date: new Date().toLocaleDateString("fr-FR"),
    _fromLocal: true
  };
}

// Normalise un nom d'ingrédient (souvent généré par IA ou importé en anglais)
// vers le nom canonique de la base + récupère emoji et catégorie
function normalizeIngredient(rawName){
  if(!rawName) return {nom: rawName, categorie: getCat(rawName), emoji: getCat(rawName).split(' ')[0]};
  
  // 1. Normalisation du texte : minuscules, sans accents
  const normalize = s => s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/['']/g, "'")
    .trim();
  
  const raw = normalize(rawName);
  
  // 2. Correspondance exacte sur nom ou clé
  let match = PRODUCTS_CATALOG.find(p => normalize(p.nom) === raw || p.cle === raw);
  
  // 3. Correspondance exacte sur aliases
  if(!match){
    match = PRODUCTS_CATALOG.find(p => p.aliases.some(a => normalize(a) === raw));
  }
  
  // 4. Correspondance partielle sur aliases (exact word boundary)
  // Les étapes includes ont été supprimées : trop de faux positifs
  // ("sel" dans "beurre demi-sel", "citron" dans "citronnelle", etc.)

  // 5. Correspondance par mots-clés (≥2 mots en commun)
  if(!match){
    const rawWords = raw.split(/\s+/).filter(w => w.length > 2);
    if(rawWords.length >= 2){
      match = PRODUCTS_CATALOG.find(p => {
        const allNames = [p.nom, ...p.aliases].map(normalize).join(' ');
        const commonWords = rawWords.filter(w => allNames.includes(w));
        return commonWords.length >= 2;
      });
    }
  }

  if(match){
    return {
      nom: match.nom,
      categorie: match.categorie,
      emoji: match.emoji,
      unite: match.unite_defaut,
      rayon: match.rayon,
      regimes: match.regimes
    };
  }

  // Fallback : garde le nom original + devine catégorie par regex
  const cat = getCat(rawName);
  return {
    nom: rawName,
    categorie: cat,
    emoji: cat.split(' ')[0],
    unite: null,
    rayon: null,
    regimes: null
  };
}

// Version simplifiée pour guessCat utilisant la base en priorité
function getCatFromCatalog(name){
  const r = normalizeIngredient(name);
  return r.categorie;
}

function normalizeName(name){
  const n=name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const match=PRODUCTS_DB.find(p=>{
    const pn=p.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    return pn===n||pn.startsWith(n)||n.startsWith(pn);
  });
  return match||name;
}

// getCat = version améliorée utilisant le catalogue en priorité
function getCat(name){
  if(PRODUCTS_CATALOG.length > 0){
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/['']/g,"'").trim();
    const raw = norm(name);
    const found = PRODUCTS_CATALOG.find(p =>
      norm(p.nom)===raw || p.cle===raw ||
      p.aliases.some(a=>norm(a)===raw)
    );
    if(found) return found.categorie;
  }
  return guessCat(name);
}
// getProductEmoji = emoji SPÉCIFIQUE du produit (ex: 🍋 pour citron, 🧂 pour sel)
// Priorité : p.emoji du catalogue > emoji de la catégorie granulaire > fallback guessCat
function getProductEmoji(name){
  if(PRODUCTS_CATALOG.length > 0){
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/['']/g,"'").trim();
    const raw = norm(name);
    const found = PRODUCTS_CATALOG.find(p =>
      norm(p.nom)===raw || p.cle===raw ||
      p.aliases.some(a=>norm(a)===raw)
    );
    if(found && found.emoji) return found.emoji;
  }
  return getCat(name).split(' ')[0];
}

  if(!u)return"";
  const m={gramme:"g",grammes:"g",kilogramme:"kg",kilogrammes:"kg",litre:"L",litres:"L",millilitre:"ml",millilitres:"ml",centilitre:"cl",centilitres:"cl","pièce":"","pièces":"","cuillère à soupe":"càs","cuillères à soupe":"càs","cuillère à café":"càc","cuillères à café":"càc",pincée:"pincée",pincées:"pincée",sachet:"sachet",sachets:"sachet","boîte":"boîte","boîtes":"boîte",bouteille:"bouteille",bouteilles:"bouteille",paquet:"paquet",paquets:"paquet",tranche:"tranche",tranches:"tranche",botte:"botte",bottes:"botte"};
  const low=u.toLowerCase().trim();return m[low]!==undefined?m[low]:(UNITS.includes(low)?low:"");
}
function mergeItem(items,n,qv,uv,src,ct){
  const arr=[...items],norm=n.toLowerCase();
  const ex=arr.find(i=>i.name.toLowerCase()===norm&&!i.checked);
  if(ex){const s=ex.quantities.find(q=>q.unit===uv);if(s)s.qty=roundQ(+s.qty+ +qv);else ex.quantities.push({qty:roundQ(+qv),unit:uv,source:src});}
  else arr.push({id:Date.now()+Math.random(),name:n,category:ct||getCat(n),quantities:[{qty:roundQ(+qv),unit:uv,source:src}],checked:false});
  return arr;
}

// ─── CROP MODAL ───────────────────────────────────────────────
function CropModal({open,src,onConfirm,onClose}){
  const canvasRef=useRef(null),imgRef=useRef(null),containerRef=useRef(null);
  const [drag,setDrag]=useState(null);
  const [crop,setCrop]=useState({x:.05,y:.05,w:.9,h:.9});
  const [loaded,setLoaded]=useState(false);
  const [canvasSize,setCanvasSize]=useState({w:400,h:300});

  useEffect(()=>{if(open&&src){setLoaded(false);setCrop({x:.05,y:.05,w:.9,h:.9});}},[open,src]);

  // Quand l'image est chargée : calcule les dimensions du canvas selon ratio réel + DPR
  function onImgLoad(){
    const img=imgRef.current;
    if(!img)return;
    const dpr=window.devicePixelRatio||1;
    // Largeur CSS disponible (modal ~350px max)
    const cssW=Math.min(containerRef.current?.offsetWidth||340,340);
    const ratio=img.naturalHeight/img.naturalWidth;
    const cssH=Math.round(cssW*ratio);
    // Dimensions physiques du canvas (nettes sur Retina)
    setCanvasSize({w:Math.round(cssW*dpr),h:Math.round(cssH*dpr),cssW,cssH});
    setLoaded(true);
  }

  useEffect(()=>{
    if(!loaded||!canvasRef.current||!imgRef.current)return;
    const cv=canvasRef.current,img=imgRef.current,ctx=cv.getContext("2d");
    const W=cv.width,H=cv.height;
    const dpr=window.devicePixelRatio||1;
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(img,0,0,W,H);
    ctx.fillStyle="rgba(0,0,0,.5)";
    const cx=crop.x*W,cy=crop.y*H,cw=crop.w*W,ch=crop.h*H;
    ctx.fillRect(0,0,W,cy);ctx.fillRect(0,cy,cx,ch);ctx.fillRect(cx+cw,cy,W-(cx+cw),ch);ctx.fillRect(0,cy+ch,W,H-(cy+ch));
    ctx.strokeStyle=CARAMEL2;ctx.lineWidth=2*dpr;ctx.strokeRect(cx,cy,cw,ch);
    // grille des tiers
    ctx.strokeStyle="rgba(200,132,90,.4)";ctx.lineWidth=dpr;
    [1,2].forEach(k=>{ctx.beginPath();ctx.moveTo(cx+cw*k/3,cy);ctx.lineTo(cx+cw*k/3,cy+ch);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,cy+ch*k/3);ctx.lineTo(cx+cw,cy+ch*k/3);ctx.stroke();});
    // poignées de coin nettes
    const r=10*dpr;
    [[cx,cy],[cx+cw,cy],[cx,cy+ch],[cx+cw,cy+ch]].forEach(([hx,hy])=>{
      ctx.fillStyle=CARAMEL2;ctx.beginPath();ctx.arc(hx,hy,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="white";ctx.lineWidth=1.5*dpr;ctx.beginPath();ctx.arc(hx,hy,r,0,Math.PI*2);ctx.stroke();
    });
  },[crop,loaded,canvasSize]);

  function getPos(e,cv){
    const r=cv.getBoundingClientRect();const cl=e.touches?e.touches[0]:e;
    return{x:(cl.clientX-r.left)/r.width,y:(cl.clientY-r.top)/r.height};
  }
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

  function startDrag(e){
    if(!canvasRef.current)return;e.preventDefault();
    const pos=getPos(e,canvasRef.current);const{x,y,w,h}=crop;
    const hs=[{n:"tl",px:x,py:y},{n:"tr",px:x+w,py:y},{n:"bl",px:x,py:y+h},{n:"br",px:x+w,py:y+h}];
    const hit=hs.find(hd=>Math.hypot(pos.x-hd.px,pos.y-hd.py)<0.08);
    if(hit)setDrag({type:"h",name:hit.n,sc:{...crop}});
    else if(pos.x>=x&&pos.x<=x+w&&pos.y>=y&&pos.y<=y+h)setDrag({type:"m",ox:pos.x-x,oy:pos.y-y,sc:{...crop}});
    else setDrag({type:"n",sx:pos.x,sy:pos.y});
  }
  function onDrag(e){
    if(!drag||!canvasRef.current)return;e.preventDefault();
    const pos=getPos(e,canvasRef.current);
    if(drag.type==="n"){const x=Math.min(pos.x,drag.sx),y=Math.min(pos.y,drag.sy),w=Math.abs(pos.x-drag.sx),h=Math.abs(pos.y-drag.sy);setCrop({x:clamp(x,0,1),y:clamp(y,0,1),w:clamp(w,0.05,1-x),h:clamp(h,0.05,1-y)});}
    else if(drag.type==="m"){const sc=drag.sc;setCrop({...sc,x:clamp(pos.x-drag.ox,0,1-sc.w),y:clamp(pos.y-drag.oy,0,1-sc.h)});}
    else if(drag.type==="h"){const sc=drag.sc;
      if(drag.name==="tl"){const nx=clamp(pos.x,0,sc.x+sc.w-0.05),ny=clamp(pos.y,0,sc.y+sc.h-0.05);setCrop({x:nx,y:ny,w:sc.x+sc.w-nx,h:sc.y+sc.h-ny});}
      else if(drag.name==="tr"){const ny=clamp(pos.y,0,sc.y+sc.h-0.05);setCrop({x:sc.x,y:ny,w:clamp(pos.x-sc.x,0.05,1-sc.x),h:sc.y+sc.h-ny});}
      else if(drag.name==="bl"){const nx=clamp(pos.x,0,sc.x+sc.w-0.05);setCrop({x:nx,y:sc.y,w:sc.x+sc.w-nx,h:clamp(pos.y-sc.y,0.05,1-sc.y)});}
      else{setCrop({x:sc.x,y:sc.y,w:clamp(pos.x-sc.x,0.05,1-sc.x),h:clamp(pos.y-sc.y,0.05,1-sc.y)});}
    }
  }
  function endDrag(){setDrag(null);}

  function confirm(){
    if(!imgRef.current)return;
    const img=imgRef.current;
    const out=document.createElement("canvas");
    const srcX=Math.round(img.naturalWidth*crop.x);
    const srcY=Math.round(img.naturalHeight*crop.y);
    const srcW=Math.round(img.naturalWidth*crop.w);
    const srcH=Math.round(img.naturalHeight*crop.h);
    out.width=srcW;out.height=srcH;
    out.getContext("2d").drawImage(img,srcX,srcY,srcW,srcH,0,0,srcW,srcH);
    onConfirm(out.toDataURL("image/jpeg",.95));
  }

  if(!open||!src)return null;
  return(
    <div style={{...ovl,zIndex:300}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{...mdl,paddingBottom:24}}>
        <div style={{width:36,height:4,background:BDR,borderRadius:2,margin:"0 auto 14px"}}/>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:17,marginBottom:4,color:TXT}}>📐 Recadrer la photo</div>
        <div style={{fontSize:12,color:TXT3,marginBottom:10}}>Tirez les coins pour délimiter la zone à garder</div>
        <div ref={containerRef} style={{borderRadius:12,overflow:"hidden",touchAction:"none",userSelect:"none",background:CREAM2,border:`1px solid ${BDR}`}}>
          {/* Image cachée — source pour le canvas et pour le recadrage final */}
          <img ref={imgRef} src={src} alt="" style={{display:"none"}} onLoad={onImgLoad}/>
          {loaded
            ?<canvas
                ref={canvasRef}
                width={canvasSize.w}
                height={canvasSize.h}
                style={{width:`${canvasSize.cssW}px`,height:`${canvasSize.cssH}px`,display:"block",cursor:"crosshair",touchAction:"none",maxWidth:"100%"}}
                onMouseDown={startDrag} onMouseMove={onDrag} onMouseUp={endDrag} onMouseLeave={endDrag}
                onTouchStart={startDrag} onTouchMove={onDrag} onTouchEnd={endDrag}/>
            :<div style={{height:220,display:"flex",alignItems:"center",justifyContent:"center",color:TXT3,fontSize:13}}>Chargement…</div>
          }
        </div>
        <div style={{fontSize:10,color:TXT3,textAlign:"center",marginTop:6}}>Pleine résolution préservée ✓</div>
        <div style={{display:"flex",gap:8,marginTop:10}}>
          <button style={{...btn("gh"),flex:1}} onClick={onClose}>Annuler</button>
          <button style={{...btn("acc"),flex:1}} onClick={confirm} disabled={!loaded}>✂️ Recadrer</button>
        </div>
      </div>
    </div>
  );
}

// ─── HISTORY SESSION ──────────────────────────────────────────
function HistorySession({session,onReloadAll,onReloadSelected,onDeleteItem}){
  const [open,setOpen]=useState(false);
  const [sel,setSel]=useState(new Set());
  function toggle(name){const s=new Set(sel);if(s.has(name))s.delete(name);else s.add(name);setSel(s);}
  function selAll(){setSel(new Set(session.items.map(i=>i.name)));}
  const items=session.items||[];
  return(
    <div style={{...card,padding:0,overflow:"hidden"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 13px",cursor:"pointer"}} onClick={()=>setOpen(o=>!o)}>
        <div>
          <div style={{fontWeight:600,fontSize:13,color:TXT}}>{session.date}</div>
          <div style={{fontSize:10,color:TXT3,marginTop:2}}>{session.count} articles</div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <button style={{...btn("out"),fontSize:11,padding:"5px 9px"}} onClick={e=>{e.stopPropagation();onReloadAll();}}>Tout ajouter</button>
          <span style={{color:TXT3,fontSize:16,display:"inline-block",transform:open?"rotate(180deg)":"none",transition:"transform .2s"}}>▾</span>
        </div>
      </div>
      {open&&(
        <div style={{borderTop:`1px solid ${BDR}`,padding:"10px 13px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontSize:11,color:TXT3}}>{sel.size} sélectionné{sel.size>1?"s":""}</span>
            <div style={{display:"flex",gap:5}}>
              <button style={{...btn("gh"),fontSize:11,padding:"4px 8px"}} onClick={selAll}>Tout</button>
              <button style={{...btn("gh"),fontSize:11,padding:"4px 8px"}} onClick={()=>setSel(new Set())}>Aucun</button>
              <button style={{...btn("suc"),fontSize:11,padding:"4px 8px"}} onClick={()=>onReloadSelected(sel)} disabled={sel.size===0}>✅ Ajouter ({sel.size})</button>
            </div>
          </div>
          <div style={{maxHeight:240,overflowY:"auto"}}>
            {items.map((item,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 4px",borderBottom:i<items.length-1?`1px solid ${BDR}`:"none",cursor:"pointer",background:sel.has(item.name)?`rgba(200,132,90,.08)`:"transparent"}} onClick={()=>toggle(item.name)}>
                <div style={{width:18,height:18,borderRadius:4,border:sel.has(item.name)?"none":`1.5px solid ${BDR}`,background:sel.has(item.name)?SUC:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  {sel.has(item.name)&&<span style={{color:"white",fontSize:10,fontWeight:700}}>✓</span>}
                </div>
                <span style={{flex:1,fontSize:13}}>{item.name}</span>
                <span style={{fontSize:11,color:TXT3}}>{(item.quantities||[]).map(q=>fmtQ(q.qty,q.unit)).join(" + ")}</span>
                {onDeleteItem&&<span style={{fontSize:12,color:TXT3,opacity:.5,cursor:"pointer",padding:"2px 6px",flexShrink:0}} onClick={e=>{e.stopPropagation();onDeleteItem(item.name);}}>✕</span>}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ITEM MINI (vue grille 3 colonnes ultra-compact)
// ═══════════════════════════════════════════════════════════════
function ItemMini({item,onToggle,onDel,onNameChange}){
  const catEmoji=getProductEmoji(item.name);
  const shortName=item.name.length>12?item.name.slice(0,11)+"…":item.name;
  const [showEdit,setShowEdit]=useState(false);
  const [editName,setEditName]=useState(item.name);
  const [editQty,setEditQty]=useState(item.quantities?.[0]?.qty??1);
  const [editUnit,setEditUnit]=useState(item.quantities?.[0]?.unit??"");
  const [editCat,setEditCat]=useState(item.category||getCat(item.name));

  function openEdit(){
    setEditName(item.name);setEditQty(item.quantities?.[0]?.qty??1);
    setEditUnit(item.quantities?.[0]?.unit??"");setEditCat(item.category||getCat(item.name));
    setShowEdit(s=>!s);
  }
  function saveEdit(){
    if(editName.trim()&&onNameChange) onNameChange(item.id,editName.trim(),editCat,editQty,editUnit);
    setShowEdit(false);
  }

  return(
    <div style={{background:item.checked?CREAM2:SURF,border:`1px solid ${showEdit?CARAMEL2:item.checked?CARAMEL:BDR}`,borderRadius:10,boxShadow:"0 1px 4px rgba(160,90,40,.05)",opacity:item.checked?.55:1,display:"flex",flexDirection:"column",minWidth:0,overflow:"hidden"}}>
      <div style={{padding:"7px 6px",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
        {/* Ligne haut : checkbox | emoji | actions */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%"}}>
          <div onClick={()=>onToggle(item.id)} style={{width:15,height:15,borderRadius:4,border:item.checked?"none":`1.5px solid ${BDR}`,background:item.checked?CARAMEL:"transparent",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}>
            {item.checked&&<span style={{color:"white",fontSize:8,fontWeight:800}}>✓</span>}
          </div>
          <EmojiImg emoji={catEmoji} size={18}/>
          <div style={{display:"flex",gap:1}}>
            <button style={{background:"none",border:"none",color:showEdit?CARAMEL2:TXT3,cursor:"pointer",fontSize:10,padding:"1px 2px",opacity:showEdit?1:.5}} onClick={openEdit}>✏️</button>
            <button style={{background:"none",border:"none",color:TXT3,cursor:"pointer",fontSize:10,padding:"1px 2px",opacity:.5}} onClick={()=>onDel(item.id)}>🗑️</button>
          </div>
        </div>
        {/* Nom */}
        <div style={{fontSize:10,fontWeight:700,color:TXT,textAlign:"center",textDecoration:item.checked?"line-through":"none",lineHeight:1.2,width:"100%"}}>{shortName}</div>
        {/* Quantité */}
        <div style={{fontSize:9,color:TXT3,fontWeight:600,textAlign:"center"}}>{(item.quantities||[]).map(q=>fmtQ(q.qty,q.unit)).join("+")}</div>
      </div>
      {/* Panneau édition inline mini */}
      {showEdit&&(
        <div style={{borderTop:`1px solid ${BDR}`,background:CREAM,padding:"6px 7px",display:"flex",flexDirection:"column",gap:5}}>
          <input style={{...inp,fontSize:10,padding:"4px 7px"}} value={editName} onChange={e=>setEditName(e.target.value)} placeholder="Nom…"/>
          <div style={{display:"flex",gap:4}}>
            <input type="number" min="0" step="0.1" style={{...inp,fontSize:10,padding:"4px 5px",textAlign:"center",flex:1}} value={editQty} onChange={e=>setEditQty(parseFloat(e.target.value)||1)}/>
            <select style={{...sel,fontSize:9,padding:"4px 3px",flex:1}} value={editUnit} onChange={e=>setEditUnit(e.target.value)}>
              {UNITS.map(u=><option key={u} value={u}>{UL[u]||"pcs"}</option>)}
            </select>
          </div>
          <select style={{...sel,fontSize:9,padding:"4px 5px"}} value={editCat} onChange={e=>setEditCat(e.target.value)}>
            {CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <div style={{display:"flex",gap:4}}>
            <button style={{...btn("gh"),flex:1,fontSize:9,padding:"4px",justifyContent:"center"}} onClick={()=>setShowEdit(false)}>✕</button>
            <button style={{...btn("acc"),flex:2,fontSize:9,padding:"4px",justifyContent:"center"}} onClick={saveEdit}>✅ OK</button>
          </div>
        </div>
      )}
    </div>
  );
}

// SUGG BLOCK — suggestions adaptées au mode d'affichage
// ═══════════════════════════════════════════════════════════════
function SuggBlock({popular,listView,db,setDb,showToast,normInc,getCatFn}){
  // Filtrer les articles déjà dans la liste courante
  const inList=new Set((db.items||[]).map(i=>i.name.toLowerCase()));
  const [dismissed,setDismissed]=useState(new Set());
  const visible=popular.filter(p=>!inList.has(p.name.toLowerCase())&&!dismissed.has(p.name));

  // State local qtys initialisé sur les items visibles
  const [suggQtys,setSuggQtys]=useState(()=>{
    const init={};
    popular.forEach(p=>{
      const info=normInc(p.name);
      init[p.name]={qty:1,unit:info.unite||p.lastUnit||""};
    });
    return init;
  });

  function addSugg(p){
    const info=normInc(p.name);
    const catV=normalizeCat(info.categorie||p.category||getCatFn(p.name));
    const sq=suggQtys[p.name]||{qty:1,unit:""};
    const ni=mergeItem(db.items,p.name,sq.qty,sq.unit,"manuel",catV);
    const ph={...db.productHistory};
    if(!ph[p.name])ph[p.name]={count:0,category:catV,lastUnit:sq.unit};
    ph[p.name].count++;ph[p.name].category=catV;ph[p.name].lastUnit=sq.unit;
    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);
    // Retirer immédiatement de l'affichage
    setDismissed(prev=>new Set([...prev,p.name]));
    showToast("✅ "+p.name+" ajouté");
  }

  function setQ(name,val){setSuggQtys(prev=>({...prev,[name]:{...prev[name],qty:val}}))}
  function setU(name,val){setSuggQtys(prev=>({...prev,[name]:{...prev[name],unit:val}}))}

  if(!visible.length) return null;

  // Fond distinct pour différencier du contenu liste
  const SUGG_BG="rgba(184,112,58,.05)";
  const SUGG_BDR="rgba(184,112,58,.2)";

  if(listView==="grille"){
    return(
      <div style={{marginTop:14,background:SUGG_BG,border:`1px dashed ${SUGG_BDR}`,borderRadius:14,padding:"12px 10px"}}>
        <div style={{fontSize:10,fontWeight:800,color:TXT2,letterSpacing:.8,textTransform:"uppercase",marginBottom:8}}>💡 Suggestions rapides</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {visible.map((p,i)=>{
            const info=normInc(p.name);
            const em=(info.categorie||getCatFn(p.name)).split(" ")[0];
            const sq=suggQtys[p.name]||{qty:1,unit:""};
            return(
              <div key={i} style={{background:SURF,border:`1px solid ${BDR}`,borderRadius:12,padding:"9px 10px",display:"flex",flexDirection:"column",gap:5,boxShadow:"0 1px 4px rgba(160,90,40,.04)"}}>
                <div style={{display:"flex",alignItems:"center",gap:5}}>
                  <span style={{fontSize:16}}>{em}</span>
                  <div style={{flex:1,fontSize:12,fontWeight:700,color:TXT,lineHeight:1.2}}>{p.name}</div>
                </div>
                <div style={{display:"flex",gap:4,alignItems:"center"}}>
                  <input type="number" min="0.1" step="0.5" value={sq.qty} onChange={e=>setQ(p.name,parseFloat(e.target.value)||1)} style={{...inp,padding:"4px 6px",fontSize:11,width:44,textAlign:"center"}}/>
                  <select value={sq.unit} onChange={e=>setU(p.name,e.target.value)} style={{...sel,padding:"4px 5px",fontSize:10,flex:1}}>
                    {UNITS.map(u=><option key={u} value={u}>{UL[u]||"pcs"}</option>)}
                  </select>
                  <button onClick={()=>addSugg(p)} style={{background:CARAMEL,border:"none",color:"white",borderRadius:8,width:28,height:28,fontSize:16,fontWeight:800,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>+</button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  if(listView==="mini"){
    return(
      <div style={{marginTop:14,background:SUGG_BG,border:`1px dashed ${SUGG_BDR}`,borderRadius:14,padding:"12px 10px"}}>
        <div style={{fontSize:10,fontWeight:800,color:TXT2,letterSpacing:.8,textTransform:"uppercase",marginBottom:8}}>💡 Suggestions rapides</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
          {visible.map((p,i)=>{
            const info=normInc(p.name);
            const em=(info.categorie||getCatFn(p.name)).split(" ")[0];
            const shortName=p.name.length>10?p.name.slice(0,9)+"…":p.name;
            const sq=suggQtys[p.name]||{qty:1,unit:""};
            return(
              <div key={i} style={{background:SURF,border:`1px solid ${BDR}`,borderRadius:10,padding:"7px 6px",display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                <span style={{fontSize:16}}>{em}</span>
                <div style={{fontSize:9,fontWeight:700,color:TXT,textAlign:"center",lineHeight:1.2,width:"100%"}}>{shortName}</div>
                <input type="number" min="0.1" step="0.5" value={sq.qty} onChange={e=>setQ(p.name,parseFloat(e.target.value)||1)}
                  style={{...inp,padding:"3px 4px",fontSize:9,width:"100%",textAlign:"center"}}/>
                <select value={sq.unit} onChange={e=>setU(p.name,e.target.value)}
                  style={{...sel,padding:"3px 4px",fontSize:9,width:"100%"}}>
                  {UNITS.map(u=><option key={u} value={u}>{UL[u]||"pcs"}</option>)}
                </select>
                <button onClick={()=>addSugg(p)} style={{background:CARAMEL,border:"none",color:"white",borderRadius:6,width:"100%",height:22,fontSize:13,fontWeight:800,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // Vue liste (défaut)
  return(
    <div style={{marginTop:14,background:SUGG_BG,border:`1px dashed ${SUGG_BDR}`,borderRadius:14,overflow:"hidden"}}>
      <div style={{fontSize:10,fontWeight:800,color:TXT2,letterSpacing:.8,textTransform:"uppercase",padding:"10px 12px 6px"}}>💡 Suggestions rapides</div>
      <div>
        {visible.map((p,i)=>{
          const info=normInc(p.name);
          const em=(info.categorie||getCatFn(p.name)).split(" ")[0];
          const sq=suggQtys[p.name]||{qty:1,unit:""};
          return(
            <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",borderTop:`1px solid ${SUGG_BDR}`}}>
              <span style={{fontSize:16,flexShrink:0}}>{em}</span>
              <div style={{flex:1,fontSize:13,fontWeight:600,color:TXT}}>{p.name}</div>
              <input type="number" min="0.1" step="0.5" value={sq.qty} onChange={e=>setQ(p.name,parseFloat(e.target.value)||1)} style={{...inp,padding:"4px 6px",fontSize:11,width:44,textAlign:"center",flexShrink:0}}/>
              <select value={sq.unit} onChange={e=>setU(p.name,e.target.value)} style={{...sel,padding:"4px 5px",fontSize:10,width:60,flexShrink:0}}>
                {UNITS.map(u=><option key={u} value={u}>{UL[u]||"pcs"}</option>)}
              </select>
              <button onClick={()=>addSugg(p)} style={{background:CARAMEL,border:"none",color:"white",borderRadius:8,width:28,height:28,fontSize:16,fontWeight:800,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>+</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// PAGE LISTE
// ═══════════════════════════════════════════════════════════════
function PageListe({db,setDb,showToast,goToPlanning}){
  const [name,setName]=useState("");
  const [qty,setQty]=useState(1);
  const [unit,setUnit]=useState("");
  const [cat,setCat]=useState("🥦 Légumes");
  const [sugg,setSugg]=useState([]);
  const [eqty,setEqty]=useState(null);
  const [confirmClear,setConfirmClear]=useState(false);
  const [listView,setListView]=useState(()=>localStorage.getItem("ws_list_view")||"liste");
  const [showSavedLists,setShowSavedLists]=useState(false);
  const showPriceVisible=localStorage.getItem("ws_prices_visible")!=="false";
  // Vocal
  const [vocalActive,setVocalActive]=useState(false);
  const [vocalPending,setVocalPending]=useState([]);
  const recognitionRef=useRef(null);

  useEffect(()=>{
    if(!name.trim()){setSugg([]);return;}
    const q=name.toLowerCase();
    const autoInfo=normalizeIngredient(name);
    if(autoInfo&&autoInfo.categorie) setCat(normalizeCat(autoInfo.categorie));
    if(autoInfo&&autoInfo.unite) setUnit(autoInfo.unite);
    const histEntries=Object.entries(db.productHistory).filter(([n])=>n.toLowerCase().includes(q)).sort((a,b)=>b[1].count-a[1].count);
    const histNames=new Set(histEntries.map(([n])=>n.toLowerCase()));
    const dbEntries=PRODUCTS_DB.filter(p=>p.toLowerCase().includes(q)&&!histNames.has(p.toLowerCase())).slice(0,4).map(p=>{
      const info=normalizeIngredient(p);
      return[p,{count:0,category:normalizeCat(info.categorie||getCat(p)),lastUnit:info.unite||""}];
    });
    setSugg([...histEntries,...dbEntries].slice(0,6));
  },[name,db.productHistory]);

  function changeCat(id,newCat){
    const ni=db.items.map(i=>i.id===id?{...i,category:newCat}:i);
    const nd={...db,items:ni};setDb(nd);saveDB(nd);
  }
  function editItem(id,newName,newCat,newQty,newUnit){
    const ni=db.items.map(i=>{
      if(i.id!==id)return i;
      // Met à jour le nom, la catégorie, et remplace la première quantité manuelle
      const qs=[...i.quantities];
      const firstManual=qs.findIndex(q=>!q.source||q.source==="manuel"||q.source==="historique"||q.source==="vocal");
      if(firstManual>=0) qs[firstManual]={...qs[firstManual],qty:roundQ(newQty),unit:newUnit};
      else qs.unshift({qty:roundQ(newQty),unit:newUnit,source:"manuel"});
      return{...i,name:newName,category:newCat,quantities:qs};
    });
    const nd={...db,items:ni};setDb(nd);saveDB(nd);
    showToast("✅ Article modifié");
  }

  // ─── VOCAL ────────────────────────────────────────────
  function parseVocalText(text){
    const segments=text.split(/,|\bvirgule\b|\set\s/i).map(s=>s.trim()).filter(Boolean);
    // Map des unités vocales étendues (contenants inclus)
    const unitMapVocal={
      g:"g",gr:"g",gramme:"g",grammes:"g",
      kg:"kg",kilo:"kg",kilos:"kg",kilogramme:"kg",kilogrammes:"kg",
      l:"L",litre:"L",litres:"L",
      ml:"ml",cl:"cl",
      sachet:"sachet",sachets:"sachet",
      boite:"boîte","boîte":"boîte",boites:"boîte","boîtes":"boîte",
      bouteille:"bouteille",bouteilles:"bouteille",
      paquet:"paquet",paquets:"paquet",
      tranche:"tranche",tranches:"tranche",
      botte:"botte",bottes:"botte",
      pot:"boîte",pots:"boîte",
      "unité":"","unités":"","pièce":"","pièces":"",piece:"",pieces:"",
    };
    return segments.map(seg=>{
      const s=seg.toLowerCase().trim();
      // Pattern: "2 sachets de levure", "1 boîte de tomates", "300g de farine"
      const m=s.match(/^(\d+[\.,]?\d*)\s*([a-zàâäéèêëîïôùûüç]+)?\s*(?:de\s+|d['']\s*)?(.+)$/i);
      if(m){
        const qv=parseFloat(m[1].replace(",","."))||1;
        const rawUnit=(m[2]||"").toLowerCase().trim();
        const uv=unitMapVocal[rawUnit]!==undefined?unitMapVocal[rawUnit]:null;
        const namePart=(uv!==null?m[3]:((m[2]?m[2]+" ":"")+m[3])).trim();
        const n=namePart.charAt(0).toUpperCase()+namePart.slice(1);
        const info=normalizeIngredient(n);
        const finalUnit=uv!==null?uv:(info.unite||"");
        return{name:info.nom||n,qty:qv,unit:finalUnit,category:normalizeCat(info.categorie||getCat(n))};
      }
      // Pattern "Œufs 3"
      const m2=s.match(/^(.+?)\s+(\d+)$/i);
      if(m2){
        const info2=normalizeIngredient(m2[1].trim());
        return{name:info2.nom||m2[1].trim().charAt(0).toUpperCase()+m2[1].trim().slice(1),qty:parseInt(m2[2]),unit:info2.unite||"",category:normalizeCat(info2.categorie||getCat(m2[1]))};
      }
      // Juste un nom
      const info3=normalizeIngredient(s);
      return{name:info3.nom||s.charAt(0).toUpperCase()+s.slice(1),qty:1,unit:info3.unite||"",category:normalizeCat(info3.categorie||getCat(s))};
    });
  }

  function startVocal(){
    const SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SpeechRec){showToast("⚠️ Reconnaissance vocale non supportée");return;}
    const rec=new SpeechRec();
    rec.lang="fr-FR";rec.continuous=true;rec.interimResults=false;
    recognitionRef.current=rec;
    setVocalActive(true);
    rec.onresult=e=>{
      const transcript=Array.from(e.results).slice(e.resultIndex).map(r=>r[0].transcript).join(" ").trim();
      if(!transcript)return;
      const items=parseVocalText(transcript);
      setVocalPending(prev=>[...prev,...items]);
    };
    rec.onerror=(err)=>{if(err.error!=="aborted"){setVocalActive(false);showToast("❌ Erreur vocale");}};
    rec.onend=()=>{/* Ne pas stopper automatiquement — géré par stopVocal() */};
    rec.start();
  }
  function stopVocal(){
    recognitionRef.current?.stop();
    setVocalActive(false);
  }
  function confirmVocalItem(idx){
    const item=vocalPending[idx];
    const ni=mergeItem(db.items,item.name,item.qty,item.unit,"vocal",item.category);
    const ph={...db.productHistory};
    if(!ph[item.name])ph[item.name]={count:0,category:item.category,lastUnit:item.unit};
    ph[item.name].count++;
    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);
    setVocalPending(prev=>prev.filter((_,i)=>i!==idx));
    showToast("✅ "+item.name+" ajouté");
  }
  function removeVocalItem(idx){
    setVocalPending(prev=>prev.filter((_,i)=>i!==idx));
  }
  function confirmAllVocal(){
    let ni=[...db.items],ph={...db.productHistory};
    vocalPending.forEach(item=>{
      ni=mergeItem(ni,item.name,item.qty,item.unit,"vocal",item.category);
      if(!ph[item.name])ph[item.name]={count:0,category:item.category,lastUnit:item.unit};
      ph[item.name].count++;
    });
    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);
    setVocalPending([]);showToast(`✅ ${vocalPending.length} articles ajoutés`);
  }
  // ──────────────────────────────────────────────────────
  function addItem(){
    const n=name.trim();if(!n)return;
    const ni=mergeItem(db.items,n,qty,unit,"manuel",cat);
    const ph={...db.productHistory};
    if(!ph[n])ph[n]={count:0,category:cat,lastUnit:unit};
    ph[n].count++;ph[n].category=cat;ph[n].lastUnit=unit;
    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);
    setName("");setQty(1);setSugg([]);showToast("✅ "+n+" ajouté");
  }
  function toggle(id){const ni=db.items.map(i=>i.id===id?{...i,checked:!i.checked}:i);const nd={...db,items:ni};setDb(nd);saveDB(nd);}
  function del(id){const ni=db.items.filter(i=>i.id!==id);const nd={...db,items:ni};setDb(nd);saveDB(nd);}
  function clrChk(){const ni=db.items.filter(i=>!i.checked);const nd={...db,items:ni};setDb(nd);saveDB(nd);showToast("🗑️ Articles cochés supprimés");}
  function toggleAll(){
    const allChecked=db.items.length>0&&db.items.every(i=>i.checked);
    const ni=db.items.map(i=>({...i,checked:!allChecked}));
    const nd={...db,items:ni};setDb(nd);saveDB(nd);
  }
  function saveHist(){
    if(!db.items.length){showToast("⚠️ Liste vide");return;}
    const h=[{date:new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}),items:JSON.parse(JSON.stringify(db.items)),count:db.items.length},...db.shoppingHistory].slice(0,20);
    const nd={...db,shoppingHistory:h};setDb(nd);saveDB(nd);showToast("💾 Course sauvegardée");
  }
  function confEqty(val,uv){
    if(isNaN(val)||val<0){showToast("⚠️ Quantité invalide");return;}
    const ni=db.items.map(item=>{
      if(item.id!==eqty.itemId)return item;
      const qs=[...item.quantities];
      if(eqty.qi==null)qs.push({qty:roundQ(val),unit:uv,source:"manuel"});
      else qs[eqty.qi]={...qs[eqty.qi],qty:roundQ(val),unit:uv};
      return{...item,quantities:qs};
    });
    const nd={...db,items:ni};setDb(nd);saveDB(nd);setEqty(null);
  }
  function delQty(){
    const ni=db.items.reduce((acc,item)=>{
      if(item.id!==eqty.itemId)return[...acc,item];
      const qs=item.quantities.filter((_,i)=>i!==eqty.qi);
      return qs.length?[...acc,{...item,quantities:qs}]:acc;
    },[]);
    const nd={...db,items:ni};setDb(nd);saveDB(nd);setEqty(null);
  }

  // ─── helpers widget ───────────────────────────────────

  const unc=db.items.filter(i=>!i.checked),chk=db.items.filter(i=>i.checked);
  const total=db.items.length,cc=chk.length,pct=total?Math.round(cc/total*100):0;
  const allChecked=total>0&&total===cc;
  // Groupement normalisé : toutes les catégories granulaires ramenées aux 16 standards
  const cats={};
  unc.forEach(item=>{
    const c=normalizeCat(item.category||getCat(item.name));
    if(!cats[c])cats[c]=[];
    cats[c].push(item);
  });
  // Tri dans l'ordre de CATEGORIES
  const catsSorted=Object.fromEntries(
    CATEGORIES.filter(c=>cats[c]).map(c=>[c,cats[c]])
  );

  return(
    <div style={{padding:14,paddingBottom:90}}>

      {/* ═══ TOGGLE VUE LISTE / GRILLE ═══════════════════ */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:16,fontWeight:700,color:TXT}}>
          🛒 {total>0?`${unc.length} article${unc.length>1?"s":""}`:""}{pct>0?` · ${pct}%`:""}
        </div>
        <div style={{display:"flex",background:"rgba(0,0,0,.06)",borderRadius:10,padding:3,gap:3}}>
          <div onClick={()=>{setListView("liste");localStorage.setItem("ws_list_view","liste");}} style={{padding:"5px 11px",borderRadius:7,background:listView==="liste"?SURF:"transparent",boxShadow:listView==="liste"?"0 2px 8px rgba(0,0,0,.09)":"none",cursor:"pointer",fontSize:15,transition:"all .2s"}}>☰</div>
          <div onClick={()=>{setListView("grille");localStorage.setItem("ws_list_view","grille");}} style={{padding:"5px 11px",borderRadius:7,background:listView==="grille"?SURF:"transparent",boxShadow:listView==="grille"?"0 2px 8px rgba(0,0,0,.09)":"none",cursor:"pointer",fontSize:15,transition:"all .2s"}}>⊞</div>
          <div onClick={()=>{setListView("mini");localStorage.setItem("ws_list_view","mini");}} style={{padding:"5px 11px",borderRadius:7,background:listView==="mini"?SURF:"transparent",boxShadow:listView==="mini"?"0 2px 8px rgba(0,0,0,.09)":"none",cursor:"pointer",fontSize:13,transition:"all .2s",letterSpacing:-1}}>⋮⋮⋮</div>
        </div>
      </div>

      {/* Add form */}
      <div style={{...card,background:"rgba(184,112,58,.06)",border:`1.5px solid rgba(184,112,58,.25)`,boxShadow:"0 2px 12px rgba(184,112,58,.10)"}}>
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <input style={{...inp,flex:1}} placeholder="Nom de l'article…" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addItem()}/>
          <button style={{...btn(vocalActive?"dng":"gh"),padding:"10px 12px",fontSize:16,flexShrink:0}} onClick={vocalActive?stopVocal:startVocal} title={vocalActive?"Arrêter la reconnaissance vocale":"Démarrer la reconnaissance vocale"}>
            {vocalActive?"⏹️":"🎤"}
          </button>
          <button style={{...btn("acc"),fontSize:18,padding:"10px 16px"}} onClick={addItem}>+</button>
        </div>
        {vocalActive&&(
          <div style={{background:"rgba(212,96,74,.1)",border:"2px solid rgba(212,96,74,.5)",borderRadius:10,padding:"10px 13px",marginBottom:8,display:"flex",flexDirection:"column",gap:6}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:10,height:10,borderRadius:"50%",background:DNG,animation:"pulse 1s infinite",flexShrink:0}}/>
              <span style={{fontSize:13,color:DNG,fontWeight:800}}>🎤 En écoute continue…</span>
              <span style={{fontSize:11,color:TXT3,marginLeft:"auto"}}>Appuyez ⏹️ pour arrêter</span>
            </div>
            <div style={{background:"rgba(212,96,74,.12)",borderRadius:8,padding:"7px 10px",fontSize:12,color:DNG,fontWeight:700,textAlign:"center",lineHeight:1.5}}>
              Dites vos articles puis <span style={{background:DNG,color:"white",borderRadius:5,padding:"1px 6px",fontWeight:900}}>« virgule »</span> entre chaque
            </div>
            <div style={{fontSize:10,color:TXT3,textAlign:"center"}}>Ex : "tomates virgule lait virgule œufs"</div>
          </div>
        )}
        {sugg.length>0&&(
          <div style={{background:CREAM2,border:`1px solid ${BDR}`,borderRadius:12,overflow:"hidden",marginBottom:8}}>
            {sugg.slice(0,6).map(([n,d])=>{
              const catInfo=normalizeIngredient(n);
              const catDisplay=(d.category||catInfo.categorie||getCat(n)).split(" ")[0];
              const unitDisplay=d.lastUnit||catInfo.unite||"";
              return(
                <div key={n} style={{padding:"9px 13px",fontSize:13,cursor:"pointer",borderBottom:`1px solid ${BDR}`,display:"flex",justifyContent:"space-between",color:TXT}}
                  onClick={()=>{
                    const info=normalizeIngredient(n);
                    const catV=normalizeCat(info.categorie||d.category||getCat(n));
                    const unitV=info.unite||d.lastUnit||"";
                    setName(n);
                    setCat(catV);
                    setUnit(unitV);
                    setSugg([]);
                  }}>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{fontSize:14}}>{catDisplay}</span>
                    <span style={{fontWeight:600}}>{n}</span>
                  </div>
                  <span style={{fontSize:10,color:TXT3,background:CREAM2,padding:"2px 8px",borderRadius:20,fontWeight:600}}>{d.count>0?`${d.count}× · `:""}{UL[unitDisplay]||"pcs"}</span>
                </div>
              );
            })}
          </div>
        )}
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <Stepper value={qty} onChange={setQty}/>
          <select style={{...sel,flex:1,minWidth:75,padding:"8px 10px"}} value={unit} onChange={e=>setUnit(e.target.value)}>{UNITS.map(u=><option key={u} value={u}>{UL[u]}</option>)}</select>
          <select style={{...sel,flex:1,minWidth:115,padding:"8px 10px"}} value={cat} onChange={e=>setCat(e.target.value)}>{CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}</select>
        </div>

      </div>

      {/* Validation vocale en attente */}
      {vocalPending.length>0&&(
        <div style={{...card,background:"rgba(255,255,255,.95)",border:`1.5px solid ${CARAMEL2}`,marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontSize:13,fontWeight:700,color:TXT}}>🎤 Articles détectés — Vérifiez avant d'ajouter</div>
            <button style={{...btn("acc"),fontSize:11,padding:"5px 10px"}} onClick={confirmAllVocal}>Tout ajouter ✓</button>
          </div>
          {vocalPending.map((item,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:i<vocalPending.length-1?`1px solid ${BDR}`:"none"}}>
              <span style={{fontSize:18}}>{item.category.split(" ")[0]}</span>
              <div style={{flex:1}}>
                <input style={{...inp,padding:"6px 10px",fontSize:13,marginBottom:4}} value={item.name}
                  onChange={e=>{const info=normalizeIngredient(e.target.value);setVocalPending(prev=>prev.map((it,j)=>j===i?{...it,name:e.target.value,category:info.categorie||getCat(e.target.value)}:it));}}/>
                <div style={{display:"flex",gap:4}}>
                  <input type="number" style={{...inp,padding:"4px 8px",fontSize:12,width:60}} value={item.qty}
                    onChange={e=>setVocalPending(prev=>prev.map((it,j)=>j===i?{...it,qty:parseFloat(e.target.value)||1}:it))}/>
                  <select style={{...sel,padding:"4px 8px",fontSize:12,flex:1}} value={item.unit}
                    onChange={e=>setVocalPending(prev=>prev.map((it,j)=>j===i?{...it,unit:e.target.value}:it))}>
                    {UNITS.map(u=><option key={u} value={u}>{UL[u]}</option>)}
                  </select>
                </div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:4,flexShrink:0}}>
                <button style={{...btn("suc"),padding:"6px 10px",fontSize:12}} onClick={()=>confirmVocalItem(i)}>✓</button>
                <button style={{...btn("dng"),padding:"6px 10px",fontSize:12}} onClick={()=>removeVocalItem(i)}>✕</button>
              </div>
            </div>
          ))}
        </div>
      )}
      {db.items.length===0?(
        <div style={{textAlign:"center",padding:"48px 20px"}}>
          <div style={{marginBottom:12}}><EmojiImg emoji="🛍️" size={44}/></div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:6,color:TXT}}>Liste vide</div>
          <div style={{fontSize:13,color:TXT3}}>Ajoutez un article ou importez une recette</div>
        </div>
      ):(
        <>
          {/* Barre d'actions rapides */}
          <div style={{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap"}}>
            <button style={{...btn("gh"),fontSize:11,padding:"7px 12px",flex:1,justifyContent:"center",minWidth:120}} onClick={toggleAll}>
              {allChecked?"☐ Tout décocher":"☑️ Tout cocher"}
            </button>
            {chk.length>0&&(
              <button style={{...btn("dng"),fontSize:11,padding:"7px 12px",flex:1,justifyContent:"center",minWidth:120}} onClick={clrChk}>
                🗑️ Supprimer cochés ({chk.length})
              </button>
            )}
          </div>

          {/* Vue liste / grille 2 / mini grille 3 */}
          {listView==="liste"?(
            <>
              {Object.entries(catsSorted).map(([c,items])=>(
                <div key={c}><SecTitle count={items.length}>{c}</SecTitle>
                  {items.map(item=><Item key={item.id} item={item} onToggle={toggle} onDel={del} onEqty={(id,qi)=>setEqty({itemId:id,qi})} onAqty={id=>setEqty({itemId:id,qi:null})} priceDB={db.priceDB} showPrice={showPriceVisible} onCatChange={changeCat} onNameChange={editItem}/>)}
                </div>
              ))}
              {chk.length>0&&<div><SecTitle>✓ Dans le panier ({chk.length})</SecTitle>{chk.map(item=><Item key={item.id} item={item} onToggle={toggle} onDel={del} onEqty={(id,qi)=>setEqty({itemId:id,qi})} onAqty={id=>setEqty({itemId:id,qi:null})} priceDB={db.priceDB} showPrice={showPriceVisible} onCatChange={changeCat} onNameChange={editItem}/>)}</div>}
            </>
          ):listView==="grille"?(
            /* Vue grille 2 colonnes */
            <>
              {Object.entries(catsSorted).map(([c,items])=>(
                <div key={c}>
                  <SecTitle count={items.length}>{c}</SecTitle>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:4}}>
                    {items.map(item=><ItemCard key={item.id} item={item} onToggle={toggle} onDel={del} priceDB={db.priceDB} showPrice={showPriceVisible} onNameChange={editItem}/>)}
                  </div>
                </div>
              ))}
              {chk.length>0&&(
                <>
                  <SecTitle>✓ Dans le panier ({chk.length})</SecTitle>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:4}}>
                    {chk.map(item=><ItemCard key={item.id} item={item} onToggle={toggle} onDel={del} priceDB={db.priceDB} showPrice={showPriceVisible} onNameChange={editItem}/>)}
                  </div>
                </>
              )}
            </>
          ):(
            /* Vue mini grille 3 colonnes */
            <>
              {Object.entries(catsSorted).map(([c,items])=>(
                <div key={c}>
                  <SecTitle count={items.length}>{c}</SecTitle>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:4}}>
                    {items.map(item=><ItemMini key={item.id} item={item} onToggle={toggle} onDel={del} onNameChange={editItem}/>)}
                  </div>
                </div>
              ))}
              {chk.length>0&&(
                <>
                  <SecTitle>✓ Dans le panier ({chk.length})</SecTitle>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:4}}>
                    {chk.map(item=><ItemMini key={item.id} item={item} onToggle={toggle} onDel={del} onNameChange={editItem}/>)}
                  </div>
                </>
              )}
            </>
          )}

          <div style={{display:"flex",gap:8,marginTop:10}}>
            <button style={{...btn("out"),flex:2,fontSize:12,justifyContent:"center"}} onClick={saveHist}>💾 Sauvegarder les courses</button>

          </div>

          {(()=>{

        const freq=Object.entries(db.productHistory).sort((a,b)=>b[1].count-a[1].count).slice(0,12).map(([n,d])=>({name:n,...d}));
        const popular=freq.length>=6?freq:PRODUCTS_DB.slice(0,12-freq.length).filter(p=>!freq.find(f=>f.name.toLowerCase()===p.toLowerCase())).map(p=>({name:p,count:0,category:getCat(p),lastUnit:""})).concat(freq).slice(0,12);
        if(!popular.length)return null;
        return <SuggBlock popular={popular} listView={listView} db={db} setDb={setDb} showToast={showToast} normInc={normalizeIngredient} getCatFn={getCat}/>;
      })()}
      <EqtyModal open={!!eqty} item={eqty?db.items.find(i=>i.id===eqty.itemId):null} qi={eqty?.qi} onClose={()=>setEqty(null)} onConf={confEqty} onDel={delQty}/>
      <Modal open={confirmClear} onClose={()=>setConfirmClear(false)}>

        <div style={{display:"flex",gap:8}}>

      </Modal>
      {showSavedLists&&<SavedListsModal db={db} setDb={setDb} showToast={showToast} onClose={()=>setShowSavedLists(false)}/>}
    </div>
  );
}

// ─── MODAL LISTES SAUVEGARDÉES ───────────────────────────────
function SavedListsModal({db,setDb,showToast,onClose}){
  const hist=db.shoppingHistory||[];
  const [openSess,setOpenSess]=useState(new Set());
  // {sessionIdx: Set<itemName>}
  const [selected,setSelected]=useState({});
  // {sessionIdx: {itemName: {qty,unit}}}
  const [qtys,setQtys]=useState({});

  function toggleSess(i){const s=new Set(openSess);s.has(i)?s.delete(i):s.add(i);setOpenSess(s);}

  function toggleItem(si,name,defaultQty,defaultUnit){
    setSelected(prev=>{
      const cur=new Set(prev[si]||[]);
      if(cur.has(name))cur.delete(name);else cur.add(name);
      return{...prev,[si]:cur};
    });
    setQtys(prev=>{
      if(!prev[si]||!prev[si][name]){
        const sess=hist[si];
        const item=(sess.items||[]).find(it=>it.name===name);
        const q=item?.quantities?.[0]||{qty:1,unit:""};
        return{...prev,[si]:{...(prev[si]||{}),[name]:{qty:q.qty,unit:q.unit}}};
      }
      return prev;
    });
  }

  function toggleAll(si){
    const sess=hist[si];
    const allNames=(sess.items||[]).map(it=>it.name);
    const cur=selected[si]||new Set();
    if(cur.size===allNames.length){
      setSelected(prev=>({...prev,[si]:new Set()}));
    } else {
      const newSel=new Set(allNames);
      setSelected(prev=>({...prev,[si]:newSel}));
      setQtys(prev=>{
        const qMap={};
        (sess.items||[]).forEach(it=>{const q=it.quantities?.[0]||{qty:1,unit:""};qMap[it.name]={qty:q.qty,unit:q.unit};});
        return{...prev,[si]:{...(prev[si]||{}),...qMap}};
      });
    }
  }

  function countSelected(){
    return Object.values(selected).reduce((s,set)=>s+(set?.size||0),0);
  }

  function addSelected(){
    let ni=[...db.items],ph={...db.productHistory},added=0;
    Object.entries(selected).forEach(([siStr,nameSet])=>{
      const si=parseInt(siStr);
      const sess=hist[si];
      nameSet.forEach(name=>{
        const item=(sess.items||[]).find(it=>it.name===name);
        const catV=item?.category||getCat(name);
        const qEntry=qtys[si]?.[name]||{qty:1,unit:""};
        ni=mergeItem(ni,name,qEntry.qty,qEntry.unit,"historique",catV);
        if(!ph[name])ph[name]={count:0,category:catV,lastUnit:qEntry.unit};
        ph[name].count++;added++;
      });
    });
    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);
    showToast(`✅ ${added} article${added>1?"s":""} ajouté${added>1?"s":""}`);
    onClose();
  }

  const total=countSelected();

  return(
    <div style={ovl} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{...mdl,paddingBottom:24}}>
        <div style={{width:36,height:4,background:BDR,borderRadius:2,margin:"0 auto 14px"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:18,color:TXT}}>📋 Listes sauvegardées</div>
          <button style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:TXT3}} onClick={onClose}>✕</button>
        </div>
        {hist.length===0?(
          <div style={{textAlign:"center",padding:"32px 0",color:TXT3,fontSize:13}}>Aucune liste sauvegardée</div>
        ):(
          <div style={{maxHeight:"60vh",overflowY:"auto"}}>
            {hist.map((sess,si)=>{
              const isOpen=openSess.has(si);
              const sessSel=selected[si]||new Set();
              const items=sess.items||[];
              return(
                <div key={si} style={{...card,padding:0,overflow:"hidden",marginBottom:8}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,padding:"11px 13px",cursor:"pointer"}} onClick={()=>toggleSess(si)}>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,fontSize:13,color:TXT}}>{sess.date}</div>
                      <div style={{fontSize:10,color:TXT3,marginTop:2}}>{items.length} articles · {sessSel.size} sélectionné{sessSel.size>1?"s":""}</div>
                    </div>
                    <button style={{...btn("gh"),fontSize:11,padding:"4px 9px"}} onClick={e=>{e.stopPropagation();toggleAll(si);}}>
                      {sessSel.size===items.length?"Aucun":"Tout"}
                    </button>
                    <span style={{color:TXT3,fontSize:16,display:"inline-block",transform:isOpen?"rotate(180deg)":"none",transition:"transform .2s"}}>▾</span>
                  </div>
                  {isOpen&&(
                    <div style={{borderTop:`1px solid ${BDR}`,padding:"8px 13px 10px"}}>
                      {items.map((item,ii)=>{
                        const isSel=sessSel.has(item.name);
                        const qData=qtys[si]?.[item.name]||{qty:(item.quantities?.[0]?.qty||1),unit:(item.quantities?.[0]?.unit||"")};
                        return(
                          <div key={ii} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 4px",borderBottom:ii<items.length-1?`1px solid ${BDR}`:"none",background:isSel?"rgba(200,132,90,.06)":"transparent",borderRadius:6,cursor:"pointer"}} onClick={()=>toggleItem(si,item.name)}>
                            <div style={{width:18,height:18,borderRadius:5,border:isSel?"none":`1.5px solid ${BDR}`,background:isSel?CARAMEL:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                              {isSel&&<span style={{color:"white",fontSize:9,fontWeight:800}}>✓</span>}
                            </div>
                            <span style={{fontSize:12,fontWeight:600,color:TXT,flex:1}}>{(item.category||getCat(item.name)).split(" ")[0]} {item.name}</span>
                            {isSel&&(
                              <div style={{display:"flex",alignItems:"center",gap:4}} onClick={e=>e.stopPropagation()}>
                                <input type="number" style={{...inp,width:50,padding:"3px 6px",fontSize:11,marginBottom:0}} value={qData.qty}
                                  onChange={e=>setQtys(prev=>({...prev,[si]:{...(prev[si]||{}),[item.name]:{...qData,qty:parseFloat(e.target.value)||1}}}))}/>
                                <select style={{...sel,width:60,padding:"3px 5px",fontSize:10,marginBottom:0}} value={qData.unit}
                                  onChange={e=>setQtys(prev=>({...prev,[si]:{...(prev[si]||{}),[item.name]:{...qData,unit:e.target.value}}}))}>
                                  {UNITS.map(u=><option key={u} value={u}>{UL[u]||"pcs"}</option>)}
                                </select>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
        {total>0&&(
          <button style={{...btn("acc"),width:"100%",justifyContent:"center",fontSize:14,padding:"13px",marginTop:12}} onClick={addSelected}>
            🛒 Ajouter {total} article{total>1?"s":""} à la liste
          </button>
        )}
      </div>
    </div>
  );
}

function EqtyModal({open,item,qi,onClose,onConf,onDel}){
  const [val,setVal]=useState("");const [unit,setUnit]=useState("");
  useEffect(()=>{if(open&&item&&qi!=null){const q=item.quantities[qi];setVal(String(q.qty));setUnit(q.unit||"");}else{setVal("");setUnit("");}},[ open,item,qi]);
  return(
    <Modal open={open} onClose={onClose}>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:20,marginBottom:6,color:TXT}}>{qi==null?"Ajouter une quantité":"Modifier la quantité"}</div>
      {item&&<div style={{fontSize:13,color:TXT3,marginBottom:12}}>{item.name}</div>}
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <div style={{flex:1}}><span style={lbl}>Quantité</span><input style={inp} type="number" min="0" step="0.1" value={val} onChange={e=>setVal(e.target.value)}/></div>
        <div style={{flex:1}}><span style={lbl}>Unité</span><select style={sel} value={unit} onChange={e=>setUnit(e.target.value)}>{UNITS.map(u=><option key={u} value={u}>{UL[u]}</option>)}</select></div>
      </div>
      <div style={{display:"flex",gap:8}}>
        {qi!=null&&<button style={{...btn("dng"),fontSize:12}} onClick={onDel}>🗑️</button>}
        <button style={{...btn("gh"),flex:1,fontSize:12}} onClick={onClose}>Annuler</button>
        <button style={{...btn("acc"),flex:1,fontSize:12}} onClick={()=>onConf(parseFloat(val),unit)}>Confirmer</button>
      </div>
    </Modal>
  );
}

const DIET_TAGS=["Tout","🌱 Végétarien","🌿 Vegan","🚫🌾 Sans gluten","🥛 Sans lactose","🐟 Poisson","🥩 Viande","⚡ Rapide"];

function guessRecipeEmoji(name){
  const n=(name||"").toLowerCase();
  if(/pâte|pasta|spaghetti|tagliatelle|linguine|rigatoni|lasagne/.test(n))return"🍝";
  if(/salade|taboulé/.test(n))return"🥗";
  if(/soupe|velouté|potage|bouillon/.test(n))return"🍜";
  if(/tarte|quiche|pizza/.test(n))return"🥧";
  if(/gâteau|cake|brownie|muffin|crêpe|clafoutis|moelleux/.test(n))return"🍰";

  return"🍽️";
}

function estimateRecipeCost(recipe,priceDB,vp){
  if(!recipe?.ingredients?.length||!priceDB)return null;
  const base=recipe.persons||1,scale=(vp||base)/base;
  const toBase={g:1/1000,kg:1,ml:1/1000,cl:1/100,L:1,l:1,pièce:1,tranche:1,sachet:1,boîte:1,bouteille:1,paquet:1,botte:1};
  let total=0,matched=0;
  recipe.ingredients.forEach(ing=>{
    const key=ing.name.toLowerCase().trim();
    const entry=(priceDB||{})[key];
    if(!entry?.shops)return;
    const shops=Object.entries(entry.shops);
    if(!shops.length)return;
    const best=shops.sort((a,b)=>(a[1].priceRef?.value??a[1].price)-(b[1].priceRef?.value??b[1].price))[0][1];
    const ref=best.priceRef;
    const ingQty=parseFloat(ing.qty)*scale;
    if(ref&&ing.qty&&ing.unit&&toBase[ing.unit]!==undefined){
      total+=ingQty*toBase[ing.unit]*ref.value;matched++;
    } else if(!ing.qty){
      total+=best.price;matched++;
    }
  });
  if(!matched)return null;
  return{total:Math.round(total*100)/100,matched,outOf:recipe.ingredients.length};
}

// Traduction FR → EN pour la recherche TheMealDB
const SEARCH_FR_TO_EN={"poulet":"chicken","boeuf":"beef","bœuf":"beef","porc":"pork","agneau":"lamb","poisson":"fish","saumon":"salmon","crevette":"shrimp","pâtes":"pasta","riz":"rice","soupe":"soup","salade":"salad","tarte":"pie","pizza":"pizza","curry":"curry","risotto":"risotto","omelette":"omelette","crêpe":"crepe","ratatouille":"ratatouille","bouillabaisse":"bouillabaisse","cassoulet":"cassoulet","gratin":"gratin"};
function translateMealName(enName){return MEAL_NAME_FR[enName]||enName;}
function translateSearchToEN(frTerm){
  const low=frTerm.toLowerCase().trim();
  return SEARCH_FR_TO_EN[low]||frTerm;
}
function parseMealDBMeasure(measure){
  if(!measure)return{qty:"",unit:""};
  const fracs={"1/2":"0.5","1/3":"0.33","1/4":"0.25","2/3":"0.67","3/4":"0.75"};
  let s=measure.trim().toLowerCase();
  Object.entries(fracs).forEach(([f,v])=>{s=s.replace(f,v);});
  const match=s.match(/^([\d.]+)\s*([a-zéàèêâ ]*)/);
  if(!match)return{qty:"",unit:""};
  const qty=match[1];
  const rawUnit=(match[2]||"").trim();
  const unitMap={g:"g",kg:"kg",ml:"ml",cl:"cl",l:"L",cup:"",cups:"",tbsp:"càs",tbs:"càs",tsp:"càc",oz:"g",lb:"kg",pinch:"pincée",bunch:"botte",clove:"pièce",cloves:"pièce",slice:"tranche",slices:"tranche",can:"boîte",jar:"boîte",bag:"paquet",packet:"paquet",bottle:"bouteille"};
  return{qty,unit:(unitMap[rawUnit]!==undefined?unitMap[rawUnit]:"").trim()};
}

function MealDBSearch({onImport,onClose,showToast,initialMeal}){
  const [view,setView]=useState(initialMeal?"detail":"categories");
  const [categories,setCategories]=useState([]);
  const [query,setQuery]=useState("");
  const [results,setResults]=useState([]);
  const [loading,setLoading]=useState(false);
  const [detail,setDetail]=useState(null);
  const detailRef=useRef(null);
  const [translating,setTranslating]=useState(false);
  const [selectedCat,setSelectedCat]=useState("");

  useEffect(()=>{
    if(!initialMeal)fetch("https://www.themealdb.com/api/json/v1/1/categories.php")
      .then(r=>r.json()).then(d=>setCategories(d.categories||[])).catch(()=>{});
  },[]);

  useEffect(()=>{
    if(!initialMeal) return;
    if(initialMeal._preloaded){
      // Recette locale pré-chargée → afficher directement
      detailRef.current=initialMeal._preloaded;
      setDetail(initialMeal._preloaded);
      setView("detail");
    } else if(initialMeal?.mealdbId){
      loadDetail(initialMeal.mealdbId);
    }
  },[initialMeal]);

  async function browseCategory(cat){
    setSelectedCat(cat);setLoading(true);setResults([]);setView("list");
    try{
      // 1. Cache local en priorité
      const localHits = filterLocalByCategory(cat, 200);
      if(localHits.length > 0){
        setResults(localHits.map(m=>({
          idMeal: m.id||"",
          strMeal: m.nom||m.nomEN||"",
          strCategory: cat,
          _localData: m
        })));
        setLoading(false);
        return;
      }
      // 2. API en ligne
      const r=await fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?c=${encodeURIComponent(cat)}`);
      const d=await r.json();setResults(d.meals||[]);
    }catch{showToast("❌ Erreur de connexion");}
    setLoading(false);
  }

  async function search(){
    if(!query.trim())return;
    setLoading(true);setResults([]);setView("list");setSelectedCat("");
    try{
      // 1. Cache local en priorité
      const localHits = searchLocalMealDB(query, 50);
      if(localHits.length > 0){
        setResults(localHits.map(m=>({
          idMeal: m.id||"",
          strMeal: m.nom||m.nomEN||"",
          strCategory: m.categorieEN||m.categorie||"",
          _localData: m
        })));
        setLoading(false);
        return;
      }
      // 2. API en ligne
      const r=await fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${encodeURIComponent(query)}`);
      const d=await r.json();setResults(d.meals||[]);
      if(!d.meals?.length)showToast("Aucune recette trouvée");
    }catch{showToast("❌ Erreur de connexion");}
    setLoading(false);
  }

  async function browseArea(area){
    setSelectedCat("__area__"+area);setLoading(true);setResults([]);setView("list");
    try{
      // 1. Cache local en priorité
      const localHits = filterLocalByArea(area, 200);
      if(localHits.length > 0){
        setResults(localHits.map(m=>({
          idMeal: m.id||"",
          strMeal: m.nom||m.nomEN||"",
          strCategory: m.categorieEN||m.categorie||"",
          _localData: m
        })));
        setLoading(false);
        return;
      }
      // 2. API en ligne
      const r=await fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?a=${encodeURIComponent(area)}`);
      const d=await r.json();setResults(d.meals||[]);
    }catch{showToast("❌ Erreur de connexion");}
    setLoading(false);
  }

  async function loadDetail(id){
    setLoading(true);setDetail(null);setView("detail");
    try{
      // 1. Chercher dans le cache local (id numérique ou string)
      const localMatch = _localArray().find(m=>String(m.id)===String(id));
      if(localMatch){
        // Déjà traduit → afficher directement, pas besoin d'IA
        setDetail(localMealToWisely(localMatch));
        setLoading(false);
        return;
      }
      // 2. Fallback : API en ligne + traduction IA si clé dispo
      const r=await fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${id}`);
      const d=await r.json();
      const m=d.meals?.[0];if(!m){showToast("❌ Introuvable");setView("list");setLoading(false);return;}
      const ings=[];
      for(let i=1;i<=20;i++){
        const name=(m[`strIngredient${i}`]||"").trim();
        const measure=(m[`strMeasure${i}`]||"").trim();
        if(!name)continue;
        const normalized = normalizeIngredient(name);
        ings.push({name:normalized.nom,...parseMealDBMeasure(measure),category:normalized.categorie});
      }
      // Nettoyage des étapes : supprimer les "STEP 1", "Step 1:", etc. parasites
      const rawSteps=(m.strInstructions||"").split(/\r?\n/).map(s=>s.trim()).filter(s=>s.length>3);
      const steps=rawSteps.map(s=>s.replace(/^(STEP|Step|step)\s*\d+[:\.\s]*/,"").trim()).filter(s=>s.length>3);
      const raw={
        id:Date.now(),name:m.strMeal,persons:null,duration:null,photo:null,
        source:"mealdb",mealdbId:m.idMeal,
        category:CAT_FR[m.strCategory]||m.strCategory||"",
        area:AREA_FR[m.strArea]||m.strArea||"",
        ingredients:ings,steps,
        date:new Date().toLocaleDateString("fr-FR")
      };
      setLoading(false);
      // Traduire avec Anthropic si clé dispo — ingrédients EN PRIORITÉ
      const apiKey=localStorage.getItem("ws_apikey")||"";
      if(apiKey){
        setTranslating(true);
        try{
          const prompt=`Tu es un traducteur culinaire français expert. Traduis cette recette anglaise en français.

RÈGLES STRICTES :
- Traduis le nom du plat en français naturel (si traduction connue), sinon garde l'original
- Pour chaque ingrédient : traduis en nom générique français COURANT (ex: "chicken thighs" → "cuisses de poulet", "garlic cloves" → "gousses d'ail", "olive oil" → "huile d'olive", "chorizo" → "chorizo")
- Traduis chaque étape en français naturel et fluide
- Conserve exactement les mêmes qty et unit pour chaque ingrédient
- Ne jamais laisser de mots anglais dans les noms d'ingrédients
- Réponds UNIQUEMENT en JSON valide (pas de markdown, pas de backtick, pas de commentaire)

FORMAT EXACT :
{"name":"string","ingredients":[{"name":"string","qty":"string","unit":"string"}],"steps":["string"]}

DONNÉES À TRADUIRE :
Nom: ${raw.name}
Ingrédients: ${JSON.stringify(raw.ingredients)}
Étapes: ${JSON.stringify(raw.steps)}`;
          const resp=await fetch("https://api.anthropic.com/v1/messages",{
            method:"POST",
            headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
            body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,messages:[{role:"user",content:prompt}]})
          });
          if(resp.ok){
            const data=await resp.json();
            let text=(data.content||[]).map(c=>c.text||"").join("").trim();
            text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
            const translated=JSON.parse(text);
            if(translated.name)raw.name=translated.name;
            if(translated.ingredients?.length===raw.ingredients.length)raw.ingredients=translated.ingredients;
            if(translated.steps?.length)raw.steps=translated.steps;
          }
        }catch(e){console.warn("Traduction échouée:",e);}
        setTranslating(false);
      }
      detailRef.current={...raw};
      setDetail({...raw});
    }catch(e){showToast("❌ "+e.message);setView("list");}
    setLoading(false);setTranslating(false);
  }

          <div style={{fontSize:10,color:TXT3,marginTop:14,padding:"8px 11px",background:CREAM,borderRadius:9,borderLeft:`2px solid ${BDR}`,lineHeight:1.55}}>
            📖 Recettes issues de <span style={{color:CARAMEL2,fontWeight:700,cursor:"pointer",textDecoration:"underline"}} onClick={()=>window.open("https://www.themealdb.com","_blank")}>TheMealDB.com</span> · Licence CC BY-SA
          </div>

      )}

      {/* VUE LISTE */}
      {view==="list"&&(
        <>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
            <button style={{...btn("gh"),fontSize:11,padding:"7px 12px"}} onClick={()=>{setView("categories");setResults([]);}}>← Retour</button>

                Licence Creative Commons CC BY-SA · Traduction automatique par IA

      {/* Barre bas fixe — import uniquement dans le détail */}
      {view==="detail"&&detail&&!loading&&!translating&&(
