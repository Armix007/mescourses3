function priceFreshness(ts){
  if(!ts)return"🔴";
  const days=(Date.now()-ts)/(1000*60*60*24);
  if(days<14)return"🟢";if(days<60)return"🟡";return"🔴";
}
// Calcule le prix de référence normalisé selon l'unité
// Poids/volume → prix au kg ou au litre
// Pièce/paquet/boîte/etc. → prix à l'unité
function pricePerKg(price,qty,unit){
  if(!price||!qty||!unit)return null;
  const q=parseFloat(qty);if(isNaN(q)||q<=0)return null;
  // Unités de poids → ramène au kg
  const toKg={g:1000,kg:1};
  // Unités de volume → ramène au litre
  const toL={ml:1000,cl:100,L:1,l:1};
  // Unités discrètes → prix à l'unité
  const discrete=["pièce","pièces","","pcs","tranche","tranches","sachet","sachets","boîte","boîtes","bouteille","bouteilles","paquet","paquets","botte","bottes","pot","pots","barquette","barquettes","rouleau","rouleaux"];
  if(toKg[unit]!==undefined)return{value:(price/q)*toKg[unit],label:"€/kg"};
  if(toL[unit]!==undefined)return{value:(price/q)*toL[unit],label:"€/L"};
  if(discrete.includes(unit.toLowerCase()))return{value:price/q,label:"€/pièce"};
  return null;
}
// Libellé court du prix de référence
function fmtPriceRef(price,qty,unit){
  const r=pricePerKg(price,qty,unit);
  if(!r)return null;
  return`${r.value.toFixed(2)}${r.label}`;
}
// Cherche le meilleur prix connu pour un produit
function getBestPrice(priceDB,name){
  const norm=name.toLowerCase().trim();
  const entries=Object.entries(priceDB||{});
  const match=entries.find(([k])=>k===norm);
  if(!match)return null;
  const shops=Object.entries(match[1].shops||{});
  if(!shops.length)return null;
  const best=shops.sort((a,b)=>{
    const ra=a[1].priceRef?.value??a[1].price;
    const rb=b[1].priceRef?.value??b[1].price;
    return ra-rb;
  })[0];
  return{shop:best[0],...best[1]};
}

  const ex=arr.find(i=>i.name.toLowerCase()===norm&&!i.checked);
  if(ex){const s=ex.quantities.find(q=>q.unit===uv);if(s)s.qty=roundQ(+s.qty+ +qv);else ex.quantities.push({qty:roundQ(+qv),unit:uv,source:src});}
  else arr.push({id:Date.now()+Math.random(),name:n,category:ct||guessCat(n),quantities:[{qty:roundQ(+qv),unit:uv,source:src}],checked:false});
  return arr;
}

// ─── CROP MODAL ───────────────────────────────────────────────
function CropModal({open,src,onConfirm,onClose}){
  const canvasRef=useRef(null),imgRef=useRef(null),containerRef=useRef(null);
  const [drag,setDrag]=useState(null);
  const [crop,setCrop]=useState({x:.05,y:.05,w:.9,h:.9});
  const [loaded,setLoaded]=useState(false);
  const [canvasSize,setCanvasSize]=useState({w:400,h:300});

  useEffect(()=>{if(open&&src){setLoaded(false);setCrop({x:.05,y:.05,w:.9,h:.9});}},[open,src]);

  // Quand l'image est chargée : calcule les dimensions du canvas selon ratio réel + DPR
  function onImgLoad(){
    const img=imgRef.current;
    if(!img)return;
    const dpr=window.devicePixelRatio||1;
    // Largeur CSS disponible (modal ~350px max)
    const cssW=Math.min(containerRef.current?.offsetWidth||340,340);
    const ratio=img.naturalHeight/img.naturalWidth;
    const cssH=Math.round(cssW*ratio);
    // Dimensions physiques du canvas (nettes sur Retina)
    setCanvasSize({w:Math.round(cssW*dpr),h:Math.round(cssH*dpr),cssW,cssH});
    setLoaded(true);
  }

  useEffect(()=>{
    if(!loaded||!canvasRef.current||!imgRef.current)return;
    const cv=canvasRef.current,img=imgRef.current,ctx=cv.getContext("2d");
    const W=cv.width,H=cv.height;
    const dpr=window.devicePixelRatio||1;
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(img,0,0,W,H);
    ctx.fillStyle="rgba(0,0,0,.5)";
    const cx=crop.x*W,cy=crop.y*H,cw=crop.w*W,ch=crop.h*H;
    ctx.fillRect(0,0,W,cy);ctx.fillRect(0,cy,cx,ch);ctx.fillRect(cx+cw,cy,W-(cx+cw),ch);ctx.fillRect(0,cy+ch,W,H-(cy+ch));
    ctx.strokeStyle=CARAMEL2;ctx.lineWidth=2*dpr;ctx.strokeRect(cx,cy,cw,ch);
    // grille des tiers
    ctx.strokeStyle="rgba(200,132,90,.4)";ctx.lineWidth=dpr;
    [1,2].forEach(k=>{ctx.beginPath();ctx.moveTo(cx+cw*k/3,cy);ctx.lineTo(cx+cw*k/3,cy+ch);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,cy+ch*k/3);ctx.lineTo(cx+cw,cy+ch*k/3);ctx.stroke();});
    // poignées de coin nettes
    const r=10*dpr;
    [[cx,cy],[cx+cw,cy],[cx,cy+ch],[cx+cw,cy+ch]].forEach(([hx,hy])=>{
      ctx.fillStyle=CARAMEL2;ctx.beginPath();ctx.arc(hx,hy,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="white";ctx.lineWidth=1.5*dpr;ctx.beginPath();ctx.arc(hx,hy,r,0,Math.PI*2);ctx.stroke();
    });
  },[crop,loaded,canvasSize]);

  function getPos(e,cv){
    const r=cv.getBoundingClientRect();const cl=e.touches?e.touches[0]:e;
    return{x:(cl.clientX-r.left)/r.width,y:(cl.clientY-r.top)/r.height};
  }
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

  function startDrag(e){
    if(!canvasRef.current)return;e.preventDefault();
    const pos=getPos(e,canvasRef.current);const{x,y,w,h}=crop;
    const hs=[{n:"tl",px:x,py:y},{n:"tr",px:x+w,py:y},{n:"bl",px:x,py:y+h},{n:"br",px:x+w,py:y+h}];
    const hit=hs.find(hd=>Math.hypot(pos.x-hd.px,pos.y-hd.py)<0.08);
    if(hit)setDrag({type:"h",name:hit.n,sc:{...crop}});
    else if(pos.x>=x&&pos.x<=x+w&&pos.y>=y&&pos.y<=y+h)setDrag({type:"m",ox:pos.x-x,oy:pos.y-y,sc:{...crop}});
    else setDrag({type:"n",sx:pos.x,sy:pos.y});
  }
  function onDrag(e){
    if(!drag||!canvasRef.current)return;e.preventDefault();
    const pos=getPos(e,canvasRef.current);
    if(drag.type==="n"){const x=Math.min(pos.x,drag.sx),y=Math.min(pos.y,drag.sy),w=Math.abs(pos.x-drag.sx),h=Math.abs(pos.y-drag.sy);setCrop({x:clamp(x,0,1),y:clamp(y,0,1),w:clamp(w,0.05,1-x),h:clamp(h,0.05,1-y)});}
    else if(drag.type==="m"){const sc=drag.sc;setCrop({...sc,x:clamp(pos.x-drag.ox,0,1-sc.w),y:clamp(pos.y-drag.oy,0,1-sc.h)});}
    else if(drag.type==="h"){const sc=drag.sc;
      if(drag.name==="tl"){const nx=clamp(pos.x,0,sc.x+sc.w-0.05),ny=clamp(pos.y,0,sc.y+sc.h-0.05);setCrop({x:nx,y:ny,w:sc.x+sc.w-nx,h:sc.y+sc.h-ny});}
      else if(drag.name==="tr"){const ny=clamp(pos.y,0,sc.y+sc.h-0.05);setCrop({x:sc.x,y:ny,w:clamp(pos.x-sc.x,0.05,1-sc.x),h:sc.y+sc.h-ny});}
      else if(drag.name==="bl"){const nx=clamp(pos.x,0,sc.x+sc.w-0.05);setCrop({x:nx,y:sc.y,w:sc.x+sc.w-nx,h:clamp(pos.y-sc.y,0.05,1-sc.y)});}
      else{setCrop({x:sc.x,y:sc.y,w:clamp(pos.x-sc.x,0.05,1-sc.x),h:clamp(pos.y-sc.y,0.05,1-sc.y)});}
    }
  }
  function endDrag(){setDrag(null);}

  function confirm(){
    if(!imgRef.current)return;
    const img=imgRef.current;
    const out=document.createElement("canvas");
    const srcX=Math.round(img.naturalWidth*crop.x);
    const srcY=Math.round(img.naturalHeight*crop.y);
    const srcW=Math.round(img.naturalWidth*crop.w);
    const srcH=Math.round(img.naturalHeight*crop.h);
    out.width=srcW;out.height=srcH;
    out.getContext("2d").drawImage(img,srcX,srcY,srcW,srcH,0,0,srcW,srcH);
    onConfirm(out.toDataURL("image/jpeg",.95));
  }

  if(!open||!src)return null;
  return(
    <div style={{...ovl,zIndex:300}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{...mdl,paddingBottom:24}}>
        <div style={{width:36,height:4,background:BDR,borderRadius:2,margin:"0 auto 14px"}}/>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:17,marginBottom:4,color:TXT}}>📐 Recadrer la photo</div>
        <div style={{fontSize:12,color:TXT3,marginBottom:10}}>Tirez les coins pour délimiter la zone à garder</div>
        <div ref={containerRef} style={{borderRadius:12,overflow:"hidden",touchAction:"none",userSelect:"none",background:CREAM2,border:`1px solid ${BDR}`}}>
          {/* Image cachée — source pour le canvas et pour le recadrage final */}
          <img ref={imgRef} src={src} alt="" style={{display:"none"}} onLoad={onImgLoad}/>
          {loaded
            ?<canvas
                ref={canvasRef}
                width={canvasSize.w}
                height={canvasSize.h}
                style={{width:`${canvasSize.cssW}px`,height:`${canvasSize.cssH}px`,display:"block",cursor:"crosshair",touchAction:"none",maxWidth:"100%"}}
                onMouseDown={startDrag} onMouseMove={onDrag} onMouseUp={endDrag} onMouseLeave={endDrag}
                onTouchStart={startDrag} onTouchMove={onDrag} onTouchEnd={endDrag}/>
            :<div style={{height:220,display:"flex",alignItems:"center",justifyContent:"center",color:TXT3,fontSize:13}}>Chargement…</div>
          }
        </div>
        <div style={{fontSize:10,color:TXT3,textAlign:"center",marginTop:6}}>Pleine résolution préservée ✓</div>
        <div style={{display:"flex",gap:8,marginTop:10}}>
          <button style={{...btn("gh"),flex:1}} onClick={onClose}>Annuler</button>
          <button style={{...btn("acc"),flex:1}} onClick={confirm} disabled={!loaded}>✂️ Recadrer</button>
        </div>
      </div>
    </div>
  );
}

  const [open,setOpen]=useState(false);
  const [sel,setSel]=useState(new Set());
  function toggle(name){const s=new Set(sel);if(s.has(name))s.delete(name);else s.add(name);setSel(s);}
  function selAll(){setSel(new Set(session.items.map(i=>i.name)));}
  const items=session.items||[];
  return(
    <div style={{...card,padding:0,overflow:"hidden"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 13px",cursor:"pointer"}} onClick={()=>setOpen(o=>!o)}>

          <div style={{fontWeight:600,fontSize:13,color:TXT}}>{session.date}</div>

        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <button style={{...btn("out"),fontSize:11,padding:"5px 9px"}} onClick={e=>{e.stopPropagation();onReloadAll();}}>Tout ajouter</button>
          <span style={{color:TXT3,fontSize:16,display:"inline-block",transform:open?"rotate(180deg)":"none",transition:"transform .2s"}}>▾</span>

        <div style={{borderTop:`1px solid ${BDR}`,padding:"10px 13px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontSize:11,color:TXT3}}>{sel.size} sélectionné{sel.size>1?"s":""}</span>
            <div style={{display:"flex",gap:5}}>
              <button style={{...btn("gh"),fontSize:11,padding:"4px 8px"}} onClick={selAll}>Tout</button>
              <button style={{...btn("gh"),fontSize:11,padding:"4px 8px"}} onClick={()=>setSel(new Set())}>Aucun</button>
              <button style={{...btn("suc"),fontSize:11,padding:"4px 8px"}} onClick={()=>onReloadSelected(sel)} disabled={sel.size===0}>✅ Ajouter ({sel.size})</button>
            </div>
          </div>
          <div style={{maxHeight:240,overflowY:"auto"}}>
            {items.map((item,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 4px",borderBottom:i<items.length-1?`1px solid ${BDR}`:"none",cursor:"pointer",background:sel.has(item.name)?`rgba(200,132,90,.08)`:"transparent"}} onClick={()=>toggle(item.name)}>
                <div style={{width:18,height:18,borderRadius:4,border:sel.has(item.name)?"none":`1.5px solid ${BDR}`,background:sel.has(item.name)?SUC:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  {sel.has(item.name)&&<span style={{color:"white",fontSize:10,fontWeight:700}}>✓</span>}
                </div>
                <span style={{flex:1,fontSize:13}}>{item.name}</span>
                <span style={{fontSize:11,color:TXT3}}>{(item.quantities||[]).map(q=>fmtQ(q.qty,q.unit)).join(" + ")}</span>
                {onDeleteItem&&<span style={{fontSize:12,color:TXT3,opacity:.5,cursor:"pointer",padding:"2px 6px",flexShrink:0}} onClick={e=>{e.stopPropagation();onDeleteItem(item.name);}}>✕</span>}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// PAGE LISTE
// ═══════════════════════════════════════════════════════════════
function PageListe({db,setDb,showToast,goToPlanning}){
  const [name,setName]=useState("");
  const [qty,setQty]=useState(1);
  const [unit,setUnit]=useState("");
  const [cat,setCat]=useState("🥦 Légumes");
  const [sugg,setSugg]=useState([]);
  const [eqty,setEqty]=useState(null);
  const [confirmClear,setConfirmClear]=useState(false);
  const showPriceVisible=localStorage.getItem("ws_prices_visible")!=="false";
  // Widget haut de liste
  const [widgetTab,setWidgetTab]=useState(()=>localStorage.getItem("ws_widget_tab")||"planning");
  const [selectedDay,setSelectedDay]=useState(null);
  // Vocal
  const [vocalActive,setVocalActive]=useState(false);
  const [vocalPending,setVocalPending]=useState([]);
  const recognitionRef=useRef(null);

  useEffect(()=>{
    if(!name.trim()){setSugg([]);return;}
    const q=name.toLowerCase();
    // Fusionner l'historique utilisateur + base PRODUCTS_DB
    const histEntries=Object.entries(db.productHistory).filter(([n])=>n.toLowerCase().includes(q)).sort((a,b)=>b[1].count-a[1].count);
    const histNames=new Set(histEntries.map(([n])=>n.toLowerCase()));
    const dbEntries=PRODUCTS_DB.filter(p=>p.toLowerCase().includes(q)&&!histNames.has(p.toLowerCase())).slice(0,4).map(p=>[p,{count:0,category:guessCat(p),lastUnit:""}]);
    setSugg([...histEntries,...dbEntries].slice(0,6));
  },[name,db.productHistory]);

  function changeCat(id,newCat){
    const ni=db.items.map(i=>i.id===id?{...i,category:newCat}:i);
    const nd={...db,items:ni};setDb(nd);saveDB(nd);
  }

  // ─── VOCAL ────────────────────────────────────────────
  function parseVocalText(text){
    // Split by virgule (symbol ou mot "virgule") ou "et" en début de segment
    const segments=text.split(/,|\bvirgule\b|\set\s/i).map(s=>s.trim()).filter(Boolean);
    return segments.map(seg=>{
      const s=seg.toLowerCase().trim();
      // Try to extract quantity + unit + name
      // Patterns: "300g de tomate", "2 litres de lait", "5 œufs", "poivron rouge"
      const m=s.match(/^(\d+[\.,]?\d*)\s*(g|kg|l|litre[s]?|ml|cl|unité[s]?|pièce[s]?)?\s*(?:de\s+)?(.+)$/i);
      if(m){
        const qv=parseFloat(m[1].replace(",","."))||1;
        const rawUnit=(m[2]||"").toLowerCase();
        const unitMap={g:"g",kg:"kg",l:"L",litre:"L",litres:"L",ml:"ml",cl:"cl"};
        const uv=unitMap[rawUnit]||"";
        const n=m[3].trim();
        return{name:n.charAt(0).toUpperCase()+n.slice(1),qty:qv,unit:uv,category:guessCat(n)};
      }
      // pattern "Œuf 5" or "Oeufs 3"
      const m2=s.match(/^(.+?)\s+(\d+)$/i);
      if(m2){
        return{name:m2[1].trim().charAt(0).toUpperCase()+m2[1].trim().slice(1),qty:parseInt(m2[2]),unit:"",category:guessCat(m2[1])};
      }
      // Just a name
      return{name:s.charAt(0).toUpperCase()+s.slice(1),qty:1,unit:"",category:guessCat(s)};
    });
  }

  function startVocal(){
    const SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SpeechRec){showToast("⚠️ Reconnaissance vocale non supportée");return;}
    const rec=new SpeechRec();
    rec.lang="fr-FR";rec.continuous=false;rec.interimResults=false;
    recognitionRef.current=rec;
    setVocalActive(true);
    rec.onresult=e=>{
      const transcript=e.results[0][0].transcript;
      setVocalActive(false);
      const items=parseVocalText(transcript);
      setVocalPending(items);
    };
    rec.onerror=()=>{setVocalActive(false);showToast("❌ Erreur vocale");};
    rec.onend=()=>setVocalActive(false);
    rec.start();
  }
  function stopVocal(){
    recognitionRef.current?.stop();
    setVocalActive(false);
  }
  function confirmVocalItem(idx){
    const item=vocalPending[idx];
    const ni=mergeItem(db.items,item.name,item.qty,item.unit,"vocal",item.category);
    const ph={...db.productHistory};
    if(!ph[item.name])ph[item.name]={count:0,category:item.category,lastUnit:item.unit};
    ph[item.name].count++;
    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);
    setVocalPending(prev=>prev.filter((_,i)=>i!==idx));
    showToast("✅ "+item.name+" ajouté");
  }
  function removeVocalItem(idx){
    setVocalPending(prev=>prev.filter((_,i)=>i!==idx));
  }
  function confirmAllVocal(){
    let ni=[...db.items],ph={...db.productHistory};
    vocalPending.forEach(item=>{
      ni=mergeItem(ni,item.name,item.qty,item.unit,"vocal",item.category);
      if(!ph[item.name])ph[item.name]={count:0,category:item.category,lastUnit:item.unit};
      ph[item.name].count++;
    });
    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);
    setVocalPending([]);showToast(`✅ ${vocalPending.length} articles ajoutés`);
  }
  // ──────────────────────────────────────────────────────
  function addItem(){
    const n=name.trim();if(!n)return;
    const ni=mergeItem(db.items,n,qty,unit,"manuel",cat);
    const ph={...db.productHistory};
    if(!ph[n])ph[n]={count:0,category:cat,lastUnit:unit};
    ph[n].count++;ph[n].category=cat;ph[n].lastUnit=unit;
    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);
    setName("");setQty(1);setSugg([]);showToast("✅ "+n+" ajouté");
  }
  function toggle(id){const ni=db.items.map(i=>i.id===id?{...i,checked:!i.checked}:i);const nd={...db,items:ni};setDb(nd);saveDB(nd);}
  function del(id){const ni=db.items.filter(i=>i.id!==id);const nd={...db,items:ni};setDb(nd);saveDB(nd);}
  function clrChk(){const ni=db.items.filter(i=>!i.checked);const nd={...db,items:ni};setDb(nd);saveDB(nd);showToast("🗑️ Articles cochés supprimés");}
  function toggleAll(){
    const allChecked=db.items.length>0&&db.items.every(i=>i.checked);
    const ni=db.items.map(i=>({...i,checked:!allChecked}));
    const nd={...db,items:ni};setDb(nd);saveDB(nd);
  }
  function saveHist(){
    if(!db.items.length){showToast("⚠️ Liste vide");return;}
    const h=[{date:new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}),items:JSON.parse(JSON.stringify(db.items)),count:db.items.length},...db.shoppingHistory].slice(0,20);
    const nd={...db,shoppingHistory:h};setDb(nd);saveDB(nd);showToast("💾 Course sauvegardée");
  }
  function confEqty(val,uv){
    if(isNaN(val)||val<0){showToast("⚠️ Quantité invalide");return;}
    const ni=db.items.map(item=>{
      if(item.id!==eqty.itemId)return item;
      const qs=[...item.quantities];
      if(eqty.qi==null)qs.push({qty:roundQ(val),unit:uv,source:"manuel"});
      else qs[eqty.qi]={...qs[eqty.qi],qty:roundQ(val),unit:uv};
      return{...item,quantities:qs};
    });
    const nd={...db,items:ni};setDb(nd);saveDB(nd);setEqty(null);
  }
  function delQty(){
    const ni=db.items.reduce((acc,item)=>{
      if(item.id!==eqty.itemId)return[...acc,item];
      const qs=item.quantities.filter((_,i)=>i!==eqty.qi);
      return qs.length?[...acc,{...item,quantities:qs}]:acc;
    },[]);
    const nd={...db,items:ni};setDb(nd);saveDB(nd);setEqty(null);
  }

  // ─── helpers widget ───────────────────────────────────
  function switchTab(t){setWidgetTab(t);localStorage.setItem("ws_widget_tab",t);setSelectedDay(null);}
  function getWeekDays(){
    const days=[];
    // Lundi de la semaine courante
    const now=new Date();
    const monday=new Date(now);
    monday.setDate(now.getDate()-((now.getDay()+6)%7));
    for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);days.push(d);}
    return days;
  }
  const weekDays=getWeekDays();
  const calendar=db.calendar||{};
  const todayKey=dateKey(new Date());
  const DAY_SHORT=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];

  // Estimation coût liste courante
  const estimatedTotal=(()=>{
    let t=0;
    db.items.filter(i=>!i.checked).forEach(item=>{
      const bp=getBestPrice(db.priceDB,item.name);
      if(bp){
        const qty=(item.quantities||[]).reduce((s,q)=>{
          const n=parseFloat(q.qty)||0;
          const u=q.unit||"";
          if(u==="kg"||u==="L")return s+n*bp.price;
          if(u==="g"||u==="ml")return s+(n/1000)*bp.price;
          return s+n*bp.price;
        },0);
        t+=qty;
      }
    });
    return t>0?t.toFixed(2):null;
  })();

  // Budget info
  const budget=db.budget||{};
  const monthly=budget.monthly||0;
  const sessions=budget.sessions||[];
  const monthKey=new Date().toISOString().slice(0,7);
  const thisMonthSessions=sessions.filter(s=>s.date&&s.date.includes(new Date().getFullYear()));
  const spent=thisMonthSessions.reduce((s,sess)=>s+(sess.total||0),0);
  const pctBudget=monthly>0?Math.min(100,Math.round((spent/monthly)*100)):0;

  const unc=db.items.filter(i=>!i.checked),chk=db.items.filter(i=>i.checked);
  const total=db.items.length,cc=chk.length,pct=total?Math.round(cc/total*100):0;
  const allChecked=total>0&&total===cc;
  const cats={};unc.forEach(item=>{const c=item.category||"❓ Autre";if(!cats[c])cats[c]=[];cats[c].push(item);});

  return(
    <div style={{padding:14,paddingBottom:90}}>

      {/* ═══ WIDGET TABS ═══════════════════════════════ */}
      <div style={{display:"flex",gap:3,background:"rgba(0,0,0,.05)",borderRadius:10,padding:3,marginBottom:10}}>
        <div style={{flex:1,textAlign:"center",padding:"7px 4px",fontSize:11,fontWeight:700,borderRadius:8,background:widgetTab==="planning"?SURF:"transparent",color:widgetTab==="planning"?CARAMEL:TXT3,boxShadow:widgetTab==="planning"?"0 2px 8px rgba(0,0,0,.08)":"none",cursor:"pointer",transition:"all .2s"}} onClick={()=>switchTab("planning")}>📅 Planning</div>
        <div style={{flex:1,textAlign:"center",padding:"7px 4px",fontSize:11,fontWeight:700,borderRadius:8,background:widgetTab==="budget"?SURF:"transparent",color:widgetTab==="budget"?CARAMEL:TXT3,boxShadow:widgetTab==="budget"?"0 2px 8px rgba(0,0,0,.08)":"none",cursor:"pointer",transition:"all .2s"}} onClick={()=>switchTab("budget")}>💰 Budget</div>
      </div>

      {/* ═══ WIDGET PLANNING ═══════════════════════════ */}
      {widgetTab==="planning"&&(
        <div style={{...card,background:"rgba(255,255,255,.93)",marginBottom:12,overflow:"hidden"}}>
          {/* Semaine strip */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,padding:"10px 10px 6px"}}>
            {weekDays.map((d,i)=>{
              const dk=dateKey(d);
              const isToday=dk===todayKey;
              const isSel=selectedDay===dk;
              const hasMidi=!!(calendar[dk]?.midi);
              const hasSoir=!!(calendar[dk]?.soir);
              return(
                <div key={dk} onClick={()=>setSelectedDay(isSel?null:dk)}
                  style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"6px 2px",borderRadius:9,cursor:"pointer",background:isSel?"rgba(184,112,58,.15)":isToday?"rgba(184,112,58,.08)":"transparent",outline:isSel?`1.5px solid ${CARAMEL}`:"none",transition:"all .15s"}}>
                  <div style={{fontSize:8,fontWeight:800,color:isToday?CARAMEL:TXT3,textTransform:"uppercase",letterSpacing:.3}}>{DAY_SHORT[i]}</div>
                  <div style={{fontSize:13,fontWeight:900,color:isToday?CARAMEL:TXT,lineHeight:1}}>{d.getDate()}</div>
                  <div style={{display:"flex",gap:2,height:8,alignItems:"center"}}>
                    <div style={{width:5,height:5,borderRadius:"50%",background:hasMidi?CARAMEL2:BDR,transition:"background .2s"}}/>
                    <div style={{width:5,height:5,borderRadius:"50%",background:hasSoir?CARAMEL:"transparent",border:hasSoir?"none":`1px solid ${BDR}`,transition:"background .2s"}}/>
                  </div>
                </div>
              );
            })}
          </div>
          {/* Légende dots */}
          <div style={{display:"flex",gap:12,justifyContent:"center",padding:"0 10px 6px",fontSize:9,color:TXT3,fontWeight:600}}>
            <div style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:6,height:6,borderRadius:"50%",background:CARAMEL2}}/> Midi</div>
            <div style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:6,height:6,borderRadius:"50%",background:CARAMEL}}/> Soir</div>
            <div style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:6,height:6,borderRadius:"50%",background:BDR}}/> Libre</div>
          </div>

          {/* Détail jour sélectionné */}
          {selectedDay&&(()=>{
            const d=new Date(selectedDay);
            const isToday=selectedDay===todayKey;
            const dayLabel=isToday?"Aujourd'hui":d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
            const midiId=calendar[selectedDay]?.midi;
            const soirId=calendar[selectedDay]?.soir;
            const midiR=midiId?(db.recipes||[]).find(r=>String(r.id)===String(midiId)):null;
            const soirR=soirId?(db.recipes||[]).find(r=>String(r.id)===String(soirId)):null;
            function addMealToList(recipe){
              if(!recipe)return;
              let ni=[...db.items],ph={...db.productHistory},added=0;
              (recipe.ingredients||[]).forEach(ing=>{
                if(!ing.name?.trim())return;
                const ct=ph[ing.name]?.category||guessCat(ing.name);
                ni=mergeItem(ni,ing.name,parseFloat(ing.qty)||1,ing.unit||"","recette",ct);
                if(!ph[ing.name])ph[ing.name]={count:0,category:ct,lastUnit:ing.unit||""};
                ph[ing.name].count++;added++;
              });
              const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);
              showToast(`🛒 ${added} ingrédients de ${recipe.name} ajoutés`);
            }
            return(
              <div style={{borderTop:`1px solid ${BDR}`,padding:"10px 12px 12px",background:CREAM}}>
                <div style={{fontSize:11,fontWeight:700,color:CARAMEL,marginBottom:8}}>📍 {dayLabel.charAt(0).toUpperCase()+dayLabel.slice(1)}</div>
                {[{slot:"🌅 Midi",recipe:midiR},{slot:"🌙 Soir",recipe:soirR}].map(({slot,recipe})=>(
                  <div key={slot} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",background:"rgba(255,255,255,.9)",borderRadius:9,border:`1px solid ${BDR}`,marginBottom:5}}>
                    <div style={{fontSize:10,fontWeight:800,color:TXT3,width:34,flexShrink:0}}>{slot}</div>
                    {recipe
                      ?<div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:12,fontWeight:700,color:TXT,marginBottom:3}}>{guessRecipeEmoji(recipe.name)} {recipe.name}</div>
                          <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                            {recipe.persons&&<span style={{fontSize:9,background:CREAM2,padding:"1px 6px",borderRadius:10,color:TXT2,fontWeight:600}}>👥 {recipe.persons}</span>}
                            {recipe.duration&&<span style={{fontSize:9,background:CREAM2,padding:"1px 6px",borderRadius:10,color:TXT2,fontWeight:600}}>⏱️ {recipe.duration}</span>}
                            {(()=>{const c=estimateRecipeCost(recipe,db.priceDB,recipe.persons);return c?<span style={{fontSize:9,background:"rgba(90,138,58,.1)",padding:"1px 6px",borderRadius:10,color:SUC,fontWeight:700}}>~{c.total.toFixed(2)}€</span>:null;})()}
                          </div>
                        </div>
                      :<div style={{flex:1,fontSize:11,color:TXT3,fontStyle:"italic",cursor:"pointer"}} onClick={goToPlanning}>+ Planifier un repas →</div>
                    }
                    {recipe&&(
                      <button onClick={()=>addMealToList(recipe)}
                        style={{background:"none",border:`1px solid ${BDR}`,borderRadius:8,padding:"4px 8px",fontSize:10,color:CARAMEL,fontWeight:700,cursor:"pointer",flexShrink:0,whiteSpace:"nowrap"}}>
                        🛒 Ajouter
                      </button>
                    )}
                  </div>
                ))}
              </div>
            );
          })()}

          {/* Bouton générer liste */}
          <div onClick={goToPlanning} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:`linear-gradient(135deg,rgba(184,112,58,.08),rgba(200,132,90,.05))`,borderTop:`1px solid rgba(184,112,58,.12)`,cursor:"pointer"}}>
            <span style={{fontSize:12,fontWeight:700,color:CARAMEL}}>🛒 Générer la liste de courses</span>
            <span style={{fontSize:16,color:CARAMEL2}}>›</span>
          </div>
        </div>
      )}

      {/* ═══ WIDGET BUDGET ════════════════════════════ */}
      {widgetTab==="budget"&&(
        <div style={{marginBottom:12}}>
          {/* Hero caramel */}
          <div style={{background:`linear-gradient(135deg,${CARAMEL} 0%,${CARAMEL2} 100%)`,borderRadius:16,padding:16,marginBottom:8,position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",top:-20,right:-20,width:120,height:120,background:"rgba(255,255,255,.07)",borderRadius:"50%"}}/>
            <div style={{position:"absolute",bottom:-30,right:20,width:80,height:80,background:"rgba(255,255,255,.05)",borderRadius:"50%"}}/>
            <div style={{position:"relative",zIndex:1}}>
              <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,.65)",letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Budget ce mois</div>
              <div style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:12}}>
                <div style={{fontFamily:"'Fraunces',serif",fontSize:34,fontWeight:900,color:"white",lineHeight:1}}>{spent.toFixed(2)} €</div>
                {monthly>0&&<div style={{fontSize:12,color:"rgba(255,255,255,.6)"}}>/ {monthly} €</div>}
              </div>
              {monthly>0&&(
                <>
                  <div style={{height:6,background:"rgba(255,255,255,.2)",borderRadius:3,overflow:"hidden",marginBottom:8}}>
                    <div style={{width:pctBudget+"%",height:"100%",background:"white",borderRadius:3,transition:"width .6s"}}/>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"rgba(255,255,255,.65)"}}>
                    <span>{(monthly-spent).toFixed(2)} € restants</span>
                    <span>{thisMonthSessions.length} session{thisMonthSessions.length!==1?"s":""}</span>
                  </div>
                </>
              )}
              {/* Historique mini */}
              {thisMonthSessions.length>0&&(
                <div style={{borderTop:"1px solid rgba(255,255,255,.15)",marginTop:10,paddingTop:10}}>
                  <div style={{fontSize:9,fontWeight:700,color:"rgba(255,255,255,.55)",letterSpacing:.8,textTransform:"uppercase",marginBottom:6}}>Dernières sessions</div>
                  {thisMonthSessions.slice(-3).reverse().map((sess,i)=>{
                    const maxT=Math.max(...thisMonthSessions.map(s=>s.total||0),1);
                    const pct=Math.round(((sess.total||0)/maxT)*100);
                    return(
                      <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                        <div style={{fontSize:10,color:"rgba(255,255,255,.7)",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{sess.date}</div>
                        <div style={{fontSize:11,fontWeight:700,color:"white",flexShrink:0}}>{(sess.total||0).toFixed(2)} €</div>
                        <div style={{width:44,height:4,background:"rgba(255,255,255,.15)",borderRadius:2,overflow:"hidden",flexShrink:0}}>
                          <div style={{width:pct+"%",height:"100%",background:"rgba(255,255,255,.55)",borderRadius:2}}/>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>

          {/* Estimation liste courante */}
          {estimatedTotal&&(
            <div style={{...card,background:"rgba(255,255,255,.92)",padding:"12px 14px"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:7}}>
                <div style={{fontSize:12,fontWeight:700,color:TXT}}>🛒 Estimation liste en cours</div>
                <div style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:900,color:CARAMEL}}>~{estimatedTotal} €</div>
              </div>
              {monthly>0&&(()=>{
                const newSpent=spent+parseFloat(estimatedTotal);
                const newPct=Math.min(100,Math.round((newSpent/monthly)*100));
                return(
                  <>
                    <div style={{height:5,background:CREAM2,borderRadius:3,overflow:"hidden",marginBottom:5}}>
                      <div style={{width:newPct+"%",height:"100%",background:newPct>80?DNG:newPct>60?CARAMEL2:SUC,borderRadius:3,transition:"width .5s"}}/>
                    </div>
                    <div style={{fontSize:10,color:TXT3}}>Budget après cette session : {(monthly-newSpent).toFixed(2)} € restants</div>
                  </>
                );
              })()}
            </div>
          )}
        </div>
      )}

      {/* Add form */}
      <div style={{...card,background:"rgba(255,255,255,.9)"}}>
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <input style={{...inp,flex:1}} placeholder="Nom de l'article…" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addItem()}/>
          <button style={{...btn(vocalActive?"dng":"gh"),padding:"10px 12px",fontSize:16,flexShrink:0}} onClick={vocalActive?stopVocal:startVocal} title="Ajout vocal">
            {vocalActive?"⏹️":"🎤"}
          </button>
          <button style={{...btn("acc"),fontSize:18,padding:"10px 16px"}} onClick={addItem}>+</button>
        </div>
        {vocalActive&&(
          <div style={{background:"rgba(212,96,74,.1)",border:"2px solid rgba(212,96,74,.5)",borderRadius:10,padding:"10px 13px",marginBottom:8,display:"flex",flexDirection:"column",gap:6}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:10,height:10,borderRadius:"50%",background:DNG,animation:"pulse 1s infinite",flexShrink:0}}/>
              <span style={{fontSize:13,color:DNG,fontWeight:800}}>🎤 En écoute…</span>
            </div>
            <div style={{background:"rgba(212,96,74,.12)",borderRadius:8,padding:"7px 10px",fontSize:12,color:DNG,fontWeight:700,textAlign:"center",lineHeight:1.5}}>
              Dites vos articles puis <span style={{background:DNG,color:"white",borderRadius:5,padding:"1px 6px",fontWeight:900}}>« virgule »</span> entre chaque
            </div>
            <div style={{fontSize:10,color:TXT3,textAlign:"center"}}>Ex : "tomates virgule lait virgule œufs"</div>
          </div>
        )}
        {sugg.length>0&&(
          <div style={{background:CREAM2,border:`1px solid ${BDR}`,borderRadius:12,overflow:"hidden",marginBottom:8}}>
            {sugg.slice(0,5).map(([n,d])=>(
              <div key={n} style={{padding:"9px 13px",fontSize:13,cursor:"pointer",borderBottom:`1px solid ${BDR}`,display:"flex",justifyContent:"space-between",color:TXT}}
                onClick={()=>{setName(n);if(d.category)setCat(d.category);if(d.lastUnit!==undefined)setUnit(d.lastUnit);setSugg([]);}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:14}}>{(d.category||guessCat(n)).split(" ")[0]}</span>
                  <span style={{fontWeight:600}}>{n}</span>
                </div>
                <span style={{fontSize:10,color:TXT3,background:CREAM2,padding:"2px 8px",borderRadius:20,fontWeight:600}}>{d.count}× · {UL[d.lastUnit]||"pcs"}</span>
              </div>
            ))}
          </div>
        )}
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <Stepper value={qty} onChange={setQty}/>
          <select style={{...sel,flex:1,minWidth:75,padding:"8px 10px"}} value={unit} onChange={e=>setUnit(e.target.value)}>{UNITS.map(u=><option key={u} value={u}>{UL[u]}</option>)}</select>
          <select style={{...sel,flex:1,minWidth:115,padding:"8px 10px"}} value={cat} onChange={e=>setCat(e.target.value)}>{CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}</select>
        </div>
      </div>

      {/* Validation vocale en attente */}
      {vocalPending.length>0&&(
        <div style={{...card,background:"rgba(255,255,255,.95)",border:`1.5px solid ${CARAMEL2}`,marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontSize:13,fontWeight:700,color:TXT}}>🎤 Articles détectés — Vérifiez avant d'ajouter</div>
            <button style={{...btn("acc"),fontSize:11,padding:"5px 10px"}} onClick={confirmAllVocal}>Tout ajouter ✓</button>
          </div>
          {vocalPending.map((item,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:i<vocalPending.length-1?`1px solid ${BDR}`:"none"}}>
              <span style={{fontSize:18}}>{item.category.split(" ")[0]}</span>
              <div style={{flex:1}}>
                <input style={{...inp,padding:"6px 10px",fontSize:13,marginBottom:4}} value={item.name}
                  onChange={e=>setVocalPending(prev=>prev.map((it,j)=>j===i?{...it,name:e.target.value,category:guessCat(e.target.value)}:it))}/>
                <div style={{display:"flex",gap:4}}>
                  <input type="number" style={{...inp,padding:"4px 8px",fontSize:12,width:60}} value={item.qty}
                    onChange={e=>setVocalPending(prev=>prev.map((it,j)=>j===i?{...it,qty:parseFloat(e.target.value)||1}:it))}/>
                  <select style={{...sel,padding:"4px 8px",fontSize:12,flex:1}} value={item.unit}
                    onChange={e=>setVocalPending(prev=>prev.map((it,j)=>j===i?{...it,unit:e.target.value}:it))}>
                    {UNITS.map(u=><option key={u} value={u}>{UL[u]}</option>)}
                  </select>
                </div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:4,flexShrink:0}}>
                <button style={{...btn("suc"),padding:"6px 10px",fontSize:12}} onClick={()=>confirmVocalItem(i)}>✓</button>
                <button style={{...btn("dng"),padding:"6px 10px",fontSize:12}} onClick={()=>removeVocalItem(i)}>✕</button>
              </div>
            </div>
          ))}
        </div>
      )}
      {db.items.length===0?(
        <div style={{textAlign:"center",padding:"48px 20px"}}>
          <div style={{fontSize:44,marginBottom:12}}>🛍️</div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:6,color:TXT}}>Liste vide</div>
          <div style={{fontSize:13,color:TXT3}}>Ajoutez un article ou importez une recette</div>
        </div>
      ):(
        <>
          {/* Barre d'actions rapides */}
          <div style={{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap"}}>
            <button style={{...btn("gh"),fontSize:11,padding:"7px 12px",flex:1,justifyContent:"center",minWidth:120}} onClick={toggleAll}>
              {allChecked?"☐ Tout décocher":"☑️ Tout cocher"}
            </button>
            {chk.length>0&&(
              <button style={{...btn("dng"),fontSize:11,padding:"7px 12px",flex:1,justifyContent:"center",minWidth:120}} onClick={clrChk}>
                🗑️ Supprimer cochés ({chk.length})
              </button>
            )}
          </div>
          {Object.entries(cats).map(([c,items])=>(
            <div key={c}><SecTitle>{c}</SecTitle>
              {items.map(item=><Item key={item.id} item={item} onToggle={toggle} onDel={del} onEqty={(id,qi)=>setEqty({itemId:id,qi})} onAqty={id=>setEqty({itemId:id,qi:null})} priceDB={db.priceDB} showPrice={showPriceVisible} onCatChange={changeCat}/>)}
            </div>
          ))}

const DIET_TAGS=["Tout","🌱 Végétarien","🌿 Vegan","🚫🌾 Sans gluten","🥛 Sans lactose","🐟 Poisson","🥩 Viande","⚡ Rapide"];

function guessRecipeEmoji(name){
  const n=(name||"").toLowerCase();
  if(/pâte|pasta|spaghetti|tagliatelle|linguine|rigatoni|lasagne/.test(n))return"🍝";
  if(/salade|taboulé/.test(n))return"🥗";
  if(/soupe|velouté|potage|bouillon/.test(n))return"🍜";
  if(/tarte|quiche|pizza/.test(n))return"🥧";
  if(/gâteau|cake|brownie|muffin|crêpe|clafoutis|moelleux/.test(n))return"🍰";
  if(/poulet|volaille|dinde/.test(n))return"🍗";
  if(/boeuf|steak|pot-au-feu|bourguignon/.test(n))return"🥩";
  if(/poisson|saumon|thon|cabillaud|dorade/.test(n))return"🐟";
  if(/riz|risotto|paella/.test(n))return"🍚";
  if(/burger|sandwich|wrap/.test(n))return"🍔";
  if(/curry|wok|sauté/.test(n))return"🥘";
  if(/oeuf|omelette|frittata/.test(n))return"🥚";
  if(/gratin|soufflé/.test(n))return"🫕";
  return"🍽️";
}

function estimateRecipeCost(recipe,priceDB,vp){
  if(!recipe?.ingredients?.length||!priceDB)return null;
  const base=recipe.persons||1,scale=(vp||base)/base;
  const toBase={g:1/1000,kg:1,ml:1/1000,cl:1/100,L:1,l:1,pièce:1,tranche:1,sachet:1,boîte:1,bouteille:1,paquet:1,botte:1};
  let total=0,matched=0;
  recipe.ingredients.forEach(ing=>{
    const key=ing.name.toLowerCase().trim();
    const entry=(priceDB||{})[key];
    if(!entry?.shops)return;
    const shops=Object.entries(entry.shops);
    if(!shops.length)return;
    const best=shops.sort((a,b)=>(a[1].priceRef?.value??a[1].price)-(b[1].priceRef?.value??b[1].price))[0][1];
    const ref=best.priceRef;
    const ingQty=parseFloat(ing.qty)*scale;
    if(ref&&ing.qty&&ing.unit&&toBase[ing.unit]!==undefined){
      total+=ingQty*toBase[ing.unit]*ref.value;matched++;
    } else if(!ing.qty){
      total+=best.price;matched++;
    }
  });
  if(!matched)return null;
  return{total:Math.round(total*100)/100,matched,outOf:recipe.ingredients.length};
}

const MEAL_NAME_FR={"Beef and Mustard Pie":"Tourte bœuf moutarde","Beef and Oyster pie":"Tourte bœuf aux huîtres","Beef Bourguignon":"Bœuf Bourguignon","Beef Brisket Pot Roast":"Pot-au-feu de poitrine","Beef Lo Mein":"Bœuf aux nouilles sautées","Beef Rendang":"Rendang de bœuf","Beef stroganoff":"Bœuf Stroganoff","Bigos (Hunters Stew)":"Bigos (ragoût chasseur)","Chicken Alfredo":"Poulet Alfredo","Chicken Basquaise":"Poulet basquaise","Chicken Congee":"Congee de poulet","Chicken Couscous":"Couscous au poulet","Chicken Handi":"Poulet Handi","Chicken Karahi":"Poulet Karahi","Chicken Marengo":"Poulet Marengo","Chicken Marsala":"Poulet Marsala","Chicken Parmesan":"Poulet Parmesan","Coq au vin":"Coq au vin","Egg Drop Soup":"Soupe aux œufs","Fish pie":"Tourte au poisson","French Onion Soup":"Soupe à l'oignon","Grilled Salmon with Cajun":"Saumon grillé cajun","Honey Teriyaki Salmon":"Saumon teriyaki au miel","Kedgeree":"Kedgeree","Lamb and Potato Pie":"Tourte agneau pommes de terre","Lamb Biryani":"Biryani d'agneau","Lobster Bisque":"Bisque de homard","Poutine":"Poutine","Ribollita":"Ribollita (soupe toscane)","Ratatouille":"Ratatouille","Salmon Prawn Risotto":"Risotto saumon crevettes","Smoked Haddock Kedgeree":"Kedgeree haddock fumé","Spaghetti Bolognese":"Spaghettis bolognaise","Spaghetti alla Carbonara":"Spaghettis carbonara","Steak Diane":"Steak Diane","Thai Green Curry":"Curry vert thaïlandais","Thai Red Curry":"Curry rouge thaïlandais","Tuna Nicoise":"Salade niçoise au thon","Vegetarian Lasagne":"Lasagnes végétariennes","Yorkshire Pudding":"Yorkshire Pudding"};
// Traduction FR → EN pour la recherche TheMealDB
const SEARCH_FR_TO_EN={"poulet":"chicken","boeuf":"beef","bœuf":"beef","porc":"pork","agneau":"lamb","poisson":"fish","saumon":"salmon","crevette":"shrimp","pâtes":"pasta","riz":"rice","soupe":"soup","salade":"salad","tarte":"pie","pizza":"pizza","curry":"curry","risotto":"risotto","omelette":"omelette","crêpe":"crepe","ratatouille":"ratatouille","bouillabaisse":"bouillabaisse","cassoulet":"cassoulet","gratin":"gratin"};
function translateMealName(enName){return MEAL_NAME_FR[enName]||enName;}
function translateSearchToEN(frTerm){
  const low=frTerm.toLowerCase().trim();
  return SEARCH_FR_TO_EN[low]||frTerm;
}
function parseMealDBMeasure(measure){
  if(!measure)return{qty:"",unit:""};
  const fracs={"1/2":"0.5","1/3":"0.33","1/4":"0.25","2/3":"0.67","3/4":"0.75"};
  let s=measure.trim().toLowerCase();
  Object.entries(fracs).forEach(([f,v])=>{s=s.replace(f,v);});
  const match=s.match(/^([\d.]+)\s*([a-zéàèêâ ]*)/);
  if(!match)return{qty:"",unit:""};
  const qty=match[1];
  const rawUnit=(match[2]||"").trim();
  const unitMap={g:"g",kg:"kg",ml:"ml",cl:"cl",l:"L",cup:"",cups:"",tbsp:"càs",tbs:"càs",tsp:"càc",oz:"g",lb:"kg",pinch:"pincée",bunch:"botte",clove:"pièce",cloves:"pièce",slice:"tranche",slices:"tranche",can:"boîte",jar:"boîte",bag:"paquet",packet:"paquet",bottle:"bouteille"};
  return{qty,unit:(unitMap[rawUnit]!==undefined?unitMap[rawUnit]:"").trim()};
}

function MealDBSearch({onImport,onClose,showToast,initialMeal}){
  const [view,setView]=useState(initialMeal?"detail":"categories");
  const [categories,setCategories]=useState([]);
  const [query,setQuery]=useState("");
  const [results,setResults]=useState([]);
  const [loading,setLoading]=useState(false);
  const [detail,setDetail]=useState(null);
  const [translating,setTranslating]=useState(false);
  const [selectedCat,setSelectedCat]=useState("");

  useEffect(()=>{
    if(!initialMeal)fetch("https://www.themealdb.com/api/json/v1/1/categories.php")
      .then(r=>r.json()).then(d=>setCategories(d.categories||[])).catch(()=>{});
  },[]);

  useEffect(()=>{
    if(initialMeal?.mealdbId)loadDetail(initialMeal.mealdbId);
  },[initialMeal]);

  async function browseCategory(cat){
    setSelectedCat(cat);setLoading(true);setResults([]);setView("list");
    try{
      const r=await fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?c=${encodeURIComponent(cat)}`);
      const d=await r.json();setResults(d.meals||[]);
    }catch{showToast("❌ Erreur de connexion");}
    setLoading(false);
  }

  async function search(){
    if(!query.trim())return;
    setLoading(true);setResults([]);setView("list");setSelectedCat("");
    try{
      const r=await fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${encodeURIComponent(query)}`);
      const d=await r.json();setResults(d.meals||[]);
      if(!d.meals?.length)showToast("Aucune recette trouvée");
    }catch{showToast("❌ Erreur de connexion");}
    setLoading(false);
  }

  async function browseArea(area){
    setSelectedCat("__area__"+area);setLoading(true);setResults([]);setView("list");
    try{
      const r=await fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?a=${encodeURIComponent(area)}`);
      const d=await r.json();setResults(d.meals||[]);
    }catch{showToast("❌ Erreur de connexion");}
    setLoading(false);
  }

  async function loadDetail(id){
    setLoading(true);setDetail(null);setView("detail");
    try{
      const r=await fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${id}`);
      const d=await r.json();
      const m=d.meals?.[0];if(!m){showToast("❌ Introuvable");setView("list");setLoading(false);return;}
      const ings=[];
      for(let i=1;i<=20;i++){
        const name=(m[`strIngredient${i}`]||"").trim();
        const measure=(m[`strMeasure${i}`]||"").trim();
        if(!name)continue;
        ings.push({name:name.toLowerCase(),...parseMealDBMeasure(measure)});
      }
      // Nettoyage des étapes : supprimer les "STEP 1", "Step 1:", etc. parasites
      const rawSteps=(m.strInstructions||"").split(/\r?\n/).map(s=>s.trim()).filter(s=>s.length>3);
      const steps=rawSteps.map(s=>s.replace(/^(STEP|Step|step)\s*\d+[:\.\s]*/,"").trim()).filter(s=>s.length>3);
      const raw={
        id:Date.now(),name:m.strMeal,persons:null,duration:null,photo:null,
        source:"mealdb",mealdbId:m.idMeal,
        category:CAT_FR[m.strCategory]||m.strCategory||"",
        area:AREA_FR[m.strArea]||m.strArea||"",
        ingredients:ings,steps,
        date:new Date().toLocaleDateString("fr-FR")
      };
      setLoading(false);
      // Traduire avec Anthropic si clé dispo — ingrédients EN PRIORITÉ
      const apiKey=localStorage.getItem("ws_apikey")||"";
      if(apiKey){
        setTranslating(true);
        try{
          const prompt=`Tu es un traducteur culinaire français expert. Traduis cette recette anglaise en français.

RÈGLES STRICTES :
- Traduis le nom du plat en français naturel (si traduction connue), sinon garde l'original
- Pour chaque ingrédient : traduis en nom générique français COURANT (ex: "chicken thighs" → "cuisses de poulet", "garlic cloves" → "gousses d'ail", "olive oil" → "huile d'olive", "chorizo" → "chorizo")
- Traduis chaque étape en français naturel et fluide
- Conserve exactement les mêmes qty et unit pour chaque ingrédient
- Ne jamais laisser de mots anglais dans les noms d'ingrédients
- Réponds UNIQUEMENT en JSON valide (pas de markdown, pas de backtick, pas de commentaire)

FORMAT EXACT :
{"name":"string","ingredients":[{"name":"string","qty":"string","unit":"string"}],"steps":["string"]}

DONNÉES À TRADUIRE :
Nom: ${raw.name}
Ingrédients: ${JSON.stringify(raw.ingredients)}
Étapes: ${JSON.stringify(raw.steps)}`;
          const resp=await fetch("https://api.anthropic.com/v1/messages",{
            method:"POST",
            headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
            body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,messages:[{role:"user",content:prompt}]})
          });
          if(resp.ok){
            const data=await resp.json();
            let text=(data.content||[]).map(c=>c.text||"").join("").trim();
            text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
            const translated=JSON.parse(text);
            if(translated.name)raw.name=translated.name;
            if(translated.ingredients?.length===raw.ingredients.length)raw.ingredients=translated.ingredients;
            if(translated.steps?.length)raw.steps=translated.steps;
          }
        }catch(e){console.warn("Traduction échouée:",e);}
        setTranslating(false);
      }
      setDetail(raw);
    }catch(e){showToast("❌ "+e.message);setView("list");}
    setLoading(false);setTranslating(false);
  }

  const [catTab,setCatTab]=useState("categories"); // categories | areas

  return(
    <Modal open onClose={onClose}>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:2,color:TXT}}>🌐 Parcourir TheMealDB</div>
      <div style={{fontSize:10,color:TXT3,marginBottom:12,lineHeight:1.5}}>
        Recettes issues de <span style={{color:CARAMEL2,fontWeight:700,cursor:"pointer",textDecoration:"underline"}} onClick={()=>window.open("https://www.themealdb.com","_blank")}>TheMealDB.com</span> — licence Creative Commons CC BY-SA
      </div>

      {/* VUE CATÉGORIES */}
      {view==="categories"&&(
        <>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <input style={{...inp,flex:1}} placeholder="Rechercher (en anglais)…" value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==="Enter"&&search()}/>
            <button style={{...btn("acc"),padding:"10px 14px"}} onClick={search} disabled={loading}>{loading?"⏳":"🔍"}</button>
          </div>
          {/* Sous-onglets catégorie / origine — bien visibles */}
          <div style={{display:"flex",gap:6,marginBottom:12}}>
            {[{id:"categories",label:"🍽️ Catégories",count:categories.length},{id:"areas",label:"🌍 Origines",count:Object.keys(AREA_FR).length}].map(t=>(
              <div key={t.id} style={{flex:1,padding:"10px 8px",textAlign:"center",borderRadius:12,background:catTab===t.id?`linear-gradient(135deg,${CARAMEL},${CARAMEL2})`:"rgba(255,255,255,.85)",color:catTab===t.id?"white":TXT2,cursor:"pointer",border:`1.5px solid ${catTab===t.id?CARAMEL:BDR}`,boxShadow:catTab===t.id?`0 3px 12px rgba(184,112,58,.25)`:"none",transition:"all .2s"}} onClick={()=>setCatTab(t.id)}>

              </div>
            ))}
          </div>
          {catTab==="categories"&&(
            <div style={{display:"flex",flexWrap:"wrap",gap:7,maxHeight:300,overflowY:"auto"}}>
              {categories.map(cat=>(
                <div key={cat.idCategory} style={{display:"flex",alignItems:"center",gap:6,padding:"9px 12px",background:"rgba(255,255,255,.9)",border:`1px solid ${BDR}`,borderRadius:12,cursor:"pointer",width:"calc(50% - 4px)",boxSizing:"border-box",boxShadow:"0 1px 5px rgba(160,90,40,.07)"}} onClick={()=>browseCategory(cat.strCategory)}>
                  <span style={{fontSize:20}}>{(CAT_FR[cat.strCategory]||cat.strCategory).split(" ")[0]}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:700,color:TXT,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{(CAT_FR[cat.strCategory]||cat.strCategory).replace(/^[^ ]+ /,"")}</div>
                  </div>
                  <span style={{color:CARAMEL2,fontWeight:700}}>›</span>
                </div>
              ))}
            </div>
          )}
          {catTab==="areas"&&(
            <div style={{display:"flex",flexWrap:"wrap",gap:7,maxHeight:300,overflowY:"auto"}}>
              {Object.entries(AREA_FR).map(([en,fr])=>(
                <div key={en} style={{display:"flex",alignItems:"center",gap:6,padding:"9px 12px",background:"rgba(255,255,255,.9)",border:`1px solid ${BDR}`,borderRadius:12,cursor:"pointer",width:"calc(50% - 4px)",boxSizing:"border-box",boxShadow:"0 1px 5px rgba(160,90,40,.07)"}} onClick={()=>browseArea(en)}>
                  <span style={{fontSize:20}}>{fr.split(" ")[0]}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:700,color:TXT,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{fr.replace(/^[^ ]+ /,"")}</div>
                  </div>
                  <span style={{color:CARAMEL2,fontWeight:700}}>›</span>
                </div>
              ))}
            </div>
          )}
        </>
      )}

      {/* VUE LISTE */}
      {view==="list"&&(
        <>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <button style={{...btn("gh"),fontSize:11,padding:"5px 10px"}} onClick={()=>{setView("categories");setResults([]);}}>← Retour</button>
            <div style={{fontSize:13,fontWeight:700,color:TXT,flex:1}}>
              {selectedCat.startsWith("__area__")?AREA_FR[selectedCat.replace("__area__","")]||selectedCat.replace("__area__",""):selectedCat?CAT_FR[selectedCat]||selectedCat:"Résultats"}
            </div>
            <span style={{fontSize:11,color:TXT3}}>{results.length} recettes</span>
          </div>
          {loading&&<div style={{textAlign:"center",padding:20,color:TXT3}}>⏳ Chargement…</div>}
          <div style={{maxHeight:380,overflowY:"auto"}}>
            {results.map(m=>(
              <div key={m.idMeal} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 4px",borderBottom:`1px solid ${BDR}`,cursor:"pointer"}} onClick={()=>loadDetail(m.idMeal)}>
                <div style={{width:44,height:44,borderRadius:10,background:`linear-gradient(135deg,${CREAM2},${BDR})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>
                  {guessRecipeEmoji(m.strMeal)}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:700,color:TXT,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.strMeal}</div>
                  {m.strCategory&&<div style={{fontSize:10,color:TXT3,marginTop:1}}>{CAT_FR[m.strCategory]||m.strCategory}</div>}
                </div>
                <div style={{fontSize:18,color:TXT3,flexShrink:0}}>›</div>
              </div>
            ))}
          </div>
        </>
      )}

      {/* VUE DÉTAIL */}
      {view==="detail"&&(
        <>
          {(loading||translating)&&(
            <div style={{textAlign:"center",padding:"30px 20px"}}>
              <div style={{fontSize:32,marginBottom:8}}>⏳</div>
              <div style={{fontSize:13,color:TXT2,fontWeight:600}}>{translating?"✨ Traduction en cours…":"Chargement…"}</div>
              {translating&&<div style={{fontSize:11,color:TXT3,marginTop:4}}>L'IA traduit le nom, les ingrédients et les étapes</div>}
            </div>
          )}
          {detail&&!loading&&!translating&&(
            <>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                <button style={{...btn("gh"),fontSize:11,padding:"5px 10px"}} onClick={()=>{setDetail(null);setView("list");}}>← Retour</button>
                <div style={{fontFamily:"'Fraunces',serif",fontSize:15,color:TXT,flex:1,lineHeight:1.3}}>{detail.name}</div>
              </div>
              <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:10}}>
                {detail.category&&<span style={{fontSize:10,background:CREAM2,padding:"2px 8px",borderRadius:20,color:TXT2,fontWeight:600}}>{detail.category}</span>}
                {detail.area&&<span style={{fontSize:10,background:CREAM2,padding:"2px 8px",borderRadius:20,color:TXT2,fontWeight:600}}>{detail.area}</span>}
                <span style={{fontSize:10,background:CREAM2,padding:"2px 8px",borderRadius:20,color:TXT2,fontWeight:600}}>🥗 {detail.ingredients.length} ingr.</span>
                <span style={{fontSize:10,background:CREAM2,padding:"2px 8px",borderRadius:20,color:TXT2,fontWeight:600}}>📋 {detail.steps.length} étapes</span>
                <span style={{fontSize:10,background:CREAM2,padding:"2px 8px",borderRadius:20,color:TXT2,fontWeight:600}}>👥 {detail.persons||"❓"} pers.</span>
                <span style={{fontSize:10,background:CREAM2,padding:"2px 8px",borderRadius:20,color:TXT2,fontWeight:600}}>⏱️ {detail.duration||"❓"}</span>
              </div>
              <div style={{fontSize:11,fontWeight:700,color:TXT2,marginBottom:5}}>Ingrédients</div>
              <div style={{background:CREAM,border:`1px solid ${BDR}`,borderRadius:10,padding:"8px 12px",marginBottom:10,maxHeight:130,overflowY:"auto"}}>
                {detail.ingredients.map((ing,i)=>(
                  <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:i<detail.ingredients.length-1?`1px solid ${BDR}`:"none",fontSize:12}}>
                    <span style={{color:TXT}}>{ing.name}</span>
                    <span style={{color:TXT3}}>{ing.qty}{ing.unit?" "+ing.unit:""}</span>
                  </div>
                ))}
              </div>
              {detail.steps?.length>0&&(
                <>
                  <div style={{fontSize:11,fontWeight:700,color:TXT2,marginBottom:5}}>Étapes de préparation</div>
                  <div style={{background:CREAM,border:`1px solid ${BDR}`,borderRadius:10,padding:"8px 12px",marginBottom:10,maxHeight:160,overflowY:"auto"}}>
                    {detail.steps.map((step,i)=>(
                      <div key={i} style={{display:"flex",gap:8,padding:"6px 0",borderBottom:i<detail.steps.length-1?`1px solid ${BDR}`:"none",fontSize:11,color:TXT2,lineHeight:1.5}}>
                        <div style={{width:18,height:18,background:CARAMEL2,color:"white",borderRadius:"50%",fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1}}>{i+1}</div>
                        <div>{step}</div>
                      </div>
                    ))}
                  </div>
                </>
              )}
              {/* Attribution + lien source */}
              <div style={{fontSize:10,color:TXT3,marginBottom:12,padding:"7px 10px",background:"rgba(200,132,90,.06)",borderRadius:8,borderLeft:`2px solid ${CARAMEL2}`,lineHeight:1.6}}>
                📖 Source : <span style={{color:CARAMEL2,fontWeight:700,cursor:"pointer",textDecoration:"underline"}} onClick={()=>window.open(`https://www.themealdb.com/meal/${detail.mealdbId}`,`_blank`)}>TheMealDB — voir la recette originale</span><br/>
                Licence Creative Commons CC BY-SA · Traduction automatique par IA
              </div>
              <div style={{display:"flex",gap:8}}>
                <button style={{...btn("gh"),flex:1}} onClick={()=>{setDetail(null);setView("list");}}>Annuler</button>
                <button style={{...btn("acc"),flex:1}} onClick={()=>onImport(detail)}>✅ Importer</button>
              </div>
            </>
          )}
        </>
      )}
    </Modal>
  );
}

// ─── RECIPE EDIT ──────────────────────────────────────────────
function RecipeEdit({recipe,onSave,onClose,showToast}){
  const [name,setName]=useState(recipe?.name||"");
  const [persons,setPersons]=useState(recipe?.persons||"");
  const [duration,setDuration]=useState(recipe?.duration||"");
  const [photo,setPhoto]=useState(recipe?.photo||null);
  const [difficulty,setDifficulty]=useState(recipe?.difficulty||"");
  const [mealType,setMealType]=useState(recipe?.mealType||"");
  const [ings,setIngs]=useState(recipe?.ingredients?.length?recipe.ingredients.map(i=>({...i})):[{name:"",qty:"",unit:""}]);
  const [steps,setSteps]=useState(recipe?.steps?.length?[...recipe.steps]:[""]);
  const [scanning,setScanning]=useState(false);
  const [scanMsg,setScanMsg]=useState("");
  const [scanStatus,setScanStatus]=useState("idle");
  const [scannedRaw,setScannedRaw]=useState(null);
  const [cropSrc,setCropSrc]=useState(null);
  const [cropFor,setCropFor]=useState(null);
  const [showApiKey,setShowApiKey]=useState(false);
  // Multi-scan
  const [multiMode,setMultiMode]=useState(false);
  const [multiPhotos,setMultiPhotos]=useState([]);
  const [merging,setMerging]=useState(false);
  const scanRef=useRef(),photoRef=useRef(),multiRef=useRef();

  function handlePhoto(e){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();r.onload=ev=>setPhoto(ev.target.result);r.readAsDataURL(file);e.target.value="";
  }

  function handleScanFile(e){
    const file=e.target.files[0];if(!file)return;
    const mt=file.type||"image/jpeg";
    const r=new FileReader();r.onload=ev=>{
      const dataUrl=ev.target.result;
      setScannedRaw({dataUrl,mt});
      doScan(dataUrl,mt);
    };r.readAsDataURL(file);e.target.value="";
  }

  function handleMultiFile(e){
    const file=e.target.files[0];if(!file)return;
    const mt=file.type||"image/jpeg";
    const r=new FileReader();r.onload=ev=>{
      setMultiPhotos(prev=>[...prev,{dataUrl:ev.target.result,mt,id:Date.now()}]);
    };r.readAsDataURL(file);e.target.value="";
  }

  function removeMultiPhoto(id){setMultiPhotos(prev=>prev.filter(p=>p.id!==id));}

  async function doMultiScan(){
    if(multiPhotos.length<2){showToast("⚠️ Ajoutez au moins 2 photos");return;}
    const apiKey=localStorage.getItem("ws_apikey")||"";
    if(!apiKey){setShowApiKey(true);return;}
    setMerging(true);setScanMsg("");setScanStatus("idle");
    const prompt=`Tu es un expert en extraction de recettes de cuisine. On t'envoie ${multiPhotos.length} photos d'une même recette (pages successives ou zones qui se chevauchent).
TÂCHE : Fusionne toutes ces images en UNE SEULE recette cohérente.
RÈGLES DE FUSION :
- Si un ingrédient apparaît plusieurs fois (zones qui se recoupent), ne le garde qu'UNE seule fois
- Pour les étapes, reconstitue l'ordre logique même si elles sont sur des photos différentes
- Prends le titre de la photo qui le montre le mieux
- Si une photo montre une VRAIE PHOTOGRAPHIE d'un plat cuisiné où la nourriture occupe la majorité de l'image (sans texte dominant), "dishPhotoDataPresent":true. Une page de livre avec une petite illustration = false.
RETOURNE UNIQUEMENT ce JSON valide (sans markdown, sans backtick) :
{"title":null,"persons":null,"duration":null,"dishPhotoDataPresent":false,"ingredients":[{"name":"","qty":"","unit":""}],"steps":[]}
INSTRUCTIONS : qty=chiffre seul, unit=unité normalisée (g,kg,ml,cl,L,càs,càc,pincée,sachet,boîte,bouteille,paquet,tranche,botte), noms génériques sans marques, steps dans l'ordre logique`;
    try{
      const content=[
        ...multiPhotos.map((p,i)=>[
          {type:"text",text:`— Photo ${i+1}/${multiPhotos.length} :`},
          {type:"image",source:{type:"base64",media_type:p.mt,data:p.dataUrl.split(",")[1]}}
        ]).flat(),
        {type:"text",text:prompt}
      ];
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,messages:[{role:"user",content}]})
      });
      if(!resp.ok){
        const errData=await resp.json().catch(()=>({}));
        if(resp.status===401){localStorage.removeItem("ws_apikey");setShowApiKey(true);}
        throw new Error("Erreur "+resp.status+(errData.error?.message?" : "+errData.error.message:""));
      }
      const data=await resp.json();
      let text=(data.content||[]).map(c=>c.text||"").join("").trim();
      text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
      const p=JSON.parse(text);
      if(p.title)setName(p.title);
      if(p.persons)setPersons(String(p.persons));
      if(p.duration)setDuration(p.duration);
      if(p.dishPhotoDataPresent&&multiPhotos.length)setPhoto(multiPhotos[0].dataUrl);
      if(p.ingredients?.length)setIngs(p.ingredients.map(i=>({name:i.name||"",qty:i.qty||"",unit:normUnit(i.unit||"")})));
      if(p.steps?.length)setSteps(p.steps.map(s=>s.trim()).filter(Boolean));
      const nbI=p.ingredients?.filter(i=>i.name)?.length||0,nbS=p.steps?.length||0;
      setScanMsg(`✨ ${multiPhotos.length} photos fusionnées — ${nbI} ingrédient${nbI>1?"s":""}, ${nbS} étape${nbS>1?"s":""}`);
      setScanStatus("ok");setMultiMode(false);setMultiPhotos([]);
    }catch(err){
      console.error(err);setScanMsg("❌ "+err.message);setScanStatus("error");
    }
    setMerging(false);
  }

  function handleCropConfirm(dataUrl){
    if(cropFor==="photo"){setPhoto(dataUrl);setCropSrc(null);}
    else if(cropFor==="scan-retry"){setCropSrc(null);doScan(dataUrl,scannedRaw?.mt||"image/jpeg");}
  }

  async function doScan(dataUrl,mt="image/jpeg"){
    const apiKey=localStorage.getItem("ws_apikey")||"";
    if(!apiKey){setShowApiKey(true);return;}
    setScanning(true);setScanMsg("");setScanStatus("idle");
    const base64=dataUrl.split(",")[1];
    const prompt=`Tu es un expert en extraction de recettes de cuisine à partir d'images. Analyse cette image et retourne UNIQUEMENT un objet JSON valide (sans markdown, sans backtick, sans texte autour).

FORMAT EXACT :
{"title":null,"persons":null,"duration":null,"dishPhotoDataPresent":false,"ingredients":[{"name":"","qty":"","unit":""}],"steps":[]}

INSTRUCTIONS PRÉCISES :

1. IDENTIFICATION DU CONTENU :
   - Si l'image contient du TEXTE de recette (livre, magazine, fiche, écran) → extrais les données, "dishPhotoDataPresent":false
   - "dishPhotoDataPresent":true UNIQUEMENT si l'image est une VRAIE PHOTOGRAPHIE d'un plat cuisiné où la nourriture occupe la MAJORITÉ de l'image, sans texte dominant. Une page de livre avec une petite photo en haut = false. Une page avec des ingrédients illustrés = false. Seule une photo réelle d'un plat servi = true.

2. EXTRACTION DES INGRÉDIENTS (priorité absolue) :
   - Cherche la liste d'ingrédients même si elle est dans un encadré, une colonne latérale, ou en petit texte
   - qty = chiffre seul (ex: "200", "2", "0.5"), sans unité
   - unit = unité seule normalisée (g, kg, ml, cl, L, càs, càc, pincée, sachet, boîte, bouteille, paquet, tranche, botte)
   - Si pas de quantité précise : qty=""
   - Ignore les décorations, publicités, numéros de page

3. NOMS D'INGRÉDIENTS :
   - Utilise le nom générique en français (ex: "tomates cerises" et non "Tomates Cerises Barquette Bio")
   - Supprime les marques commerciales

4. title : titre principal de la recette, null si absent
5. persons : nombre de personnes (chiffre seul), null si absent  
6. duration : durée totale ou de préparation (ex: "45 min"), null si absente
7. steps : étapes numérotées extraites du texte, dans l'ordre, texte original conservé`;

    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-api-key":apiKey,
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true"
        },
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:3000,
          messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:mt,data:base64}},
            {type:"text",text:prompt}
          ]}]
        })
      });
      if(!resp.ok){
        const errData=await resp.json().catch(()=>({}));
        if(resp.status===401){
          throw new Error("Clé API invalide (401) — vérifiez sur console.anthropic.com");
        }
        throw new Error("Erreur "+resp.status+(errData.error?.message?" : "+errData.error.message:""));
      }
      const data=await resp.json();
      let text=(data.content||[]).map(c=>c.text||"").join("").trim();
      text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
      const p=JSON.parse(text);
      if(p.title)setName(p.title);
      if(p.persons)setPersons(String(p.persons));
      if(p.duration)setDuration(p.duration);
      // ✅ CORRECTION : utilise dishPhotoDataPresent pour mieux détecter la photo du plat
      if(p.dishPhotoDataPresent)setPhoto(dataUrl);
      if(p.ingredients?.length)setIngs(p.ingredients.map(i=>({name:i.name||"",qty:i.qty||"",unit:normUnit(i.unit||"")})));
      if(p.steps?.length)setSteps(p.steps.map(s=>s.trim()).filter(Boolean));
      // Message de résultat précis
      const nbIngr=p.ingredients?.filter(i=>i.name)?.length||0;
      const nbSteps=p.steps?.length||0;
      setScanMsg(`✨ ${nbIngr} ingrédient${nbIngr>1?"s":""} et ${nbSteps} étape${nbSteps>1?"s":""} extraits !`);
      setScanStatus("ok");
    }catch(err){
      console.error(err);
      if(err.message.includes("401")){
        localStorage.removeItem("ws_apikey");
        setShowApiKey(true);
      }
      setScanMsg("❌ "+err.message);setScanStatus("error");
    }
    setScanning(false);
  }

  function uIng(i,f,v){const n=[...ings];n[i]={...n[i],[f]:v};setIngs(n);}
  function uStep(i,v){const n=[...steps];n[i]=v;setSteps(n);}
  function doSave(){
    if(!name.trim()){showToast("⚠️ Donnez un nom à la recette");return;}
    onSave({id:recipe?.id||Date.now(),name:name.trim(),photo,persons:parseInt(persons)||null,duration:duration.trim()||null,
      difficulty:difficulty||null,mealType:mealType||null,
      ingredients:ings.filter(i=>i.name.trim()),steps:steps.filter(Boolean),
      date:recipe?.date||new Date().toLocaleDateString("fr-FR")});
  }

  return(
    <>
      <Modal open onClose={onClose}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:20,marginBottom:14}}>{recipe?"Modifier":"Nouvelle recette"}</div>

        {/* ── Photo du plat ── */}
        <span style={lbl}>Photo du plat</span>
        <div style={{border:`2px dashed ${BDR}`,borderRadius:12,padding:photo?0:16,textAlign:"center",cursor:photo?"default":"pointer",background:CREAM,overflow:"hidden",marginBottom:6}} onClick={()=>!photo&&photoRef.current.click()}>
          {photo
            ?<img src={photo} style={{width:"100%",maxHeight:140,objectFit:"cover",display:"block"}} alt=""/>
            :<><div style={{fontSize:24,marginBottom:4}}>📷</div><div style={{fontSize:11,color:TXT3}}>Galerie / appareil photo</div></>
          }
        </div>
        <input ref={photoRef} type="file" accept="image/*" style={{display:"none"}} onChange={handlePhoto} capture="environment"/>
        {photo&&(
          <div style={{display:"flex",gap:6,marginBottom:10}}>
            <button style={{...btn("gh"),flex:1,fontSize:11,padding:"6px 10px"}} onClick={()=>photoRef.current.click()}>🔄 Changer</button>

            <div style={{flex:1,border:`2px dashed rgba(200,132,90,.35)`,borderRadius:12,padding:12,textAlign:"center",cursor:scanning?"not-allowed":"pointer",background:CREAM,opacity:scanning?.7:1}} onClick={()=>!scanning&&scanRef.current.click()}>

        {/* Mode multi-photos */}

          <div style={{background:CREAM2,border:`1.5px solid ${BDR}`,borderRadius:14,padding:12,marginBottom:8}}>

              <div style={{fontSize:12,fontWeight:700,color:TXT}}>📷📷 Mode multi-photos</div>

            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
              {multiPhotos.map((p,i)=>(
                <div key={p.id} style={{position:"relative",width:60,height:60}}>
                  <img src={p.dataUrl} style={{width:60,height:60,objectFit:"cover",borderRadius:8,border:`2px solid ${CARAMEL2}`}} alt={`Photo ${i+1}`}/>
                  <div style={{position:"absolute",top:-4,right:-4,width:18,height:18,borderRadius:"50%",background:DNG,color:"white",fontSize:10,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}} onClick={()=>removeMultiPhoto(p.id)}>✕</div>
                  <div style={{position:"absolute",bottom:2,left:2,background:"rgba(0,0,0,.55)",color:"white",fontSize:8,borderRadius:4,padding:"1px 4px",fontWeight:700}}>{i+1}</div>
                </div>
              ))}
              {/* Bouton ajouter photo */}
              <div style={{width:60,height:60,border:`2px dashed ${CARAMEL2}`,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",background:SURF,flexDirection:"column"}} onClick={()=>multiRef.current.click()}>
                <div style={{fontSize:18}}>+</div>
                <div style={{fontSize:8,color:TXT3}}>Photo</div>
              </div>
            </div>
            <div style={{fontSize:10,color:TXT3,marginBottom:8}}>
              {multiPhotos.length===0?"Ajoutez les photos dans l'ordre (début → fin de la recette)":
               multiPhotos.length===1?"Ajoutez au moins une 2ème photo":
               `${multiPhotos.length} photos prêtes — les zones en double seront fusionnées`}
            </div>
            <button style={{...btn("acc"),width:"100%",justifyContent:"center",fontSize:12}} onClick={doMultiScan} disabled={merging||multiPhotos.length<2}>
              {merging?"⏳ Fusion en cours…":`✨ Fusionner et analyser (${multiPhotos.length} photos)`}
            </button>
          </div>
        )}

        {/* Message de résultat */}
        {scanMsg&&(
          <div style={{marginBottom:8}}>
            <div style={{fontSize:11,textAlign:"center",padding:"6px 10px",borderRadius:8,background:scanStatus==="ok"?"rgba(90,138,58,.12)":"rgba(212,96,74,.12)",color:scanStatus==="ok"?SUC:DNG}}>{scanMsg}</div>
            {scanStatus==="error"&&scannedRaw&&(
              <button style={{...btn("gh"),width:"100%",fontSize:11,marginTop:5,justifyContent:"center"}} onClick={()=>{setCropSrc(scannedRaw.dataUrl);setCropFor("scan-retry");}}>
                ✂️ Recadrer l'image et réessayer
              </button>
            )}
            {scanStatus==="error"&&(
              <button style={{...btn("gh"),width:"100%",fontSize:11,marginTop:4,justifyContent:"center"}} onClick={()=>setShowApiKey(true)}>
                🔑 Configurer la clé API
              </button>
            )}
          </div>
        )}
        {!localStorage.getItem("ws_apikey")&&(
          <div style={{fontSize:11,color:TXT3,textAlign:"center",marginBottom:8,padding:"6px 10px",background:CREAM,borderRadius:8,borderLeft:`2px solid ${CARAMEL2}`}}>
            ⚠️ Clé API requise — <span style={{color:CARAMEL2,cursor:"pointer",fontWeight:600}} onClick={()=>setShowApiKey(true)}>Configurer</span>
          </div>
        )}

        <div style={{height:1,background:BDR,margin:"12px 0"}}/>
        <div style={{height:1,background:BDR,margin:"12px 0"}}/>
        <span style={lbl}>Nom de la recette</span>
        <input style={{...inp,marginBottom:10}} placeholder="Ex: Poulet rôti" value={name} onChange={e=>setName(e.target.value)}/>
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          <div style={{flex:1}}><span style={lbl}>Personnes</span><input style={inp} type="number" min="1" placeholder="4" value={persons} onChange={e=>setPersons(e.target.value)}/></div>
          <div style={{flex:1}}><span style={lbl}>Durée</span><input style={inp} placeholder="45 min" value={duration} onChange={e=>setDuration(e.target.value)}/></div>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          <div style={{flex:1}}>
            <span style={lbl}>Difficulté</span>
            <select style={sel} value={difficulty} onChange={e=>setDifficulty(e.target.value)}>
              {RECIPE_DIFFICULTY.map(d=><option key={d.id} value={d.id}>{d.label}</option>)}
            </select>
          </div>
          <div style={{flex:1}}>
            <span style={lbl}>Type de repas</span>
