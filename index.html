FORMAT : {"title":null,"persons":null,"duration":null,"dishPhotoDataPresent":false,"ingredients":[{"name":"","qty":"","unit":""}],"steps":[]}
RÈGLES : pas de doublons, ordre logique des étapes, noms génériques français, qty=chiffre seul, unit normalisée.`;
    try{
      const content=[...multiPhotos.map((p,i)=>[{type:"text",text:`Photo ${i+1}/${multiPhotos.length} :`},{type:"image",source:{type:"base64",media_type:p.mt,data:p.dataUrl.split(",")[1]}}]).flat(),{type:"text",text:prompt}];
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,messages:[{role:"user",content}]})});
      if(!resp.ok){const e=await resp.json().catch(()=>({}));if(resp.status===401){localStorage.removeItem("ws_apikey");setShowApiKey(true);}throw new Error("Erreur "+resp.status);}
      const data=await resp.json();
      let text=(data.content||[]).map(c=>c.text||"").join("").trim();
      text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
      const p=JSON.parse(text);
      if(p.title)setName(p.title);if(p.persons)setPersons(String(p.persons));if(p.duration)setDuration(p.duration);
      if(p.dishPhotoDataPresent&&multiPhotos.length)setPhoto(multiPhotos[0].dataUrl);
      if(p.ingredients?.length)setIngs(p.ingredients.map(i=>({name:i.name||"",qty:i.qty||"",unit:normUnit(i.unit||"")})));
      if(p.steps?.length)setSteps(p.steps.map(s=>s.trim()).filter(Boolean));
      const nb=p.ingredients?.filter(i=>i.name)?.length||0,ns=p.steps?.length||0;
      setScanMsg(`✨ ${multiPhotos.length} photos fusionnées — ${nb} ingr., ${ns} étapes`);setScanStatus("ok");setMultiMode(false);setMultiPhotos([]);
    }catch(err){console.error(err);setScanMsg("❌ "+err.message);setScanStatus("error");}
    setMerging(false);
  }
  function togHave(i){const s=new Set(have);if(s.has(i))s.delete(i);else s.add(i);setHave(s);}
  function scaleQ(qty){const n=parseFloat(qty);if(isNaN(n))return qty;const r=n*scale;return r%1===0?String(r):r.toFixed(2).replace(/\.?0+$/,"");}

  function toggleLike(){
    const liked=db.likedRecipes||[];
    const nd={...db,likedRecipes:isLiked?liked.filter(id=>id!==recipe.id):[...liked,recipe.id]};
    setDb(nd);showToast(isLiked?"💔 Retiré des favoris":"❤️ Ajouté aux favoris");
  }

  function handleFinishCooking({photo,note,stars}){
    const today=new Date().toLocaleDateString("fr-FR");
    const recipes=db.recipes.map(r=>{
      if(r.id!==recipe.id)return r;
      const u={...r,lastCooked:today,cookedCount:(r.cookedCount||0)+1};
      if(photo)u.photo=photo;
      if(note)u.note=note;
      if(stars)u.stars=stars;
      return u;
    });
    const nd={...db,recipes};
    setDb(nd);saveDB(nd);setCooking(false);
    showToast(stars>=4?"⭐ Superbe ! Recette mise à jour":"👨‍🍳 Recette mise à jour");
  }

  function planMeal(dk,slot){
    const existing=calendar[dk]?.[slot];
    if(existing&&String(existing)!==String(recipe.id)){
      const existingR=db.recipes.find(r=>String(r.id)===String(existing));
      setPlanConflict({dk,slot,existing:existingR});
    } else {
      applyPlan(dk,slot);
    }
    togglePanel(null);
  }

  function applyPlan(dk,slot){
    const nd={...db,calendar:{...calendar,[dk]:{...(calendar[dk]||{}),[slot]:recipe.id}}};
    setDb(nd);saveDB(nd);setPlanConflict(null);showToast("📅 Planifié !");
  }

  function addToFolder(folderId){
    const nd={...db,folders:folders.map(f=>f.id===folderId?{...f,recipeIds:[...new Set([...(f.recipeIds||[]),recipe.id])]}:f)};
    setDb(nd);showToast("🏷️ Ajouté au thème");togglePanel(null);
  }

  const diffLabel=RECIPE_DIFFICULTY.find(d=>d.id===recipe.difficulty)?.label;

  if(cooking)return<CookingMode recipe={recipe} onClose={()=>setCooking(false)} onFinish={handleFinishCooking}/>;

  return(
    <Modal open onClose={onClose} noPad>

      {/* ── HERO PHOTO ── */}
      <div style={{height:210,position:"relative",overflow:"hidden",background:`linear-gradient(135deg,${CREAM2},${BDR})`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
        {recipe.photo
          ?<img src={recipe.photo} alt={recipe.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
          :<EmojiImg emoji={guessRecipeEmoji(recipe.name)} size={80}/>
        }
        {/* Gradient overlay */}
        <div style={{position:"absolute",inset:0,background:"linear-gradient(0deg,rgba(20,10,4,.88) 0%,rgba(20,10,4,.2) 55%,transparent 100%)"}}/>
        {/* Top badges + boutons */}
        <div style={{position:"absolute",top:12,left:12,right:12,display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {recipe.source==="mealdb"&&<div style={{background:"rgba(0,0,0,.44)",color:"white",fontSize:9,borderRadius:7,padding:"3px 8px",fontWeight:700,backdropFilter:"blur(4px)"}}>🌐 TheMealDB</div>}
            {recipe.source==="ai"&&<div style={{background:"rgba(184,112,58,.65)",color:"white",fontSize:9,borderRadius:7,padding:"3px 8px",fontWeight:700,backdropFilter:"blur(4px)"}}>🤖 IA</div>}
            {recipe.lastCooked&&<div style={{background:"rgba(0,0,0,.35)",color:"white",fontSize:9,borderRadius:7,padding:"3px 8px",backdropFilter:"blur(4px)"}}>📅 {recipe.lastCooked}</div>}
          </div>
          <div style={{display:"flex",gap:5}}>
            <button style={{width:32,height:32,borderRadius:9,background:"rgba(0,0,0,.4)",border:"none",color:"white",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(4px)"}} onClick={toggleLike}>
              {isLiked?"❤️":"🤍"}
            </button>
            <button style={{width:32,height:32,borderRadius:9,background:"rgba(0,0,0,.4)",border:"none",color:"white",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(4px)"}} onClick={onClose}>✕</button>
          </div>
        </div>
        {/* Titre + chips dans la photo */}
        <div style={{position:"absolute",bottom:12,left:14,right:14}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:20,fontWeight:900,color:"white",lineHeight:1.2,marginBottom:7,textShadow:"0 1px 6px rgba(0,0,0,.4)"}}>{recipe.name}</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {recipe.duration&&<div style={{background:"rgba(255,255,255,.2)",color:"white",fontSize:10,borderRadius:20,padding:"2px 9px",fontWeight:700,backdropFilter:"blur(4px)"}}>⏱️ {recipe.duration}</div>}
            {recipe.persons&&<div style={{background:"rgba(255,255,255,.2)",color:"white",fontSize:10,borderRadius:20,padding:"2px 9px",fontWeight:700,backdropFilter:"blur(4px)"}}>👥 {recipe.persons} pers.</div>}
            {diffLabel&&<div style={{background:"rgba(255,255,255,.2)",color:"white",fontSize:10,borderRadius:20,padding:"2px 9px",fontWeight:700,backdropFilter:"blur(4px)"}}>{diffLabel}</div>}
            {cost&&<div style={{background:"rgba(90,138,58,.4)",color:"#a8e878",fontSize:10,borderRadius:20,padding:"2px 9px",fontWeight:700,backdropFilter:"blur(4px)"}}>~{cost.total.toFixed(2)}€</div>}
          </div>
        </div>
        {/* Bouton changer photo — sur le hero */}
        <button style={{position:"absolute",bottom:8,left:14,background:"rgba(0,0,0,.42)",border:"none",color:"white",borderRadius:8,padding:"4px 10px",fontSize:11,cursor:"pointer",fontWeight:600,backdropFilter:"blur(4px)"}} onClick={()=>photoRef.current.click()}>
          📷 Changer la photo
        </button>
      </div>

      {/* ── CONTENU SCROLLABLE ── */}
      <div style={{flex:1,overflowY:"auto",padding:"14px 14px 100px"}}>

        {/* Étoiles + compteur cuissons — toujours visible */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:recipe.note?6:12}}>
          <div style={{display:"flex",gap:2}}>
            {[1,2,3,4,5].map(s=><span key={s} style={{fontSize:14,opacity:s<=(recipe.stars||0)?1:.2}}>⭐</span>)}
          </div>
          {cookedCount>0&&<span style={{fontSize:10,color:TXT3,fontWeight:600}}>Cuisiné {cookedCount}×</span>}
        </div>

        {/* Note perso — lecture seule */}
        {recipe.note&&(
          <div style={{fontSize:11,color:TXT2,padding:"8px 11px",background:CREAM,borderRadius:10,borderLeft:`2.5px solid ${CARAMEL2}`,marginBottom:12,lineHeight:1.55}}>
            📝 {recipe.note}
          </div>
        )}

        {/* ── ACTION PRINCIPALE : AJOUTER À LA LISTE ── */}
        <div style={{...card,padding:"12px 14px",marginBottom:14}}>
          <div style={{fontSize:9,fontWeight:800,textTransform:"uppercase",letterSpacing:.8,color:TXT3,marginBottom:9}}>Ajouter à la liste de courses</div>
          <div style={{display:"flex",gap:8,marginBottom:7,alignItems:"center"}}>
            <Stepper value={vp} onChange={setVp}/>
            <button style={{...btn("suc"),flex:1,fontSize:12,justifyContent:"center"}} onClick={()=>onAdd(recipe,vp,have)}>🛒 Ajouter les ingrédients</button>
          </div>
          {scale!==1&&<div style={{fontSize:10,color:CARAMEL2,textAlign:"center",marginBottom:4}}>Quantités ajustées ×{scale.toFixed(2).replace(/\.?0+$/,"")}</div>}
          <div style={{fontSize:10,color:TXT3,textAlign:"center"}}>Cochez ce que vous avez déjà · seul le reste sera ajouté</div>
        </div>

        {/* ── INGRÉDIENTS ── */}
        <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:1,color:TXT2,marginBottom:8,display:"flex",alignItems:"center",gap:7}}>
          Ingrédients <span style={{fontSize:9,background:CREAM2,color:TXT3,padding:"1px 7px",borderRadius:10,fontWeight:700}}>{recipe.ingredients.length}</span>
          <div style={{flex:1,height:1,background:BDR}}/>
        </div>
        <div style={{...card,padding:0,overflow:"hidden",marginBottom:14}}>
          <div style={{padding:"6px 12px",background:"rgba(90,138,58,.06)",borderBottom:`1px solid ${BDR}`}}>
            <span style={{fontSize:10,fontWeight:700,color:SUC}}>☑ Cocher ce que j'ai déjà</span>
          </div>
          {recipe.ingredients.map((ing,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",borderBottom:i<recipe.ingredients.length-1?`1px solid ${BDR}`:"none",fontSize:13,opacity:have.has(i)?.45:1,transition:"opacity .15s"}}>
              <div onClick={()=>togHave(i)} style={{width:20,height:20,borderRadius:5,border:have.has(i)?"none":`1.5px solid ${BDR}`,background:have.has(i)?SUC:"transparent",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,transition:"all .15s"}}>
                {have.has(i)&&<span style={{color:"white",fontSize:11,fontWeight:800}}>✓</span>}
              </div>
              <span style={{flex:1,textDecoration:have.has(i)?"line-through":"none"}}>{ing.name}</span>
              <span style={{color:TXT3,fontSize:12,fontWeight:600}}>{scaleQ(ing.qty)}{ing.unit?" "+ing.unit:""}</span>
            </div>
          ))}
        </div>

        {/* ── ÉTAPES ── */}
        {recipe.steps?.length>0&&(
          <>
            <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:1,color:TXT2,marginBottom:8,display:"flex",alignItems:"center",gap:7}}>
              Préparation <span style={{fontSize:9,background:CREAM2,color:TXT3,padding:"1px 7px",borderRadius:10,fontWeight:700}}>{recipe.steps.length}</span>
              <div style={{flex:1,height:1,background:BDR}}/>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
              {recipe.steps.map((step,i)=>(
                <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start",fontSize:13,lineHeight:1.6,color:TXT2}}>
                  <div style={{width:22,height:22,background:CARAMEL2,color:"white",borderRadius:"50%",fontSize:10,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:2}}>{i+1}</div>
                  <div>{step}</div>
                </div>
              ))}
            </div>
          </>
        )}

        {/* Source MealDB */}
        {recipe.source==="mealdb"&&(
          <div style={{fontSize:10,color:TXT3,marginBottom:14,padding:"7px 10px",background:CREAM,borderRadius:9,borderLeft:`2px solid ${BDR}`,lineHeight:1.6}}>
            📖 Source : <span style={{color:CARAMEL2,fontWeight:700,cursor:"pointer",textDecoration:"underline"}} onClick={()=>window.open(`https://www.themealdb.com/meal/${recipe.mealdbId}`,"_blank")}>TheMealDB — voir l'original</span> · Licence CC BY-SA
          </div>
        )}

        {/* ── 3 BOUTONS SECONDAIRES OUTLINE ── */}
        <div style={{display:"flex",gap:7,marginBottom:openPanel?8:0}}>
          <button style={{...btn("gh"),flex:1,justifyContent:"center",fontSize:11,padding:"8px 4px",border:`1.5px solid ${BDR}`,borderColor:openPanel==="plan"?CARAMEL:BDR,color:openPanel==="plan"?CARAMEL:TXT2,background:openPanel==="plan"?`rgba(184,112,58,.06)`:"transparent"}} onClick={()=>togglePanel("plan")}>
            📅 Planifier
          </button>
          <button style={{...btn("gh"),flex:1,justifyContent:"center",fontSize:11,padding:"8px 4px",border:`1.5px solid ${BDR}`,borderColor:openPanel==="theme"?CARAMEL:BDR,color:openPanel==="theme"?CARAMEL:TXT2,background:openPanel==="theme"?`rgba(184,112,58,.06)`:"transparent"}} onClick={()=>togglePanel("theme")}>
            🏷️ Thème
          </button>
          <button style={{...btn("gh"),flex:1,justifyContent:"center",fontSize:11,padding:"8px 4px",border:`1.5px solid ${BDR}`,borderColor:openPanel==="modifier"?CARAMEL:BDR,color:openPanel==="modifier"?CARAMEL:TXT2,background:openPanel==="modifier"?`rgba(184,112,58,.06)`:"transparent"}} onClick={onEdit}>
            ✏️ Modifier
          </button>
        </div>

        {/* Panel Planifier */}
        {openPanel==="plan"&&(
          <div style={{background:CREAM2,border:`1px solid ${BDR}`,borderRadius:13,padding:"12px 13px",marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:10,fontWeight:800,color:TXT2,textTransform:"uppercase",letterSpacing:.6}}>📅 Choisir un créneau</div>
              <button onClick={()=>setOpenPanel(null)} style={{background:"none",border:"none",fontSize:13,color:TXT3,cursor:"pointer"}}>✕</button>
            </div>
            <div style={{maxHeight:200,overflowY:"auto"}}>
              {(()=>{
                const days=[];
                for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()+i);days.push(d);}
                return days.map(d=>{
                  const dk=dateKey(d);
                  const isToday=dk===dateKey(new Date());
                  return(
                    <div key={dk} style={{marginBottom:8}}>
                      <div style={{fontSize:9,fontWeight:700,color:TXT3,marginBottom:4}}>{isToday?"Aujourd'hui":d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"short"})}</div>
                      <div style={{display:"flex",gap:5}}>
                        {MEAL_SLOTS.map(slot=>{
                          const taken=calendar[dk]?.[slot];
                          const takenName=taken?db.recipes.find(r=>String(r.id)===String(taken))?.name:"";
                          return(
                            <div key={slot} style={{flex:1,padding:"6px 4px",borderRadius:9,background:taken?"rgba(212,96,74,.07)":SURF,border:`1px solid ${taken?"rgba(212,96,74,.25)":BDR}`,cursor:"pointer",fontSize:10,textAlign:"center"}} onClick={()=>planMeal(dk,slot)}>
                              <div style={{fontWeight:700,color:TXT2,marginBottom:1}}>{MEAL_LABELS[slot]}</div>
                              {taken?<div style={{color:DNG,fontSize:9,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{takenName||"Occupé"}</div>:<div style={{color:TXT3,fontSize:9}}>+ Ajouter</div>}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                });
              })()}
            </div>
          </div>
        )}

        {/* Panel Thème */}
        {openPanel==="theme"&&(
          <div style={{background:CREAM2,border:`1px solid ${BDR}`,borderRadius:13,padding:"12px 13px",marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:10,fontWeight:800,color:TXT2,textTransform:"uppercase",letterSpacing:.6}}>🏷️ Ajouter à un thème</div>
              <button onClick={()=>setOpenPanel(null)} style={{background:"none",border:"none",fontSize:13,color:TXT3,cursor:"pointer"}}>✕</button>
            </div>
            {folders.length===0
              ?<div style={{fontSize:11,color:TXT3,textAlign:"center",padding:"8px 0"}}>Aucun thème · créez-en un depuis la page Recettes</div>
              :<div style={{display:"flex",flexDirection:"column",gap:5}}>
                {folders.map(f=>(
                  <div key={f.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:9,background:"rgba(255,255,255,.7)",fontSize:12,fontWeight:600,cursor:"pointer"}} onClick={()=>addToFolder(f.id)}>
                    🏷️ {f.name}
                  </div>
                ))}
              </div>
            }
          </div>
        )}

        {/* Conflit planning */}
        {planConflict&&(
          <div style={{background:"rgba(212,96,74,.07)",border:`1.5px solid rgba(212,96,74,.25)`,borderRadius:12,padding:"12px 14px",marginBottom:8}}>
            <div style={{fontSize:13,fontWeight:700,color:DNG,marginBottom:6}}>Ce créneau est déjà pris</div>
            <div style={{fontSize:11,color:TXT2,marginBottom:10}}>
              <strong>{MEAL_LABELS[planConflict.slot]}</strong> est occupé par <strong>{planConflict.existing?.name||"une recette"}</strong>.
            </div>
            <div style={{display:"flex",gap:6}}>
              <button style={{...btn("gh"),flex:1,fontSize:11}} onClick={()=>setPlanConflict(null)}>Annuler</button>
              <button style={{...btn("dng"),flex:1,fontSize:11}} onClick={()=>applyPlan(planConflict.dk,planConflict.slot)}>Remplacer</button>
            </div>
          </div>
        )}
      </div>

      {/* ── BARRE BAS FIXE ── */}
      <div style={{position:"sticky",bottom:0,background:`rgba(253,248,240,.96)`,backdropFilter:"blur(12px)",borderTop:`1px solid ${BDR}`,padding:"10px 14px",display:"flex",gap:8,flexShrink:0}}>
        <button style={{...btn("gh"),flex:1,justifyContent:"center"}} onClick={onClose}>Fermer</button>
        {recipe.steps?.length>0&&<button style={{...btn("acc"),flex:1,justifyContent:"center"}} onClick={()=>setCooking(true)}>🍳 Cuisiner</button>}
      </div>
    </Modal>
  );
}

// PAGE HISTORIQUE
// ═══════════════════════════════════════════════════════════════
function PageHistorique({db,setDb,showToast,goToListe}){
  const [qprod,setQprod]=useState(null);
  const [catF,setCatF]=useState("Toutes");

  function confQuick(name,cat,unit,qty){
    const ni=mergeItem(db.items,name,qty,unit,"manuel",cat);
    const ph={...db.productHistory};
    if(!ph[name])ph[name]={count:0,category:cat,lastUnit:unit};
    ph[name].count++;ph[name].lastUnit=unit;
    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);
    setQprod(null);goToListe();showToast("✅ "+name+" ajouté");
  }

  function deleteHistItem(sessionIdx,itemName){
    const h=db.shoppingHistory.map((s,i)=>{
      if(i!==sessionIdx)return s;
      const items=s.items.filter(it=>it.name!==itemName);
      return{...s,items,count:items.length};
    }).filter(s=>s.items.length>0);
    const nd={...db,shoppingHistory:h};setDb(nd);saveDB(nd);showToast("🗑️ Article supprimé");
  }

  function reloadAll(idx){
    const s=db.shoppingHistory[idx];let ni=[...db.items];
    s.items.forEach(old=>{
      ni=mergeItem(ni,old.name,(old.quantities||[{qty:1,unit:""}])[0].qty,(old.quantities||[{qty:1,unit:""}])[0].unit,"historique",old.category);
    });
    const nd={...db,items:ni};setDb(nd);saveDB(nd);goToListe();showToast("🔄 Course rechargée");
  }

  function reloadSel(idx,selNames){
    const s=db.shoppingHistory[idx];let ni=[...db.items];
    s.items.filter(item=>selNames.has(item.name)).forEach(old=>{
      (old.quantities||[{qty:1,unit:"",source:"historique"}]).forEach(q=>{
        ni=mergeItem(ni,old.name,q.qty,q.unit,"historique",old.category);
      });
    });
    const nd={...db,items:ni};setDb(nd);saveDB(nd);goToListe();
    showToast(`✅ ${selNames.size} article${selNames.size>1?"s":""} ajouté${selNames.size>1?"s":""}`);
  }

  const allTop=Object.entries(db.productHistory).sort((a,b)=>b[1].count-a[1].count);
  const allCats=["Toutes",...[...new Set(allTop.map(([,d])=>d.category||"❓ Autre").filter(Boolean))]];
  const filtered=(catF==="Toutes"?allTop:allTop.filter(([,d])=>(d.category||"❓ Autre")===catF)).slice(0,24);

  return(
    <div style={{padding:14,paddingBottom:90}}>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:20,marginBottom:14,color:TXT}}>Historique</div>

      {allTop.length>0&&(
        <div style={{...card,background:"rgba(255,255,255,.88)",marginBottom:14}}>
          <div style={{fontSize:13,fontWeight:700,color:TXT2,marginBottom:8}}>🔁 Produits fréquents</div>
          <div style={{display:"flex",gap:5,overflowX:"auto",marginBottom:8,paddingBottom:4,scrollbarWidth:"none"}}>
            {allCats.map(c=>(
              <div key={c} style={{background:catF===c?CARAMEL2:CREAM2,color:catF===c?"white":TXT2,borderRadius:20,padding:"4px 10px",fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0,border:`1px solid ${catF===c?CARAMEL2:BDR}`}}
                onClick={()=>setCatF(c)}>{c}</div>
            ))}
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {filtered.map(([name,d])=>(
              <div key={name} style={{background:CREAM,border:`1px solid ${BDR}`,borderRadius:20,padding:"5px 12px",fontSize:12,color:TXT2,cursor:"pointer",display:"flex",alignItems:"center",gap:5,fontWeight:600}}
                onClick={()=>setQprod({name,category:d.category||getCat(name),lastUnit:d.lastUnit||"",count:d.count})}>
                <span style={{fontSize:14}}>{(d.category||getCat(name)).split(" ")[0]}</span>
                <span style={{color:TXT}}>{name}</span>
                <span style={{fontSize:10,color:TXT3}}>{d.count}×</span>
                <span style={{color:CARAMEL2,fontSize:15,fontWeight:700}}>+</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {db.shoppingHistory.length>0?(
        <>
          <div style={{fontSize:13,fontWeight:700,color:TXT2,marginBottom:8}}>🕐 Courses passées</div>
          {db.shoppingHistory.map((s,i)=>(
            <HistorySession key={i} session={s} onReloadAll={()=>reloadAll(i)} onReloadSelected={sel=>reloadSel(i,sel)} onDeleteItem={name=>deleteHistItem(i,name)}/>
          ))}
        </>
      ):allTop.length===0?(
        <div style={{textAlign:"center",padding:"48px 20px"}}>
          <div style={{fontSize:44,marginBottom:12}}>📦</div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:6,color:TXT}}>Aucun historique</div>
          <div style={{fontSize:13,color:TXT3}}>Vos courses passées apparaîtront ici</div>
        </div>
      ):null}

      <QuickAddModal open={!!qprod} product={qprod} onConfirm={confQuick} onClose={()=>setQprod(null)}/>
    </div>
  );
}

// SYNC FIREBASE
// ═══════════════════════════════════════════════════════════════
function hashPassword(pwd){
  let h=0;for(let i=0;i<pwd.length;i++){h=((h<<5)-h)+pwd.charCodeAt(i);h|=0;}
  return Math.abs(h).toString(36);
}

// Génère un ID unique aléatoire pour un nouveau foyer
function genFoyerId(){
  const chars="abcdefghijklmnopqrstuvwxyz0123456789";
  let id="";for(let i=0;i<10;i++)id+=chars[Math.floor(Math.random()*chars.length)];
  return id;
}

    </div>

}

// PAGE PLACARD — ANTI-GASPI & INVENTAIRE
// ═══════════════════════════════════════════════════════════════
function PagePlacard({db,setDb,showToast,goToRecettes,goToListe}){
  const [tab,setTab]=useState("inventaire"); // inventaire | recettes
  const [showAdd,setShowAdd]=useState(false);
  const [showScan,setShowScan]=useState(false);
  const [filterSignal,setFilterSignal]=useState("tous");
  const [showAIFromPantry,setShowAIFromPantry]=useState(false);
  const [pantryAILoading,setPantryAILoading]=useState(false);
  const pantry=db.pantry||[];
  const redItems=pantry.filter(i=>i.signal==="red");

  async function generateRecipeFromPantry(){
    const apiKey=localStorage.getItem("ws_apikey");if(!apiKey){showToast("⚠️ Clé API requise dans Maison > Paramètres");return;}
    const ingredientList=pantry.map(i=>i.name).join(", ");
    setPantryAILoading(true);
    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:`Je dispose des ingrédients suivants dans mon placard : ${ingredientList}. Génère une recette en utilisant principalement ces ingrédients. Réponds UNIQUEMENT en JSON, sans markdown. Format: {"name":"...","ingredients":[{"name":"...","qty":1,"unit":"g"}],"steps":["..."],"duration":"30 min","persons":2,"difficulty":"easy"}`}]})});
      const data=await resp.json();const text=data.content?.[0]?.text||"";
      const clean=text.replace(/```json|```/g,"").trim();
      const recipe=JSON.parse(clean);
      recipe.id=Date.now();recipe.source="ai";recipe.date=new Date().toLocaleDateString("fr-FR");
      const nd={...db,recipes:[...db.recipes,recipe]};setDb(nd);saveDB(nd);
      setShowAIFromPantry(false);
      showToast("🤖 Recette créée : "+recipe.name);
      goToRecettes();
    }catch(e){showToast("❌ Erreur IA : "+e.message);}
    setPantryAILoading(false);
  }

  function delItem(id){
    const nd={...db,pantry:pantry.filter(i=>i.id!==id)};setDb(nd);showToast("🗑️ Article supprimé");
  }
  function updateSignal(id,signal){
    const nd={...db,pantry:pantry.map(i=>i.id===id?{...i,signal}:i)};setDb(nd);
  }
  function addToListe(item){
    const ni=mergeItem(db.items,item.name,1,"","manuel",item.category||getCat(item.name));
    const nd={...db,items:ni};setDb(nd);showToast(`✅ ${item.name} ajouté à la liste`);goToListe();
  }

  // Score faisabilité recette basé sur l'inventaire
  function recipeScore(recipe){
    if(!pantry.length||!recipe.ingredients?.length)return null;
    const pantryNames=pantry.map(i=>i.name.toLowerCase());
    const matched=recipe.ingredients.filter(ing=>pantryNames.some(p=>p.includes(ing.name.toLowerCase())||ing.name.toLowerCase().includes(p)));
    return{matched:matched.length,total:recipe.ingredients.length,pct:Math.round(matched.length/recipe.ingredients.length*100)};
  }

  const filtered=filterSignal==="tous"?pantry:pantry.filter(i=>i.signal===filterSignal);
  const byCat={};filtered.forEach(item=>{const c=item.category||getCat(item.name);if(!byCat[c])byCat[c]=[];byCat[c].push(item);});

  // Recettes triées par score faisabilité
  const recipesWithScore=(db.recipes||[]).map(r=>({...r,score:recipeScore(r)})).filter(r=>r.score&&r.score.matched>0).sort((a,b)=>b.score.pct-a.score.pct);

  return(
    <div style={{padding:14,paddingBottom:90}}>
      {/* Header stats */}
      <div style={{...card,background:"rgba(255,255,255,.88)",padding:"14px 16px",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:20,color:TXT}}>📦 Mon Placard</div>
          <button style={{...btn("acc"),fontSize:12,padding:"7px 12px"}} onClick={()=>setShowAdd(true)}>+ Ajouter</button>
        </div>
        <div style={{display:"flex",gap:8}}>
          {SIGNALS.map(s=>{
            const count=pantry.filter(i=>i.signal===s.id).length;
            return(
              <div key={s.id} style={{flex:1,textAlign:"center",padding:"8px 4px",borderRadius:10,background:s.bg,border:`1px solid ${s.color}22`,cursor:"pointer",opacity:filterSignal!=="tous"&&filterSignal!==s.id?.4:1}} onClick={()=>setFilterSignal(filterSignal===s.id?"tous":s.id)}>
                <div style={{fontSize:18}}>{s.label.split(" ")[0]}</div>
                <div style={{fontSize:16,fontWeight:900,color:s.color,fontFamily:"'Fraunces',serif"}}>{count}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Alerte anti-gaspi */}
      {redItems.length>0&&(
        <div style={{background:"rgba(212,96,74,.1)",border:`1.5px solid rgba(212,96,74,.3)`,borderRadius:12,padding:"10px 14px",marginBottom:12,display:"flex",gap:10,alignItems:"flex-start"}}>
          <span style={{fontSize:20,flexShrink:0}}>⚠️</span>
          <div>
            <div style={{fontSize:13,fontWeight:700,color:DNG,marginBottom:3}}>À utiliser rapidement !</div>
            <div style={{fontSize:11,color:TXT2}}>{redItems.map(i=>i.name).join(", ")}</div>
            <div style={{fontSize:11,color:TXT3,marginTop:4,cursor:"pointer",fontWeight:600,textDecoration:"underline"}} onClick={()=>setTab("recettes")}>
              Voir les recettes suggérées →
            </div>
          </div>
        </div>
      )}

      {/* Onglets */}
      <div style={{display:"flex",gap:4,background:"rgba(255,255,255,.6)",borderRadius:12,padding:3,marginBottom:12}}>
        {[{id:"inventaire",label:"📦 Inventaire"},{id:"recettes",label:"🍽️ Recettes faisables"}].map(t=>(
          <div key={t.id} style={{flex:1,padding:"8px 4px",textAlign:"center",fontSize:11,fontWeight:700,borderRadius:9,background:tab===t.id?SURF:"transparent",color:tab===t.id?CARAMEL:TXT3,cursor:"pointer"}} onClick={()=>setTab(t.id)}>
            {t.label}{t.id==="recettes"&&recipesWithScore.length>0&&<span style={{marginLeft:4,background:CARAMEL2,color:"white",borderRadius:10,padding:"1px 6px",fontSize:9}}>{recipesWithScore.length}</span>}
          </div>
        ))}
      </div>

      {/* TAB INVENTAIRE */}
      {tab==="inventaire"&&(
        <>
          {pantry.length===0?(
            <div style={{textAlign:"center",padding:"48px 20px"}}>
              <div style={{fontSize:48,marginBottom:12}}>📦</div>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:6,color:TXT}}>Placard vide</div>
              <div style={{fontSize:13,color:TXT3,marginBottom:16}}>Ajoutez vos produits pour suivre votre stock et éviter le gaspillage</div>
              <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
                <button style={{...btn("acc"),fontSize:12}} onClick={()=>setShowAdd(true)}>✏️ Ajouter manuellement</button>
                <button style={{...btn("out"),fontSize:12}} onClick={()=>setShowScan(true)}>📷 Scanner une photo</button>
              </div>
            </div>
          ):(
            <>
              {/* Filtre signal */}
              <div style={{display:"flex",gap:5,marginBottom:10,overflowX:"auto",scrollbarWidth:"none"}}>
                {[{id:"tous",label:"Tous",count:pantry.length},...SIGNALS.map(s=>({id:s.id,label:s.label,count:pantry.filter(i=>i.signal===s.id).length}))].map(f=>(
                  <div key={f.id} style={{flexShrink:0,padding:"4px 10px",borderRadius:20,fontSize:11,fontWeight:700,background:filterSignal===f.id?CARAMEL2:"rgba(255,255,255,.8)",color:filterSignal===f.id?"white":TXT2,cursor:"pointer",border:`1px solid ${filterSignal===f.id?CARAMEL2:BDR}`,whiteSpace:"nowrap"}} onClick={()=>setFilterSignal(f.id)}>
                    {f.label} ({f.count})
                  </div>
                ))}
              </div>
              {Object.keys(byCat).length===0?(
                <div style={{textAlign:"center",padding:"24px",color:TXT3,fontSize:12}}>Aucun article dans cette catégorie</div>
              ):Object.entries(byCat).map(([cat,items])=>(
                <div key={cat}>
                  <SecTitle>{cat}</SecTitle>
                  {items.map(item=>(
                    <PantryItem key={item.id} item={item} onDel={delItem} onSignal={updateSignal} onAddToListe={addToListe}/>
                  ))}
                </div>
              ))}
              <button style={{...btn("gh"),width:"100%",fontSize:11,marginTop:8,justifyContent:"center"}} onClick={()=>setShowAdd(true)}>+ Ajouter un article</button>
              <button style={{...btn("gh"),width:"100%",fontSize:11,marginTop:6,justifyContent:"center"}} onClick={()=>setShowScan(true)}>📷 Scanner une photo</button>
            </>
          )}
        </>
      )}

      {/* TAB RECETTES FAISABLES */}
      {tab==="recettes"&&(
        <>
          {recipesWithScore.length===0?(
            <div style={{textAlign:"center",padding:"40px 20px"}}>
              <div style={{fontSize:40,marginBottom:10}}>🍽️</div>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:16,color:TXT,marginBottom:6}}>Aucune recette trouvée</div>
              <div style={{fontSize:12,color:TXT3,marginBottom:14}}>Ajoutez des produits à votre placard pour voir les recettes réalisables</div>
              <button style={{...btn("gh"),fontSize:12,marginBottom:8}} onClick={()=>setTab("inventaire")}>← Retour à l'inventaire</button>
              <button style={{...btn("acc"),fontSize:12,width:"100%",justifyContent:"center",marginTop:4}} onClick={()=>setShowAIFromPantry(true)}>🤖 Créer une recette avec mon placard</button>
            </div>
          ):(
            <>
              <div style={{fontSize:12,color:TXT2,marginBottom:8}}>Recettes triées par ingrédients disponibles dans votre placard :</div>
              <button style={{...btn("acc"),width:"100%",justifyContent:"center",fontSize:11,marginBottom:10,padding:"8px"}} onClick={()=>setShowAIFromPantry(true)}>🤖 Créer une recette IA avec mon placard</button>
              {recipesWithScore.map(recipe=>(
                <div key={recipe.id} style={{...card,background:"rgba(255,255,255,.9)",marginBottom:8}}>
                  <div style={{display:"flex",gap:10,alignItems:"center"}}>
                    <div style={{width:44,height:44,borderRadius:10,background:`linear-gradient(135deg,${CREAM2},${BDR})`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><EmojiImg emoji={guessRecipeEmoji(recipe.name)} size={24}/></div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:700,color:TXT,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{recipe.name}</div>
                      <div style={{fontSize:11,color:TXT2,marginTop:2}}>
                        {recipe.duration&&<span style={{marginRight:8}}>⏱️ {recipe.duration}</span>}
                        {recipe.persons&&<span>👥 {recipe.persons} pers.</span>}
                      </div>
                    </div>
                    <div style={{textAlign:"center",flexShrink:0}}>
                      <div style={{fontSize:15,fontWeight:900,color:recipe.score.pct>=70?SUC:recipe.score.pct>=40?CARAMEL:TXT3,fontFamily:"'Fraunces',serif"}}>{recipe.score.pct}%</div>
                      <div style={{fontSize:9,color:TXT3,fontWeight:600}}>{recipe.score.matched}/{recipe.score.total}</div>
                    </div>
                  </div>
                  <div style={{height:4,background:CREAM2,borderRadius:2,marginTop:8,overflow:"hidden"}}>
                    <div style={{height:"100%",width:recipe.score.pct+"%",background:recipe.score.pct>=70?SUC:recipe.score.pct>=40?CARAMEL:TXT3,borderRadius:2,transition:"width .3s"}}/>
                  </div>
                  <button style={{...btn("out"),width:"100%",fontSize:11,justifyContent:"center",marginTop:8,padding:"7px"}} onClick={goToRecettes}>
                    Voir la recette →
                  </button>
                </div>
              ))}
            </>
          )}
        </>
      )}

      {showAdd&&<AddPantryItemModal onClose={()=>setShowAdd(false)} onSave={(item)=>{const nd={...db,pantry:[...pantry,{id:Date.now()+Math.random(),...item}]};setDb(nd);setShowAdd(false);showToast("✅ "+item.name+" ajouté au placard");}} showToast={showToast}/>}
      {showScan&&<ScanPantryModal onClose={()=>setShowScan(false)} onSave={(items)=>{const nd={...db,pantry:[...pantry,...items.map(i=>({id:Date.now()+Math.random(),...i}))]};setDb(nd);setShowScan(false);showToast(`✅ ${items.length} article${items.length>1?"s":""} ajouté${items.length>1?"s":""}`);}} showToast={showToast}/>}
      {showAIFromPantry&&(
        <Modal open onClose={()=>setShowAIFromPantry(false)}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:8,color:TXT}}>🤖 Recette depuis le placard</div>
          <div style={{fontSize:12,color:TXT2,marginBottom:12,lineHeight:1.5}}>
            L'IA va analyser les <strong>{pantry.length} produits</strong> de votre placard et créer une recette sur mesure.
          </div>
          <div style={{background:CREAM2,borderRadius:10,padding:"10px 12px",marginBottom:16,fontSize:11,color:TXT3}}>
            <strong>Ingrédients utilisables :</strong><br/>{pantry.slice(0,8).map(i=>i.name).join(", ")}{pantry.length>8&&` … +${pantry.length-8} autres`}
          </div>
          {pantryAILoading?(
            <div style={{textAlign:"center",padding:"16px",fontSize:13,color:TXT3}}>⏳ Création de la recette en cours…</div>
          ):(
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              <button style={{...btn("acc"),width:"100%",justifyContent:"center"}} onClick={generateRecipeFromPantry}>✨ Générer la recette</button>
              <button style={{...btn("gh"),width:"100%",justifyContent:"center"}} onClick={()=>setShowAIFromPantry(false)}>Annuler</button>
            </div>
          )}
        </Modal>
      )}
    </div>
  );
}

  return(
    <div style={{...card,marginBottom:6,padding:"10px 13px",background:"rgba(255,255,255,.92)",border:`1.5px solid ${sig.color}33`}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <EmojiImg emoji={(item.category||getCat(item.name)).split(" ")[0]} size={22} style={{flexShrink:0}}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13,fontWeight:700,color:TXT}}>{item.name}</div>
          {item.quantity&&<div style={{fontSize:11,color:TXT3}}>{item.quantity}</div>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:16,cursor:"pointer"}} onClick={()=>setExpanded(!expanded)}>{sig.label.split(" ")[0]}</span>
          <button style={{background:"none",border:"none",color:TXT3,cursor:"pointer",fontSize:13,padding:2}} onClick={()=>onDel(item.id)}>🗑️</button>

      {expanded&&(
        <div style={{marginTop:10,paddingTop:10,borderTop:`1px solid ${BDR}`}}>

          <div style={{display:"flex",gap:6,marginBottom:8}}>
            {SIGNALS.map(s=>(
              <button key={s.id} style={{flex:1,padding:"6px 4px",borderRadius:8,border:`1.5px solid ${item.signal===s.id?s.color:BDR}`,background:item.signal===s.id?s.bg:"transparent",fontSize:16,cursor:"pointer"}} onClick={()=>{onSignal(item.id,s.id);setExpanded(false);}}>
                {s.label.split(" ")[0]}
              </button>
            ))}

          <button style={{...btn("gh"),width:"100%",fontSize:11,justifyContent:"center"}} onClick={()=>onAddToListe(item)}>

}

function AddPantryItemModal({onClose,onSave,showToast}){
  const [name,setName]=useState("");
  const [quantity,setQuantity]=useState("");
  const [signal,setSignal]=useState("green");
  const [listening,setListening]=useState(false);
  const recognitionRef=useRef(null);

  function startVoice(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){showToast("⚠️ Vocal non supporté");return;}
    const recog=new SR();recog.lang="fr-FR";recog.continuous=false;recog.interimResults=false;
    recog.onstart=()=>setListening(true);recog.onend=()=>setListening(false);
    recog.onresult=(e)=>{
      const text=e.results[0][0].transcript.trim();
      setName(text);showToast(`🎤 "${text}"`);
    };
    recog.onerror=()=>{setListening(false);showToast("❌ Erreur micro");};
    recognitionRef.current=recog;recog.start();
  }

  function save(){
    if(!name.trim()){showToast("⚠️ Entrez un nom");return;}
    onSave({name:name.trim(),quantity:quantity.trim(),signal,category:getCat(name.trim()),addedAt:Date.now()});
  }

  return(
    <Modal open onClose={onClose}>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:12,color:TXT}}>Ajouter au placard</div>
      <span style={lbl}>Nom du produit</span>
      <div style={{display:"flex",gap:6,marginBottom:10}}>
        <input style={{...inp,flex:1}} placeholder="Ex: lait, carottes, pâtes…" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&save()}/>
        <button style={{...btn("gh"),padding:"10px 12px",background:listening?"rgba(212,96,74,.1)":"",color:listening?DNG:undefined}} onClick={startVoice} disabled={listening}>🎤</button>
      </div>
      <span style={lbl}>Quantité (optionnel)</span>
      <input style={{...inp,marginBottom:12}} placeholder="Ex: 500g, 3 pièces, 1 bouteille…" value={quantity} onChange={e=>setQuantity(e.target.value)}/>
      <span style={lbl}>Signal de fraîcheur</span>
      <div style={{display:"flex",gap:6,marginBottom:16}}>
        {SIGNALS.map(s=>(
          <div key={s.id} style={{flex:1,padding:"10px 6px",borderRadius:10,border:`2px solid ${signal===s.id?s.color:BDR}`,background:signal===s.id?s.bg:"transparent",textAlign:"center",cursor:"pointer"}} onClick={()=>setSignal(s.id)}>
            <div style={{display:"flex",justifyContent:"center"}}><EmojiImg emoji={s.label.split(" ")[0]} size={22}/></div>
            <div style={{fontSize:9,fontWeight:700,color:signal===s.id?s.color:TXT3,marginTop:3,lineHeight:1.2}}>{s.label.replace(/^[^ ]+ /,"")}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:8}}>
        <button style={{...btn("gh"),flex:1}} onClick={onClose}>Annuler</button>
        <button style={{...btn("acc"),flex:2}} onClick={save}>✅ Ajouter</button>
      </div>
    </Modal>
  );
}

function ScanPantryModal({onClose,onSave,showToast}){
  const [photos,setPhotos]=useState([]);
  const [scanning,setScanning]=useState(false);
  const [result,setResult]=useState(null);
  const [scanMsg,setScanMsg]=useState("");
  const fileRef=useRef();

  function handleFile(e){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();r.onload=ev=>setPhotos(prev=>[...prev,{dataUrl:ev.target.result,mt:file.type||"image/jpeg",id:Date.now()}]);
    r.readAsDataURL(file);e.target.value="";
  }

  async function doScan(){
    if(!photos.length){showToast("⚠️ Ajoutez au moins une photo");return;}
    const apiKey=localStorage.getItem("ws_apikey")||"";
    if(!apiKey){showToast("⚠️ Clé API requise — configurez via 🔑");return;}
    setScanning(true);setScanMsg("");setResult(null);
    const prompt=`Tu es un assistant de cuisine. Analyse cette photo de placard/frigo/cuisine et liste TOUS les produits alimentaires visibles.
Pour chaque produit détecté, évalue son état apparent :
- "red" si le produit semble à utiliser très vite (ouvert, presque vide, fruits très mûrs)
- "yellow" si le produit semble bon pour cette semaine
- "green" si le produit est bien stocké et dure encore longtemps

RETOURNE UNIQUEMENT ce JSON valide (sans markdown) :
{"items":[{"name":"nom générique en français","quantity":"quantité estimée ou vide si inconnu","signal":"green"}]}

Exemples de noms génériques : "lait", "œufs", "beurre", "carottes", "yaourt nature"`;
    try{
      const content=[
        ...photos.map(p=>({type:"image",source:{type:"base64",media_type:p.mt,data:p.dataUrl.split(",")[1]}})),
        {type:"text",text:prompt}
      ];
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,messages:[{role:"user",content}]})
      });
      if(!resp.ok)throw new Error("Erreur "+resp.status);
      const data=await resp.json();
      let text=(data.content||[]).map(c=>c.text||"").join("").trim();
      text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
      const p=JSON.parse(text);
      const items=(p.items||[]).map(i=>({...i,category:getCat(i.name),addedAt:Date.now()}));
      setResult(items);
      setScanMsg(`✅ ${items.length} produit${items.length>1?"s":""} détecté${items.length>1?"s":""}`);
    }catch(err){setScanMsg("❌ "+err.message);}
    setScanning(false);
  }

  function editItem(i,field,val){setResult(prev=>prev.map((it,j)=>j===i?{...it,[field]:val}:it));}
  function removeItem(i){setResult(prev=>prev.filter((_,j)=>j!==i));}

  return(
    <Modal open onClose={onClose}>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:4,color:TXT}}>📷 Scanner mon placard</div>
      <div style={{fontSize:11,color:TXT3,marginBottom:12}}>Prenez une photo de votre placard ou frigo — l'IA détecte les produits automatiquement</div>
      {!result?(
        <>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
            {photos.map((p,i)=>(
              <div key={p.id} style={{position:"relative",width:72,height:72}}>
                <img src={p.dataUrl} style={{width:72,height:72,objectFit:"cover",borderRadius:10,border:`2px solid ${CARAMEL2}`}} alt={`P${i+1}`}/>
                <div style={{position:"absolute",top:-4,right:-4,width:18,height:18,borderRadius:"50%",background:DNG,color:"white",fontSize:10,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}} onClick={()=>setPhotos(prev=>prev.filter(x=>x.id!==p.id))}>✕</div>
              </div>
            ))}
            <div style={{width:72,height:72,border:`2px dashed ${CARAMEL2}`,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",background:SURF,flexDirection:"column",gap:2}} onClick={()=>fileRef.current.click()}>
              <EmojiImg emoji="📷" size={24}/>
              <span style={{fontSize:8,color:TXT3,fontWeight:600}}>Photo</span>
            </div>
          </div>
          <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleFile} capture="environment"/>
          {scanMsg&&<div style={{fontSize:12,textAlign:"center",padding:"6px 10px",borderRadius:8,background:"rgba(212,96,74,.1)",color:DNG,marginBottom:8,fontWeight:600}}>{scanMsg}</div>}
          {photos.length>0&&<button style={{...btn("acc"),width:"100%",justifyContent:"center",marginBottom:8}} onClick={doScan} disabled={scanning}>{scanning?"⏳ Analyse en cours…":"🔍 Analyser la photo"}</button>}
          <div style={{display:"flex",gap:8}}>
            <button style={{...btn("gh"),flex:1,fontSize:12}} onClick={onClose}>Annuler</button>
          </div>
        </>
      ):(
        <>
          {scanMsg&&<div style={{fontSize:11,textAlign:"center",padding:"5px 10px",borderRadius:8,background:"rgba(90,138,58,.1)",color:SUC,marginBottom:10,fontWeight:600}}>{scanMsg}</div>}
          <div style={{maxHeight:360,overflowY:"auto",marginBottom:10}}>
            {result.map((item,i)=>{
              const sig=getSignal(item.signal||"green");
              return(
                <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:i<result.length-1?`1px solid ${BDR}`:"none"}}>
                  <span style={{fontSize:20,flexShrink:0}}>{(item.category||getCat(item.name)).split(" ")[0]}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <input style={{width:"100%",background:"transparent",border:"none",borderBottom:`1px solid ${BDR}`,color:TXT,fontFamily:"inherit",fontSize:13,fontWeight:700,outline:"none",padding:"2px 0"}} value={item.name} onChange={e=>editItem(i,"name",e.target.value)}/>
                    {item.quantity&&<div style={{fontSize:10,color:TXT3}}>{item.quantity}</div>}
                  </div>
                  <div style={{display:"flex",gap:4,flexShrink:0}}>
                    {SIGNALS.map(s=>(
                      <span key={s.id} style={{fontSize:16,cursor:"pointer",opacity:item.signal===s.id?1:.3}} onClick={()=>editItem(i,"signal",s.id)}>{s.label.split(" ")[0]}</span>
                    ))}
                  </div>
                  <button style={{background:"none",border:"none",color:TXT3,cursor:"pointer",fontSize:12,padding:"0 2px"}} onClick={()=>removeItem(i)}>✕</button>
                </div>
              );
            })}
          </div>
          <div style={{display:"flex",gap:8}}>

const MEAL_SLOTS=["midi","soir"];
const MEAL_LABELS={midi:"☀️ Midi",soir:"🌙 Soir"};
const DAY_NAMES=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const DAY_NAMES_FULL=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];

function getWeekDates(offset){
  const now=new Date();
  const day=now.getDay();
  const monday=new Date(now);
  monday.setDate(now.getDate()-(day===0?6:day-1)+(offset||0)*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d;});
}

// Helpers pour calendrier multi-recettes
// calendar[dk][slot] = string (legacy) ou array of ids
function getSlotIds(calendar,dk,slot){
  const v=calendar[dk]?.[slot];
  if(!v)return[];
  if(Array.isArray(v))return v;
  return[String(v)];
}
function setSlotIds(calendar,dk,slot,ids){
  return{...calendar,[dk]:{...(calendar[dk]||{}),[slot]:ids}};
}

function PageCalendrier({db,setDb,showToast,goToRecettes,goToListe}){
  const [weekOffset,setWeekOffset]=useState(0);
  const [showPicker,setShowPicker]=useState(null);
  const [showActions,setShowActions]=useState(null);
  const [showWizard,setShowWizard]=useState(false);
  const [wizardQueue,setWizardQueue]=useState([]);
  const [wizardStep,setWizardStep]=useState(0);
  const [wizardItems,setWizardItems]=useState([]);
  const [freeText,setFreeText]=useState("");
  const [freeAddToRecipes,setFreeAddToRecipes]=useState(false);
  const [calAILoading,setCalAILoading]=useState(false);
  const [aiPantrySelected,setAIPantrySelected]=useState(new Set());
  const [aiManualIngreds,setAiManualIngreds]=useState("");
  const [aiWish,setAIWish]=useState("");
  // Filtres picker
  const [pickerFilterDiet,setPickerFilterDiet]=useState("");
  const [pickerFilterDiff,setPickerFilterDiff]=useState("");
  const [pickerFilterType,setPickerFilterType]=useState("");
  const [pickerFilterTime,setPickerFilterTime]=useState("");
  const [pickerSearch,setPickerSearch]=useState("");
  // Listes affiliées aux jours
  const [showListPicker,setShowListPicker]=useState(null); // dk

  const [dayListAddName,setDayListAddName]=useState("");
  // Wizard → sauvegarder comme liste du jour
  const [wizardSaveDk,setWizardSaveDk]=useState(null);

  const calendar=db.calendar||{};
  const pantry=db.pantry||[];
  const redItems=pantry.filter(i=>i.signal==="red");
  const weekDates=getWeekDates(weekOffset);
  const todayKey=dateKey(new Date());

  // ── helpers listes affiliées ───────────────────────────────
  function getLinkedListIdx(dk){
    return calendar[dk]?.listIdx!=null?calendar[dk].listIdx:null;
  }
  function linkListToDay(dk,listIdx){
    const newCal={...calendar,[dk]:{...(calendar[dk]||{}),listIdx}};
    const nd={...db,calendar:newCal};setDb(nd);saveDB(nd);
    setShowListPicker(null);showToast("🛒 Liste liée au jour !");
  }
  function unlinkListFromDay(dk){
    const newCal={...calendar};
    if(newCal[dk])delete newCal[dk].listIdx;
    const nd={...db,calendar:newCal};setDb(nd);saveDB(nd);
    showToast("🗑️ Liste détachée");
  }
  function addItemToDayList(dk,listIdx,name){
    if(!name.trim())return;
    const hist=[...(db.shoppingHistory||[])];
    if(!hist[listIdx])return;
    const newItem={id:Date.now()+Math.random(),name:name.trim(),category:getCat(name.trim()),quantities:[{qty:1,unit:"",source:"manuel"}],checked:false};
    hist[listIdx]={...hist[listIdx],items:[...(hist[listIdx].items||[]),newItem],count:(hist[listIdx].items||[]).length+1};
    const nd={...db,shoppingHistory:hist};setDb(nd);saveDB(nd);
    setDayListAddName("");showToast("✅ "+name.trim()+" ajouté");
  }
  function saveWizardResultAsDayList(items,dk){
    if(!dk||!items.length)return;
    const label=new Date(dk).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
    const newEntry={date:"Courses — "+label,items:JSON.parse(JSON.stringify(items)),count:items.length};
    const hist=[newEntry,...(db.shoppingHistory||[])].slice(0,20);
    const listIdx=0; // toujours en tête
    const newCal={...calendar,[dk]:{...(calendar[dk]||{}),listIdx}};
    const nd={...db,shoppingHistory:hist,calendar:newCal};setDb(nd);saveDB(nd);
    showToast("💾 Liste sauvegardée et liée à "+label);
  }

  function addMealToSlot(dk,slot,recipeId){
    const ids=getSlotIds(calendar,dk,slot);
    if(ids.includes(String(recipeId)))return;
    const newCal=setSlotIds(calendar,dk,slot,[...ids,String(recipeId)]);
    const nd={...db,calendar:newCal};setDb(nd);saveDB(nd);setShowPicker(null);
    showToast("📅 Repas planifié");
  }
  function removeMealFromSlot(dk,slot,recipeId){
    const ids=getSlotIds(calendar,dk,slot).filter(id=>id!==String(recipeId));
    const newCal=setSlotIds(calendar,dk,slot,ids);
    const nd={...db,calendar:newCal};setDb(nd);saveDB(nd);setShowActions(null);
    showToast("🗑️ Repas retiré");
  }
  async function addFreeTextMeal(dk,slot,name){
    if(!name.trim())return;
    const fakeRecipe={id:"free_"+Date.now(),name:name.trim(),source:"libre",ingredients:[],steps:[]};
    if(freeAddToRecipes) fakeRecipe.source="manual";
    const newRecipes=[...db.recipes,fakeRecipe];
    const ids=getSlotIds(calendar,dk,slot);
    const newCal=setSlotIds(calendar,dk,slot,[...ids,String(fakeRecipe.id)]);
    const nd={...db,recipes:newRecipes,calendar:newCal};
    setDb(nd);saveDB(nd);setShowPicker(null);setFreeText("");setFreeAddToRecipes(false);
    showToast("✅ "+name.trim()+" planifié"+(freeAddToRecipes?" et ajouté aux recettes":""));
  }
  async function generateAIMeal(dk,slot,pantryItems,manualIngreds,wish){
    const apiKey=localStorage.getItem("ws_apikey");if(!apiKey){showToast("⚠️ Clé API requise");return;}
    setCalAILoading(true);
    const allIngreds=[...pantryItems,...(manualIngreds.trim().split(/[,;]+/).map(s=>s.trim()).filter(Boolean))];
    const pantryContext=allIngreds.length?"\nIngrédients disponibles (à utiliser en priorité) : "+allIngreds.join(", "):"";
    const wishContext=wish?.trim()?"\nSouhait / type de plat : "+wish:"";
    try{
      const calPrompt="Génère une recette simple en JSON. Réponds UNIQUEMENT avec le JSON, rien d'autre."
        +pantryContext+wishContext
        +"\nFormat: "+JSON.stringify({name:"",ingredients:[{name:"",qty:1,unit:"g"}],steps:[""],duration:"30 min",persons:2,difficulty:"easy"});
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:1200,messages:[{role:"user",content:calPrompt}]})});
      const data=await resp.json();const text=data.content?.[0]?.text||"";
      const clean=text.replace(/```json|```/g,"").trim();
      const recipe=JSON.parse(clean);
      recipe.id=Date.now();recipe.source="ai";recipe.date=new Date().toLocaleDateString("fr-FR");
      const ids=getSlotIds(calendar,dk,slot);
      const newCal=setSlotIds(calendar,dk,slot,[...ids,String(recipe.id)]);
      const nd={...db,recipes:[...db.recipes,recipe],calendar:newCal};
      setDb(nd);saveDB(nd);setShowPicker(null);setAIWish("");setAiManualIngreds("");setAIPantrySelected(new Set());
      showToast("🤖 "+recipe.name+" créé et planifié !");
    }catch(_e){showToast("❌ Erreur IA");}
    setCalAILoading(false);
  }
  function generateShoppingList(){
    const todayD=new Date();todayD.setHours(0,0,0,0);
    const upcoming=[];
    Object.entries(calendar).forEach(([dk,slots])=>{
      const d=new Date(dk);d.setHours(0,0,0,0);
      if(d<todayD)return;
      MEAL_SLOTS.forEach(slot=>{
        const ids=getSlotIds(calendar,dk,slot);
        ids.forEach(recipeId=>{
          const recipe=(db.recipes||[]).find(r=>String(r.id)===String(recipeId));
          if(recipe)upcoming.push({dk,slot,recipe});
        });
      });
    });
    if(!upcoming.length){showToast("⚠️ Aucun repas planifié à venir");return;}
    upcoming.sort((a,b)=>a.dk.localeCompare(b.dk)||MEAL_SLOTS.indexOf(a.slot)-MEAL_SLOTS.indexOf(b.slot));
    // Récupérer le premier dk pour proposer de lier la liste
    setWizardSaveDk(upcoming[0].dk);
    setWizardQueue(upcoming);setWizardStep(0);setWizardItems([...db.items]);setShowWizard(true);
  }
  function finishWizardStep(recipe,vp,haveIdxs,items){
    const base=recipe.persons||1,scale=vp/base;
    let ni=[...items];
    (recipe.ingredients||[]).forEach((ing,i)=>{
      if(haveIdxs.has(i))return;
      const qN=ing.qty?roundQ(parseFloat(ing.qty)*scale):1;
      ni=mergeItem(ni,ing.name,qN,ing.unit||"","recette",getCat(ing.name));
    });
    return ni;
  }
  function antiGaspiSuggestions(){
    if(!redItems.length||!(db.recipes||[]).length)return[];
    const redNames=redItems.map(i=>i.name.toLowerCase());
    return(db.recipes||[]).filter(r=>r.ingredients?.some(ing=>redNames.some(rn=>rn.includes(ing.name?.toLowerCase())||ing.name?.toLowerCase()?.includes(rn)))).slice(0,3);
  }
  const suggestions=antiGaspiSuggestions();

  function applyPickerFilters(recipes){
    let list=recipes.filter(r=>r.source!=="libre");
    if(pickerSearch.trim()){
      const q=pickerSearch.toLowerCase();
      list=list.filter(r=>r.name.toLowerCase().includes(q)||(r.ingredients||[]).some(i=>i.name.toLowerCase().includes(q)));
    }
    if(pickerFilterDiet){
      const ings=(r)=>(r.ingredients||[]).map(i=>i.name.toLowerCase()).join(" ");
      list=list.filter(r=>{
        const ig=ings(r);
        if(pickerFilterDiet==="veg")return!/viande|boeuf|poulet|porc|veau|agneau|saucisse|jambon|lard|thon|saumon|crevette|moule/.test(ig);
        if(pickerFilterDiet==="vegan")return!/viande|boeuf|poulet|porc|veau|agneau|saucisse|jambon|lard|thon|saumon|crevette|moule|lait|oeuf|beurre|crème|fromage|yaourt|miel/.test(ig);
        if(pickerFilterDiet==="gf")return!/farine|pain|pâte|blé|seigle|orge/.test(ig);
        if(pickerFilterDiet==="lf")return!/lait|beurre|crème|fromage|yaourt/.test(ig);
        if(pickerFilterDiet==="fish")return/poisson|saumon|thon|cabillaud|dorade|crevette|moule/.test(ig);
        if(pickerFilterDiet==="meat")return/viande|boeuf|poulet|porc|veau|agneau|saucisse|jambon|lard/.test(ig);
        return true;
      });
    }
    if(pickerFilterDiff)list=list.filter(r=>r.difficulty===pickerFilterDiff);
    if(pickerFilterType)list=list.filter(r=>r.mealType===pickerFilterType);
    if(pickerFilterTime){
      list=list.filter(r=>{const d=parseInt(r.duration);if(isNaN(d))return pickerFilterTime==="any";
        if(pickerFilterTime==="fast")return d<=30;if(pickerFilterTime==="mid")return d>30&&d<=60;if(pickerFilterTime==="slow")return d>60;return true;});
    }
    return list;
  }
  const hasPickerFilters=!!(pickerFilterDiet||pickerFilterDiff||pickerFilterType||pickerFilterTime);

  // ── Résumé semaine : calcul remplissage midi/soir ─────────
  const weekFill=weekDates.map(d=>{
    const dk=dateKey(d);
    return{
      dk,
      midi:getSlotIds(calendar,dk,"midi").length>0,
      soir:getSlotIds(calendar,dk,"soir").length>0,
    };
  });
  const midiCount=weekFill.filter(d=>d.midi).length;
  const soirCount=weekFill.filter(d=>d.soir).length;

  return(
    <div style={{padding:"10px 14px",paddingBottom:90}}>

      {/* ══ HEADER COMPACT ══════════════════════════════════ */}

          <div style={{flex:1,textAlign:"center"}}>

              {weekOffset===0?"Cette semaine":weekOffset===1?"Semaine prochaine":weekOffset===-1?"Semaine dernière":`Sem. ${weekDates[0].getDate()}/${weekDates[0].getMonth()+1}`}
            </div>
            <div style={{fontSize:10,color:TXT3,marginTop:1}}>{weekDates[0].getDate()}/{weekDates[0].getMonth()+1} — {weekDates[6].getDate()}/{weekDates[6].getMonth()+1}/{weekDates[6].getFullYear()}</div>

        </div>

                <span style={{fontSize:8,color:TXT3}}>☀️</span>

              const isToday=day.dk===todayKey;

                <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
