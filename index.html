        </div>
      </Modal>
      <CropModal open={!!cropSrc} src={cropSrc} onConfirm={handleCropConfirm} onClose={()=>setCropSrc(null)}/>
      <ApiKeyModal open={showApiKey} onSave={k=>{setShowApiKey(false);if(scannedRaw)doScan(scannedRaw.dataUrl,scannedRaw.mt);}} onClose={()=>setShowApiKey(false)}/>
    </>
  );
}

// ─── COOKING MODE ─────────────────────────────────────────────
function CookingMode({recipe,onClose}){
  const [step,setStep]=useState(0);
  const [timer,setTimer]=useState(null); // secondes restantes
  const [running,setRunning]=useState(false);
  const [inputMin,setInputMin]=useState("5");
  const timerRef=useRef(null);
  const steps=recipe.steps||[];
  const total=steps.length;

  useEffect(()=>{
    if(running&&timer>0){timerRef.current=setInterval(()=>setTimer(t=>t-1),1000);}
    else if(timer===0){clearInterval(timerRef.current);setRunning(false);}
    return()=>clearInterval(timerRef.current);
  },[running,timer]);

  function startTimer(){const s=parseInt(inputMin)*60;if(s>0){setTimer(s);setRunning(true);}}
  function pauseTimer(){setRunning(false);clearInterval(timerRef.current);}
  function resetTimer(){setRunning(false);clearInterval(timerRef.current);setTimer(null);}
  function fmtTime(s){const m=Math.floor(s/60),sec=s%60;return`${m}:${sec.toString().padStart(2,"0")}`;}

  // Garder l'écran allumé si possible
  useEffect(()=>{
    let wake=null;
    if(navigator.wakeLock){navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{});}
    return()=>{if(wake)wake.release();}
  },[]);

  return(
    <div style={{position:"fixed",inset:0,background:`linear-gradient(160deg,${CARAMEL} 0%,#7a3a1a 100%)`,zIndex:500,display:"flex",flexDirection:"column",padding:20,paddingTop:40}}>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:18,color:"white",flex:1,paddingRight:10}}>{recipe.name}</div>
        <button style={{background:"rgba(255,255,255,.2)",border:"1.5px solid rgba(255,255,255,.4)",color:"white",borderRadius:10,padding:"8px 14px",fontWeight:700,fontSize:12,cursor:"pointer"}} onClick={onClose}>✕ Quitter</button>
      </div>

      {/* Progression */}
      <div style={{display:"flex",gap:4,marginBottom:20}}>
        {steps.map((_,i)=>(
          <div key={i} style={{flex:1,height:4,borderRadius:2,background:i<step?"white":i===step?"rgba(255,255,255,.7)":"rgba(255,255,255,.2)",cursor:"pointer"}} onClick={()=>setStep(i)}/>
        ))}
      </div>

      {/* Étape courante */}
      <div style={{flex:1,background:"rgba(255,255,255,.1)",borderRadius:20,padding:24,display:"flex",flexDirection:"column",justifyContent:"center",overflowY:"auto"}}>
        <div style={{fontSize:13,color:"rgba(255,255,255,.6)",fontWeight:700,letterSpacing:1,textTransform:"uppercase",marginBottom:12}}>Étape {step+1} / {total}</div>
        <div style={{fontSize:17,color:"white",lineHeight:1.7,fontWeight:500,marginBottom:16}}>{steps[step]}</div>
        {/* Ingrédients mentionnés dans cette étape */}
        {(()=>{
          const stepText=(steps[step]||"").toLowerCase();
          const mentioned=(recipe.ingredients||[]).filter(ing=>{
            const n=ing.name.toLowerCase();
            return stepText.includes(n)||(n.length>4&&stepText.includes(n.slice(0,-1)));
          });
          return mentioned.length>0?(
            <div style={{borderTop:"1px solid rgba(255,255,255,.2)",paddingTop:10}}>
              <div style={{fontSize:10,color:"rgba(255,255,255,.5)",fontWeight:700,letterSpacing:.5,marginBottom:6}}>INGRÉDIENTS POUR CETTE ÉTAPE</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                {mentioned.map((ing,i)=>(
                  <div key={i} style={{background:"rgba(255,255,255,.15)",borderRadius:8,padding:"3px 8px",fontSize:11,color:"rgba(255,255,255,.9)",fontWeight:600}}>
                    {ing.qty?`${ing.qty}${ing.unit?" "+ing.unit:""} `:""}• {ing.name}
                  </div>
                ))}
              </div>
            </div>
          ):null;
        })()}
      </div>

      {/* Minuteur */}
      <div style={{background:"rgba(255,255,255,.1)",borderRadius:16,padding:"14px 16px",marginTop:16}}>
        {timer===null?(
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <div style={{fontSize:13,color:"rgba(255,255,255,.8)",flex:1}}>⏱️ Minuteur</div>
            <input style={{width:48,background:"rgba(255,255,255,.2)",border:"1px solid rgba(255,255,255,.3)",borderRadius:8,padding:"6px 8px",color:"white",fontSize:13,textAlign:"center",outline:"none"}} value={inputMin} onChange={e=>setInputMin(e.target.value)} type="number" min="1"/>
            <span style={{color:"rgba(255,255,255,.7)",fontSize:12}}>min</span>
            <button style={{background:"white",border:"none",borderRadius:8,padding:"6px 12px",color:CARAMEL,fontWeight:700,fontSize:12,cursor:"pointer"}} onClick={startTimer}>Démarrer</button>
          </div>
        ):(
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{fontSize:28,fontWeight:900,color:timer<30?"#ff8080":"white",fontFamily:"monospace",flex:1}}>{fmtTime(timer)}</div>
            {running
              ?<button style={{background:"rgba(255,255,255,.2)",border:"none",borderRadius:8,padding:"8px 14px",color:"white",fontWeight:700,cursor:"pointer"}} onClick={pauseTimer}>⏸</button>
              :<button style={{background:"rgba(255,255,255,.2)",border:"none",borderRadius:8,padding:"8px 14px",color:"white",fontWeight:700,cursor:"pointer"}} onClick={()=>setRunning(true)}>▶</button>
            }
            <button style={{background:"rgba(255,255,255,.15)",border:"none",borderRadius:8,padding:"8px 14px",color:"white",fontWeight:700,cursor:"pointer"}} onClick={resetTimer}>✕</button>
          </div>
        )}
      </div>

      {/* Navigation étapes */}
      <div style={{display:"flex",gap:10,marginTop:14}}>
        <button style={{flex:1,padding:"14px",background:"rgba(255,255,255,.15)",border:"1.5px solid rgba(255,255,255,.3)",borderRadius:14,color:"white",fontWeight:700,fontSize:14,cursor:"pointer",opacity:step===0?.4:1}} onClick={()=>setStep(s=>Math.max(0,s-1))} disabled={step===0}>← Précédent</button>
        {step<total-1
          ?<button style={{flex:2,padding:"14px",background:"white",border:"none",borderRadius:14,color:CARAMEL,fontWeight:800,fontSize:14,cursor:"pointer"}} onClick={()=>{resetTimer();setStep(s=>s+1);}}>Suivant →</button>
          :<button style={{flex:2,padding:"14px",background:"white",border:"none",borderRadius:14,color:SUC,fontWeight:800,fontSize:14,cursor:"pointer"}} onClick={onClose}>✅ Terminé !</button>
        }
      </div>
    </div>
  );
}

// ─── AI RECIPE GENERATOR ──────────────────────────────────────
function AIRecipeGen({onImport,onClose,showToast,items}){
  const [mode,setMode]=useState("frigo");
  const [fridgeInput,setFridgeInput]=useState("");
  const [variationBase,setVariationBase]=useState("");
  const [variationType,setVariationType]=useState("végétarien");
  const [generating,setGenerating]=useState(false);
  const [result,setResult]=useState(null);
  const [listening,setListening]=useState(false);
  const [chatMsg,setChatMsg]=useState("");
  const [chatHistory,setChatHistory]=useState([]);
  const [chatLoading,setChatLoading]=useState(false);
  const recognitionRef=useRef(null);

  useEffect(()=>{
    if(items?.length)setFridgeInput(items.map(i=>i.name).join(", "));
  },[]);

  function startVoice(target){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){showToast("⚠️ Reconnaissance vocale non supportée");return;}
    const recog=new SR();recog.lang="fr-FR";recog.continuous=false;recog.interimResults=false;
    recog.onstart=()=>setListening(true);recog.onend=()=>setListening(false);
    recog.onresult=(e)=>{
      const text=e.results[0][0].transcript.trim();
      if(target==="fridge")setFridgeInput(prev=>prev?prev+", "+text:text);
      else if(target==="chat")setChatMsg(text);
      showToast(`🎤 "${text}"`);
    };
    recog.onerror=()=>{setListening(false);showToast("❌ Erreur micro");};
    recognitionRef.current=recog;recog.start();
  }

  async function generate(){
    const apiKey=localStorage.getItem("ws_apikey")||"";
    if(!apiKey){showToast("⚠️ Clé API requise — configurez via 🔑");return;}
    setGenerating(true);setResult(null);setChatHistory([]);
    const prompt=mode==="frigo"
      ?`Tu es un chef cuisinier créatif. Propose UNE recette réalisable avec ces ingrédients : ${fridgeInput}\n\nRETOURNE UNIQUEMENT ce JSON valide (sans markdown) :\n{"title":"","persons":4,"duration":"30 min","ingredients":[{"name":"","qty":"","unit":""}],"steps":["étape complète en français"],"tip":"astuce en 1 phrase"}`
      :`Tu es un chef cuisinier expert. Crée une variation ${variationType} de : "${variationBase}"\n\nRETOURNE UNIQUEMENT ce JSON valide (sans markdown) :\n{"title":"","persons":4,"duration":"30 min","ingredients":[{"name":"","qty":"","unit":""}],"steps":["étape complète en français"],"tip":"astuce en 1 phrase"}`;
    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:3000,messages:[{role:"user",content:prompt}]})});
      const data=await resp.json();
      let text=(data.content||[]).map(c=>c.text||"").join("").trim();
      text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
      const p=JSON.parse(text);
      const r={id:Date.now(),name:p.title,persons:p.persons||4,duration:p.duration||"",photo:null,source:"ai",ingredients:p.ingredients||[],steps:p.steps||[],tip:p.tip||"",date:new Date().toLocaleDateString("fr-FR")};
      setResult(r);
      setChatHistory([{role:"user",content:prompt},{role:"assistant",content:JSON.stringify(p)}]);
    }catch(e){showToast("❌ "+e.message);}
    setGenerating(false);
  }

  async function sendChat(){
    if(!chatMsg.trim()||!result)return;
    const apiKey=localStorage.getItem("ws_apikey")||"";
    if(!apiKey){showToast("⚠️ Clé API requise");return;}
    setChatLoading(true);
    const userMsg=chatMsg.trim();setChatMsg("");
    const systemPrompt=`Tu es un chef cuisinier expert. Tu modifies une recette selon les demandes. Recette actuelle : ${JSON.stringify({name:result.name,ingredients:result.ingredients,steps:result.steps})}. RETOURNE UNIQUEMENT le JSON modifié (sans markdown) : {"title":"","persons":${result.persons||4},"duration":"${result.duration||"30 min"}","ingredients":[{"name":"","qty":"","unit":""}],"steps":["étape complète"],"tip":""}`;
    const newHistory=[...chatHistory,{role:"user",content:userMsg}];
    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:3000,system:systemPrompt,messages:newHistory})});
      const data=await resp.json();
      let text=(data.content||[]).map(c=>c.text||"").join("").trim();
      text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
      const p=JSON.parse(text);
      setResult(r=>({...r,name:p.title||r.name,ingredients:p.ingredients||r.ingredients,steps:p.steps||r.steps,tip:p.tip||r.tip,duration:p.duration||r.duration}));
      setChatHistory([...newHistory,{role:"assistant",content:text}]);
      showToast("✅ Recette modifiée !");
    }catch(e){showToast("❌ "+e.message);}
    setChatLoading(false);
  }

  return(
    <Modal open onClose={onClose}>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:4,color:TXT}}>🤖 Recette par IA</div>
      <div style={{fontSize:11,color:TXT3,marginBottom:12}}>Générez et affinez vos recettes par chat ou par vocal</div>
      <div style={{display:"flex",gap:4,marginBottom:14,background:"rgba(255,255,255,.6)",borderRadius:12,padding:3}}>
        {[{id:"frigo",label:"🧊 Frigo → Recette"},{id:"variation",label:"✨ Variation"}].map(m=>(
          <div key={m.id} style={{flex:1,padding:"7px 4px",textAlign:"center",fontSize:11,fontWeight:700,borderRadius:9,background:mode===m.id?SURF:"transparent",color:mode===m.id?CARAMEL:TXT3,cursor:"pointer"}} onClick={()=>{setMode(m.id);setResult(null);setChatHistory([]);}}>
            {m.label}
          </div>
        ))}
      </div>
      {!result?(
        <>
          {mode==="frigo"?(
            <>
              <span style={lbl}>Ingrédients disponibles</span>
              <textarea style={{...inp,minHeight:70,resize:"none",fontSize:12,marginBottom:6}} placeholder="Ex: poulet, courgettes, riz…" value={fridgeInput} onChange={e=>setFridgeInput(e.target.value)}/>
              <div style={{display:"flex",gap:6,marginBottom:12}}>
                <button style={{...btn("gh"),flex:1,fontSize:11,background:listening?"rgba(212,96,74,.1)":"",color:listening?DNG:undefined}} onClick={()=>startVoice("fridge")} disabled={listening}>{listening?"🎤 Écoute…":"🎤 Ajouter par vocal"}</button>
                {items?.length>0&&<div style={{fontSize:10,color:TXT3,display:"flex",alignItems:"center"}}>💡 Pré-rempli</div>}
              </div>
            </>
          ):(
            <>
              <span style={lbl}>Recette de base</span>
              <input style={{...inp,marginBottom:10}} placeholder="Ex: Poulet rôti, Quiche lorraine…" value={variationBase} onChange={e=>setVariationBase(e.target.value)}/>
              <span style={lbl}>Type de variation</span>
              <select style={{...sel,marginBottom:12}} value={variationType} onChange={e=>setVariationType(e.target.value)}>
                {["végétarien","vegan","sans gluten","sans lactose","plus rapide (max 20 min)","version légère","version enfants"].map(v=><option key={v} value={v}>{v}</option>)}
              </select>
            </>
          )}
          <button style={{...btn("acc"),width:"100%",justifyContent:"center"}} onClick={generate} disabled={generating}>{generating?"⏳ Génération en cours…":"✨ Générer la recette"}</button>
          {!localStorage.getItem("ws_apikey")&&<div style={{fontSize:10,color:TXT3,textAlign:"center",marginTop:8}}>⚠️ Clé API requise — configurez via 🔑</div>}
        </>
      ):(
        <>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:16,color:TXT,marginBottom:6}}>{result.name}</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:8}}>
            {result.duration&&<span style={{fontSize:10,background:CREAM2,padding:"2px 8px",borderRadius:20,color:TXT2,fontWeight:600}}>⏱️ {result.duration}</span>}
            {result.persons&&<span style={{fontSize:10,background:CREAM2,padding:"2px 8px",borderRadius:20,color:TXT2,fontWeight:600}}>👥 {result.persons} pers.</span>}
            <span style={{fontSize:10,background:"rgba(200,132,90,.1)",padding:"2px 8px",borderRadius:20,color:CARAMEL2,fontWeight:600}}>🤖 IA</span>
          </div>
          {result.tip&&<div style={{fontSize:11,color:TXT2,padding:"7px 10px",background:CREAM,borderRadius:8,borderLeft:`2px solid ${CARAMEL2}`,marginBottom:8}}>💡 {result.tip}</div>}
          <div style={{background:CREAM,border:`1px solid ${BDR}`,borderRadius:10,padding:"8px 12px",marginBottom:8,maxHeight:100,overflowY:"auto"}}>
            {result.ingredients.map((ing,i)=>(
              <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"3px 0",fontSize:12,borderBottom:i<result.ingredients.length-1?`1px solid ${BDR}`:"none"}}>
                <span style={{color:TXT}}>{ing.name}</span><span style={{color:TXT3}}>{ing.qty}{ing.unit?" "+ing.unit:""}</span>
              </div>
            ))}
          </div>
          {result.steps?.length>0&&(
            <div style={{background:CREAM,border:`1px solid ${BDR}`,borderRadius:10,padding:"8px 12px",marginBottom:8,maxHeight:120,overflowY:"auto"}}>
              {result.steps.map((step,i)=>(
                <div key={i} style={{display:"flex",gap:8,padding:"5px 0",borderBottom:i<result.steps.length-1?`1px solid ${BDR}`:"none",fontSize:12,color:TXT2,lineHeight:1.5}}>
                  <div style={{width:18,height:18,background:CARAMEL2,color:"white",borderRadius:"50%",fontSize:10,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1}}>{i+1}</div>
                  <div>{step}</div>
                </div>
              ))}
            </div>
          )}
          <div style={{background:"rgba(200,132,90,.06)",border:`1px solid rgba(200,132,90,.2)`,borderRadius:12,padding:10,marginBottom:10}}>
            <div style={{fontSize:11,fontWeight:700,color:CARAMEL2,marginBottom:4}}>💬 Modifier cette recette</div>
            <div style={{fontSize:10,color:TXT3,marginBottom:6}}>Ex : "Remplace le four par une poêle", "Ajoute une sauce crémeuse"…</div>
            {chatHistory.filter(m=>m.role==="user").slice(1).slice(-2).map((m,i)=>(
              <div key={i} style={{fontSize:10,color:TXT2,padding:"3px 8px",background:"rgba(200,132,90,.08)",borderRadius:6,marginBottom:4}}>💬 {m.content}</div>
            ))}
            <div style={{display:"flex",gap:6}}>
              <input style={{...inp,flex:1,fontSize:12,padding:"8px 10px"}} placeholder="Votre demande de modification…" value={chatMsg} onChange={e=>setChatMsg(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!chatLoading&&sendChat()}/>
              <button style={{...btn("gh"),padding:"8px 10px",fontSize:14,background:listening?"rgba(212,96,74,.1)":"",color:listening?DNG:undefined}} onClick={()=>startVoice("chat")} disabled={listening}>🎤</button>
              <button style={{...btn("acc"),padding:"8px 12px",fontSize:12}} onClick={sendChat} disabled={chatLoading||!chatMsg.trim()}>{chatLoading?"⏳":"→"}</button>
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button style={{...btn("gh"),flex:1,fontSize:11}} onClick={()=>{setResult(null);setChatHistory([]);}}>↩ Régénérer</button>
            <button style={{...btn("acc"),flex:2,fontSize:11}} onClick={()=>onImport(result)}>💾 Enregistrer</button>
          </div>
        </>
      )}
    </Modal>
  );
}

// ─── FOLDER MANAGER ───────────────────────────────────────────
function FolderManager({db,setDb,showToast,onClose}){
  const [newName,setNewName]=useState("");
  const folders=db.folders||[];
  const liked=db.likedRecipes||[];

  function createFolder(){
    if(!newName.trim())return;
    if(folders.find(f=>f.name===newName.trim())){showToast("⚠️ Ce dossier existe déjà");return;}
    const nd={...db,folders:[...folders,{id:Date.now(),name:newName.trim(),recipeIds:[]}]};
    setDb(nd);setNewName("");showToast("🏷️ Thème créé !");
  }
  function deleteFolder(id){
    if(!confirm("Supprimer ce thème ?"))return;
    setDb({...db,folders:folders.filter(f=>f.id!==id)});
  }
  function addToFolder(folderId,recipeId){
    const nd={...db,folders:folders.map(f=>f.id===folderId?{...f,recipeIds:[...new Set([...(f.recipeIds||[]),recipeId])]}:f)};
    setDb(nd);showToast("✅ Recette ajoutée au thème");
  }

  return(
    <Modal open onClose={onClose}>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:12,color:TXT}}>🏷️ Mes thèmes</div>
      {/* Thème Favoris automatique */}
      <div style={{...card,background:CREAM2,marginBottom:8,padding:"10px 14px"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:20}}>❤️</span>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:700,color:TXT}}>Favoris</div>
            <div style={{fontSize:11,color:TXT3}}>{liked.length} recette{liked.length!==1?"s":""}</div>
          </div>
        </div>
      </div>
      {/* Thèmes personnalisés */}
      {folders.map(f=>{
        const count=(f.recipeIds||[]).length;
        return(
          <div key={f.id} style={{...card,background:"rgba(255,255,255,.9)",marginBottom:6,padding:"10px 14px",display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:20}}>🏷️</span>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700,color:TXT}}>{f.name}</div>
              <div style={{fontSize:11,color:TXT3}}>{count} recette{count!==1?"s":""}</div>
            </div>
            <button style={{background:"none",border:"none",color:DNG,cursor:"pointer",fontSize:14}} onClick={()=>deleteFolder(f.id)}>🗑️</button>
          </div>
        );
      })}
      {/* Créer un nouveau thème */}
      <div style={{display:"flex",gap:8,marginTop:10}}>
        <input style={{...inp,flex:1}} placeholder="Nom du thème… (ex: Été, Barbecue)" value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&createFolder()}/>
        <button style={{...btn("acc"),padding:"10px 14px"}} onClick={createFolder}>+ Créer</button>
      </div>
    </Modal>
  );
}

// ─── RECIPE VIEW ──────────────────────────────────────────────
function RecipeView({recipe,priceDB,db,setDb,onClose,onEdit,onDel,onAdd,showToast}){
  const [vp,setVp]=useState(recipe.persons||1);
  const [have,setHave]=useState(new Set());
  const [cooking,setCooking]=useState(false);
  const [showNote,setShowNote]=useState(false);
  const [noteText,setNoteText]=useState(recipe.note||"");
  const [showFolderPick,setShowFolderPick]=useState(false);
  const photoRef=useRef();
  const base=recipe.persons||1,scale=vp/base;
  const cost=estimateRecipeCost(recipe,priceDB,vp);
  const isLiked=(db.likedRecipes||[]).includes(recipe.id);
  const folders=db.folders||[];

  function togHave(i){const s=new Set(have);if(s.has(i))s.delete(i);else s.add(i);setHave(s);}
  function scaleQ(qty){const n=parseFloat(qty);if(isNaN(n))return qty;const r=n*scale;return r%1===0?String(r):r.toFixed(2).replace(/\.?0+$/,"");}

  function toggleLike(){
    const liked=db.likedRecipes||[];
    const nd={...db,likedRecipes:isLiked?liked.filter(id=>id!==recipe.id):[...liked,recipe.id]};
    setDb(nd);showToast(isLiked?"💔 Retiré des favoris":"❤️ Ajouté aux favoris");
  }

  function saveNote(){
    const recipes=db.recipes.map(r=>r.id===recipe.id?{...r,note:noteText}:r);
    setDb({...db,recipes});setShowNote(false);showToast("📝 Note sauvegardée");
  }

  function markCooked(){
    const today=new Date().toLocaleDateString("fr-FR");
    const recipes=db.recipes.map(r=>r.id===recipe.id?{...r,lastCooked:today}:r);
    setDb({...db,recipes});showToast("👨‍🍳 Bonne dégustation !");
  }

  function addToFolderAndClose(folderId){
    const nd={...db,folders:folders.map(f=>f.id===folderId?{...f,recipeIds:[...new Set([...(f.recipeIds||[]),recipe.id])]}:f)};
    setDb(nd);setShowFolderPick(false);showToast("🏷️ Ajouté au thème");
  }

  function handlePhotoUpload(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const recipes=db.recipes.map(r=>r.id===recipe.id?{...r,photo:ev.target.result}:r);
      setDb({...db,recipes});showToast("📸 Photo ajoutée !");
    };
    reader.readAsDataURL(file);e.target.value="";
  }

  if(cooking)return<CookingMode recipe={recipe} onClose={()=>{setCooking(false);markCooked();}}/>;

  return(
    <Modal open onClose={onClose}>
      <input ref={photoRef} type="file" accept="image/*" style={{display:"none"}} onChange={handlePhotoUpload} capture="environment"/>
      {/* Photo ou bouton ajouter */}
      {recipe.photo
        ?<div style={{position:"relative",marginBottom:12}}>
            <img src={recipe.photo} alt={recipe.name} style={{width:"100%",borderRadius:14,maxHeight:170,objectFit:"cover"}}/>
            <button style={{position:"absolute",bottom:8,right:8,background:"rgba(0,0,0,.5)",border:"none",color:"white",borderRadius:8,padding:"4px 10px",fontSize:11,cursor:"pointer",fontWeight:600}} onClick={()=>photoRef.current.click()}>📷 Changer</button>
          </div>
        :<div style={{width:"100%",height:110,borderRadius:14,marginBottom:12,background:`linear-gradient(135deg,${CREAM2},${BDR})`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",gap:6}} onClick={()=>photoRef.current.click()}>
            <div style={{fontSize:52}}>{guessRecipeEmoji(recipe.name)}</div>
            <div style={{fontSize:11,color:TXT2,fontWeight:600,background:"rgba(255,255,255,.75)",borderRadius:8,padding:"3px 10px"}}>📷 Ajouter une photo</div>
          </div>
      }
      {/* Titre + like */}
      <div style={{display:"flex",alignItems:"flex-start",gap:8,marginBottom:8}}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:20,flex:1,lineHeight:1.3,color:TXT}}>{recipe.name}</div>
        <button style={{background:"none",fontSize:13,cursor:"pointer",padding:"4px 8px",flexShrink:0,color:isLiked?DNG:TXT3,fontWeight:700,display:"flex",alignItems:"center",gap:4,borderRadius:8,border:`1px solid ${isLiked?"rgba(212,96,74,.3)":BDR}`}} onClick={toggleLike}>
          {isLiked?"❤️ Favori":"🤍 Favoris"}
        </button>
      </div>
      {/* Badges */}
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
        {recipe.duration&&<span style={{fontSize:11,background:CREAM2,padding:"3px 8px",borderRadius:20,color:TXT2}}>⏱️ {recipe.duration}</span>}
        {recipe.persons&&<span style={{fontSize:11,background:CREAM2,padding:"3px 8px",borderRadius:20,color:TXT2}}>📖 Base: {recipe.persons} pers.</span>}
        {recipe.category&&<span style={{fontSize:11,background:CREAM2,padding:"3px 8px",borderRadius:20,color:TXT2}}>{recipe.category}</span>}
        {recipe.area&&<span style={{fontSize:11,background:CREAM2,padding:"3px 8px",borderRadius:20,color:TXT2}}>{recipe.area}</span>}
        {cost&&<span style={{fontSize:11,background:"rgba(90,138,58,.1)",padding:"3px 8px",borderRadius:20,color:SUC,fontWeight:700}}>~{cost.total.toFixed(2)}€ · {cost.matched}/{cost.outOf}</span>}
        {recipe.lastCooked&&<span style={{fontSize:11,background:CREAM2,padding:"3px 8px",borderRadius:20,color:TXT3}}>📅 Cuisiné le {recipe.lastCooked}</span>}
      </div>
      {/* Note personnelle */}
      {recipe.note&&!showNote&&(
        <div style={{fontSize:11,color:TXT2,padding:"8px 10px",background:CREAM,borderRadius:8,borderLeft:`2px solid ${CARAMEL2}`,marginBottom:10,cursor:"pointer"}} onClick={()=>setShowNote(true)}>
          📝 {recipe.note}
        </div>
      )}
      {showNote&&(
        <div style={{marginBottom:10}}>
          <textarea style={{...inp,minHeight:64,resize:"none",fontSize:12,marginBottom:6}} placeholder="Vos astuces personnelles…" value={noteText} onChange={e=>setNoteText(e.target.value)}/>
          <div style={{display:"flex",gap:6}}>
            <button style={{...btn("gh"),flex:1,fontSize:11}} onClick={()=>setShowNote(false)}>Annuler</button>
            <button style={{...btn("acc"),flex:1,fontSize:11}} onClick={saveNote}>💾 Sauvegarder</button>
          </div>
        </div>
      )}
      {/* Portions */}
      <div style={{display:"flex",alignItems:"center",gap:10,background:CREAM,border:`1px solid ${BDR}`,borderRadius:10,padding:"10px 14px",marginBottom:10}}>
        <label style={{fontSize:13,flex:1,color:TXT2}}>🍽️ Nombre de personnes</label>
        <Stepper value={vp} onChange={setVp}/>
      </div>
      {scale!==1&&<div style={{fontSize:11,color:CARAMEL2,textAlign:"center",marginBottom:8}}>Quantités ajustées ×{scale.toFixed(2).replace(/\.?0+$/,"")}</div>}
      {/* Ingrédients */}
      <span style={lbl}>Ingrédients</span>
      <div style={{background:CREAM,border:`1px solid ${BDR}`,borderRadius:10,padding:"6px 12px",marginBottom:10}}>
        {recipe.ingredients.map((ing,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:i<recipe.ingredients.length-1?`1px solid ${BDR}`:"none",fontSize:13}}>
            <div onClick={()=>togHave(i)} style={{width:20,height:20,borderRadius:5,border:have.has(i)?"none":`1.5px solid ${BDR}`,background:have.has(i)?SUC:"transparent",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}>
              {have.has(i)&&<span style={{color:"white",fontSize:11,fontWeight:700}}>✓</span>}
            </div>
            <span style={{flex:1,textDecoration:have.has(i)?"line-through":"none",opacity:have.has(i)?.5:1}}>{ing.name}</span>
            <span style={{color:TXT3,fontSize:12}}>{scaleQ(ing.qty)}{ing.unit?" "+ing.unit:""}</span>
          </div>
        ))}
      </div>
      <div style={{fontSize:11,color:TXT3,marginBottom:12,padding:"8px 10px",background:CREAM,borderRadius:8,borderLeft:`2px solid ${CARAMEL2}`}}>
        ✅ Cochez les ingrédients que vous <strong style={{color:TXT}}>possédez déjà</strong>. Seuls les non cochés seront ajoutés.
      </div>
      {/* Étapes */}
      {recipe.steps?.length>0&&(
        <>
          <span style={lbl}>Étapes de préparation</span>
          <div style={{background:CREAM,border:`1px solid ${BDR}`,borderRadius:10,padding:"6px 12px",marginBottom:12}}>
            {recipe.steps.map((step,i)=>(
              <div key={i} style={{display:"flex",gap:10,padding:"8px 0",borderBottom:i<recipe.steps.length-1?`1px solid ${BDR}`:"none",alignItems:"flex-start",fontSize:13,lineHeight:1.5,color:TXT2}}>
                <div style={{width:22,height:22,background:CARAMEL2,color:"white",borderRadius:"50%",fontSize:11,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:2}}>{i+1}</div>
                <div>{step}</div>
              </div>
            ))}
          </div>
        </>
      )}
      {/* Attribution TheMealDB si applicable */}
      {recipe.source==="mealdb"&&(
        <div style={{fontSize:10,color:TXT3,marginBottom:10,padding:"6px 10px",background:CREAM,borderRadius:8,lineHeight:1.6}}>
          📖 Source : <span style={{color:CARAMEL2,fontWeight:700,cursor:"pointer",textDecoration:"underline"}} onClick={()=>window.open(`https://www.themealdb.com/meal/${recipe.mealdbId}`,"_blank")}>TheMealDB</span> — CC BY-SA
        </div>
      )}
      {/* Actions */}
      <div style={{display:"flex",gap:6,marginBottom:8}}>
        <button style={{...btn("gh"),flex:1,fontSize:11,padding:"8px 4px"}} onClick={onEdit}>✏️ Modifier</button>
        <button style={{...btn("gh"),flex:1,fontSize:11,padding:"8px 4px"}} onClick={()=>setShowNote(!showNote)}>📝 Note</button>
        <button style={{...btn("gh"),flex:1,fontSize:11,padding:"8px 4px"}} onClick={()=>setShowFolderPick(!showFolderPick)}>🏷️ Thème de recette</button>
        <button style={{...btn("dng"),fontSize:11,padding:"8px 6px"}} onClick={onDel}>🗑️</button>
      </div>
      {/* Sélecteur de dossier */}
      {showFolderPick&&(
        <div style={{background:CREAM2,border:`1px solid ${BDR}`,borderRadius:10,padding:"8px 10px",marginBottom:8}}>
          <div style={{fontSize:11,fontWeight:700,color:TXT2,marginBottom:6}}>Ajouter à un thème :</div>
          {folders.length===0
            ?<div style={{fontSize:11,color:TXT3}}>Aucun thème — créez-en un depuis la page Recettes</div>
            :folders.map(f=>(
              <div key={f.id} style={{padding:"6px 8px",fontSize:12,color:TXT,cursor:"pointer",borderRadius:6,marginBottom:3,background:"rgba(255,255,255,.7)"}} onClick={()=>addToFolderAndClose(f.id)}>
                🏷️ {f.name}
              </div>
            ))
          }
        </div>
      )}
      <div style={{display:"flex",gap:8}}>
        <button style={{...btn("gh"),flex:1}} onClick={onClose}>Fermer</button>
        {recipe.steps?.length>0&&<button style={{...btn("acc"),flex:1}} onClick={()=>setCooking(true)}>🍳 Cuisiner</button>}
        <button style={{...btn("suc"),flex:1}} onClick={()=>onAdd(recipe,vp,have)}>🛒 Ajouter</button>
      </div>
    </Modal>
  );
}

// PAGE HISTORIQUE
// ═══════════════════════════════════════════════════════════════
function PageHistorique({db,setDb,showToast,goToListe}){
  const [qprod,setQprod]=useState(null);
  const [catF,setCatF]=useState("Toutes");

  function confQuick(name,cat,unit,qty){
    const ni=mergeItem(db.items,name,qty,unit,"manuel",cat);
    const ph={...db.productHistory};
    if(!ph[name])ph[name]={count:0,category:cat,lastUnit:unit};
    ph[name].count++;ph[name].lastUnit=unit;
    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);
    setQprod(null);goToListe();showToast("✅ "+name+" ajouté");
  }

  function reloadAll(idx){
    const s=db.shoppingHistory[idx];let ni=[...db.items];
    s.items.forEach(old=>{
      ni=mergeItem(ni,old.name,(old.quantities||[{qty:1,unit:""}])[0].qty,(old.quantities||[{qty:1,unit:""}])[0].unit,"historique",old.category);
    });
    const nd={...db,items:ni};setDb(nd);saveDB(nd);goToListe();showToast("🔄 Course rechargée");
  }

  function reloadSel(idx,selNames){
    const s=db.shoppingHistory[idx];let ni=[...db.items];
    s.items.filter(item=>selNames.has(item.name)).forEach(old=>{
      (old.quantities||[{qty:1,unit:"",source:"historique"}]).forEach(q=>{
        ni=mergeItem(ni,old.name,q.qty,q.unit,"historique",old.category);
      });
    });
    const nd={...db,items:ni};setDb(nd);saveDB(nd);goToListe();
    showToast(`✅ ${selNames.size} article${selNames.size>1?"s":""} ajouté${selNames.size>1?"s":""}`);
  }

  const allTop=Object.entries(db.productHistory).sort((a,b)=>b[1].count-a[1].count);
  const allCats=["Toutes",...[...new Set(allTop.map(([,d])=>d.category||"❓ Autre").filter(Boolean))]];
  const filtered=(catF==="Toutes"?allTop:allTop.filter(([,d])=>(d.category||"❓ Autre")===catF)).slice(0,24);

  return(
    <div style={{padding:14,paddingBottom:90}}>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:20,marginBottom:14,color:TXT}}>Historique</div>

      {allTop.length>0&&(
        <div style={{...card,background:"rgba(255,255,255,.88)",marginBottom:14}}>
          <div style={{fontSize:13,fontWeight:700,color:TXT2,marginBottom:8}}>🔁 Produits fréquents</div>
          <div style={{display:"flex",gap:5,overflowX:"auto",marginBottom:8,paddingBottom:4,scrollbarWidth:"none"}}>
            {allCats.map(c=>(
              <div key={c} style={{background:catF===c?CARAMEL2:CREAM2,color:catF===c?"white":TXT2,borderRadius:20,padding:"4px 10px",fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0,border:`1px solid ${catF===c?CARAMEL2:BDR}`}}
                onClick={()=>setCatF(c)}>{c}</div>
            ))}

function hashPassword(pwd){
  let h=0;for(let i=0;i<pwd.length;i++){h=((h<<5)-h)+pwd.charCodeAt(i);h|=0;}
  return Math.abs(h).toString(36);
}

// Génère un ID unique aléatoire pour un nouveau foyer
function genFoyerId(){
  const chars="abcdefghijklmnopqrstuvwxyz0123456789";
  let id="";for(let i=0;i<10;i++)id+=chars[Math.floor(Math.random()*chars.length)];
  return id;
}

// Récupère le code d'invitation depuis l'URL (?invite=xxx)
function getInviteFromUrl(){
  const p=new URLSearchParams(window.location.search);
  return p.get("invite")||null;
}

function LoginScreen({onLogin}){
  const inviteCode=getInviteFromUrl();
  const [mode,setMode]=useState(inviteCode?"rejoindre":"choix"); // choix | creer | rejoindre
  const [pseudo,setPseudo]=useState(()=>localStorage.getItem("ws_pseudo")||"");
  const [pwd,setPwd]=useState(()=>localStorage.getItem("ws_pwd_saved")||"");
  const [remember,setRemember]=useState(!!localStorage.getItem("ws_pwd_saved"));
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const [inviteLink,setInviteLink]=useState("");
  const [showInvite,setShowInvite]=useState(false);
  const [copied,setCopied]=useState(false);

  async function creerFoyer(){
    if(!pseudo.trim()){setErr("Entrez votre prénom");return;}
    if(!pwd.trim()||pwd.length<4){setErr("Mot de passe trop court (min. 4 caractères)");return;}
    setLoading(true);setErr("");
    const foyerId=genFoyerId();
    const docId="foyer_"+foyerId+"_"+hashPassword(pwd.trim());
    try{
      const{fsdb,doc,setDoc}=window._firebase;
      const ref=doc(fsdb,"households",docId);
      await setDoc(ref,{items:[],productHistory:{},recipes:[],shoppingHistory:[],foyerId,createdAt:Date.now(),members:[pseudo.trim()]});
      localStorage.setItem("ws_pseudo",pseudo.trim());
      localStorage.setItem("ws_docid",docId);
      localStorage.setItem("ws_foyerid",foyerId);
      if(remember){localStorage.setItem("ws_pwd_saved",pwd.trim());}else{localStorage.removeItem("ws_pwd_saved");}
      // Afficher le lien d'invitation
      const link=`${window.location.origin}${window.location.pathname}?invite=${foyerId}`;
      setInviteLink(link);
      setShowInvite(true);
      onLogin(docId,pseudo.trim());
    }catch(e){setErr("Erreur : "+e.message);}
    setLoading(false);
  }

  async function rejoindre(){
    if(!pseudo.trim()){setErr("Entrez votre prénom");return;}
    if(!pwd.trim()||pwd.length<4){setErr("Mot de passe trop court (min. 4 caractères)");return;}
    const fid=inviteCode||"";
    if(!fid){setErr("Code d'invitation manquant");return;}
    setLoading(true);setErr("");
    const docId="foyer_"+fid+"_"+hashPassword(pwd.trim());
    try{
      const{fsdb,doc,getDoc,setDoc}=window._firebase;
      const ref=doc(fsdb,"households",docId);
      const snap=await getDoc(ref);
      if(!snap.exists()){setErr("Mot de passe incorrect ou lien invalide");setLoading(false);return;}
      // Ajouter le membre si pas déjà présent
      const data=snap.data();
      const members=[...(data.members||[])];
      if(!members.includes(pseudo.trim()))members.push(pseudo.trim());
      await setDoc(ref,{...data,members},{merge:true});
      localStorage.setItem("ws_pseudo",pseudo.trim());
      localStorage.setItem("ws_docid",docId);
      localStorage.setItem("ws_foyerid",fid);
      if(remember){localStorage.setItem("ws_pwd_saved",pwd.trim());}else{localStorage.removeItem("ws_pwd_saved");}
      onLogin(docId,pseudo.trim());
    }catch(e){setErr("Erreur : "+e.message);}
    setLoading(false);
  }

function PagePrix({db,setDb,showToast}){
  const [tab,setTab]=useState("scanner");
  const [scanPhotos,setScanPhotos]=useState([]);
  const [scanning,setScanning]=useState(false);
  const [scanResult,setScanResult]=useState(null);
  const [scanMsg,setScanMsg]=useState("");
  const [scanStatus,setScanStatus]=useState("idle");
  const [shopName,setShopName]=useState("");
  const [shopAuto,setShopAuto]=useState(false);
  const [showBudgetEdit,setShowBudgetEdit]=useState(false);
  const [budgetInput,setBudgetInput]=useState("");
  const [searchPrice,setSearchPrice]=useState("");
  const [filterShop,setFilterShop]=useState("Tous");
  const [showPriceVisible,setShowPriceVisible]=useState(()=>localStorage.getItem("ws_prices_visible")!=="false");
  const [listening,setListening]=useState(false);
  const [showApiKey,setShowApiKey]=useState(false);
  const [confirmShop,setConfirmShop]=useState(false);
  const [deleteTicket,setDeleteTicket]=useState(null);
  const scanRef=useRef();
  const recognitionRef=useRef(null);

  function togglePriceVisible(){const v=!showPriceVisible;setShowPriceVisible(v);localStorage.setItem("ws_prices_visible",String(v));}

  function handleScanFile(e){
    const file=e.target.files[0];if(!file)return;
    const mt=file.type||"image/jpeg";
    const r=new FileReader();r.onload=ev=>setScanPhotos(prev=>[...prev,{dataUrl:ev.target.result,mt,id:Date.now()}]);
    r.readAsDataURL(file);e.target.value="";
  }

  function addManualItem(){setScanResult(prev=>[...(prev||[]),{genericName:"",originalName:"",price:0,qty:"",unit:"",selected:true,manual:true,confidence:"high"}]);}

  function editItem(i,field,val){setScanResult(prev=>prev.map((it,j)=>j===i?{...it,[field]:field==="price"?parseFloat(val)||0:val,confirmed:field!=="selected"?true:it.confirmed}:it));}

  function startVoice(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){showToast("⚠️ Reconnaissance vocale non supportée");return;}
    const recog=new SR();recog.lang="fr-FR";recog.continuous=false;recog.interimResults=false;
    recog.onstart=()=>setListening(true);recog.onend=()=>setListening(false);
    recog.onresult=(e)=>{
      const text=e.results[0][0].transcript.trim().toLowerCase();
      const match=text.match(/^(.+?)\s+([\d.,]+)\s*€?\s*$/);
      if(match){
        const name=match[1].trim();const price=parseFloat(match[2].replace(",","."))||0;
        setScanResult(prev=>[...(prev||[]),{genericName:name,originalName:name,price,qty:"",unit:"",selected:true,manual:true,confidence:"high",confirmed:true}]);
        showToast(`🎤 "${name}" ajouté`);
      }else{
        setScanResult(prev=>[...(prev||[]),{genericName:text,originalName:text,price:0,qty:"",unit:"",selected:true,manual:true,confidence:"medium",confirmed:false}]);

MISSION 2 — ARTICLES : Extrais TOUS les articles achetés dans l'ordre exact du ticket.
Pour chaque article :
- genericName : nom générique français sans marque (ex: "beurre doux", "poulet entier", "lait demi-écrémé")
- originalName : texte exact lu sur le ticket

RETOURNE UNIQUEMENT ce JSON valide (sans markdown, sans backtick) :
{"shopName":"","items":[{"genericName":"","originalName":"","price":0,"qty":"","unit":"","confidence":"high","failed":false}]}`;
    try{
      const content=[
        ...scanPhotos.map((p,i)=>[
          ...(n>1?[{type:"text",text:`Photo ${i+1}/${n} :`}]:[]),
          {type:"image",source:{type:"base64",media_type:p.mt,data:p.dataUrl.split(",")[1]}}
        ]).flat(),
        {type:"text",text:prompt}
      ];
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:5000,messages:[{role:"user",content}]})
      });
      if(!resp.ok){const e=await resp.json().catch(()=>({}));throw new Error("Erreur "+resp.status+(e.error?.message?" : "+e.error.message:""));}
      const data=await resp.json();
      let text=(data.content||[]).map(c=>c.text||"").join("").trim();
      text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
      const p=JSON.parse(text);

                      <PriceItemCard key={name} name={name} data={data} best={best} catEmoji={catEmoji} onDelete={()=>deletePriceItem(name)} onDeleteShop={(shop)=>deleteShopPrice(name,shop)} onUpdateShop={(shop,newInfo)=>{
                        const newDB={...db.priceDB,[name]:{...data,shops:{...data.shops,[shop]:{...data.shops[shop],...newInfo,priceRef:pricePerKg(newInfo.price,newInfo.qty,newInfo.unit),updatedAt:Date.now()}}}};
                        const nd={...db,priceDB:newDB};setDb(nd);saveDB(nd);showToast("✅ Prix mis à jour");
                      }} onUpdateCat={(newCat)=>{
                        const newDB={...db.priceDB,[name]:{...data,shops:Object.fromEntries(Object.entries(data.shops).map(([s,i])=>[s,{...i,category:newCat}]))}};
                        const nd={...db,priceDB:newDB};setDb(nd);saveDB(nd);
                      }}/>

          <div style={{...card,background:"rgba(255,255,255,.9)",marginBottom:10}}>

                </div>
                <div style={{fontSize:10,color:TXT3,marginTop:4,textAlign:"right"}}>{budgetPct}% · {Math.max(0,monthlyBudget-thisMonthTotal).toFixed(2)}€ restant</div>

              <div style={{fontSize:12,color:TXT3,textAlign:"center",padding:"8px 0"}}>Définissez une enveloppe mensuelle pour suivre votre budget</div>

          <div style={{fontFamily:"'Fraunces',serif",fontSize:16,color:TXT,marginBottom:10}}>Historique des courses</div>
          {sessions.length===0?(

      {/* Modal budget mensuel */}
      <Modal open={showBudgetEdit} onClose={()=>setShowBudgetEdit(false)}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:10,color:TXT}}>💰 Budget mensuel</div>
        <span style={lbl}>Enveloppe en euros</span>
        <input style={{...inp,marginBottom:14,fontSize:16,textAlign:"center"}} type="number" min="0" placeholder="Ex: 400" value={budgetInput} onChange={e=>setBudgetInput(e.target.value)}/>
        <div style={{display:"flex",gap:8}}>
          <button style={{...btn("gh"),flex:1}} onClick={()=>setShowBudgetEdit(false)}>Annuler</button>
          <button style={{...btn("acc"),flex:1}} onClick={()=>{const v=parseFloat(budgetInput)||0;const nd={...db,budget:{...(db.budget||{}),monthly:v}};setDb(nd);saveDB(nd);setShowBudgetEdit(false);showToast("💰 Budget mis à jour");}}>Enregistrer</button>
        </div>
      </Modal>

      {/* Modal confirmation magasin absent */}
      <Modal open={confirmShop} onClose={()=>setConfirmShop(false)}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:17,marginBottom:8,color:TXT}}>Magasin non renseigné</div>

        <div style={{display:"flex",gap:8}}>
          <button style={{...btn("gh"),flex:1}} onClick={()=>setConfirmShop(false)}>Annuler</button>
          <button style={{...btn("acc"),flex:1}} onClick={()=>{setConfirmShop(false);doSavePrices(shopName.trim()||"Inconnu");}}>Enregistrer quand même</button>
        </div>
      </Modal>

      {/* Modal suppression ticket budget */}
      {deleteTicket&&<Modal open onClose={()=>setDeleteTicket(null)}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:17,marginBottom:8,color:TXT}}>🗑️ Supprimer ce ticket ?</div>
        <div style={{fontSize:13,color:TXT2,marginBottom:6}}><strong>{deleteTicket.session.shop||"Magasin inconnu"}</strong> — {deleteTicket.session.date} — {deleteTicket.session.total?.toFixed(2)}€</div>
        <div style={{fontSize:12,color:TXT3,marginBottom:16}}>Choisissez ce que vous souhaitez supprimer :</div>

      </Modal>}

      {showApiKey&&<ApiKeyModal open onSave={()=>setShowApiKey(false)} onClose={()=>setShowApiKey(false)}/>}
    </div>
  );
}

// PAGE PLACARD — ANTI-GASPI & INVENTAIRE
// ═══════════════════════════════════════════════════════════════
function PagePlacard({db,setDb,showToast,goToRecettes,goToListe}){
  const [tab,setTab]=useState("inventaire"); // inventaire | recettes
  const [showAdd,setShowAdd]=useState(false);
  const [showScan,setShowScan]=useState(false);
  const [filterSignal,setFilterSignal]=useState("tous");
  const pantry=db.pantry||[];
  const redItems=pantry.filter(i=>i.signal==="red");

  function delItem(id){
    const nd={...db,pantry:pantry.filter(i=>i.id!==id)};setDb(nd);showToast("🗑️ Article supprimé");
  }
  function updateSignal(id,signal){
    const nd={...db,pantry:pantry.map(i=>i.id===id?{...i,signal}:i)};setDb(nd);
  }
  function addToListe(item){
    const ni=mergeItem(db.items,item.name,1,"","manuel",item.category||guessCat(item.name));
    const nd={...db,items:ni};setDb(nd);showToast(`✅ ${item.name} ajouté à la liste`);goToListe();
  }

  // Score faisabilité recette basé sur l'inventaire
  function recipeScore(recipe){
    if(!pantry.length||!recipe.ingredients?.length)return null;
    const pantryNames=pantry.map(i=>i.name.toLowerCase());
    const matched=recipe.ingredients.filter(ing=>pantryNames.some(p=>p.includes(ing.name.toLowerCase())||ing.name.toLowerCase().includes(p)));
    return{matched:matched.length,total:recipe.ingredients.length,pct:Math.round(matched.length/recipe.ingredients.length*100)};
  }

  const filtered=filterSignal==="tous"?pantry:pantry.filter(i=>i.signal===filterSignal);
  const byCat={};filtered.forEach(item=>{const c=item.category||guessCat(item.name);if(!byCat[c])byCat[c]=[];byCat[c].push(item);});

  // Recettes triées par score faisabilité
  const recipesWithScore=(db.recipes||[]).map(r=>({...r,score:recipeScore(r)})).filter(r=>r.score&&r.score.matched>0).sort((a,b)=>b.score.pct-a.score.pct);

  return(
    <div style={{padding:14,paddingBottom:90}}>
      {/* Header stats */}
      <div style={{...card,background:"rgba(255,255,255,.88)",padding:"14px 16px",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:20,color:TXT}}>📦 Mon Placard</div>
          <button style={{...btn("acc"),fontSize:12,padding:"7px 12px"}} onClick={()=>setShowAdd(true)}>+ Ajouter</button>
        </div>
        <div style={{display:"flex",gap:8}}>
          {SIGNALS.map(s=>{
            const count=pantry.filter(i=>i.signal===s.id).length;
            return(
              <div key={s.id} style={{flex:1,textAlign:"center",padding:"8px 4px",borderRadius:10,background:s.bg,border:`1px solid ${s.color}22`,cursor:"pointer",opacity:filterSignal!=="tous"&&filterSignal!==s.id?.4:1}} onClick={()=>setFilterSignal(filterSignal===s.id?"tous":s.id)}>
                <div style={{fontSize:18}}>{s.label.split(" ")[0]}</div>
                <div style={{fontSize:16,fontWeight:900,color:s.color,fontFamily:"'Fraunces',serif"}}>{count}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Alerte anti-gaspi */}
      {redItems.length>0&&(
        <div style={{background:"rgba(212,96,74,.1)",border:`1.5px solid rgba(212,96,74,.3)`,borderRadius:12,padding:"10px 14px",marginBottom:12,display:"flex",gap:10,alignItems:"flex-start"}}>
          <span style={{fontSize:20,flexShrink:0}}>⚠️</span>
          <div>
            <div style={{fontSize:13,fontWeight:700,color:DNG,marginBottom:3}}>À utiliser rapidement !</div>
            <div style={{fontSize:11,color:TXT2}}>{redItems.map(i=>i.name).join(", ")}</div>
            <div style={{fontSize:11,color:TXT3,marginTop:4,cursor:"pointer",fontWeight:600,textDecoration:"underline"}} onClick={()=>setTab("recettes")}>
              Voir les recettes suggérées →
            </div>
          </div>
        </div>
      )}

      {/* Onglets */}
      <div style={{display:"flex",gap:4,background:"rgba(255,255,255,.6)",borderRadius:12,padding:3,marginBottom:12}}>
        {[{id:"inventaire",label:"📦 Inventaire"},{id:"recettes",label:"🍽️ Recettes faisables"}].map(t=>(
          <div key={t.id} style={{flex:1,padding:"8px 4px",textAlign:"center",fontSize:11,fontWeight:700,borderRadius:9,background:tab===t.id?SURF:"transparent",color:tab===t.id?CARAMEL:TXT3,cursor:"pointer"}} onClick={()=>setTab(t.id)}>
            {t.label}{t.id==="recettes"&&recipesWithScore.length>0&&<span style={{marginLeft:4,background:CARAMEL2,color:"white",borderRadius:10,padding:"1px 6px",fontSize:9}}>{recipesWithScore.length}</span>}
          </div>
        ))}
      </div>

      {/* TAB INVENTAIRE */}
      {tab==="inventaire"&&(
        <>
          {pantry.length===0?(
            <div style={{textAlign:"center",padding:"48px 20px"}}>
              <div style={{fontSize:48,marginBottom:12}}>📦</div>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:6,color:TXT}}>Placard vide</div>
              <div style={{fontSize:13,color:TXT3,marginBottom:16}}>Ajoutez vos produits pour suivre votre stock et éviter le gaspillage</div>
              <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
                <button style={{...btn("acc"),fontSize:12}} onClick={()=>setShowAdd(true)}>✏️ Ajouter manuellement</button>
                <button style={{...btn("out"),fontSize:12}} onClick={()=>setShowScan(true)}>📷 Scanner une photo</button>
              </div>
            </div>
          ):(
            <>
              {/* Filtre signal */}
              <div style={{display:"flex",gap:5,marginBottom:10,overflowX:"auto",scrollbarWidth:"none"}}>
                {[{id:"tous",label:"Tous",count:pantry.length},...SIGNALS.map(s=>({id:s.id,label:s.label,count:pantry.filter(i=>i.signal===s.id).length}))].map(f=>(
                  <div key={f.id} style={{flexShrink:0,padding:"4px 10px",borderRadius:20,fontSize:11,fontWeight:700,background:filterSignal===f.id?CARAMEL2:"rgba(255,255,255,.8)",color:filterSignal===f.id?"white":TXT2,cursor:"pointer",border:`1px solid ${filterSignal===f.id?CARAMEL2:BDR}`,whiteSpace:"nowrap"}} onClick={()=>setFilterSignal(f.id)}>
                    {f.label} ({f.count})
                  </div>
                ))}
              </div>
              {Object.keys(byCat).length===0?(
                <div style={{textAlign:"center",padding:"24px",color:TXT3,fontSize:12}}>Aucun article dans cette catégorie</div>
              ):Object.entries(byCat).map(([cat,items])=>(
                <div key={cat}>
                  <SecTitle>{cat}</SecTitle>
                  {items.map(item=>(
                    <PantryItem key={item.id} item={item} onDel={delItem} onSignal={updateSignal} onAddToListe={addToListe}/>
                  ))}
                </div>
              ))}
              <button style={{...btn("gh"),width:"100%",fontSize:11,marginTop:8,justifyContent:"center"}} onClick={()=>setShowAdd(true)}>+ Ajouter un article</button>
              <button style={{...btn("gh"),width:"100%",fontSize:11,marginTop:6,justifyContent:"center"}} onClick={()=>setShowScan(true)}>📷 Scanner une photo</button>
            </>
          )}
        </>
      )}

      {/* TAB RECETTES FAISABLES */}
      {tab==="recettes"&&(
        <>
          {recipesWithScore.length===0?(
            <div style={{textAlign:"center",padding:"40px 20px"}}>
              <div style={{fontSize:40,marginBottom:10}}>🍽️</div>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:16,color:TXT,marginBottom:6}}>Aucune recette trouvée</div>
              <div style={{fontSize:12,color:TXT3,marginBottom:14}}>Ajoutez des produits à votre placard pour voir les recettes réalisables</div>
              <button style={{...btn("gh"),fontSize:12}} onClick={()=>setTab("inventaire")}>← Retour à l'inventaire</button>
            </div>
          ):(
            <>
              <div style={{fontSize:12,color:TXT2,marginBottom:10}}>Recettes triées par ingrédients disponibles dans votre placard :</div>
              {recipesWithScore.map(recipe=>(
                <div key={recipe.id} style={{...card,background:"rgba(255,255,255,.9)",marginBottom:8}}>
                  <div style={{display:"flex",gap:10,alignItems:"center"}}>
                    <div style={{width:44,height:44,borderRadius:10,background:`linear-gradient(135deg,${CREAM2},${BDR})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,flexShrink:0}}>{guessRecipeEmoji(recipe.name)}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:700,color:TXT,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{recipe.name}</div>
                      <div style={{fontSize:11,color:TXT2,marginTop:2}}>
                        {recipe.duration&&<span style={{marginRight:8}}>⏱️ {recipe.duration}</span>}
                        {recipe.persons&&<span>👥 {recipe.persons} pers.</span>}
                      </div>
                    </div>
                    <div style={{textAlign:"center",flexShrink:0}}>
                      <div style={{fontSize:15,fontWeight:900,color:recipe.score.pct>=70?SUC:recipe.score.pct>=40?CARAMEL:TXT3,fontFamily:"'Fraunces',serif"}}>{recipe.score.pct}%</div>
                      <div style={{fontSize:9,color:TXT3,fontWeight:600}}>{recipe.score.matched}/{recipe.score.total}</div>
                    </div>
                  </div>
                  {/* Barre de progression */}
                  <div style={{height:4,background:CREAM2,borderRadius:2,marginTop:8,overflow:"hidden"}}>
                    <div style={{height:"100%",width:recipe.score.pct+"%",background:recipe.score.pct>=70?SUC:recipe.score.pct>=40?CARAMEL:TXT3,borderRadius:2,transition:"width .3s"}}/>
                  </div>
                  <button style={{...btn("out"),width:"100%",fontSize:11,justifyContent:"center",marginTop:8,padding:"7px"}} onClick={goToRecettes}>
                    Voir la recette →
                  </button>
                </div>
              ))}
            </>
          )}
        </>
      )}

      {showAdd&&<AddPantryItemModal onClose={()=>setShowAdd(false)} onSave={(item)=>{const nd={...db,pantry:[...pantry,{id:Date.now()+Math.random(),...item}]};setDb(nd);setShowAdd(false);showToast("✅ "+item.name+" ajouté au placard");}} showToast={showToast}/>}
      {showScan&&<ScanPantryModal onClose={()=>setShowScan(false)} onSave={(items)=>{const nd={...db,pantry:[...pantry,...items.map(i=>({id:Date.now()+Math.random(),...i}))]};setDb(nd);setShowScan(false);showToast(`✅ ${items.length} article${items.length>1?"s":""} ajouté${items.length>1?"s":""}`);}} showToast={showToast}/>}
    </div>
  );
}

function AddPantryItemModal({onClose,onSave,showToast}){
  const [name,setName]=useState("");
  const [quantity,setQuantity]=useState("");
  const [signal,setSignal]=useState("green");
  const [listening,setListening]=useState(false);
  const recognitionRef=useRef(null);

  function startVoice(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){showToast("⚠️ Vocal non supporté");return;}
    const recog=new SR();recog.lang="fr-FR";recog.continuous=false;recog.interimResults=false;
    recog.onstart=()=>setListening(true);recog.onend=()=>setListening(false);
    recog.onresult=(e)=>{
      const text=e.results[0][0].transcript.trim();
      setName(text);showToast(`🎤 "${text}"`);
    };
    recog.onerror=()=>{setListening(false);showToast("❌ Erreur micro");};
    recognitionRef.current=recog;recog.start();
  }

  function save(){
    if(!name.trim()){showToast("⚠️ Entrez un nom");return;}
    onSave({name:name.trim(),quantity:quantity.trim(),signal,category:guessCat(name.trim()),addedAt:Date.now()});
  }

  return(
    <Modal open onClose={onClose}>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:12,color:TXT}}>Ajouter au placard</div>
      <span style={lbl}>Nom du produit</span>
      <div style={{display:"flex",gap:6,marginBottom:10}}>
        <input style={{...inp,flex:1}} placeholder="Ex: lait, carottes, pâtes…" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&save()}/>
        <button style={{...btn("gh"),padding:"10px 12px",background:listening?"rgba(212,96,74,.1)":"",color:listening?DNG:undefined}} onClick={startVoice} disabled={listening}>🎤</button>
      </div>
      <span style={lbl}>Quantité (optionnel)</span>
      <input style={{...inp,marginBottom:12}} placeholder="Ex: 500g, 3 pièces, 1 bouteille…" value={quantity} onChange={e=>setQuantity(e.target.value)}/>
      <span style={lbl}>Signal de fraîcheur</span>
      <div style={{display:"flex",gap:6,marginBottom:16}}>
        {SIGNALS.map(s=>(
          <div key={s.id} style={{flex:1,padding:"10px 6px",borderRadius:10,border:`2px solid ${signal===s.id?s.color:BDR}`,background:signal===s.id?s.bg:"transparent",textAlign:"center",cursor:"pointer"}} onClick={()=>setSignal(s.id)}>
            <div style={{fontSize:22}}>{s.label.split(" ")[0]}</div>
            <div style={{fontSize:9,fontWeight:700,color:signal===s.id?s.color:TXT3,marginTop:3,lineHeight:1.2}}>{s.label.replace(/^[^ ]+ /,"")}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:8}}>
        <button style={{...btn("gh"),flex:1}} onClick={onClose}>Annuler</button>
        <button style={{...btn("acc"),flex:2}} onClick={save}>✅ Ajouter</button>
      </div>
    </Modal>
  );
}

function ScanPantryModal({onClose,onSave,showToast}){
  const [photos,setPhotos]=useState([]);
  const [scanning,setScanning]=useState(false);
  const [result,setResult]=useState(null);
  const [scanMsg,setScanMsg]=useState("");
  const fileRef=useRef();

  function handleFile(e){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();r.onload=ev=>setPhotos(prev=>[...prev,{dataUrl:ev.target.result,mt:file.type||"image/jpeg",id:Date.now()}]);
    r.readAsDataURL(file);e.target.value="";
  }

  async function doScan(){
    if(!photos.length){showToast("⚠️ Ajoutez au moins une photo");return;}
    const apiKey=localStorage.getItem("ws_apikey")||"";
    if(!apiKey){showToast("⚠️ Clé API requise — configurez via 🔑");return;}
    setScanning(true);setScanMsg("");setResult(null);
    const prompt=`Tu es un assistant de cuisine. Analyse cette photo de placard/frigo/cuisine et liste TOUS les produits alimentaires visibles.
Pour chaque produit détecté, évalue son état apparent :
- "red" si le produit semble à utiliser très vite (ouvert, presque vide, fruits très mûrs)
- "yellow" si le produit semble bon pour cette semaine
- "green" si le produit est bien stocké et dure encore longtemps

RETOURNE UNIQUEMENT ce JSON valide (sans markdown) :
{"items":[{"name":"nom générique en français","quantity":"quantité estimée ou vide si inconnu","signal":"green"}]}

Exemples de noms génériques : "lait", "œufs", "beurre", "carottes", "yaourt nature"`;
    try{
      const content=[
        ...photos.map(p=>({type:"image",source:{type:"base64",media_type:p.mt,data:p.dataUrl.split(",")[1]}})),
        {type:"text",text:prompt}
      ];
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,messages:[{role:"user",content}]})
      });
      if(!resp.ok)throw new Error("Erreur "+resp.status);
      const data=await resp.json();
      let text=(data.content||[]).map(c=>c.text||"").join("").trim();
      text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
      const p=JSON.parse(text);
      const items=(p.items||[]).map(i=>({...i,category:guessCat(i.name),addedAt:Date.now()}));
      setResult(items);
      setScanMsg(`✅ ${items.length} produit${items.length>1?"s":""} détecté${items.length>1?"s":""}`);
    }catch(err){setScanMsg("❌ "+err.message);}
    setScanning(false);
  }

  function editItem(i,field,val){setResult(prev=>prev.map((it,j)=>j===i?{...it,[field]:val}:it));}
  function removeItem(i){setResult(prev=>prev.filter((_,j)=>j!==i));}

  return(
    <Modal open onClose={onClose}>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:4,color:TXT}}>📷 Scanner mon placard</div>
      <div style={{fontSize:11,color:TXT3,marginBottom:12}}>Prenez une photo de votre placard ou frigo — l'IA détecte les produits automatiquement</div>
      {!result?(
        <>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
            {photos.map((p,i)=>(
              <div key={p.id} style={{position:"relative",width:72,height:72}}>
                <img src={p.dataUrl} style={{width:72,height:72,objectFit:"cover",borderRadius:10,border:`2px solid ${CARAMEL2}`}} alt={`P${i+1}`}/>
                <div style={{position:"absolute",top:-4,right:-4,width:18,height:18,borderRadius:"50%",background:DNG,color:"white",fontSize:10,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}} onClick={()=>setPhotos(prev=>prev.filter(x=>x.id!==p.id))}>✕</div>
              </div>
            ))}
            <div style={{width:72,height:72,border:`2px dashed ${CARAMEL2}`,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",background:SURF,flexDirection:"column",gap:2}} onClick={()=>fileRef.current.click()}>
              <span style={{fontSize:24}}>📷</span>
              <span style={{fontSize:8,color:TXT3,fontWeight:600}}>Photo</span>
            </div>
          </div>
          <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleFile} capture="environment"/>
          {scanMsg&&<div style={{fontSize:12,textAlign:"center",padding:"6px 10px",borderRadius:8,background:"rgba(212,96,74,.1)",color:DNG,marginBottom:8,fontWeight:600}}>{scanMsg}</div>}
          {photos.length>0&&<button style={{...btn("acc"),width:"100%",justifyContent:"center",marginBottom:8}} onClick={doScan} disabled={scanning}>{scanning?"⏳ Analyse en cours…":"🔍 Analyser la photo"}</button>}
          <div style={{display:"flex",gap:8}}>
            <button style={{...btn("gh"),flex:1,fontSize:12}} onClick={onClose}>Annuler</button>
          </div>
        </>
      ):(
        <>
          {scanMsg&&<div style={{fontSize:11,textAlign:"center",padding:"5px 10px",borderRadius:8,background:"rgba(90,138,58,.1)",color:SUC,marginBottom:10,fontWeight:600}}>{scanMsg}</div>}
          <div style={{maxHeight:360,overflowY:"auto",marginBottom:10}}>
            {result.map((item,i)=>{
              const sig=getSignal(item.signal||"green");
              return(
                <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:i<result.length-1?`1px solid ${BDR}`:"none"}}>
                  <span style={{fontSize:20,flexShrink:0}}>{(item.category||guessCat(item.name)).split(" ")[0]}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <input style={{width:"100%",background:"transparent",border:"none",borderBottom:`1px solid ${BDR}`,color:TXT,fontFamily:"inherit",fontSize:13,fontWeight:700,outline:"none",padding:"2px 0"}} value={item.name} onChange={e=>editItem(i,"name",e.target.value)}/>
                    {item.quantity&&<div style={{fontSize:10,color:TXT3}}>{item.quantity}</div>}
                  </div>
                  <div style={{display:"flex",gap:4,flexShrink:0}}>
                    {SIGNALS.map(s=>(
                      <span key={s.id} style={{fontSize:16,cursor:"pointer",opacity:item.signal===s.id?1:.3}} onClick={()=>editItem(i,"signal",s.id)}>{s.label.split(" ")[0]}</span>
                    ))}
                  </div>
                  <button style={{background:"none",border:"none",color:TXT3,cursor:"pointer",fontSize:12,padding:"0 2px"}} onClick={()=>removeItem(i)}>✕</button>
                </div>
              );
            })}
          </div>
          <div style={{display:"flex",gap:8}}>
            <button style={{...btn("gh"),flex:1,fontSize:11}} onClick={()=>{setResult(null);setScanMsg("");}}>↩ Rescanner</button>
            <button style={{...btn("acc"),flex:2,fontSize:11}} onClick={()=>onSave(result)}>✅ Ajouter au placard ({result.length})</button>
          </div>
        </>
      )}
    </Modal>
  );
}
