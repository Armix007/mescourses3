const FLUENT_CDN="https://cdn.jsdelivr.net/npm/fluentui-emoji-cdn/icons/";
function emojiToHex(e){
  const codes=[];
  const pts=[...e];
  for(const ch of pts){
    const cp=ch.codePointAt(0);
    if(cp===0xFE0F)continue; // strip variation selector-16
    codes.push(cp.toString(16));
  }
  return codes.join('-');
}
// Cache des images vérifiées (évite les requêtes répétées)
const _emojiImgCache={};
function getEmojiImgUrl(emoji){
  if(!emoji||emoji.length===0)return null;
  if(_emojiImgCache[emoji]!==undefined)return _emojiImgCache[emoji];
  const hex=emojiToHex(emoji.trim());
  if(!hex)return(_emojiImgCache[emoji]=null);
  const url=`${FLUENT_CDN}${hex}.png`;
  return(_emojiImgCache[emoji]=url);
}
// Composant image Fluent Emoji avec fallback Unicode
function EmojiImg({emoji,size=20,style={}}){
  const [failed,setFailed]=useState(false);
  const url=getEmojiImgUrl(emoji);
  if(!url||failed){
    return<span style={{fontSize:size,...style}}>{emoji}</span>;
  }
  return<img src={url} alt={emoji} width={size} height={size} onError={()=>setFailed(true)} style={{display:"inline-block",verticalAlign:"middle",objectFit:"contain",...style}}/>;
}

// Fraîcheur : 🟢 < 14j, 🟡 14-60j, 🔴 > 60j
function priceFreshness(ts){
  if(!ts)return"🔴";
  const days=(Date.now()-ts)/(1000*60*60*24);
  if(days<14)return"🟢";if(days<60)return"🟡";return"🔴";
}
// Calcule le prix de référence normalisé selon l'unité
// Poids/volume → prix au kg ou au litre
// Pièce/paquet/boîte/etc. → prix à l'unité
function pricePerKg(price,qty,unit){
  if(!price||!qty||!unit)return null;
  const q=parseFloat(qty);if(isNaN(q)||q<=0)return null;
  // Unités de poids → ramène au kg
  const toKg={g:1000,kg:1};
  // Unités de volume → ramène au litre
  const toL={ml:1000,cl:100,L:1,l:1};
  // Unités discrètes → prix à l'unité
  const discrete=["pièce","pièces","","pcs","tranche","tranches","sachet","sachets","boîte","boîtes","bouteille","bouteilles","paquet","paquets","botte","bottes","pot","pots","barquette","barquettes","rouleau","rouleaux"];
  if(toKg[unit]!==undefined)return{value:(price/q)*toKg[unit],label:"€/kg"};
  if(toL[unit]!==undefined)return{value:(price/q)*toL[unit],label:"€/L"};
  if(discrete.includes(unit.toLowerCase()))return{value:price/q,label:"€/pièce"};
  return null;
}
// Libellé court du prix de référence
function fmtPriceRef(price,qty,unit){
  const r=pricePerKg(price,qty,unit);
  if(!r)return null;
  return`${r.value.toFixed(2)}${r.label}`;
}
// Cherche le meilleur prix connu pour un produit
function getBestPrice(priceDB,name){
  const norm=name.toLowerCase().trim();
  const entries=Object.entries(priceDB||{});
  const match=entries.find(([k])=>k===norm);
  if(!match)return null;
  const shops=Object.entries(match[1].shops||{});
  if(!shops.length)return null;
  const best=shops.sort((a,b)=>{
    const ra=a[1].priceRef?.value??a[1].price;
    const rb=b[1].priceRef?.value??b[1].price;
    return ra-rb;
  })[0];
  return{shop:best[0],...best[1]};
}

let MEALDB_LOCAL = []; // tableau de recettes traduites, rempli au démarrage

async function loadLocalMealDB(){
  try{
    const r = await fetch('/recipes_mealdb_fr.json');
    if(!r.ok){ MEALDB_LOCAL = []; return; }
    const d = await r.json();
    // Accepte { recipes: [...] }, un tableau direct, ou un objet indexé
    let arr = null;
    if(Array.isArray(d)) arr = d;
    else if(d && Array.isArray(d.recipes)) arr = d.recipes;
    else if(d && typeof d === 'object') arr = Object.values(d).find(v=>Array.isArray(v)) || [];
    MEALDB_LOCAL = Array.isArray(arr) ? arr : [];
    console.info('✅ MealDB local : ' + MEALDB_LOCAL.length + ' recettes chargées');
  } catch(e){
    MEALDB_LOCAL = [];
  }
}

// Sécurité : garantit toujours un tableau, même si le chargement a échoué
function _localArray(){ return Array.isArray(MEALDB_LOCAL) ? MEALDB_LOCAL : []; }

// Recherche dans la base locale : retourne jusqu'à maxResults résultats
function searchLocalMealDB(term, maxResults=10){
  const arr = _localArray();
  if(!term || !arr.length) return [];
  const q = term.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  return arr.filter(m=>{
    const haystack = [m.nom, m.nomEN, m.categorie, m.origine, ...(m.tags||[])].join(' ')
      .toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    return haystack.includes(q);
  }).slice(0, maxResults);
}

// Filtre la base locale selon catégorie EN (strCategory TheMealDB)
function filterLocalByCategory(categoryEN, maxResults=100){
  const arr = _localArray();
  if(!arr.length) return [];
  const q = categoryEN.toLowerCase();
  return arr.filter(m=>
    (m.categorieEN||"").toLowerCase() === q
    || (m.categorie||"").toLowerCase().includes(q)
  ).slice(0, maxResults);
}

// Filtre la base locale selon origine EN (strArea TheMealDB)
function filterLocalByArea(areaEN, maxResults=100){
  const arr = _localArray();
  if(!arr.length) return [];
  const q = areaEN.toLowerCase();
  return arr.filter(m=>
    (m.origineEN||"").toLowerCase() === q
    || (m.origine||"").toLowerCase().includes(q)
  ).slice(0, maxResults);
}

// Convertit une recette du cache local au format interne Wisely
function parseMeasureLocal(measure){
  if(!measure) return {qty:"", unit:""};
  const s = measure.trim();
  if(/au go[uû]t|à volon|q\.s\.|qs/i.test(s)) return {qty:"", unit:"pincée"};
  const fracs={"1/2":"0.5","1/3":"0.33","1/4":"0.25","2/3":"0.67","3/4":"0.75"};
  let n = s;
  Object.entries(fracs).forEach(([f,v])=>{ n=n.replace(f,v); });
  const m = n.match(/^(\d+(?:[.,]\d+)?)\s*([a-zà-ÿ]*)\s*/i);
  if(!m) return {qty:"", unit:""};
  const unitMap={g:"g",gr:"g",kg:"kg",ml:"ml",cl:"cl",l:"L",L:"L",
    "càs":"càs","càc":"càc",tbsp:"càs",tsp:"càc",
    oz:"g",lb:"kg","pincée":"pincée",botte:"botte",
    gousse:"pièce",gousses:"pièce",tranche:"tranche",tranches:"tranche",
    "boîte":"boîte",sachet:"sachet",paquet:"paquet",bouteille:"bouteille"};
  const u = (m[2]||"").toLowerCase().trim();
  return {qty: m[1].replace(',','.'), unit: unitMap[u]!==undefined ? unitMap[u] : u};
}

function localMealToWisely(m){
  const reg = m.regimes || {};
  const diets = [];
  if(reg.vegetarien||reg["végétarien"]) diets.push("vegetarian");
  if(reg.vegan) diets.push("vegan");
  if(reg.sans_gluten) diets.push("gluten-free");
  if(reg.sans_lactose) diets.push("dairy-free");
  return {
    id: Date.now() + Math.random(),
    name: m.nom || m.nomEN || "",
    nameEN: m.nomEN || "",
    source: "mealdb",
    mealdbId: m.id || null,
    photo: m.photo || null,
    category: m.categorie || "",
    area: m.origine || "",
    duration: m.duration || null,
    persons: m.persons || null,
    diets,
    tags: m.tags || [],
    ingredients: (m.ingredients||[]).map(ing=>{
      const {qty,unit}=parseMeasureLocal(ing.measure||"");
      return {name:ing.name||ing.nom||"", qty, unit, category:ing.categorie||ing.category||getCat(ing.name||ing.nom||"")};
    }),
    steps: m.etapes || m.steps || [],
    date: new Date().toLocaleDateString("fr-FR"),
    _fromLocal: true
  };
}

// Normalise un nom d'ingrédient (souvent généré par IA ou importé en anglais)
// vers le nom canonique de la base + récupère emoji et catégorie
function normalizeIngredient(rawName){
  if(!rawName) return {nom: rawName, categorie: getCat(rawName), emoji: getCat(rawName).split(' ')[0]};
  
  // 1. Normalisation du texte : minuscules, sans accents
  const normalize = s => s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/['']/g, "'")
    .trim();
  
  const raw = normalize(rawName);
  
  // 2. Correspondance exacte sur nom ou clé
  let match = PRODUCTS_CATALOG.find(p => normalize(p.nom) === raw || p.cle === raw);
  
  // 3. Correspondance exacte sur aliases
  if(!match){
    match = PRODUCTS_CATALOG.find(p => p.aliases.some(a => normalize(a) === raw));
  }
  
  // 4. Correspondance partielle sur aliases (exact word boundary)
  // Les étapes includes ont été supprimées : trop de faux positifs
  // ("sel" dans "beurre demi-sel", "citron" dans "citronnelle", etc.)

  // 5. Correspondance par mots-clés (≥2 mots en commun)
  if(!match){
    const rawWords = raw.split(/\s+/).filter(w => w.length > 2);
    if(rawWords.length >= 2){
      match = PRODUCTS_CATALOG.find(p => {
        const allNames = [p.nom, ...p.aliases].map(normalize).join(' ');
        const commonWords = rawWords.filter(w => allNames.includes(w));
        return commonWords.length >= 2;
      });
    }
  }

  if(match){
    return {
      nom: match.nom,
      categorie: match.categorie,
      emoji: match.emoji,
      unite: match.unite_defaut,
      rayon: match.rayon,
      regimes: match.regimes
    };
  }

  // Fallback : garde le nom original + devine catégorie par regex
  const cat = getCat(rawName);
  return {
    nom: rawName,
    categorie: cat,
    emoji: cat.split(' ')[0],
    unite: null,
    rayon: null,
    regimes: null
  };
}

// Version simplifiée pour guessCat utilisant la base en priorité
function getCatFromCatalog(name){
  const r = normalizeIngredient(name);
  return r.categorie;
}

// getCat = version améliorée utilisant le catalogue en priorité
function getCat(name){
  if(PRODUCTS_CATALOG.length > 0){
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/['']/g,"'").trim();
    const raw = norm(name);
    const found = PRODUCTS_CATALOG.find(p =>
      norm(p.nom)===raw || p.cle===raw ||
      p.aliases.some(a=>norm(a)===raw)
    );
    if(found) return found.categorie;
  }
  return guessCat(name);
}
// getProductEmoji = emoji SPÉCIFIQUE du produit (ex: 🍋 pour citron, 🧂 pour sel)
// Priorité : p.emoji du catalogue > emoji de la catégorie granulaire > fallback guessCat
function getProductEmoji(name){
  if(!name)return"🥗";try{name=String(name);}catch(_e){return"🥗";}
  if(PRODUCTS_CATALOG.length > 0){
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/['']/g,"'").trim();
    const raw = norm(name);
    const found = PRODUCTS_CATALOG.find(p =>
      norm(p.nom)===raw || p.cle===raw ||
      p.aliases.some(a=>norm(a)===raw)
    );
    if(found && found.emoji) return found.emoji;
  }
  return getCat(name).split(' ')[0];
}

function mergeItem(items,n,qv,uv,src,ct){
  const arr=[...items],norm=n.toLowerCase();
  const ex=arr.find(i=>i.name.toLowerCase()===norm&&!i.checked);
  if(ex){const s=ex.quantities.find(q=>q.unit===uv);if(s)s.qty=roundQ(+s.qty+ +qv);else ex.quantities.push({qty:roundQ(+qv),unit:uv,source:src});}
  else arr.push({id:Date.now()+Math.random(),name:n,category:ct||getCat(n),quantities:[{qty:roundQ(+qv),unit:uv,source:src}],checked:false});
  return arr;
}

function CropModal({open,src,onConfirm,onClose}){
  const canvasRef=useRef(null),imgRef=useRef(null),containerRef=useRef(null);
  const [drag,setDrag]=useState(null);
  const [crop,setCrop]=useState({x:.05,y:.05,w:.9,h:.9});
  const [loaded,setLoaded]=useState(false);
  const [canvasSize,setCanvasSize]=useState({w:400,h:300});

  useEffect(()=>{if(open&&src){setLoaded(false);setCrop({x:.05,y:.05,w:.9,h:.9});}},[open,src]);

  // Quand l'image est chargée : calcule les dimensions du canvas selon ratio réel + DPR
  function onImgLoad(){
    const img=imgRef.current;
    if(!img)return;
    const dpr=window.devicePixelRatio||1;
    // Largeur CSS disponible (modal ~350px max)
    const cssW=Math.min(containerRef.current?.offsetWidth||340,340);
    const ratio=img.naturalHeight/img.naturalWidth;
    const cssH=Math.round(cssW*ratio);
    // Dimensions physiques du canvas (nettes sur Retina)
    setCanvasSize({w:Math.round(cssW*dpr),h:Math.round(cssH*dpr),cssW,cssH});
    setLoaded(true);
  }

  useEffect(()=>{
    if(!loaded||!canvasRef.current||!imgRef.current)return;
    const cv=canvasRef.current,img=imgRef.current,ctx=cv.getContext("2d");
    const W=cv.width,H=cv.height;
    const dpr=window.devicePixelRatio||1;
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(img,0,0,W,H);
    ctx.fillStyle="rgba(0,0,0,.5)";
    const cx=crop.x*W,cy=crop.y*H,cw=crop.w*W,ch=crop.h*H;
    ctx.fillRect(0,0,W,cy);ctx.fillRect(0,cy,cx,ch);ctx.fillRect(cx+cw,cy,W-(cx+cw),ch);ctx.fillRect(0,cy+ch,W,H-(cy+ch));
    ctx.strokeStyle=CARAMEL2;ctx.lineWidth=2*dpr;ctx.strokeRect(cx,cy,cw,ch);
    // grille des tiers
    ctx.strokeStyle="rgba(200,132,90,.4)";ctx.lineWidth=dpr;
    [1,2].forEach(k=>{ctx.beginPath();ctx.moveTo(cx+cw*k/3,cy);ctx.lineTo(cx+cw*k/3,cy+ch);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,cy+ch*k/3);ctx.lineTo(cx+cw,cy+ch*k/3);ctx.stroke();});
    // poignées de coin nettes
    const r=10*dpr;
    [[cx,cy],[cx+cw,cy],[cx,cy+ch],[cx+cw,cy+ch]].forEach(([hx,hy])=>{
      ctx.fillStyle=CARAMEL2;ctx.beginPath();ctx.arc(hx,hy,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="white";ctx.lineWidth=1.5*dpr;ctx.beginPath();ctx.arc(hx,hy,r,0,Math.PI*2);ctx.stroke();
    });
  },[crop,loaded,canvasSize]);

  function getPos(e,cv){
    const r=cv.getBoundingClientRect();const cl=e.touches?e.touches[0]:e;
    return{x:(cl.clientX-r.left)/r.width,y:(cl.clientY-r.top)/r.height};
  }
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

  function startDrag(e){
    if(!canvasRef.current)return;e.preventDefault();
    const pos=getPos(e,canvasRef.current);const{x,y,w,h}=crop;
    const hs=[{n:"tl",px:x,py:y},{n:"tr",px:x+w,py:y},{n:"bl",px:x,py:y+h},{n:"br",px:x+w,py:y+h}];
    const hit=hs.find(hd=>Math.hypot(pos.x-hd.px,pos.y-hd.py)<0.08);
    if(hit)setDrag({type:"h",name:hit.n,sc:{...crop}});
    else if(pos.x>=x&&pos.x<=x+w&&pos.y>=y&&pos.y<=y+h)setDrag({type:"m",ox:pos.x-x,oy:pos.y-y,sc:{...crop}});
    else setDrag({type:"n",sx:pos.x,sy:pos.y});
  }
  function onDrag(e){
    if(!drag||!canvasRef.current)return;e.preventDefault();
    const pos=getPos(e,canvasRef.current);
    if(drag.type==="n"){const x=Math.min(pos.x,drag.sx),y=Math.min(pos.y,drag.sy),w=Math.abs(pos.x-drag.sx),h=Math.abs(pos.y-drag.sy);setCrop({x:clamp(x,0,1),y:clamp(y,0,1),w:clamp(w,0.05,1-x),h:clamp(h,0.05,1-y)});}
    else if(drag.type==="m"){const sc=drag.sc;setCrop({...sc,x:clamp(pos.x-drag.ox,0,1-sc.w),y:clamp(pos.y-drag.oy,0,1-sc.h)});}
    else if(drag.type==="h"){const sc=drag.sc;
      if(drag.name==="tl"){const nx=clamp(pos.x,0,sc.x+sc.w-0.05),ny=clamp(pos.y,0,sc.y+sc.h-0.05);setCrop({x:nx,y:ny,w:sc.x+sc.w-nx,h:sc.y+sc.h-ny});}
      else if(drag.name==="tr"){const ny=clamp(pos.y,0,sc.y+sc.h-0.05);setCrop({x:sc.x,y:ny,w:clamp(pos.x-sc.x,0.05,1-sc.x),h:sc.y+sc.h-ny});}
      else if(drag.name==="bl"){const nx=clamp(pos.x,0,sc.x+sc.w-0.05);setCrop({x:nx,y:sc.y,w:sc.x+sc.w-nx,h:clamp(pos.y-sc.y,0.05,1-sc.y)});}
      else{setCrop({x:sc.x,y:sc.y,w:clamp(pos.x-sc.x,0.05,1-sc.x),h:clamp(pos.y-sc.y,0.05,1-sc.y)});}
    }
  }
  function endDrag(){setDrag(null);}

  function confirm(){
    if(!imgRef.current)return;
    const img=imgRef.current;
    const out=document.createElement("canvas");
    const srcX=Math.round(img.naturalWidth*crop.x);
    const srcY=Math.round(img.naturalHeight*crop.y);
    const srcW=Math.round(img.naturalWidth*crop.w);
    const srcH=Math.round(img.naturalHeight*crop.h);
    out.width=srcW;out.height=srcH;
    out.getContext("2d").drawImage(img,srcX,srcY,srcW,srcH,0,0,srcW,srcH);
    onConfirm(out.toDataURL("image/jpeg",.95));
  }

  if(!open||!src)return null;
  return(
    <div style={{...ovl,zIndex:300}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{...mdl,paddingBottom:24}}>
        <div style={{width:36,height:4,background:BDR,borderRadius:2,margin:"0 auto 14px"}}/>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:17,marginBottom:4,color:TXT}}>📐 Recadrer la photo</div>
        <div style={{fontSize:12,color:TXT3,marginBottom:10}}>Tirez les coins pour délimiter la zone à garder</div>
        <div ref={containerRef} style={{borderRadius:12,overflow:"hidden",touchAction:"none",userSelect:"none",background:CREAM2,border:`1px solid ${BDR}`}}>
          {/* Image cachée — source pour le canvas et pour le recadrage final */}
          <img ref={imgRef} src={src} alt="" style={{display:"none"}} onLoad={onImgLoad}/>
          {loaded
            ?<canvas
                ref={canvasRef}
                width={canvasSize.w}
                height={canvasSize.h}
                style={{width:`${canvasSize.cssW}px`,height:`${canvasSize.cssH}px`,display:"block",cursor:"crosshair",touchAction:"none",maxWidth:"100%"}}
                onMouseDown={startDrag} onMouseMove={onDrag} onMouseUp={endDrag} onMouseLeave={endDrag}
                onTouchStart={startDrag} onTouchMove={onDrag} onTouchEnd={endDrag}/>
            :<div style={{height:220,display:"flex",alignItems:"center",justifyContent:"center",color:TXT3,fontSize:13}}>Chargement…</div>
          }
        </div>
        <div style={{fontSize:10,color:TXT3,textAlign:"center",marginTop:6}}>Pleine résolution préservée ✓</div>
        <div style={{display:"flex",gap:8,marginTop:10}}>
          <button style={{...btn("gh"),flex:1}} onClick={onClose}>Annuler</button>
          <button style={{...btn("acc"),flex:1}} onClick={confirm} disabled={!loaded}>✂️ Recadrer</button>
        </div>
      </div>
    </div>
  );
}

// SUGG BLOCK — suggestions adaptées au mode d'affichage
// ═══════════════════════════════════════════════════════════════
function SuggBlock({popular,listView,db,setDb,showToast,normInc,getCatFn}){
  // Filtrer les articles déjà dans la liste courante
  const inList=new Set((db.items||[]).map(i=>i.name.toLowerCase()));
  const [dismissed,setDismissed]=useState(new Set());
  const visible=popular.filter(p=>!inList.has(p.name.toLowerCase())&&!dismissed.has(p.name));

  // State local qtys initialisé sur les items visibles
  const [suggQtys,setSuggQtys]=useState(()=>{
    const init={};
    popular.forEach(p=>{
      const info=normInc(p.name);
      init[p.name]={qty:1,unit:info.unite||p.lastUnit||""};
    });
    return init;
  });

  function addSugg(p){
    const info=normInc(p.name);
    const catV=normalizeCat(info.categorie||p.category||getCatFn(p.name));
    const sq=suggQtys[p.name]||{qty:1,unit:""};
    const ni=mergeItem(db.items,p.name,sq.qty,sq.unit,"manuel",catV);
    const ph={...db.productHistory};
    if(!ph[p.name])ph[p.name]={count:0,category:catV,lastUnit:sq.unit};
    ph[p.name].count++;ph[p.name].category=catV;ph[p.name].lastUnit=sq.unit;
    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);
    // Retirer immédiatement de l'affichage
    setDismissed(prev=>new Set([...prev,p.name]));
    showToast("✅ "+p.name+" ajouté");
  }

  function setQ(name,val){setSuggQtys(prev=>({...prev,[name]:{...prev[name],qty:val}}))}
  function setU(name,val){setSuggQtys(prev=>({...prev,[name]:{...prev[name],unit:val}}))}

  if(!visible.length) return null;

  // Fond distinct pour différencier du contenu liste
  const SUGG_BG="rgba(184,112,58,.05)";
  const SUGG_BDR="rgba(184,112,58,.2)";

  if(listView==="grille"){
    return(
      <div style={{marginTop:14,background:SUGG_BG,border:`1px dashed ${SUGG_BDR}`,borderRadius:14,padding:"12px 10px"}}>
        <div style={{fontSize:10,fontWeight:800,color:TXT2,letterSpacing:.8,textTransform:"uppercase",marginBottom:8}}>💡 Suggestions rapides</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {visible.map((p,i)=>{
            const info=normInc(p.name);
            const em=(info.categorie||getCatFn(p.name)).split(" ")[0];
            const sq=suggQtys[p.name]||{qty:1,unit:""};
            return(
              <div key={i} style={{background:SURF,border:`1px solid ${BDR}`,borderRadius:12,padding:"9px 10px",display:"flex",flexDirection:"column",gap:5,boxShadow:"0 1px 4px rgba(160,90,40,.04)"}}>
                <div style={{display:"flex",alignItems:"center",gap:5}}>
                  <span style={{fontSize:16}}>{em}</span>
                  <div style={{flex:1,fontSize:12,fontWeight:700,color:TXT,lineHeight:1.2}}>{p.name}</div>
                </div>
                <div style={{display:"flex",gap:4,alignItems:"center"}}>
                  <input type="number" min="0.1" step="0.5" value={sq.qty} onChange={e=>setQ(p.name,parseFloat(e.target.value)||1)} style={{...inp,padding:"4px 6px",fontSize:11,width:44,textAlign:"center"}}/>
                  <select value={sq.unit} onChange={e=>setU(p.name,e.target.value)} style={{...sel,padding:"4px 5px",fontSize:10,flex:1}}>
                    {UNITS.map(u=><option key={u} value={u}>{UL[u]||"pcs"}</option>)}
                  </select>
                  <button onClick={()=>addSugg(p)} style={{background:CARAMEL,border:"none",color:"white",borderRadius:8,width:28,height:28,fontSize:16,fontWeight:800,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>+</button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  if(listView==="mini"){
    return(
      <div style={{marginTop:14,background:SUGG_BG,border:`1px dashed ${SUGG_BDR}`,borderRadius:14,padding:"12px 10px"}}>
        <div style={{fontSize:10,fontWeight:800,color:TXT2,letterSpacing:.8,textTransform:"uppercase",marginBottom:8}}>💡 Suggestions rapides</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
          {visible.map((p,i)=>{
            const info=normInc(p.name);
            const em=(info.categorie||getCatFn(p.name)).split(" ")[0];
            const shortName=p.name.length>10?p.name.slice(0,9)+"…":p.name;
            const sq=suggQtys[p.name]||{qty:1,unit:""};
            return(
              <div key={i} style={{background:SURF,border:`1px solid ${BDR}`,borderRadius:10,padding:"7px 6px",display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                <span style={{fontSize:16}}>{em}</span>
                <div style={{fontSize:9,fontWeight:700,color:TXT,textAlign:"center",lineHeight:1.2,width:"100%"}}>{shortName}</div>
                <input type="number" min="0.1" step="0.5" value={sq.qty} onChange={e=>setQ(p.name,parseFloat(e.target.value)||1)}
                  style={{...inp,padding:"3px 4px",fontSize:9,width:"100%",textAlign:"center"}}/>
                <select value={sq.unit} onChange={e=>setU(p.name,e.target.value)}
                  style={{...sel,padding:"3px 4px",fontSize:9,width:"100%"}}>
                  {UNITS.map(u=><option key={u} value={u}>{UL[u]||"pcs"}</option>)}
                </select>
                <button onClick={()=>addSugg(p)} style={{background:CARAMEL,border:"none",color:"white",borderRadius:6,width:"100%",height:22,fontSize:13,fontWeight:800,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // Vue liste (défaut)
  return(
    <div style={{marginTop:14,background:SUGG_BG,border:`1px dashed ${SUGG_BDR}`,borderRadius:14,overflow:"hidden"}}>
      <div style={{fontSize:10,fontWeight:800,color:TXT2,letterSpacing:.8,textTransform:"uppercase",padding:"10px 12px 6px"}}>💡 Suggestions rapides</div>
      <div>
        {visible.map((p,i)=>{
          const info=normInc(p.name);
          const em=(info.categorie||getCatFn(p.name)).split(" ")[0];
          const sq=suggQtys[p.name]||{qty:1,unit:""};
          return(
            <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",borderTop:`1px solid ${SUGG_BDR}`}}>
              <span style={{fontSize:16,flexShrink:0}}>{em}</span>
              <div style={{flex:1,fontSize:13,fontWeight:600,color:TXT}}>{p.name}</div>
              <input type="number" min="0.1" step="0.5" value={sq.qty} onChange={e=>setQ(p.name,parseFloat(e.target.value)||1)} style={{...inp,padding:"4px 6px",fontSize:11,width:44,textAlign:"center",flexShrink:0}}/>
              <select value={sq.unit} onChange={e=>setU(p.name,e.target.value)} style={{...sel,padding:"4px 5px",fontSize:10,width:60,flexShrink:0}}>
                {UNITS.map(u=><option key={u} value={u}>{UL[u]||"pcs"}</option>)}
              </select>
              <button onClick={()=>addSugg(p)} style={{background:CARAMEL,border:"none",color:"white",borderRadius:8,width:28,height:28,fontSize:16,fontWeight:800,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>+</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// PAGE LISTE

function PageListe({db,setDb,showToast,goToPlanning}){
  const [name,setName]=useState("");
  const [qty,setQty]=useState(1);
  const [unit,setUnit]=useState("");
  const [cat,setCat]=useState("🥦 Légumes");
  const [sugg,setSugg]=useState([]);
  const [eqty,setEqty]=useState(null);
  const [confirmClear,setConfirmClear]=useState(false);
  const [listView,setListView]=useState(()=>localStorage.getItem("ws_list_view")||"liste");
  const [showSavedLists,setShowSavedLists]=useState(false);
  const [showSaveModal,setShowSaveModal]=useState(false);
  const [saveName,setSaveName]=useState("");
  const [showQtyPanel,setShowQtyPanel]=useState(false);
  const showPriceVisible=localStorage.getItem("ws_prices_visible")!=="false";
  // Vocal
  const [vocalActive,setVocalActive]=useState(false);
  const [vocalPending,setVocalPending]=useState([]);
  const recognitionRef=useRef(null);

  useEffect(()=>{
    if(!name.trim()){setSugg([]);return;}
    const q=name.toLowerCase();
    const autoInfo=normalizeIngredient(name);
    if(autoInfo&&autoInfo.categorie) setCat(normalizeCat(autoInfo.categorie));
    if(autoInfo&&autoInfo.unite) setUnit(autoInfo.unite);
    const histEntries=Object.entries(db.productHistory).filter(([n])=>n.toLowerCase().includes(q)).sort((a,b)=>b[1].count-a[1].count);
    const histNames=new Set(histEntries.map(([n])=>n.toLowerCase()));
    const dbEntries=PRODUCTS_DB.filter(p=>p.toLowerCase().includes(q)&&!histNames.has(p.toLowerCase())).slice(0,4).map(p=>{
      const info=normalizeIngredient(p);
      return[p,{count:0,category:normalizeCat(info.categorie||getCat(p)),lastUnit:info.unite||""}];
    });
    setSugg([...histEntries,...dbEntries].slice(0,6));
  },[name,db.productHistory]);

  function changeCat(id,newCat){
    const ni=db.items.map(i=>i.id===id?{...i,category:newCat}:i);
    const nd={...db,items:ni};setDb(nd);saveDB(nd);
  }
  function editItem(id,newName,newCat,newQty,newUnit){
    const ni=db.items.map(i=>{
      if(i.id!==id)return i;
      // Remplace UNIQUEMENT la première quantité existante (sans en ajouter une nouvelle)
      const qs=[...i.quantities];
      if(qs.length>0){
        qs[0]={...qs[0],qty:roundQ(newQty),unit:newUnit,source:"manuel"};
      } else {
        qs.push({qty:roundQ(newQty),unit:newUnit,source:"manuel"});
      }
      return{...i,name:newName,category:newCat,quantities:qs};
    });
    const nd={...db,items:ni};setDb(nd);saveDB(nd);
    showToast("✅ Article modifié");
  }

  // ─── VOCAL ────────────────────────────────────────────
  function parseVocalText(text){
    const segments=text.split(/,|\bvirgule\b|\set\s/i).map(s=>s.trim()).filter(Boolean);
    // Map des unités vocales étendues (contenants inclus)
    const unitMapVocal={
      g:"g",gr:"g",gramme:"g",grammes:"g",
      kg:"kg",kilo:"kg",kilos:"kg",kilogramme:"kg",kilogrammes:"kg",
      l:"L",litre:"L",litres:"L",
      ml:"ml",cl:"cl",
      sachet:"sachet",sachets:"sachet",
      boite:"boîte","boîte":"boîte",boites:"boîte","boîtes":"boîte",
      bouteille:"bouteille",bouteilles:"bouteille",
      paquet:"paquet",paquets:"paquet",
      tranche:"tranche",tranches:"tranche",
      botte:"botte",bottes:"botte",
      pot:"boîte",pots:"boîte",
      "unité":"","unités":"","pièce":"","pièces":"",piece:"",pieces:"",
    };
    return segments.map(seg=>{
      const s=seg.toLowerCase().trim();
      // Pattern: "2 sachets de levure", "1 boîte de tomates", "300g de farine"
      const m=s.match(/^(\d+[\.,]?\d*)\s*([a-zàâäéèêëîïôùûüç]+)?\s*(?:de\s+|d['']\s*)?(.+)$/i);
      if(m){
        const qv=parseFloat(m[1].replace(",","."))||1;
        const rawUnit=(m[2]||"").toLowerCase().trim();
        const uv=unitMapVocal[rawUnit]!==undefined?unitMapVocal[rawUnit]:null;
        const namePart=(uv!==null?m[3]:((m[2]?m[2]+" ":"")+m[3])).trim();
        const n=namePart.charAt(0).toUpperCase()+namePart.slice(1);
        const info=normalizeIngredient(n);
        const finalUnit=uv!==null?uv:(info.unite||"");
        return{name:info.nom||n,qty:qv,unit:finalUnit,category:normalizeCat(info.categorie||getCat(n))};
      }
      // Pattern "Œufs 3"
      const m2=s.match(/^(.+?)\s+(\d+)$/i);
      if(m2){
        const info2=normalizeIngredient(m2[1].trim());
        return{name:info2.nom||m2[1].trim().charAt(0).toUpperCase()+m2[1].trim().slice(1),qty:parseInt(m2[2]),unit:info2.unite||"",category:normalizeCat(info2.categorie||getCat(m2[1]))};
      }
      // Juste un nom
      const info3=normalizeIngredient(s);
      return{name:info3.nom||s.charAt(0).toUpperCase()+s.slice(1),qty:1,unit:info3.unite||"",category:normalizeCat(info3.categorie||getCat(s))};
    });
  }

  function startVocal(){
    const SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SpeechRec){showToast("⚠️ Reconnaissance vocale non supportée");return;}
    const rec=new SpeechRec();
    rec.lang="fr-FR";rec.continuous=true;rec.interimResults=false;
    recognitionRef.current=rec;
    setVocalActive(true);
    rec.onresult=e=>{
      const transcript=Array.from(e.results).slice(e.resultIndex).map(r=>r[0].transcript).join(" ").trim();
      if(!transcript)return;
      const items=parseVocalText(transcript);
      setVocalPending(prev=>[...prev,...items]);
    };
    rec.onerror=(err)=>{if(err.error!=="aborted"){setVocalActive(false);showToast("❌ Erreur vocale");}};
    rec.onend=()=>{/* Ne pas stopper automatiquement — géré par stopVocal() */};
    rec.start();
  }
  function stopVocal(){
    recognitionRef.current?.stop();
    setVocalActive(false);
  }
  function confirmVocalItem(idx){
    const item=vocalPending[idx];
    const ni=mergeItem(db.items,item.name,item.qty,item.unit,"vocal",item.category);
    const ph={...db.productHistory};
    if(!ph[item.name])ph[item.name]={count:0,category:item.category,lastUnit:item.unit};
    ph[item.name].count++;
    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);
    setVocalPending(prev=>prev.filter((_,i)=>i!==idx));
    showToast("✅ "+item.name+" ajouté");
  }
  function removeVocalItem(idx){
    setVocalPending(prev=>prev.filter((_,i)=>i!==idx));
  }
  function confirmAllVocal(){
    let ni=[...db.items],ph={...db.productHistory};
    vocalPending.forEach(item=>{
      ni=mergeItem(ni,item.name,item.qty,item.unit,"vocal",item.category);
      if(!ph[item.name])ph[item.name]={count:0,category:item.category,lastUnit:item.unit};
      ph[item.name].count++;
    });
    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);
    setVocalPending([]);showToast(`✅ ${vocalPending.length} articles ajoutés`);
  }
  // ──────────────────────────────────────────────────────
  function addItem(){
    const n=name.trim();if(!n)return;
    // Si le panneau quantité est ouvert → utilise qty/unit choisis
    // Sinon → ajoute avec qty=1 sans unité (l'utilisateur pourra ajuster via + qté)
    const useQty=showQtyPanel?qty:0;
    const useUnit=showQtyPanel?unit:"";
    const ni=mergeItem(db.items,n,useQty,useUnit,"manuel",cat);
    const ph={...db.productHistory};
    if(!ph[n])ph[n]={count:0,category:cat,lastUnit:useUnit};
    ph[n].count++;ph[n].category=cat;ph[n].lastUnit=useUnit;
    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);
    setName("");setQty(1);setUnit("");setSugg([]);setShowQtyPanel(false);
    showToast("✅ "+n+" ajouté");
  }
  function toggle(id){const ni=db.items.map(i=>i.id===id?{...i,checked:!i.checked}:i);const nd={...db,items:ni};setDb(nd);saveDB(nd);}
  function del(id){const ni=db.items.filter(i=>i.id!==id);const nd={...db,items:ni};setDb(nd);saveDB(nd);}
  function clrChk(){const ni=db.items.filter(i=>!i.checked);const nd={...db,items:ni};setDb(nd);saveDB(nd);showToast("🗑️ Articles cochés supprimés");}
  function toggleAll(){
    const allChecked=db.items.length>0&&db.items.every(i=>i.checked);
    const ni=db.items.map(i=>({...i,checked:!allChecked}));
    const nd={...db,items:ni};setDb(nd);saveDB(nd);
  }
  function saveHist(){
    if(!db.items.length){showToast("⚠️ Liste vide");return;}
    const defaultName=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
    setSaveName(defaultName);
    setShowSaveModal(true);
  }
  function confirmSaveHist(){
    const label=saveName.trim()||new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
    const h=[{date:label,items:JSON.parse(JSON.stringify(db.items)),count:db.items.length},...(db.shoppingHistory||[])].slice(0,20);
    const nd={...db,shoppingHistory:h};setDb(nd);saveDB(nd);
    setShowSaveModal(false);setSaveName("");
    showToast(`💾 Liste "${label}" sauvegardée`);
  }
  function confEqty(val,uv){
    if(isNaN(val)||val<0){showToast("⚠️ Quantité invalide");return;}
    const ni=db.items.map(item=>{
      if(item.id!==eqty.itemId)return item;
      const qs=[...item.quantities];
      if(eqty.qi==null)qs.push({qty:roundQ(val),unit:uv,source:"manuel"});
      else qs[eqty.qi]={...qs[eqty.qi],qty:roundQ(val),unit:uv};
      return{...item,quantities:qs};
    });
    const nd={...db,items:ni};setDb(nd);saveDB(nd);setEqty(null);
  }
  function delQty(){
    const ni=db.items.reduce((acc,item)=>{
      if(item.id!==eqty.itemId)return[...acc,item];
      const qs=item.quantities.filter((_,i)=>i!==eqty.qi);
      return qs.length?[...acc,{...item,quantities:qs}]:acc;
    },[]);
    const nd={...db,items:ni};setDb(nd);saveDB(nd);setEqty(null);
  }

  // ─── helpers widget ───────────────────────────────────

  // Groupement normalisé : toutes les catégories granulaires ramenées aux 16 standards
  const cats={};
  unc.forEach(item=>{
    const c=normalizeCat(item.category||getCat(item.name));
    if(!cats[c])cats[c]=[];
    cats[c].push(item);
  });
  // Tri dans l'ordre de CATEGORIES
  const catsSorted=Object.fromEntries(
    CATEGORIES.filter(c=>cats[c]).map(c=>[c,cats[c]])
  );

  return(

        <div style={{background:"linear-gradient(135deg,#2a1408,#4a2010)",borderRadius:12,padding:"11px 14px",marginBottom:12,display:"flex",alignItems:"center",gap:10,boxShadow:"0 4px 16px rgba(42,20,8,.35)"}}>
          <span style={{fontSize:20,flexShrink:0}}>✏️</span>

            onClick={()=>{

            onClick={()=>{

              if(newHist[idx]){newHist[idx]={...newHist[idx],items:JSON.parse(JSON.stringify(db.items)),count:db.items.length};}

              setDb(nd);saveDB(nd);showToast("💾 Liste modifiée et sauvegardée !");

        </div>

      {/* ═══ TOGGLE VUE LISTE / GRILLE ═══════════════════ */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:16,fontWeight:700,color:TXT}}>
            🛒 {total>0?`${unc.length} article${unc.length>1?"s":""}`:""}{pct>0?` · ${pct}%`:""}
          </div>
          {!db.editSession?.active&&(
            <button style={{background:"rgba(0,0,0,.06)",border:"none",borderRadius:8,padding:"5px 9px",cursor:"pointer",fontSize:12,color:TXT2,fontWeight:600,display:"flex",alignItems:"center",gap:4}} onClick={()=>setShowSavedLists(true)}>
              📋

        </div>
        <div style={{display:"flex",background:"rgba(0,0,0,.06)",borderRadius:10,padding:3,gap:3}}>
          <div onClick={()=>{setListView("liste");localStorage.setItem("ws_list_view","liste");}} style={{padding:"5px 11px",borderRadius:7,background:listView==="liste"?SURF:"transparent",boxShadow:listView==="liste"?"0 2px 8px rgba(0,0,0,.09)":"none",cursor:"pointer",fontSize:15,transition:"all .2s"}}>☰</div>
          <div onClick={()=>{setListView("grille");localStorage.setItem("ws_list_view","grille");}} style={{padding:"5px 11px",borderRadius:7,background:listView==="grille"?SURF:"transparent",boxShadow:listView==="grille"?"0 2px 8px rgba(0,0,0,.09)":"none",cursor:"pointer",fontSize:15,transition:"all .2s"}}>⊞</div>
          <div onClick={()=>{setListView("mini");localStorage.setItem("ws_list_view","mini");}} style={{padding:"5px 11px",borderRadius:7,background:listView==="mini"?SURF:"transparent",boxShadow:listView==="mini"?"0 2px 8px rgba(0,0,0,.09)":"none",cursor:"pointer",fontSize:13,transition:"all .2s",letterSpacing:-1}}>⋮⋮⋮</div>
        </div>

      {/* Add form */}

        {/* Ligne saisie + boutons */}

            onChange={e=>{setName(e.target.value);if(!e.target.value.trim())setShowQtyPanel(false);}}

function PageSavedLists({db,setDb,showToast,onClose}){
  const hist=db.shoppingHistory||[];
  const [tab,setTab]=useState("all"); // all | fav | shared
  const [editMode,setEditMode]=useState(false);
  const [pendingEdit,setPendingEdit]=useState(null); // idx en attente de confirmation
  const [openSess,setOpenSess]=useState(new Set());
  const [selected,setSelected]=useState({});
  const [qtys,setQtys]=useState({});
  const [confirmDel,setConfirmDel]=useState(null);

  // Filtrage par onglet
  const filtered=hist.map((s,i)=>({...s,_idx:i})).filter(s=>{
    if(tab==="fav") return s.favorite;
    if(tab==="shared") return s.shared;
    return true;
  });

  function toggleFav(idx,e){
    e.stopPropagation();
    const newHist=hist.map((s,i)=>i===idx?{...s,favorite:!s.favorite}:s);
    const nd={...db,shoppingHistory:newHist};setDb(nd);saveDB(nd);
    showToast(hist[idx].favorite?"💔 Retiré des favoris":"⭐ Ajouté aux favoris");
  }

  function toggleSess(i){const s=new Set(openSess);s.has(i)?s.delete(i):s.add(i);setOpenSess(s);}

  function toggleItem(si,name){
    setSelected(prev=>{
      const cur=new Set(prev[si]||[]);
      if(cur.has(name))cur.delete(name);else cur.add(name);
      return{...prev,[si]:cur};
    });
    setQtys(prev=>{
      if(!prev[si]||!prev[si][name]){
        const sess=hist[si];
        const item=(sess.items||[]).find(it=>it.name===name);
        const q=item?.quantities?.[0]||{qty:1,unit:""};
        return{...prev,[si]:{...(prev[si]||{}),[name]:{qty:q.qty,unit:q.unit}}};
      }
      return prev;
    });
  }

  function toggleAll(si){
    const sess=hist[si];
    const allNames=(sess.items||[]).map(it=>it.name);
    const cur=selected[si]||new Set();
    if(cur.size===allNames.length){
      setSelected(prev=>({...prev,[si]:new Set()}));
    } else {
      const newSel=new Set(allNames);
      setSelected(prev=>({...prev,[si]:newSel}));
      setQtys(prev=>{
        const qMap={};
        (sess.items||[]).forEach(it=>{const q=it.quantities?.[0]||{qty:1,unit:""};qMap[it.name]={qty:q.qty,unit:q.unit};});
        return{...prev,[si]:{...(prev[si]||{}),...qMap}};
      });
    }
  }

  function deleteSess(si){
    const newHist=hist.filter((_,i)=>i!==si);
    const nd={...db,shoppingHistory:newHist};setDb(nd);saveDB(nd);
    setConfirmDel(null);showToast("🗑️ Liste supprimée");
  }

  function countSelected(){
    return Object.values(selected).reduce((s,set)=>s+(set?.size||0),0);
  }

  function addSelected(){
    let ni=[...db.items],ph={...db.productHistory},added=0;
    Object.entries(selected).forEach(([siStr,nameSet])=>{
      const si=parseInt(siStr);
      const sess=hist[si];
      nameSet.forEach(name=>{
        const item=(sess.items||[]).find(it=>it.name===name);
        const catV=item?.category||getCat(name);
        const qEntry=qtys[si]?.[name]||{qty:1,unit:""};
        ni=mergeItem(ni,name,qEntry.qty,qEntry.unit,"historique",catV);
        if(!ph[name])ph[name]={count:0,category:catV,lastUnit:qEntry.unit};
        ph[name].count++;added++;
      });
    });
    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);
    showToast(`✅ ${added} article${added>1?"s":""} ajouté${added>1?"s":""}`);
    onClose();
  }

  // Activer le mode modification sur une liste
  function startEditSession(idx){
    const sess=hist[idx];
    // Backup des items courants + chargement des items de la liste
    const editSession={
      active:true,
      listIdx:idx,
      listDate:sess.date,
      backup:JSON.parse(JSON.stringify(db.items))
    };
    const newItems=JSON.parse(JSON.stringify(sess.items||[]));
    const nd={...db,items:newItems,editSession};
    setDb(nd);saveDB(nd);
    setConfirmEdit(null);setPendingEdit(null);setEditMode(false);
    showToast("✏️ Mode modification activé — "+sess.date);
    onClose();
  }

  const total=countSelected();
  const TAB_LABELS=[{id:"all",label:"Toutes",count:hist.length},{id:"fav",label:"⭐ Favoris",count:hist.filter(s=>s.favorite).length},{id:"shared",label:"🔗 Partagées",count:hist.filter(s=>s.shared).length}];

  return(
    <FullPage open={true} onClose={()=>{setEditMode(false);setPendingEdit(null);onClose();}}>
      {/* Header */}
      <div style={{background:"rgba(184,112,58,.92)",backdropFilter:"blur(10px)",padding:"12px 14px",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <button style={{background:"rgba(255,255,255,.2)",border:"none",borderRadius:10,width:34,height:34,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:16,flexShrink:0}} onClick={()=>{setEditMode(false);setPendingEdit(null);onClose();}}>←</button>
          <div style={{flex:1}}>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:700,color:"white"}}>📋 Listes sauvegardées</div>
          </div>

function guessRecipeEmoji(name){
  const n=(name||"").toLowerCase();
  if(/pâte|pasta|spaghetti|tagliatelle|linguine|rigatoni|lasagne/.test(n))return"🍝";
  if(/salade|taboulé/.test(n))return"🥗";
  if(/soupe|velouté|potage|bouillon/.test(n))return"🍜";
  if(/tarte|quiche|pizza/.test(n))return"🥧";
  if(/gâteau|cake|brownie|muffin|crêpe|clafoutis|moelleux/.test(n))return"🍰";
  if(/poulet|volaille|dinde/.test(n))return"🍗";
  if(/boeuf|steak|pot-au-feu|bourguignon/.test(n))return"🥩";
  if(/poisson|saumon|thon|cabillaud|dorade/.test(n))return"🐟";
  if(/riz|risotto|paella/.test(n))return"🍚";
  if(/burger|sandwich|wrap/.test(n))return"🍔";
  if(/curry|wok|sauté/.test(n))return"🥘";
  if(/oeuf|omelette|frittata/.test(n))return"🥚";
  if(/gratin|soufflé/.test(n))return"🫕";
  return"🍽️";
}

function estimateRecipeCost(recipe,priceDB,vp){
  if(!recipe?.ingredients?.length||!priceDB)return null;
  const base=recipe.persons||1,scale=(vp||base)/base;
  const toBase={g:1/1000,kg:1,ml:1/1000,cl:1/100,L:1,l:1,pièce:1,tranche:1,sachet:1,boîte:1,bouteille:1,paquet:1,botte:1};
  let total=0,matched=0;
  recipe.ingredients.forEach(ing=>{
    const key=ing.name.toLowerCase().trim();
    const entry=(priceDB||{})[key];
    if(!entry?.shops)return;
    const shops=Object.entries(entry.shops);
    if(!shops.length)return;
    const best=shops.sort((a,b)=>(a[1].priceRef?.value??a[1].price)-(b[1].priceRef?.value??b[1].price))[0][1];
    const ref=best.priceRef;
    const ingQty=parseFloat(ing.qty)*scale;
    if(ref&&ing.qty&&ing.unit&&toBase[ing.unit]!==undefined){
      total+=ingQty*toBase[ing.unit]*ref.value;matched++;
    } else if(!ing.qty){
      total+=best.price;matched++;
    }
  });
  if(!matched)return null;
  return{total:Math.round(total*100)/100,matched,outOf:recipe.ingredients.length};
}

function PageRecettes({db,setDb,showToast}){
  const [showEdit,setShowEdit]=useState(false);
  const [editIdx,setEditIdx]=useState(-1);

  const [dietFilters,setDietFilters]=useState(new Set());

  const [areaFilter,setAreaFilter]=useState("");
  function toggleFilter(setter,val){setter(prev=>{const s=new Set(prev);if(s.has(val))s.delete(val);else s.add(val);return s;});}
  const [showMealDB,setShowMealDB]=useState(false);

  const [mealdbResults,setMealdbResults]=useState([]);

  useEffect(()=>{

    clearTimeout(mdbTimer.current);
    mdbTimer.current=setTimeout(async()=>{
      setMealdbLoading(true);
      try{

        const localHits = searchLocalMealDB(search, 5);
        if(localHits.length > 0){
          setMealdbResults(localHits.map(m=>({
            id:"mdb_"+(m.id||Math.random()),

            area:m.origine||"",
            source:"mealdb",
            _localData:m
          })));
          setMealdbLoading(false);
          return;
        }
        // 2. Fallback : appel API en ligne si base locale vide ou aucun résultat
        const searchEN=translateSearchToEN(search);
        const r=await fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${encodeURIComponent(searchEN)}`);
        const d=await r.json();
        setMealdbResults((d.meals||[]).slice(0,5).map(m=>({id:"mdb_"+m.idMeal,mealdbId:m.idMeal,name:translateMealName(m.strMeal)||m.strMeal,nameEN:m.strMeal,photo:m.strMealThumb,category:CAT_FR[m.strCategory]||m.strCategory,area:AREA_FR[m.strArea]||m.strArea,source:"mealdb"})));
      }catch(_e){setMealdbResults([]);}
      setMealdbLoading(false);
    },300);
  },[search]);

  function saveRecipe(recipe){
    const recipes=[...db.recipes];
    if(editIdx>=0)recipes[editIdx]=recipe;else recipes.push(recipe);
    const nd={...db,recipes};setDb(nd);saveDB(nd);setShowEdit(false);showToast("🍽️ Recette enregistrée !");
  }
  function delRecipe(idx){
    if(!confirm("Supprimer cette recette ?"))return;
    const recipes=db.recipes.filter((_,i)=>i!==idx);
    const nd={...db,recipes};setDb(nd);saveDB(nd);setViewIdx(-1);showToast("🗑️ Recette supprimée");
  }
  function addToList(recipe,vp,haveIdxs){
    const base=recipe.persons||1,scale=vp/base;
    let ni=[...db.items],ph={...db.productHistory},added=0;
    recipe.ingredients.forEach((ing,i)=>{
      if(haveIdxs.has(i))return;
      const qN=ing.qty?roundQ(parseFloat(ing.qty)*scale):1,uv=ing.unit||"",n=ing.name;
      const ct=ph[n]?.category||getCat(n);
      ni=mergeItem(ni,n,qN,uv,recipe.name,ct);
      if(!ph[n])ph[n]={count:0,category:ct,lastUnit:uv};ph[n].count++;added++;
    });
    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);setViewIdx(-1);
    showToast(`✅ ${added} ingrédient${added>1?"s":""} ajouté${added>1?"s":""} à la liste`);
  }
  function importRecipe(recipe){
    const nd={...db,recipes:[...db.recipes,recipe]};
    setDb(nd);saveDB(nd);setShowMealDB(false);setShowAI(false);showToast("✅ Recette importée !");
  }
  async function importMealDBById(mealdbId){
    showToast("⏳ Import…");
    try{
      // 1. Vérifier si la recette est dans le cache local
      const localMatch = _localArray().find(m=>String(m.id)===String(mealdbId));
      if(localMatch){
        importRecipe(localMealToWisely(localMatch));
        return;
      }
      // 2. Fallback API en ligne
      const r=await fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${mealdbId}`);
      const d=await r.json();const m=d.meals?.[0];if(!m){showToast("❌ Introuvable");return;}
      const ings=[];
      for(let i=1;i<=20;i++){const name=m[`strIngredient${i}`];const measure=m[`strMeasure${i}`];if(name?.trim()){const{qty,unit}=parseMealDBMeasure(measure||"");ings.push({name:name.trim(),qty,unit});}}
      importRecipe({id:Date.now(),name:translateMealName(m.strMeal)||m.strMeal,source:"mealdb",mealdbId:m.idMeal,photo:m.strMealThumb,category:CAT_FR[m.strCategory]||m.strCategory,area:AREA_FR[m.strArea]||m.strArea,ingredients:ings,steps:m.strInstructions?.split(/\r\n|\n/).filter(s=>s.trim()).map(s=>s.trim())||[],date:new Date().toLocaleDateString("fr-FR")});
    }catch(_e){showToast("❌ Erreur import");}
  }

  function getTimeLabel(r){const d=parseInt(r.duration);if(isNaN(d))return null;if(d<=30)return"fast";if(d<=60)return"medium";return"slow";}

  function matchDiet(r){
    if(dietFilters.size===0)return true;
    const ings=(r.ingredients||[]).map(i=>i.name.toLowerCase()).join(" ");
    // Si la recette a des régimes pré-calculés depuis le JSON local, on les utilise en priorité
    const precomputed = r.diets || [];
    return [...dietFilters].some(f=>{
      if(precomputed.length>0){
        if(f==="🌱 Végétarien")return precomputed.includes("vegetarian")||precomputed.includes("végétarien");
        if(f==="🌿 Vegan")return precomputed.includes("vegan");
        if(f==="🚫🌾 Sans gluten")return precomputed.includes("gluten-free")||precomputed.includes("sans gluten");
        if(f==="🥛 Sans lactose")return precomputed.includes("dairy-free")||precomputed.includes("sans lactose");
        if(f==="🐟 Poisson")return precomputed.includes("fish")||precomputed.includes("seafood")||precomputed.includes("poisson");
        if(f==="🥩 Viande")return precomputed.includes("meat")||precomputed.includes("viande");
        if(f==="⚡ Rapide"){const d=parseInt(r.duration);return!isNaN(d)&&d<=30;}
      }
      // Fallback : détection par regex sur les ingrédients
      if(f==="🌱 Végétarien")return!/viande|boeuf|poulet|porc|veau|agneau|saucisse|jambon|lard|lardon|thon|saumon|crevette|moule/.test(ings);
      if(f==="🌿 Vegan")return!/viande|boeuf|poulet|porc|veau|agneau|saucisse|jambon|lard|lardon|thon|saumon|crevette|moule|lait|oeuf|beurre|crème|fromage|yaourt|miel/.test(ings);
      if(f==="🚫🌾 Sans gluten")return!/farine|pain|pâte|blé|seigle|orge|brioche|biscuit/.test(ings);
      if(f==="🥛 Sans lactose")return!/lait|beurre|crème|fromage|yaourt/.test(ings);
      if(f==="🐟 Poisson")return/poisson|saumon|thon|cabillaud|dorade|crevette|moule/.test(ings);
      if(f==="🥩 Viande")return/viande|boeuf|poulet|porc|veau|agneau|saucisse|jambon|lard/.test(ings);
      if(f==="⚡ Rapide"){const d=parseInt(r.duration);return!isNaN(d)&&d<=30;}
      return true;
    });
  }

  const likedIds=new Set(db.likedRecipes||[]);
  const folders=db.folders||[];
  const activeFiltersCount=[...diffFilters,...typeFilters,...timeFilters,...dietFilters].length+(areaFilter?1:0);

  function getFiltered(){
    let list=db.recipes;
    if(tab==="likes") list=list.filter(r=>likedIds.has(r.id));
    else if(tab==="dossiers"){
      if(activeFolder!==null){
        const f=folders.find(f=>f.id===activeFolder);

      } else list=[];

    if(search.trim()) list=list.filter(r=>r.name.toLowerCase().includes(search.toLowerCase())||
      (r.ingredients||[]).some(i=>i.name.toLowerCase().includes(search.toLowerCase())));

    if(typeFilters.size) list=list.filter(r=>typeFilters.has(r.mealType));
    if(timeFilters.size) list=list.filter(r=>timeFilters.has(getTimeLabel(r)));
    if(areaFilter) list=list.filter(r=>(r.area||"").toLowerCase().includes(areaFilter.toLowerCase()));
    return list.filter(matchDiet);
  }
  const filtered=getFiltered();

  function RecipeCard({r}){
    const realIdx=db.recipes.indexOf(r);
    const cost=estimateRecipeCost(r,db.priceDB,r.persons);
    const isLiked=likedIds.has(r.id);
    const diffLabel=RECIPE_DIFFICULTY.find(d=>d.id===r.difficulty)?.label;

    // ── VUE LISTE ──────────────────────────────────────────────
    if(recipeView==="liste"){
      return(
        <div style={{...card,padding:"10px 12px",overflow:"hidden",cursor:"pointer",marginBottom:7,background:"rgba(255,255,255,.92)",display:"flex",alignItems:"center",gap:10}} onClick={()=>setViewIdx(realIdx)}>
          <div style={{width:46,height:46,borderRadius:10,background:`linear-gradient(135deg,${CREAM2},${BDR})`,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0}}>
            {r.photo?<img src={r.photo} alt={r.name} style={{width:"100%",height:"100%",objectFit:"cover",borderRadius:10}}/>:<EmojiImg emoji={guessRecipeEmoji(r.name)} size={24}/>}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:14,color:CARAMEL,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}</div>
            <div style={{display:"flex",gap:5,marginTop:3,flexWrap:"wrap",alignItems:"center"}}>
              {r.duration&&<span style={{fontSize:10,color:TXT3,fontWeight:600}}>⏱️ {r.duration}</span>}
              {r.persons&&<span style={{fontSize:10,color:TXT3,fontWeight:600}}>👥 {r.persons}</span>}
              <span style={{fontSize:10,color:TXT3,fontWeight:600}}>🥗 {r.ingredients.length}</span>
              {diffLabel&&<span style={{fontSize:10,color:TXT3,fontWeight:600}}>{diffLabel}</span>}
              {cost&&<span style={{fontSize:10,color:SUC,fontWeight:700}}>~{cost.total.toFixed(2)}€</span>}
              {r.source==="mealdb"&&<span style={{fontSize:9,background:"rgba(0,0,0,.08)",padding:"1px 5px",borderRadius:6,color:TXT3,fontWeight:700}}>🌐</span>}
              {r.source==="ai"&&<span style={{fontSize:9,background:"rgba(184,112,58,.12)",padding:"1px 5px",borderRadius:6,color:CARAMEL2,fontWeight:700}}>🤖</span>}
            </div>
          </div>
          {isLiked&&<span style={{fontSize:13,flexShrink:0}}>❤️</span>}
          <span style={{color:TXT3,fontSize:16,flexShrink:0}}>›</span>
        </div>
      );
    }

    // ── VUE GRILLE 2 COLONNES ──────────────────────────────────
    if(recipeView==="grille"){
      return(
        <div style={{...card,padding:0,overflow:"hidden",cursor:"pointer",background:"rgba(255,255,255,.92)"}} onClick={()=>setViewIdx(realIdx)}>
          <div style={{height:108,background:`linear-gradient(135deg,${CREAM2} 0%,${BDR} 100%)`,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",position:"relative"}}>
            {r.photo?<img src={r.photo} alt={r.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
              :<div style={{filter:"drop-shadow(0 3px 10px rgba(0,0,0,.08))"}}><EmojiImg emoji={guessRecipeEmoji(r.name)} size={48}/></div>}
            {r.source==="mealdb"&&<div style={{position:"absolute",top:6,left:6,background:"rgba(0,0,0,.42)",color:"white",fontSize:8,borderRadius:6,padding:"2px 6px",fontWeight:700,backdropFilter:"blur(4px)"}}>🌐</div>}
            {r.source==="ai"&&<div style={{position:"absolute",top:6,left:6,background:"rgba(184,112,58,.7)",color:"white",fontSize:8,borderRadius:6,padding:"2px 6px",fontWeight:700,backdropFilter:"blur(4px)"}}>🤖</div>}
            {isLiked&&<div style={{position:"absolute",top:6,right:6,fontSize:13}}>❤️</div>}
            {r.stars>0&&<div style={{position:"absolute",bottom:5,left:6,background:"rgba(0,0,0,.35)",color:"white",fontSize:8,borderRadius:6,padding:"1px 6px",backdropFilter:"blur(4px)"}}>{["","⭐","⭐⭐","⭐⭐⭐","⭐⭐⭐⭐","⭐⭐⭐⭐⭐"][r.stars]}</div>}
          </div>
          <div style={{padding:"8px 10px 10px"}}>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:12,marginBottom:5,color:CARAMEL,fontWeight:700,lineHeight:1.25,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{r.name}</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
              {r.duration&&<span style={{fontSize:9,background:CREAM2,padding:"2px 6px",borderRadius:20,color:TXT2,fontWeight:600}}>⏱️ {r.duration}</span>}
              {r.persons&&<span style={{fontSize:9,background:CREAM2,padding:"2px 6px",borderRadius:20,color:TXT2,fontWeight:600}}>👥 {r.persons}</span>}
              <span style={{fontSize:9,background:CREAM2,padding:"2px 6px",borderRadius:20,color:TXT2,fontWeight:600}}>🥗 {r.ingredients.length}</span>
              {diffLabel&&<span style={{fontSize:9,background:CREAM2,padding:"2px 6px",borderRadius:20,color:TXT2,fontWeight:600}}>{diffLabel}</span>}
              {cost&&<span style={{fontSize:9,background:"rgba(90,138,58,.1)",padding:"2px 6px",borderRadius:20,color:SUC,fontWeight:700}}>~{cost.total.toFixed(2)}€</span>}
            </div>
          </div>
        </div>
      );
    }

    // ── VUE GRANDE CARTE (1 colonne, photo large) ──────────────
    return(
      <div style={{...card,padding:0,overflow:"hidden",cursor:"pointer",background:"rgba(255,255,255,.92)"}} onClick={()=>setViewIdx(realIdx)}>
        <div style={{height:170,background:`linear-gradient(135deg,${CREAM2} 0%,${BDR} 100%)`,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",position:"relative"}}>
          {r.photo?<img src={r.photo} alt={r.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
            :<div style={{filter:"drop-shadow(0 4px 16px rgba(0,0,0,.1))"}}><EmojiImg emoji={guessRecipeEmoji(r.name)} size={72}/></div>}
          {/* Overlay gradient bas */}
          <div style={{position:"absolute",inset:0,background:"linear-gradient(0deg,rgba(42,31,14,.65) 0%,transparent 55%)"}}/>
          {/* Badges top */}
          <div style={{position:"absolute",top:8,left:8,display:"flex",gap:5}}>
            {r.source==="mealdb"&&<div style={{background:"rgba(0,0,0,.44)",color:"white",fontSize:9,borderRadius:7,padding:"2px 8px",fontWeight:700,backdropFilter:"blur(4px)"}}>🌐 TheMealDB</div>}
            {r.source==="ai"&&<div style={{background:"rgba(184,112,58,.7)",color:"white",fontSize:9,borderRadius:7,padding:"2px 8px",fontWeight:700,backdropFilter:"blur(4px)"}}>🤖 IA</div>}
            {r.stars>0&&<div style={{background:"rgba(0,0,0,.35)",color:"white",fontSize:9,borderRadius:7,padding:"2px 8px",backdropFilter:"blur(4px)"}}>{["","⭐","⭐⭐","⭐⭐⭐","⭐⭐⭐⭐","⭐⭐⭐⭐⭐"][r.stars]}</div>}
          </div>
          {isLiked&&<div style={{position:"absolute",top:8,right:8,fontSize:16}}>❤️</div>}
          {/* Titre dans la photo */}
          <div style={{position:"absolute",bottom:10,left:12,right:12}}>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:17,fontWeight:900,color:"white",lineHeight:1.2,marginBottom:5,textShadow:"0 1px 4px rgba(0,0,0,.4)"}}>{r.name}</div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
              {r.duration&&<span style={{fontSize:10,background:"rgba(255,255,255,.2)",color:"white",padding:"2px 8px",borderRadius:20,fontWeight:700,backdropFilter:"blur(4px)"}}>⏱️ {r.duration}</span>}
              {r.persons&&<span style={{fontSize:10,background:"rgba(255,255,255,.2)",color:"white",padding:"2px 8px",borderRadius:20,fontWeight:700,backdropFilter:"blur(4px)"}}>👥 {r.persons} pers.</span>}
              {diffLabel&&<span style={{fontSize:10,background:"rgba(255,255,255,.2)",color:"white",padding:"2px 8px",borderRadius:20,fontWeight:700,backdropFilter:"blur(4px)"}}>{diffLabel}</span>}
            </div>
          </div>
        </div>
        <div style={{padding:"10px 13px 12px"}}>
          <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
            <span style={{fontSize:11,background:CREAM2,padding:"3px 9px",borderRadius:20,color:TXT2,fontWeight:600}}>🥗 {r.ingredients.length} ingr.</span>
            {r.mealType&&<span style={{fontSize:11,background:CREAM2,padding:"3px 9px",borderRadius:20,color:TXT2,fontWeight:600}}>{RECIPE_MEAL_TYPE.find(t=>t.id===r.mealType)?.label}</span>}
            {r.area&&<span style={{fontSize:11,background:CREAM2,padding:"3px 9px",borderRadius:20,color:TXT2,fontWeight:600}}>{r.area}</span>}
            {cost&&<span style={{fontSize:11,background:"rgba(90,138,58,.1)",padding:"3px 9px",borderRadius:20,color:SUC,fontWeight:700}}>~{cost.total.toFixed(2)}€</span>}
            {r.note&&<span style={{fontSize:11,background:CREAM2,padding:"3px 9px",borderRadius:20,color:CARAMEL2,fontWeight:600}}>📝 Note</span>}
            {r.lastCooked&&<span style={{fontSize:11,background:CREAM2,padding:"3px 9px",borderRadius:20,color:TXT3,fontWeight:600}}>📅 {r.lastCooked}</span>}
          </div>
        </div>
      </div>
    );
  }

  // ─── helpers tabs ───────────────────────────────────────
  const [favTab,setFavTab]=useState(false); // true = favoris, false = toutes

  return(
    <div style={{padding:14,paddingBottom:90}}>

      {/* ─── HEADER ─── */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:22,color:TXT,fontWeight:900}}>Mes recettes</div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <div style={{display:"flex",background:"rgba(0,0,0,.06)",borderRadius:10,padding:3,gap:2}}>
            <div onClick={()=>{setRecipeView("liste");localStorage.setItem("ws_recipe_view","liste");}} style={{padding:"5px 10px",borderRadius:7,background:recipeView==="liste"?SURF:"transparent",boxShadow:recipeView==="liste"?"0 2px 8px rgba(0,0,0,.09)":"none",cursor:"pointer",fontSize:14,transition:"all .2s"}}>☰</div>
            <div onClick={()=>{setRecipeView("grille");localStorage.setItem("ws_recipe_view","grille");}} style={{padding:"5px 10px",borderRadius:7,background:recipeView==="grille"?SURF:"transparent",boxShadow:recipeView==="grille"?"0 2px 8px rgba(0,0,0,.09)":"none",cursor:"pointer",fontSize:14,transition:"all .2s"}}>⊞</div>
            <div onClick={()=>{setRecipeView("grande");localStorage.setItem("ws_recipe_view","grande");}} style={{padding:"5px 10px",borderRadius:7,background:recipeView==="grande"?SURF:"transparent",boxShadow:recipeView==="grande"?"0 2px 8px rgba(0,0,0,.09)":"none",cursor:"pointer",fontSize:13,transition:"all .2s"}}>▬</div>
          </div>
          <button style={{...btn("acc"),fontSize:12,padding:"8px 13px"}} onClick={()=>{setEditIdx(-1);setShowEdit(true);}}>+ Créer</button>
        </div>
      </div>

      {/* ─── RECHERCHE ─── */}
      <div style={{position:"relative",marginBottom:10}}>
        <input style={{...inp,paddingLeft:34}} placeholder="Nom, ingrédient, cuisine…" value={search} onChange={e=>setSearch(e.target.value)}/>
        <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",fontSize:14,pointerEvents:"none"}}>🔍</span>
        {search&&<span style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",fontSize:14,cursor:"pointer",color:TXT3}} onClick={()=>setSearch("")}>✕</span>}
      </div>

      {/* ─── RÉSULTATS RECHERCHE : mes recettes en premier, MealDB ensuite ─── */}
      {search.trim().length>=2&&(
        <>
          {/* Mes recettes filtrées */}
          {filtered.length>0&&(
            <div style={{marginBottom:10}}>
              <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:1,color:TXT2,marginBottom:8,display:"flex",alignItems:"center",gap:7}}>
                Dans mes recettes <span style={{fontSize:9,background:CREAM2,color:TXT3,padding:"1px 7px",borderRadius:10,fontWeight:700}}>{filtered.length}</span>
                <div style={{flex:1,height:1,background:BDR}}/>
              </div>
              {filtered.slice(0,3).map(r=><RecipeCard key={r.id||db.recipes.indexOf(r)} r={r}/>)}
            </div>
          )}
          {/* MealDB en second */}
          {(mealdbResults.length>0||mealdbLoading)&&(
            <div style={{...card,background:"rgba(255,255,255,.9)",marginBottom:10,padding:"10px 13px"}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
                <span style={{fontSize:13}}>🌐</span>
                <div style={{fontSize:11,fontWeight:700,color:CARAMEL}}>Dans TheMealDB</div>
                {mealdbLoading&&<div style={{fontSize:10,color:TXT3,marginLeft:4}}>Recherche…</div>}
                {!mealdbLoading&&mealdbResults.length>0&&<span style={{fontSize:9,background:CREAM2,color:TXT3,padding:"1px 7px",borderRadius:10,fontWeight:700,marginLeft:2}}>{mealdbResults.length}</span>}
              </div>
              {mealdbResults.map(r=>(
                <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:`1px solid ${BDR}`,cursor:"pointer"}} onClick={()=>{
                  if(r._localData){const wrecipe=localMealToWisely(r._localData);setShowMealDB({...r,_preloaded:wrecipe});}
                  else{setShowMealDB(r);}
                }}>
                  {r.photo
                    ?<img src={r.photo+"/preview"} alt="" style={{width:38,height:38,objectFit:"cover",borderRadius:8,flexShrink:0}} onError={e=>e.target.style.display="none"}/>
                    :<div style={{width:38,height:38,borderRadius:8,background:`linear-gradient(135deg,${CREAM2},${BDR})`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><EmojiImg emoji={guessRecipeEmoji(r.name||"")} size={20}/></div>
                  }
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:700,color:TXT,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}</div>
                    <div style={{fontSize:9,color:TXT3}}>{r.category}{r.area?" · "+r.area:""}</div>
                  </div>
                  <button style={{...btn("acc"),fontSize:10,padding:"4px 8px",flexShrink:0}} onClick={e=>{e.stopPropagation();
                    if(r._localData){const wrecipe=localMealToWisely(r._localData);setShowMealDB({...r,_preloaded:wrecipe});}
                    else{setShowMealDB(r);}
                  }}>Voir</button>
                </div>
              ))}
              {mealdbResults.length===5&&(
                <div style={{fontSize:10,color:CARAMEL2,fontWeight:700,textAlign:"center",marginTop:8,cursor:"pointer"}} onClick={()=>setShowMealDB(true)}>
                  Voir tous les résultats dans TheMealDB →
                </div>
              )}
            </div>
          )}
          {filtered.length===0&&!mealdbLoading&&mealdbResults.length===0&&(
            <div style={{textAlign:"center",padding:"32px 20px",color:TXT3,fontSize:13}}>Aucun résultat pour « {search} »</div>
          )}
        </>
      )}

      {/* ─── CONTENU PRINCIPAL (hors recherche) ─── */}
      {!search.trim()&&(
        <>
          {/* Filtres rapides scrollables avec boutons navigation */}
          <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:8}}>
            <button onClick={()=>scrollFilters(-1)} style={{background:"rgba(255,255,255,.85)",border:`1px solid ${BDR}`,borderRadius:20,width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,fontSize:12,color:TXT2}}>◀</button>
            <div ref={filterScrollRef} style={{display:"flex",gap:5,overflowX:"auto",paddingBottom:2,scrollbarWidth:"none",WebkitOverflowScrolling:"touch",flex:1}}>
              {["🌱 Végétarien","🌿 Vegan","⚡ Rapide","🐟 Poisson","🥩 Viande","🚫🌾 Sans gluten","🥛 Sans lactose"].map(t=>(
                <div key={t} style={{flexShrink:0,padding:"5px 11px",borderRadius:20,fontSize:11,fontWeight:700,background:dietFilters.has(t)?CARAMEL:"rgba(255,255,255,.75)",color:dietFilters.has(t)?"white":TXT2,cursor:"pointer",border:`1px solid ${dietFilters.has(t)?CARAMEL:BDR}`,whiteSpace:"nowrap",transition:"all .15s"}} onClick={()=>toggleFilter(setDietFilters,t)}>
                  {t}
                </div>
              ))}
              <div style={{flexShrink:0,padding:"5px 11px",borderRadius:20,fontSize:11,fontWeight:700,background:showFilters||activeFiltersCount>0?CARAMEL:"rgba(255,255,255,.75)",color:showFilters||activeFiltersCount>0?"white":TXT2,cursor:"pointer",border:`1px solid ${showFilters||activeFiltersCount>0?CARAMEL:BDR}`,whiteSpace:"nowrap"}} onClick={()=>setShowFilters(f=>!f)}>
                🎚️{activeFiltersCount>0?` (${activeFiltersCount})`:""}
              </div>
            </div>
            <button onClick={()=>scrollFilters(1)} style={{background:"rgba(255,255,255,.85)",border:`1px solid ${BDR}`,borderRadius:20,width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,fontSize:12,color:TXT2}}>▶</button>
          </div>


          {/* Panel filtres avancés */}
          {showFilters&&(
            <div style={{...card,background:"rgba(255,255,255,.94)",marginBottom:10,padding:"12px 14px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <div style={{fontSize:12,fontWeight:800,color:TXT}}>🎚️ Filtres avancés</div>
                <div style={{display:"flex",gap:5}}>
                  {activeFiltersCount>0&&<button style={{...btn("gh"),fontSize:10,padding:"4px 8px",color:DNG}} onClick={()=>{setDiffFilters(new Set());setTypeFilters(new Set());setTimeFilters(new Set());setDietFilters(new Set());setAreaFilter("");}}>✕ Effacer</button>}
                  <button style={{...btn("gh"),fontSize:10,padding:"4px 8px"}} onClick={()=>setShowFilters(false)}>Fermer</button>
                </div>
              </div>
              <div style={{marginBottom:10}}>
                <div style={{fontSize:10,fontWeight:800,color:TXT2,marginBottom:6,textTransform:"uppercase",letterSpacing:.6}}>Difficulté</div>
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  {RECIPE_DIFFICULTY.filter(d=>d.id).map(d=>(
                    <span key={d.id} style={{fontSize:11,padding:"4px 10px",borderRadius:16,background:diffFilters.has(d.id)?CARAMEL2:CREAM2,color:diffFilters.has(d.id)?"white":TXT2,border:`1px solid ${diffFilters.has(d.id)?CARAMEL2:BDR}`,cursor:"pointer",fontWeight:600}} onClick={()=>toggleFilter(setDiffFilters,d.id)}>{d.label}</span>
                  ))}
                </div>
              </div>
              <div style={{marginBottom:10}}>
                <div style={{fontSize:10,fontWeight:800,color:TXT2,marginBottom:6,textTransform:"uppercase",letterSpacing:.6}}>Temps</div>
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  {[{id:"fast",label:"⚡ <30min"},{id:"medium",label:"🕐 30-60min"},{id:"slow",label:"🐢 >1h"}].map(t=>(
                    <span key={t.id} style={{fontSize:11,padding:"4px 10px",borderRadius:16,background:timeFilters.has(t.id)?CARAMEL2:CREAM2,color:timeFilters.has(t.id)?"white":TXT2,border:`1px solid ${timeFilters.has(t.id)?CARAMEL2:BDR}`,cursor:"pointer",fontWeight:600}} onClick={()=>toggleFilter(setTimeFilters,t.id)}>{t.label}</span>
                  ))}
                </div>
              </div>
              <div style={{marginBottom:db.recipes.some(r=>r.area)?10:0}}>
                <div style={{fontSize:10,fontWeight:800,color:TXT2,marginBottom:6,textTransform:"uppercase",letterSpacing:.6}}>Type de repas</div>
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  {RECIPE_MEAL_TYPE.filter(t=>t.id).map(t=>(
                    <span key={t.id} style={{fontSize:11,padding:"4px 10px",borderRadius:16,background:typeFilters.has(t.id)?CARAMEL2:CREAM2,color:typeFilters.has(t.id)?"white":TXT2,border:`1px solid ${typeFilters.has(t.id)?CARAMEL2:BDR}`,cursor:"pointer",fontWeight:600}} onClick={()=>toggleFilter(setTypeFilters,t.id)}>{t.label}</span>
                  ))}
                </div>
              </div>
              {db.recipes.some(r=>r.area)&&(
                <div>
                  <div style={{fontSize:10,fontWeight:800,color:TXT2,marginBottom:6,textTransform:"uppercase",letterSpacing:.6}}>Origine</div>
                  <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                    {[...new Set(db.recipes.map(r=>r.area).filter(Boolean))].sort().map(a=>(
                      <span key={a} style={{fontSize:11,padding:"4px 10px",borderRadius:16,background:areaFilter===a?CARAMEL2:CREAM2,color:areaFilter===a?"white":TXT2,border:`1px solid ${areaFilter===a?CARAMEL2:BDR}`,cursor:"pointer",fontWeight:600}} onClick={()=>setAreaFilter(areaFilter===a?"":a)}>{a}</span>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Tabs Toutes / Favoris / Thèmes */}
          <div style={{display:"flex",background:"rgba(255,255,255,.6)",borderRadius:12,padding:3,marginBottom:10,border:"1px solid rgba(255,255,255,.5)"}}>
            {[
              {id:"recettes",label:"🍽️ Toutes"},
              {id:"likes",label:`❤️ Favoris${likedIds.size>0?" ("+likedIds.size+")":""}`},
              {id:"dossiers",label:`🏷️ Thèmes${folders.length>0?" ("+folders.length+")":""}` },
            ].map(t=>(
              <div key={t.id} style={{flex:1,padding:"7px 4px",textAlign:"center",fontSize:11,fontWeight:700,borderRadius:9,background:tab===t.id?"white":CREAM2,color:tab===t.id?CARAMEL:TXT2,cursor:"pointer",transition:"all .15s",boxShadow:tab===t.id?"0 1px 4px rgba(0,0,0,.08)":"none",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}} onClick={()=>{setTab(t.id);setActiveFolder(null);}}>
                {t.label}
              </div>
            ))}
          </div>

          {/* Sous-navigation thèmes */}

      {viewIdx>=0&&db.recipes[viewIdx]&&<RecipeView
        recipe={db.recipes[viewIdx]} priceDB={db.priceDB} db={db} setDb={d=>{setDb(d);saveDB(d);}}
