      setDb(nd);saveDB(nd);setShowPicker(null);
      showToast("🤖 "+recipe.name+" créé et planifié !");
    }catch(e){showToast("❌ Erreur IA");}
    setCalAILoading(false);
  }

  function setMeal(dk,slot,recipeId){
    const nd={...db,calendar:{...calendar,[dk]:{...(calendar[dk]||{}),[slot]:recipeId}}};
    setDb(nd);saveDB(nd);setShowPicker(null);
    showToast("📅 Repas planifié");
  }
  function removeMeal(dk,slot){
    const nd={...db,calendar:{...calendar,[dk]:{...(calendar[dk]||{}),[slot]:null}}};
    setDb(nd);saveDB(nd);setShowActions(null);
    showToast("🗑️ Repas retiré");
  }
  function generateShoppingList(){
    // Flux guidé : collecter les recettes à venir et lancer le wizard
    const todayD=new Date();todayD.setHours(0,0,0,0);
    const upcoming=[];
    Object.entries(calendar).forEach(([dk,slots])=>{
      const d=new Date(dk);d.setHours(0,0,0,0);
      if(d<todayD)return;
      MEAL_SLOTS.forEach(slot=>{
        const recipeId=slots[slot];
        if(!recipeId)return;
        const recipe=(db.recipes||[]).find(r=>String(r.id)===String(recipeId));
        if(recipe)upcoming.push({dk,slot,recipe});
      });
    });
    if(!upcoming.length){showToast("⚠️ Aucun repas planifié à venir");return;}
    // Trier par date
    upcoming.sort((a,b)=>a.dk.localeCompare(b.dk)||MEAL_SLOTS.indexOf(a.slot)-MEAL_SLOTS.indexOf(b.slot));
    setWizardQueue(upcoming);
    setWizardStep(0);
    setWizardItems([...db.items]);
    setShowWizard(true);
  }

  function finishWizardStep(recipe,vp,haveIdxs,items){
    const base=recipe.persons||1,scale=vp/base;
    let ni=[...items];
    (recipe.ingredients||[]).forEach((ing,i)=>{
      if(haveIdxs.has(i))return;
      const qN=ing.qty?roundQ(parseFloat(ing.qty)*scale):1;
      ni=mergeItem(ni,ing.name,qN,ing.unit||"","recette",guessCat(ing.name));
    });
    return ni;
  }
  function antiGaspiSuggestions(){
    if(!redItems.length||!(db.recipes||[]).length)return[];
    const redNames=redItems.map(i=>i.name.toLowerCase());
    return(db.recipes||[]).filter(r=>r.ingredients?.some(ing=>redNames.some(rn=>rn.includes(ing.name?.toLowerCase())||ing.name?.toLowerCase()?.includes(rn)))).slice(0,3);
  }
  const suggestions=antiGaspiSuggestions();

  return(
    <div style={{padding:14,paddingBottom:90}}>
      <div style={{...card,background:"rgba(255,255,255,.88)",padding:"14px 16px",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:20,color:TXT}}>📅 Planning repas</div>
          <button style={{...btn("acc"),fontSize:11,padding:"7px 12px"}} onClick={generateShoppingList}>🛒 Générer la liste</button>
        </div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <button style={{...btn("gh"),padding:"6px 14px",fontSize:18}} onClick={()=>setWeekOffset(w=>w-1)}>‹</button>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:13,fontWeight:700,color:TXT}}>
              {weekOffset===0?"Cette semaine":weekOffset===1?"Semaine prochaine":weekOffset===-1?"Semaine dernière":`Semaine du ${weekDates[0].getDate()}/${weekDates[0].getMonth()+1}`}
            </div>
            <div style={{fontSize:10,color:TXT3}}>{weekDates[0].getDate()}/{weekDates[0].getMonth()+1} — {weekDates[6].getDate()}/{weekDates[6].getMonth()+1}/{weekDates[6].getFullYear()}</div>
          </div>
          <button style={{...btn("gh"),padding:"6px 14px",fontSize:18}} onClick={()=>setWeekOffset(w=>w+1)}>›</button>
        </div>
        {weekOffset!==0&&<button style={{...btn("out"),width:"100%",justifyContent:"center",fontSize:11,marginTop:8,padding:"5px"}} onClick={()=>setWeekOffset(0)}>Retour à cette semaine</button>}
      </div>

      {redItems.length>0&&suggestions.length>0&&(
        <div style={{background:"rgba(212,96,74,.08)",border:"1.5px solid rgba(212,96,74,.25)",borderRadius:12,padding:"10px 14px",marginBottom:10}}>
          <div style={{fontSize:12,fontWeight:700,color:DNG,marginBottom:6}}>⚠️ Produits à utiliser vite — recettes suggérées :</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {suggestions.map(r=>(
              <div key={r.id} style={{fontSize:11,background:SURF,border:`1px solid ${BDR}`,borderRadius:20,padding:"4px 10px",color:TXT2,cursor:"pointer",fontWeight:600}} onClick={()=>{
                let placed=false;
                for(const d of weekDates){
                  for(const slot of MEAL_SLOTS){
                    const dk=dateKey(d);
                    if(!(calendar[dk]?.[slot])){setMeal(dk,slot,r.id);placed=true;break;}
                  }
                  if(placed)break;
                }
                if(!placed)showToast("⚠️ Semaine complète");
              }}>{guessRecipeEmoji(r.name)} {r.name}</div>
            ))}
          </div>
        </div>
      )}

      {weekDates.map((d,di)=>{
        const dk=dateKey(d);
        const isToday=dk===todayKey;
        const isPast=new Date(dk)<new Date(new Date().setHours(0,0,0,0));
        return(
          <div key={dk} style={{...card,background:isToday?"rgba(200,132,90,.08)":isPast?"rgba(255,255,255,.6)":"rgba(255,255,255,.88)",marginBottom:6,border:isToday?`1.5px solid ${CARAMEL2}`:`1px solid ${BDR}`,opacity:isPast&&!isToday?.75:1}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <div style={{width:36,height:36,borderRadius:10,background:isToday?`linear-gradient(135deg,${CARAMEL},${CARAMEL2})`:"rgba(200,132,90,.1)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <div style={{fontSize:8,fontWeight:800,color:isToday?"rgba(255,255,255,.8)":TXT3,letterSpacing:.5}}>{DAY_NAMES[di]}</div>
                <div style={{fontSize:15,fontWeight:900,color:isToday?"white":TXT,fontFamily:"'Fraunces',serif",lineHeight:1}}>{d.getDate()}</div>
              </div>
              <div style={{fontSize:12,fontWeight:700,color:isToday?CARAMEL:TXT2}}>{DAY_NAMES_FULL[di]}{isToday&&<span style={{fontSize:10,color:CARAMEL2,marginLeft:6,fontWeight:600}}>· Aujourd'hui</span>}</div>
            </div>
            <div style={{display:"flex",gap:6}}>
              {MEAL_SLOTS.map(slot=>{
                const recipeId=calendar[dk]?.[slot];
                const recipe=recipeId?(db.recipes||[]).find(r=>String(r.id)===String(recipeId)):null;
                return(
                  <div key={slot} style={{flex:1,borderRadius:10,border:`1.5px ${recipe?"solid":"dashed"} ${recipe?CARAMEL2:BDR}`,background:recipe?"rgba(200,132,90,.06)":CREAM,padding:"7px 8px",cursor:"pointer",minHeight:54,display:"flex",flexDirection:"column",justifyContent:"center"}} onClick={()=>recipe?setShowActions({dk,slot,recipe}):setShowPicker({dk,slot})}>
                    <div style={{fontSize:9,fontWeight:700,color:TXT3,marginBottom:3}}>{MEAL_LABELS[slot]}</div>
                    {recipe?(
                      <div style={{display:"flex",alignItems:"center",gap:5}}>
                        <span style={{fontSize:14,flexShrink:0}}>{guessRecipeEmoji(recipe.name)}</span>
                        <div style={{fontSize:10,fontWeight:700,color:TXT,lineHeight:1.2}}>{recipe.name}</div>
                      </div>
                    ):(
                      <div style={{fontSize:10,color:TXT3,textAlign:"center"}}>+ Ajouter</div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
      <div style={{textAlign:"center",padding:"8px 0 4px",fontSize:10,color:TXT3}}>Appuyez sur un créneau pour assigner une recette</div>

      {showPicker&&(
        <Modal open onClose={()=>{setShowPicker(null);setFreeText("");}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:17,marginBottom:4,color:TXT}}>Que planifier ?</div>
          <div style={{fontSize:11,color:TXT3,marginBottom:12}}>
            {DAY_NAMES_FULL[new Date(showPicker.dk).getDay()===0?6:new Date(showPicker.dk).getDay()-1]} · {MEAL_LABELS[showPicker.slot]}
          </div>
          {/* Tabs 3 modes */}
          <div style={{display:"flex",gap:6,marginBottom:12}}>
            {[{id:"list",label:"📖 Mes recettes"},{id:"ai",label:"🤖 Créer via IA"},{id:"free",label:"✏️ Nom libre"}].map(m=>(
              <div key={m.id} style={{flex:1,textAlign:"center",padding:"7px 4px",borderRadius:10,fontSize:10,fontWeight:700,cursor:"pointer",background:(showPicker.mode||"list")===m.id?CARAMEL:CREAM2,color:(showPicker.mode||"list")===m.id?"white":TXT2,border:`1px solid ${(showPicker.mode||"list")===m.id?CARAMEL:BDR}`}} onClick={()=>setShowPicker(p=>({...p,mode:m.id}))}>{m.label}</div>
            ))}
          </div>
          {(showPicker.mode||"list")==="list"&&(
            !(db.recipes||[]).length?(
              <div style={{textAlign:"center",padding:"20px",color:TXT3,fontSize:12}}>
                Aucune recette — créez d'abord vos recettes
                <button style={{...btn("out"),width:"100%",justifyContent:"center",marginTop:10,fontSize:11}} onClick={()=>{setShowPicker(null);goToRecettes();}}>→ Aller aux recettes</button>
              </div>
            ):(
              <div style={{maxHeight:360,overflowY:"auto"}}>
                {suggestions.length>0&&(
                  <div style={{marginBottom:8}}>
                    <div style={{fontSize:10,fontWeight:700,color:DNG,marginBottom:5}}>⚠️ Utilise des produits à finir :</div>
                    {suggestions.map(r=>(
                      <div key={"s"+r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 8px",borderRadius:10,background:"rgba(212,96,74,.06)",border:`1px solid rgba(212,96,74,.2)`,cursor:"pointer",marginBottom:5}} onClick={()=>setMeal(showPicker.dk,showPicker.slot,r.id)}>
                        <span style={{fontSize:20}}>{guessRecipeEmoji(r.name)}</span>
                        <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:TXT}}>{r.name}</div>{r.duration&&<div style={{fontSize:10,color:TXT3}}>⏱️ {r.duration}</div>}</div>
                      </div>
                    ))}
                    <div style={{borderBottom:`1px solid ${BDR}`,marginBottom:8}}/>
                  </div>
                )}
                {(db.recipes||[]).filter(r=>r.source!=="libre").map(r=>(
                  <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 4px",borderBottom:`1px solid ${BDR}`,cursor:"pointer"}} onClick={()=>setMeal(showPicker.dk,showPicker.slot,r.id)}>
                    <span style={{fontSize:20,flexShrink:0}}>{guessRecipeEmoji(r.name)}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:700,color:TXT,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}</div>
                      <div style={{fontSize:10,color:TXT3}}>{r.duration&&<span style={{marginRight:6}}>⏱️ {r.duration}</span>}{r.persons&&<span>👥 {r.persons} pers.</span>}</div>
                    </div>
                    <span style={{color:TXT3,fontSize:16}}>›</span>
                  </div>
                ))}
              </div>
            )
          )}
          {(showPicker.mode)==="ai"&&(
            <div>
              {pantry.length>0&&(
                <div style={{marginBottom:12}}>
                  <div style={{fontSize:11,fontWeight:700,color:TXT2,marginBottom:6}}>🏠 Utiliser depuis mon placard :</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:5,maxHeight:100,overflowY:"auto"}}>
                    {pantry.map(item=>{
                      const isSel=aiPantrySelected.has(item.id);
                      return(
                        <div key={item.id} onClick={()=>{const s=new Set(aiPantrySelected);isSel?s.delete(item.id):s.add(item.id);setAIPantrySelected(s);}}
                          style={{padding:"4px 10px",borderRadius:16,fontSize:11,fontWeight:600,cursor:"pointer",
                            background:isSel?CARAMEL2:"rgba(255,255,255,.8)",color:isSel?"white":TXT2,
                            border:`1.5px solid ${isSel?CARAMEL2:BDR}`}}>
                          {guessCat(item.name).split(" ")[0]} {item.name}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
              <div style={{marginBottom:12}}>
                <div style={{fontSize:11,fontWeight:700,color:TXT2,marginBottom:5}}>✨ Souhait / type de plat (optionnel) :</div>
                <input style={{...inp,fontSize:12}} placeholder="Ex: pâtes, plat rapide, végétarien…" value={aiWish} onChange={e=>setAIWish(e.target.value)}/>
              </div>
              {calAILoading?(
                <div style={{textAlign:"center",padding:"12px 0",fontSize:13,color:TXT3}}>⏳ Génération en cours…</div>
              ):(
                <button style={{...btn("acc"),width:"100%",justifyContent:"center"}} onClick={()=>{
                  const pantryNames=pantry.filter(i=>aiPantrySelected.has(i.id)).map(i=>i.name);
                  generateAIMeal(showPicker.dk,showPicker.slot,pantryNames,aiWish);
                }}>🤖 Générer la recette</button>
              )}
            </div>
          )}
          
          {(showPicker.mode)==="free"&&(
            <div>
              <div style={{fontSize:12,color:TXT2,marginBottom:8}}>Entrez simplement le nom du repas, sans ingrédients :</div>
              <input style={{...inp,marginBottom:12}} placeholder="Ex: Raclette, Sushi maison, Pizza…" value={freeText} onChange={e=>setFreeText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&freeText.trim()&&addFreeTextMeal(showPicker.dk,showPicker.slot,freeText)} autoFocus/>
              <button style={{...btn("acc"),width:"100%",justifyContent:"center"}} disabled={!freeText.trim()} onClick={()=>addFreeTextMeal(showPicker.dk,showPicker.slot,freeText)}>✅ Planifier "{freeText||"…"}"</button>
            </div>
          )}
        </Modal>
      )}

      {showActions&&(
        <Modal open onClose={()=>setShowActions(null)}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
            <span style={{fontSize:32}}>{guessRecipeEmoji(showActions.recipe.name)}</span>
            <div>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:16,color:TXT}}>{showActions.recipe.name}</div>
              <div style={{fontSize:11,color:TXT3}}>{DAY_NAMES_FULL[new Date(showActions.dk).getDay()===0?6:new Date(showActions.dk).getDay()-1]} · {MEAL_LABELS[showActions.slot]}</div>
            </div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            <button style={{...btn("out"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>{setShowPicker({dk:showActions.dk,slot:showActions.slot,mode:"list"});setShowActions(null);}}>🔄 Changer la recette</button>
            <button style={{...btn("dng"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>removeMeal(showActions.dk,showActions.slot)}>🗑️ Retirer ce repas</button>
            <button style={{...btn("gh"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>setShowActions(null)}>Fermer</button>
          </div>
        </Modal>
      )}

      {/* Picker conflit */}
      {pickerConflict&&(
        <Modal open onClose={()=>setPickerConflict(null)}>
          <div style={{textAlign:"center",marginBottom:12}}>
            <div style={{fontSize:32,marginBottom:6}}>😊</div>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:17,color:TXT,marginBottom:6}}>Ce créneau est déjà pris !</div>
            <div style={{fontSize:12,color:TXT2,lineHeight:1.6}}>
              <strong>{MEAL_LABELS[pickerConflict.slot]}</strong> est occupé par<br/>
              <strong style={{color:CARAMEL}}>{pickerConflict.existing?.name||"une recette"}</strong>
            </div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            <button style={{...btn("dng"),width:"100%",justifyContent:"center"}} onClick={()=>{setMeal(pickerConflict.dk,pickerConflict.slot,pickerConflict.newId);setPickerConflict(null);}}>🔄 Remplacer quand même</button>
            <button style={{...btn("gh"),width:"100%",justifyContent:"center"}} onClick={()=>setPickerConflict(null)}>Annuler</button>
          </div>
        </Modal>
      )}

      {/* Wizard Générer la liste */}
      {showWizard&&wizardQueue.length>0&&(()=>{
        const current=wizardQueue[wizardStep];
        // Guard : si wizardStep hors limites (ex: skip sur dernière étape mal calculée), fermer proprement
        if(!current){
          setTimeout(()=>{setShowWizard(false);goToListe();},0);
          return null;
        }
        const recipe=current.recipe;
        // Guard : recette corrompue ou supprimée
        if(!recipe||!recipe.name){
          setTimeout(()=>{setWizardStep(s=>s+1);},0);
          return null;
        }
        const isLast=wizardStep>=wizardQueue.length-1;
        const dayLabel=new Date(current.dk).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"short"});
        return(
          <WizardStep
            recipe={recipe}
            dayLabel={dayLabel}
            slot={MEAL_LABELS[current.slot]}
            stepNum={wizardStep+1}
            totalSteps={wizardQueue.length}
            isLast={isLast}
            priceDB={db.priceDB}
            onNext={(vp,haveIdxs)=>{
              const newItems=finishWizardStep(recipe,vp,haveIdxs,wizardItems);
              if(isLast){
                const nd={...db,items:newItems};setDb(nd);saveDB(nd);
                setShowWizard(false);setWizardStep(0);setWizardQueue([]);setWizardItems([]);
                goToListe();
                showToast("✅ Liste générée ! Bon shopping 🛒");
              } else {
                setWizardItems(newItems);
                setWizardStep(s=>Math.min(s+1,wizardQueue.length-1));
              }
            }}
            onSkip={()=>{
              if(isLast){
                const nd={...db,items:wizardItems};setDb(nd);saveDB(nd);
                setShowWizard(false);setWizardStep(0);setWizardQueue([]);setWizardItems([]);
                goToListe();
                showToast("✅ Liste générée !");
              } else {
                setWizardStep(s=>Math.min(s+1,wizardQueue.length-1));
              }
            }}
            onCancel={()=>{setShowWizard(false);setWizardStep(0);setWizardQueue([]);setWizardItems([]);}}
          />
        );
      })()}
    </div>
  );
}

// ─── WIZARD STEP (flux guidé Générer la liste) ────────────────
function WizardStep({recipe,dayLabel,slot,stepNum,totalSteps,isLast,priceDB,onNext,onSkip,onCancel}){
  const [vp,setVp]=useState(recipe.persons||2);
  const [have,setHave]=useState(new Set());
  const base=recipe.persons||1;
  const scale=vp/base;
  const cost=estimateRecipeCost(recipe,priceDB,vp);

  function togHave(i){const s=new Set(have);if(s.has(i))s.delete(i);else s.add(i);setHave(s);}
  function scaleQ(qty){const n=parseFloat(qty);if(isNaN(n))return qty;const r=n*scale;return r%1===0?String(r):r.toFixed(2).replace(/\.?0+$/,"");}

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:300,display:"flex",alignItems:"flex-end"}}>
      <div style={{width:"100%",background:SURF,borderRadius:"20px 20px 0 0",padding:"20px 16px 32px",maxHeight:"88vh",overflowY:"auto"}}>
        {/* Progress */}
        <div style={{display:"flex",gap:4,marginBottom:14}}>
          {Array.from({length:totalSteps}).map((_,i)=>(
            <div key={i} style={{flex:1,height:4,borderRadius:2,background:i<stepNum-1?SUC:i===stepNum-1?CARAMEL2:BDR}}/>
          ))}
        </div>
        {/* Header */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
          <div>
            <div style={{fontSize:11,color:TXT3,fontWeight:700,marginBottom:2}}>{stepNum}/{totalSteps} — {dayLabel} · {slot}</div>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:20,color:TXT,fontWeight:700}}>{recipe.name}</div>
          </div>
          <button style={{background:"none",border:"none",color:TXT3,fontSize:18,cursor:"pointer",padding:4}} onClick={onCancel}>✕</button>
        </div>
        {/* Personnes */}
        <div style={{display:"flex",alignItems:"center",gap:10,background:CREAM,border:`1px solid ${BDR}`,borderRadius:10,padding:"10px 14px",marginBottom:12}}>
          <label style={{fontSize:13,flex:1,color:TXT2}}>🍽️ Nombre de personnes</label>
          <Stepper value={vp} onChange={setVp}/>
        </div>
        {scale!==1&&<div style={{fontSize:11,color:CARAMEL2,textAlign:"center",marginBottom:10}}>Quantités ajustées ×{scale.toFixed(2).replace(/\.?0+$/,"")}</div>}
        {/* Ingrédients */}
        <div style={{fontSize:11,fontWeight:700,color:TXT2,marginBottom:6}}>Cochez ce que vous avez déjà :</div>
        <div style={{background:CREAM,border:`1px solid ${BDR}`,borderRadius:10,padding:"6px 12px",marginBottom:12}}>
          {(recipe.ingredients||[]).map((ing,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:i<recipe.ingredients.length-1?`1px solid ${BDR}`:"none",fontSize:13}}>
              <div onClick={()=>togHave(i)} style={{width:20,height:20,borderRadius:5,border:have.has(i)?"none":`1.5px solid ${BDR}`,background:have.has(i)?SUC:"transparent",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}>
                {have.has(i)&&<span style={{color:"white",fontSize:11,fontWeight:700}}>✓</span>}
              </div>
              <span style={{flex:1,textDecoration:have.has(i)?"line-through":"none",opacity:have.has(i)?.5:1}}>{ing.name}</span>
              <span style={{color:TXT3,fontSize:12}}>{scaleQ(ing.qty)}{ing.unit?" "+ing.unit:""}</span>
            </div>
          ))}
        </div>
        {cost&&<div style={{fontSize:11,color:SUC,textAlign:"center",marginBottom:12,fontWeight:700}}>~{cost.total.toFixed(2)}€ estimé · {cost.matched}/{cost.outOf} prix connus</div>}
        <div style={{display:"flex",gap:8}}>
          <button style={{...btn("gh"),flex:1}} onClick={onSkip}>Passer →</button>
          <button style={{...btn(isLast?"suc":"acc"),flex:2}} onClick={()=>onNext(vp,have)}>
            {isLast?"✅ Générer la liste":"Recette suivante →"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── PICKER RECETTES (Calendrier) ─────────────────────────────
function PickerRecettes({db,suggestions,onSelect,onImport,goToRecettes,showToast}){
  const [pickerSearch,setPickerSearch]=useState("");
  const [pickerDiff,setPickerDiff]=useState("");
  const [pickerType,setPickerType]=useState("");
  const [mdbResults,setMdbResults]=useState([]);
  const [mdbLoading,setMdbLoading]=useState(false);
  const timerRef=useRef(null);

  useEffect(()=>{
    if(!pickerSearch.trim()||pickerSearch.length<2){setMdbResults([]);return;}
    clearTimeout(timerRef.current);
    timerRef.current=setTimeout(async()=>{
      setMdbLoading(true);
      try{
        const r=await fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${encodeURIComponent(pickerSearch)}`);
        const d=await r.json();
        setMdbResults((d.meals||[]).slice(0,4).map(m=>({id:"mdb_"+m.idMeal,mealdbId:m.idMeal,name:m.strMeal,photo:m.strMealThumb,category:CAT_FR[m.strCategory]||m.strCategory,source:"mealdb"})));
      }catch{setMdbResults([]);}
      setMdbLoading(false);
    },600);
  },[pickerSearch]);

  async function importAndSelect(mealdbId){
    showToast("⏳ Import…");
    try{
      const r=await fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${mealdbId}`);
      const d=await r.json();const m=d.meals?.[0];if(!m)return;
      const ings=[];
      for(let i=1;i<=20;i++){const name=m[`strIngredient${i}`];const measure=m[`strMeasure${i}`];if(name?.trim()){const{qty,unit}=parseMealDBMeasure(measure||"");ings.push({name:name.trim(),qty,unit});}}
      const recipe={id:Date.now(),name:m.strMeal,source:"mealdb",mealdbId:m.idMeal,photo:m.strMealThumb,category:CAT_FR[m.strCategory]||m.strCategory,area:AREA_FR[m.strArea]||m.strArea,ingredients:ings,steps:m.strInstructions?.split(/\r\n|\n/).filter(s=>s.trim()).map(s=>s.trim())||[],date:new Date().toLocaleDateString("fr-FR")};
      onImport(recipe);
    }catch{showToast("❌ Erreur import");}
  }

  const myRecipes=(db.recipes||[]).filter(r=>{
    if(pickerSearch.trim()&&!r.name.toLowerCase().includes(pickerSearch.toLowerCase())&&!(r.ingredients||[]).some(i=>i.name.toLowerCase().includes(pickerSearch.toLowerCase())))return false;
    if(pickerDiff&&r.difficulty!==pickerDiff)return false;
    if(pickerType&&r.mealType!==pickerType)return false;
    return true;
  });

  return(
    <div style={{maxHeight:500,display:"flex",flexDirection:"column"}}>
      <div style={{position:"relative",marginBottom:7}}>
        <input style={{...inp,paddingLeft:30}} placeholder="Rechercher…" value={pickerSearch} onChange={e=>setPickerSearch(e.target.value)}/>
        <span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",fontSize:12}}>🔍</span>
      </div>
      <div style={{display:"flex",gap:5,marginBottom:8,flexWrap:"wrap"}}>
        {RECIPE_DIFFICULTY.filter(d=>d.id).map(d=>(
          <span key={d.id} style={{fontSize:11,padding:"3px 8px",borderRadius:12,background:pickerDiff===d.id?CARAMEL2:CREAM2,color:pickerDiff===d.id?"white":TXT2,border:`1px solid ${pickerDiff===d.id?CARAMEL2:BDR}`,cursor:"pointer"}} onClick={()=>setPickerDiff(pickerDiff===d.id?"":d.id)}>{d.label}</span>
        ))}
        {RECIPE_MEAL_TYPE.filter(t=>t.id).map(t=>(
          <span key={t.id} style={{fontSize:11,padding:"3px 8px",borderRadius:12,background:pickerType===t.id?CARAMEL2:CREAM2,color:pickerType===t.id?"white":TXT2,border:`1px solid ${pickerType===t.id?CARAMEL2:BDR}`,cursor:"pointer"}} onClick={()=>setPickerType(pickerType===t.id?"":t.id)}>{t.label}</span>
        ))}
      </div>
      <div style={{overflowY:"auto",flex:1}}>
        {suggestions.length>0&&!pickerSearch&&(
          <div style={{marginBottom:8}}>
            <div style={{fontSize:10,fontWeight:700,color:DNG,marginBottom:5}}>⚠️ Anti-gaspi :</div>
            {suggestions.map(r=>(
              <div key={"s"+r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px",borderRadius:10,background:"rgba(212,96,74,.06)",border:`1px solid rgba(212,96,74,.2)`,cursor:"pointer",marginBottom:4}} onClick={()=>onSelect(r.id)}>
                <span style={{fontSize:18}}>{guessRecipeEmoji(r.name)}</span>
                <div style={{flex:1,fontSize:12,fontWeight:700,color:TXT}}>{r.name}</div>
              </div>
            ))}
            <div style={{borderBottom:`1px solid ${BDR}`,margin:"8px 0"}}/>
          </div>
        )}
        {myRecipes.length>0&&(
          <div>
            <div style={{fontSize:10,fontWeight:700,color:TXT3,marginBottom:5}}>MES RECETTES ({myRecipes.length})</div>
            {myRecipes.map(r=>(
              <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 4px",borderBottom:`1px solid ${BDR}`,cursor:"pointer"}} onClick={()=>onSelect(r.id)}>
                <span style={{fontSize:18,flexShrink:0}}>{guessRecipeEmoji(r.name)}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:700,color:TXT,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}</div>
                  <div style={{fontSize:10,color:TXT3}}>
                    {r.duration&&<span style={{marginRight:5}}>⏱️ {r.duration}</span>}
                    {r.difficulty&&<span>{RECIPE_DIFFICULTY.find(d=>d.id===r.difficulty)?.label}</span>}
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
        {pickerSearch.length>=2&&(mdbResults.length>0||mdbLoading)&&(
          <div style={{marginTop:8}}>
            <div style={{fontSize:10,fontWeight:700,color:CARAMEL,marginBottom:5}}>🌐 THEMEALDB {mdbLoading?"…":""}</div>
            {mdbResults.map(r=>(
              <div key={r.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 4px",borderBottom:`1px solid ${BDR}`,cursor:"pointer"}} onClick={()=>importAndSelect(r.mealdbId)}>
                <img src={r.photo+"/preview"} alt="" style={{width:34,height:34,objectFit:"cover",borderRadius:6,flexShrink:0}} onError={e=>e.target.style.display="none"}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:700,color:TXT,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}</div>
                  <div style={{fontSize:10,color:TXT3}}>{r.category}</div>
                </div>
                <div style={{fontSize:9,color:CARAMEL2,fontWeight:700,flexShrink:0}}>+ Import</div>
              </div>
            ))}
          </div>
        )}
        {!myRecipes.length&&!mdbResults.length&&!mdbLoading&&(
          <div style={{textAlign:"center",padding:"20px",color:TXT3,fontSize:12}}>
            {pickerSearch?"Aucun résultat pour « "+pickerSearch+" »":"Aucune recette — créez-en une d'abord"}
            {!pickerSearch&&<button style={{...btn("out"),width:"100%",justifyContent:"center",marginTop:10,fontSize:11}} onClick={goToRecettes}>→ Aller aux recettes</button>}
          </div>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// PAGE PARAMÈTRES — Phase 9
// ═══════════════════════════════════════════════════════════════
function PageParametres({db,setDb,showToast,pseudo,setPseudo,docId,onLogout,setShowApiKeyGlobal}){
  const [newPseudo,setNewPseudo]=useState(pseudo);
  const [budgetInput,setBudgetInput]=useState(String(db.budget?.monthly||0));
  const [showPrices,setShowPrices]=useState(localStorage.getItem("ws_prices_visible")!=="false");
  const [defaultPersons,setDefaultPersons]=useState(localStorage.getItem("ws_default_persons")||"2");
  const foyerId=localStorage.getItem("ws_foyerid")||"";

  function savePseudo(){
    if(!newPseudo.trim())return;
    setPseudo(newPseudo.trim());localStorage.setItem("ws_pseudo",newPseudo.trim());
    showToast("✅ Pseudo mis à jour");
  }
  function saveBudget(){
    const v=parseFloat(budgetInput)||0;
    const nd={...db,budget:{...db.budget,monthly:v}};setDb(nd);saveDB(nd);
    showToast("💰 Budget mis à jour");
  }
  function togglePrices(v){
    setShowPrices(v);localStorage.setItem("ws_prices_visible",v?"true":"false");
    showToast(v?"🟢 Prix visibles":"🔴 Prix masqués");
  }
  function saveDefaultPersons(v){setDefaultPersons(v);localStorage.setItem("ws_default_persons",v);}
  function exportData(){
    const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;
    a.download=`wisely-export-${new Date().toISOString().slice(0,10)}.json`;
    a.click();URL.revokeObjectURL(url);showToast("📦 Export téléchargé !");
  }
  function copyInviteLink(){
    const fid=localStorage.getItem("ws_foyerid");const pwd=localStorage.getItem("ws_pwd_saved");
    if(!fid||!pwd){showToast("⚠️ Reconnectez-vous d'abord");return;}
    const link=`${window.location.origin}${window.location.pathname}?foyer=${fid}&pwd=${btoa(pwd)}`;
    navigator.clipboard.writeText(link).then(()=>showToast("🔗 Lien copié !"));
  }

  const Row=({icon,label,children,border=true})=>(
    <div style={{display:"flex",alignItems:"center",gap:12,padding:"13px 16px",borderBottom:border?`1px solid ${BDR}`:"none"}}>
      <span style={{fontSize:20,flexShrink:0}}>{icon}</span>
      <div style={{flex:1,fontSize:13,fontWeight:600,color:TXT}}>{label}</div>
      <div style={{flexShrink:0}}>{children}</div>
    </div>
  );
  const Section=({title,children})=>(
    <div style={{marginBottom:16}}>
      <div style={{fontSize:11,fontWeight:800,color:TXT3,letterSpacing:.8,textTransform:"uppercase",marginBottom:8,paddingLeft:4}}>{title}</div>
      <div style={{...card,background:"rgba(255,255,255,.9)",padding:0,overflow:"hidden"}}>{children}</div>
    </div>
  );

  return(
    <div style={{padding:14,paddingBottom:90}}>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:22,color:TXT,marginBottom:16}}>⚙️ Paramètres</div>
      <Section title="Profil">
        <div style={{padding:"13px 16px",borderBottom:`1px solid ${BDR}`}}>
          <div style={{fontSize:11,color:TXT3,marginBottom:5}}>Pseudo</div>
          <div style={{display:"flex",gap:8}}>
            <input style={{...inp,flex:1,marginBottom:0}} value={newPseudo} onChange={e=>setNewPseudo(e.target.value)}/>
            <button style={{...btn("acc"),padding:"8px 12px"}} onClick={savePseudo}>💾</button>
          </div>
        </div>
        <div style={{padding:"13px 16px",borderBottom:`1px solid ${BDR}`}}>
          <div style={{fontSize:11,color:TXT3,marginBottom:4}}>ID Foyer</div>
          <div style={{fontFamily:"monospace",fontSize:11,color:TXT2,background:CREAM2,padding:"6px 10px",borderRadius:8,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{foyerId||"—"}</div>
        </div>
        <div style={{padding:"13px 16px"}}>
          <button style={{...btn("out"),width:"100%",justifyContent:"center",fontSize:12}} onClick={copyInviteLink}>🔗 Copier le lien d'invitation</button>
        </div>
      </Section>
      <Section title="Préférences">
        <Row icon="💰" label="Afficher les prix" border>
          <div style={{width:40,height:22,borderRadius:11,background:showPrices?SUC:BDR,cursor:"pointer",position:"relative",transition:"background .2s"}} onClick={()=>togglePrices(!showPrices)}>
            <div style={{position:"absolute",top:3,left:showPrices?20:3,width:16,height:16,borderRadius:"50%",background:"white",transition:"left .2s"}}/>
          </div>
        </Row>
        <Row icon="👥" label="Personnes par défaut" border={false}>
          <select style={{...sel,width:60,marginBottom:0}} value={defaultPersons} onChange={e=>saveDefaultPersons(e.target.value)}>
            {[1,2,3,4,5,6].map(n=><option key={n} value={n}>{n}</option>)}
          </select>
        </Row>
      </Section>
      <Section title="Budget">
        <div style={{padding:"13px 16px"}}>
          <div style={{fontSize:11,color:TXT3,marginBottom:5}}>Budget mensuel (€)</div>
          <div style={{display:"flex",gap:8}}>
            <input style={{...inp,flex:1,marginBottom:0,fontSize:16,textAlign:"center"}} type="number" min="0" placeholder="400" value={budgetInput} onChange={e=>setBudgetInput(e.target.value)}/>
            <button style={{...btn("acc"),padding:"8px 12px"}} onClick={saveBudget}>💾</button>
          </div>
          <div style={{fontSize:10,color:TXT3,marginTop:4}}>Actuel : {db.budget?.monthly||0} €/mois</div>
        </div>
      </Section>
      <Section title="Clé API Anthropic">
        <div style={{padding:"13px 16px"}}>
          <div style={{fontSize:11,color:TXT3,marginBottom:6}}>Pour le scan IA & la génération de recettes</div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <div style={{flex:1,fontSize:12,color:localStorage.getItem("ws_apikey")?SUC:DNG,fontWeight:700}}>
              {localStorage.getItem("ws_apikey")?"✅ Configurée":"❌ Non configurée"}
            </div>
            <button style={{...btn("acc"),fontSize:11,padding:"7px 12px"}} onClick={()=>setShowApiKeyGlobal(true)}>🔑 Modifier</button>
          </div>
        </div>
      </Section>
      <Section title="Données">
        <Row icon="📦" label="Exporter mes données" border>
          <button style={{...btn("gh"),fontSize:11,padding:"6px 12px"}} onClick={exportData}>Export</button>
        </Row>
        <Row icon="🗑️" label="Vider la liste" border>
          <button style={{...btn("gh"),fontSize:11,padding:"6px 12px",color:DNG}} onClick={()=>{if(!confirm("Vider la liste ?"))return;const nd={...db,items:[]};setDb(nd);saveDB(nd);showToast("🗑️ Liste vidée");}}>Vider</button>
        </Row>
        <Row icon="🕐" label="Vider l'historique" border={false}>
          <button style={{...btn("gh"),fontSize:11,padding:"6px 12px",color:DNG}} onClick={()=>{if(!confirm("Supprimer l'historique ?"))return;const nd={...db,shoppingHistory:[],productHistory:{}};setDb(nd);saveDB(nd);showToast("🗑️ Historique effacé");}}>Effacer</button>
        </Row>
      </Section>
      <Section title="Compte">
        <Row icon="🔒" label="Se déconnecter" border={false}>
          <button style={{...btn("dng"),fontSize:11,padding:"6px 14px"}} onClick={onLogout}>Déconnexion</button>
        </Row>
      </Section>
      <div style={{textAlign:"center",padding:"12px 0 4px",fontSize:10,color:TXT3}}>
        🍽️ Wisely Food — Phase 9 · Fait avec ❤️
      </div>
    </div>
  );
}


// ═══════════════════════════════════════════════════════════════
// APP ROOT
// ═══════════════════════════════════════════════════════════════
function App(){
  const [page,setPage]=useState("liste");
  const [db,setDb]=useState(EMPTY_DB);
  const [toast,setToast]=useState("");
  const [pseudo,setPseudo]=useState(()=>localStorage.getItem("ws_pseudo")||"");
  const [docId,setDocId]=useState(()=>localStorage.getItem("ws_docid")||null);
  const [fbReady,setFbReady]=useState(true); // toujours démarrer, Firebase se sync en arrière-plan
  const [showApiKeyGlobal,setShowApiKeyGlobal]=useState(false);
  const ttRef=useRef(null);
  const localRef=useRef(false);

  // Attendre que Firebase soit prêt (fallback 3s)
  useEffect(()=>{
    if(window._firebaseReady){setFbReady(true);return;}
    const h=()=>setFbReady(true);
    window.addEventListener("firebaseReady",h);
    const t=setTimeout(()=>setFbReady(true),3000);
    return()=>{window.removeEventListener("firebaseReady",h);clearTimeout(t);};
  },[]);

  // Écouter les changements Firestore en temps réel
  useEffect(()=>{
    if(!docId||!fbReady)return;
    const{fsdb,doc,onSnapshot}=window._firebase;
    const ref=doc(fsdb,"households",docId);
    const unsub=onSnapshot(ref,snap=>{
      if(!snap.exists())return;
      if(localRef.current){localRef.current=false;return;}
      const data=snap.data();
      setDb({
        items:data.items||[],
        productHistory:data.productHistory||{},
        recipes:data.recipes||[],
        shoppingHistory:data.shoppingHistory||[],
        priceDB:data.priceDB||{},
        budget:data.budget||{monthly:0,sessions:[]},
        folders:data.folders||[],
        likedRecipes:data.likedRecipes||[],
        pantry:data.pantry||[],
        calendar:data.calendar||{}
      });
    });
    return()=>unsub();
  },[docId,fbReady]);

  function showToast(msg){setToast(msg);clearTimeout(ttRef.current);ttRef.current=setTimeout(()=>setToast(""),2800);}

  // Sauvegarder dans Firestore + localStorage
  function setDbSync(newDb){
    setDb(newDb);
    // localStorage fallback
    try{localStorage.setItem("ws_r1",JSON.stringify(newDb));}catch{}
    // Firestore sync
    if(docId&&fbReady){
      localRef.current=true;
      const{fsdb,doc,setDoc}=window._firebase;
      const ref=doc(fsdb,"households",docId);
      setDoc(ref,{
        items:newDb.items||[],
        productHistory:newDb.productHistory||{},
        recipes:newDb.recipes||[],
        shoppingHistory:newDb.shoppingHistory||[],
        priceDB:newDb.priceDB||{},
        budget:newDb.budget||{monthly:0,sessions:[]},
        folders:newDb.folders||[],
        likedRecipes:newDb.likedRecipes||[],
        pantry:newDb.pantry||[],
        calendar:newDb.calendar||{}
      }).catch(e=>console.error("Sync error:",e));
    }
  }

  function handleLogin(id,name){
    setDocId(id);
    setPseudo(name||localStorage.getItem("ws_pseudo")||"");
  }

  function handleLogout(){
    localStorage.removeItem("ws_docid");
    localStorage.removeItem("ws_foyerid");
    // Ne pas supprimer ws_pseudo et ws_pwd_saved si "se souvenir" était coché
    setDocId(null);
    setDb(EMPTY_DB);
  }

  if(!fbReady){
    return(
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:TXT3,fontSize:14,fontWeight:600}}>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:40,marginBottom:12}}>🛒</div>
          Chargement…
        </div>
      </div>
    );
  }

  if(!docId){
    return <LoginScreen onLogin={handleLogin}/>;
  }

  return(
    <div style={{minHeight:"100vh",maxWidth:480,margin:"0 auto",fontFamily:"'Plus Jakarta Sans',sans-serif",color:TXT,position:"relative",overflowX:"hidden"}}>
      {/* HEADER */}
      <div style={{padding:"18px 18px 0",position:"relative"}}>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 80% 20%, rgba(255,255,255,.12) 0%, transparent 60%)",pointerEvents:"none"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",position:"relative"}}>
          <div>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:900,color:"white",letterSpacing:-.3}}>🍽️ Wisely Food <span style={{fontSize:10,fontWeight:600,background:"rgba(255,255,255,.25)",borderRadius:6,padding:"2px 7px",letterSpacing:.5,verticalAlign:"middle"}}>Phase 10</span></div>
            {pseudo?<div style={{fontSize:11,color:"rgba(255,255,255,.75)",marginTop:2,fontWeight:600}}>Bonjour {pseudo} 👋</div>
            :<div style={{fontSize:10,color:"rgba(255,255,255,.6)",marginTop:2,fontWeight:600}}>Synchronisé en temps réel ☁️</div>}
          </div>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <button style={{background:"rgba(255,255,255,.2)",border:"1.5px solid rgba(255,255,255,.35)",color:"white",borderRadius:12,padding:"7px 10px",fontFamily:"'Plus Jakarta Sans',sans-serif",fontWeight:700,fontSize:10,cursor:"pointer"}} title="Clé API Anthropic"
              onClick={()=>setShowApiKeyGlobal(true)}>🔑</button>
            <button style={{background:"rgba(255,255,255,.2)",border:"1.5px solid rgba(255,255,255,.35)",color:"white",borderRadius:12,padding:"7px 10px",fontFamily:"'Plus Jakarta Sans',sans-serif",fontWeight:700,fontSize:10,cursor:"pointer"}}
              onClick={()=>{
                const fid=localStorage.getItem("ws_foyerid");
                if(fid){const link=`${window.location.origin}${window.location.pathname}?invite=${fid}`;navigator.clipboard.writeText(link).then(()=>showToast("🔗 Lien copié !"));}
              }}>🔗</button>
            <button style={{background:"rgba(255,255,255,.2)",border:"1.5px solid rgba(255,255,255,.35)",color:"white",borderRadius:12,padding:"7px 12px",fontFamily:"'Plus Jakarta Sans',sans-serif",fontWeight:700,fontSize:11,cursor:"pointer"}} onClick={handleLogout}>🔒 Déco.</button>
          </div>
        </div>
        {/* NAV TABS — bottom, 4 onglets */}
      </div>
      {/* PAGE CONTENT */}
      <div style={{background:"rgba(255,255,255,.04)",minHeight:"calc(100vh - 120px)"}}>
        {page==="liste"&&<PageListe db={db} setDb={setDbSync} showToast={showToast} goToPlanning={()=>setPage("calendrier")}/>}
        {page==="recettes"&&<PageRecettes db={db} setDb={setDbSync} showToast={showToast}/>}
        {page==="prix"&&<PagePrix db={db} setDb={setDbSync} showToast={showToast}/>}
        {page==="placard"&&<PagePlacard db={db} setDb={setDbSync} showToast={showToast} goToRecettes={()=>setPage("recettes")} goToListe={()=>setPage("liste")}/>}
        {page==="calendrier"&&<PageCalendrier db={db} setDb={setDbSync} showToast={showToast} goToRecettes={()=>setPage("recettes")} goToListe={()=>setPage("liste")}/>}
        {page==="historique"&&<PageHistorique db={db} setDb={setDbSync} showToast={showToast} goToListe={()=>setPage("liste")}/>}
        {page==="parametres"&&<PageParametres db={db} setDb={setDbSync} showToast={showToast} pseudo={pseudo} setPseudo={setPseudo} docId={docId} setShowApiKeyGlobal={setShowApiKeyGlobal} onLogout={()=>{["ws_docid","ws_r1","ws_foyerid","ws_pwd_saved"].forEach(k=>localStorage.removeItem(k));window.location.reload();}}/>}
        {page==="maison"&&(
          <div style={{padding:14,paddingBottom:90}}>
            {/* Stats rapides */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}}>
              {[["Recettes",(db.recipes||[]).length,"🍽️"],["Budget",`${((db.budget?.sessions||[]).reduce((s,x)=>s+(x.total||0),0)).toFixed(0)}€`,"💰"],["Planifiés",(()=>{const t=new Date();t.setHours(0,0,0,0);return Object.entries(db.calendar||{}).filter(([dk])=>new Date(dk)>=t).reduce((s,[,sl])=>s+(sl.midi?1:0)+(sl.soir?1:0),0);})(),"📅"]].map(([label,val,ico])=>(
                <div key={label} style={{background:"rgba(255,255,255,.88)",border:`1px solid ${BDR}`,borderRadius:14,padding:"12px 8px",textAlign:"center"}}>
                  <div style={{fontSize:18,marginBottom:4}}>{ico}</div>
                  <div style={{fontFamily:"'Fraunces',serif",fontSize:20,fontWeight:900,color:CARAMEL,lineHeight:1}}>{val}</div>
                  <div style={{fontSize:9,color:TXT3,fontWeight:700,textTransform:"uppercase",letterSpacing:.3,marginTop:3}}>{label}</div>
                </div>
              ))}
            </div>
            {/* Hub grid */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
              {[
                {id:"prix",ico:"🧾",title:"Prix & Tickets",sub:"Scanner & base de prix",badge:`${Object.keys(db.priceDB||{}).length} prix`},
                {id:"placard",ico:"📦",title:"Placard",sub:"Inventaire & anti-gaspi",badge:(db.pantry||[]).filter(i=>i.signal==="red").length>0?`${(db.pantry||[]).filter(i=>i.signal==="red").length} 🔴`:"OK"},
                {id:"historique",ico:"🕐",title:"Historique",sub:"Courses passées",badge:`${(db.shoppingHistory||[]).length} sessions`},
                {id:"parametres",ico:"⚙️",title:"Paramètres",sub:"Profil, API, données",badge:"Compte"},
              ].map(h=>(
                <div key={h.id} onClick={()=>setPage(h.id)} style={{background:"rgba(255,255,255,.88)",border:`1px solid ${BDR}`,borderRadius:16,padding:"16px 14px",cursor:"pointer",display:"flex",flexDirection:"column",gap:8}}>
                  <div style={{fontSize:28}}>{h.ico}</div>
                  <div>
                    <div style={{fontSize:14,fontWeight:700,color:TXT}}>{h.title}</div>
                    <div style={{fontSize:11,color:TXT3,lineHeight:1.4,marginTop:2}}>{h.sub}</div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                    <span style={{fontSize:10,fontWeight:700,background:CREAM2,color:TXT2,padding:"2px 8px",borderRadius:10}}>{h.badge}</span>
                    <span style={{fontSize:16,color:CARAMEL}}>›</span>
                  </div>
                </div>
              ))}
            </div>
            {/* Lien invitation */}
            <div style={{background:`rgba(184,112,58,.06)`,border:`1.5px dashed rgba(184,112,58,.25)`,borderRadius:14,padding:"14px",display:"flex",alignItems:"center",gap:12}}>
              <span style={{fontSize:24}}>🔗</span>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:700,color:TXT,marginBottom:2}}>Inviter votre partenaire</div>
                <div style={{fontSize:11,color:TXT3}}>Partagez votre foyer en 1 clic</div>
              </div>
              <button style={{...btn("acc"),fontSize:11,padding:"7px 12px"}} onClick={()=>{const fid=localStorage.getItem("ws_foyerid");if(fid){const link=`${window.location.origin}${window.location.pathname}?invite=${fid}`;navigator.clipboard.writeText(link).then(()=>showToast("🔗 Lien copié !"));}}}>Copier</button>
            </div>
          </div>
        )}
      </div>
      {/* BOTTOM NAV — 4 onglets */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"white",borderTop:`1px solid ${BDR}`,display:"flex",padding:"8px 4px 12px",zIndex:20,boxShadow:"0 -4px 20px rgba(42,31,14,.06)"}}>
        {[
          {id:"liste",     icon:"🛒", label:"Liste"},
          {id:"recettes",  icon:"🍽️", label:"Recettes"},
          {id:"calendrier",icon:"📅", label:"Planning"},
          {id:"maison",    icon:"🏠", label:"Maison"},
        ].map(t=>(
          <div key={t.id} onClick={()=>setPage(t.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,cursor:"pointer",padding:"4px 2px",borderRadius:12,background:page===t.id?"rgba(184,112,58,.1)":"transparent",transition:"background .2s"}}>
            <span style={{fontSize:22,lineHeight:1}}>{t.icon}</span>
            <span style={{fontSize:9,fontWeight:700,color:page===t.id?CARAMEL:TXT3,letterSpacing:.2}}>{t.label}</span>
            {page===t.id&&<div style={{width:4,height:4,borderRadius:"50%",background:CARAMEL}}/>}
          </div>
        ))}
      </div>
      <Toast msg={toast}/>
      {showApiKeyGlobal&&<ApiKeyModal open onSave={()=>setShowApiKeyGlobal(false)} onClose={()=>setShowApiKeyGlobal(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{regs.forEach(r=>r.unregister());});
}
</script>
</body>
</html>
