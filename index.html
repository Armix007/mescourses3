<script type="text/babel">
const {useState,useEffect,useRef}=React;

// ─── CONSTANTES ───────────────────────────────────────────────
const CATEGORIES=["🍎 Fruits","🥦 Légumes","🥩 Viande","🐟 Poisson","🥛 Laitiers","🧀 Fromage","🥚 Oeufs","🍞 Boulangerie","🥫 Épicerie sèche","🫙 Conserves","🧊 Surgelés","🍷 Boissons","🧴 Hygiène","🧹 Entretien","🍬 Confiseries","❓ Autre"];
const UNITS=["","g","kg","ml","cl","L","càs","càc","pincée","sachet","boîte","bouteille","paquet","tranche","botte"];
const UL={"":"pcs","g":"g","kg":"kg","ml":"ml","cl":"cl","L":"L","càs":"càs","càc":"càc","pincée":"pincée","sachet":"sachet","boîte":"boîte","bouteille":"bouteille","paquet":"paquet","tranche":"tranche","botte":"botte"};
const EMPTY_DB={items:[],productHistory:{},recipes:[],shoppingHistory:[]};
const BG="transparent",SURF="#ffffff",SURF2="#fdf8f0",SURF3="#f5ece0",ACC="#c8845a",TXT="#2a1f0e",TXT2="#9a7050",TXT3="#c8a880",DNG="#d4604a",SUC="#5a8a3a",BDR="#e8d4b8";
const CARAMEL="#b8703a",CARAMEL2="#c8845a",CREAM="#fdf8f0",CREAM2="#f5ece0";

function loadDB(){try{return JSON.parse(localStorage.getItem("ws_r1")||"null")||EMPTY_DB;}catch{return EMPTY_DB;}}
function saveDB(db){try{localStorage.setItem("ws_r1",JSON.stringify(db));}catch{}}
function roundQ(n){return n%1===0?n:+n.toFixed(2);}
function fmtQ(qty,unit){const n=parseFloat(qty);const q=isNaN(n)?qty:(n%1===0?n:+n.toFixed(2));return unit?`${q} ${unit}`:`${q} pcs`;}
function guessCat(name){
  const n=name.toLowerCase();
  if(/tomate|salade|carotte|courgette|aubergine|oignon|poireau|brocoli|épinard|poivron|concombre|chou|radis|betterave|asperge|fenouil|échalotte|ail|gingembre|navet/.test(n))return"🥦 Légumes";
  if(/pomme|poire|banane|fraise|framboise|cerise|abricot|pêche|melon|pastèque|mangue|ananas|kiwi|orange|citron|raisin|figue|prune|myrtille|avocat/.test(n))return"🍎 Fruits";
  if(/viande|boeuf|porc|veau|agneau|poulet|dinde|canard|lapin|saucisse|jambon|lard|lardon|steak|côte|filet/.test(n))return"🥩 Viande";
  if(/poisson|saumon|thon|cabillaud|sole|dorade|crevette|moule|huître|sardine|anchois/.test(n))return"🐟 Poisson";
  if(/lait|yaourt|crème fraîche|crème|beurre/.test(n))return"🥛 Laitiers";
  if(/fromage|gruyère|emmental|parmesan|comté|mozzarella|camembert|brie|roquefort|chèvre/.test(n))return"🧀 Fromage";
  if(/oeuf|oeufs/.test(n))return"🥚 Oeufs";
  if(/pain|baguette|brioche|croissant/.test(n))return"🍞 Boulangerie";
  if(/shampo|savon|dentifrice|gel douche|déodorant/.test(n))return"🧴 Hygiène";
  if(/eau|jus|soda|bière|vin|café|thé/.test(n))return"🍷 Boissons";
  return"🥫 Épicerie sèche";
}
function normUnit(u){
  if(!u)return"";
  const m={gramme:"g",grammes:"g",kilogramme:"kg",kilogrammes:"kg",litre:"L",litres:"L",millilitre:"ml",millilitres:"ml",centilitre:"cl",centilitres:"cl","pièce":"","pièces":"","cuillère à soupe":"càs","cuillères à soupe":"càs","cuillère à café":"càc","cuillères à café":"càc",pincée:"pincée",pincées:"pincée",sachet:"sachet",sachets:"sachet","boîte":"boîte","boîtes":"boîte",bouteille:"bouteille",bouteilles:"bouteille",paquet:"paquet",paquets:"paquet",tranche:"tranche",tranches:"tranche",botte:"botte",bottes:"botte"};
  const low=u.toLowerCase().trim();return m[low]!==undefined?m[low]:(UNITS.includes(low)?low:"");
}
function mergeItem(items,n,qv,uv,src,ct){
  const arr=[...items],norm=n.toLowerCase();
  const ex=arr.find(i=>i.name.toLowerCase()===norm&&!i.checked);
  if(ex){const s=ex.quantities.find(q=>q.unit===uv);if(s)s.qty=roundQ(+s.qty+ +qv);else ex.quantities.push({qty:roundQ(+qv),unit:uv,source:src});}
  else arr.push({id:Date.now()+Math.random(),name:n,category:ct||guessCat(n),quantities:[{qty:roundQ(+qv),unit:uv,source:src}],checked:false});
  return arr;
}

// ─── STYLES PARTAGÉS ─────────────────────────────────────────
const inp={width:"100%",background:SURF,border:`1.5px solid ${BDR}`,borderRadius:12,padding:"11px 13px",color:TXT,fontFamily:"'Plus Jakarta Sans',sans-serif",fontSize:14,outline:"none",boxSizing:"border-box"};
const sel={...inp,fontSize:13,appearance:"none",cursor:"pointer"};
const btn=(v="acc")=>({
  background:v==="acc"?CARAMEL2:v==="suc"?SUC:v==="dng"?DNG:v==="out"?"transparent":SURF3,
  color:v==="acc"||v==="suc"||v==="dng"?"white":v==="gh"?TXT2:TXT,
  border:v==="out"?`1.5px solid ${CARAMEL2}`:"none",
  borderRadius:12,padding:"10px 14px",
  fontFamily:"'Plus Jakarta Sans',sans-serif",fontWeight:700,fontSize:13,
  cursor:"pointer",display:"inline-flex",alignItems:"center",gap:5,
  whiteSpace:"nowrap",flexShrink:0,
  boxShadow:v==="acc"?`0 3px 12px rgba(200,132,90,.3)`:"none"
});
const lbl={fontSize:11,color:TXT3,fontWeight:700,textTransform:"uppercase",letterSpacing:.7,display:"block",marginBottom:6};
const card={background:SURF,border:`1px solid ${BDR}`,borderRadius:16,padding:14,marginBottom:10,boxShadow:"0 2px 12px rgba(160,90,40,.07)"};
const ovl={position:"fixed",inset:0,background:"rgba(80,40,10,.55)",zIndex:200,display:"flex",alignItems:"flex-end",backdropFilter:"blur(6px)"};
const mdl={background:SURF,borderRadius:"20px 20px 0 0",padding:"18px 16px",width:"100%",maxHeight:"94vh",overflowY:"auto"};

// ─── COMPOSANTS DE BASE ───────────────────────────────────────
function Toast({msg}){
  return msg?<div style={{position:"fixed",bottom:100,left:"50%",transform:"translateX(-50%)",background:CARAMEL,color:"white",padding:"10px 20px",borderRadius:40,fontSize:12,fontWeight:700,zIndex:500,boxShadow:"0 4px 20px rgba(160,90,40,.3)",pointerEvents:"none",whiteSpace:"nowrap"}}>{msg}</div>:null;
}

function Stepper({value,onChange,min=1}){
  const bs={background:CREAM2,border:`1px solid ${BDR}`,color:CARAMEL,width:30,height:30,borderRadius:8,fontSize:16,cursor:"pointer",fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"};
  return(
    <div style={{display:"flex",alignItems:"center",gap:6,background:SURF,border:`1.5px solid ${BDR}`,borderRadius:10,padding:4,flexShrink:0}}>
      <button style={bs} onClick={()=>onChange(Math.max(min,value-1))}>−</button>
      <span style={{fontSize:14,fontWeight:700,minWidth:22,textAlign:"center",color:TXT,fontFamily:"'Fraunces',serif"}}>{value}</span>
      <button style={bs} onClick={()=>onChange(value+1)}>+</button>
    </div>
  );
}

function Modal({open,onClose,children}){
  if(!open)return null;
  return(
    <div style={ovl} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={mdl}>
        <div style={{width:36,height:4,background:BDR,borderRadius:2,margin:"0 auto 18px"}}/>
        {children}
      </div>
    </div>
  );
}

function SecTitle({children}){
  return(
    <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1,color:TXT3,margin:"14px 0 7px",display:"flex",alignItems:"center",gap:6}}>
      {children}<div style={{flex:1,height:1,background:BDR}}/>
    </div>
  );
}

// ─── CROP MODAL ───────────────────────────────────────────────
function CropModal({open,src,onConfirm,onClose}){
  const canvasRef=useRef(null),imgRef=useRef(null),containerRef=useRef(null);
  const [drag,setDrag]=useState(null);
  const [crop,setCrop]=useState({x:.05,y:.05,w:.9,h:.9});
  const [loaded,setLoaded]=useState(false);
  const [canvasSize,setCanvasSize]=useState({w:400,h:300});

  useEffect(()=>{if(open&&src){setLoaded(false);setCrop({x:.05,y:.05,w:.9,h:.9});}},[open,src]);

  // Quand l'image est chargée : calcule les dimensions du canvas selon ratio réel + DPR
  function onImgLoad(){
    const img=imgRef.current;
    if(!img)return;
    const dpr=window.devicePixelRatio||1;
    // Largeur CSS disponible (modal ~350px max)
    const cssW=Math.min(containerRef.current?.offsetWidth||340,340);
    const ratio=img.naturalHeight/img.naturalWidth;
    const cssH=Math.round(cssW*ratio);
    // Dimensions physiques du canvas (nettes sur Retina)
    setCanvasSize({w:Math.round(cssW*dpr),h:Math.round(cssH*dpr),cssW,cssH});
    setLoaded(true);
  }

  useEffect(()=>{
    if(!loaded||!canvasRef.current||!imgRef.current)return;
    const cv=canvasRef.current,img=imgRef.current,ctx=cv.getContext("2d");
    const W=cv.width,H=cv.height;
    const dpr=window.devicePixelRatio||1;
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(img,0,0,W,H);
    ctx.fillStyle="rgba(0,0,0,.5)";
    const cx=crop.x*W,cy=crop.y*H,cw=crop.w*W,ch=crop.h*H;
    ctx.fillRect(0,0,W,cy);ctx.fillRect(0,cy,cx,ch);ctx.fillRect(cx+cw,cy,W-(cx+cw),ch);ctx.fillRect(0,cy+ch,W,H-(cy+ch));
    ctx.strokeStyle=CARAMEL2;ctx.lineWidth=2*dpr;ctx.strokeRect(cx,cy,cw,ch);
    // grille des tiers
    ctx.strokeStyle="rgba(200,132,90,.4)";ctx.lineWidth=dpr;
    [1,2].forEach(k=>{ctx.beginPath();ctx.moveTo(cx+cw*k/3,cy);ctx.lineTo(cx+cw*k/3,cy+ch);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,cy+ch*k/3);ctx.lineTo(cx+cw,cy+ch*k/3);ctx.stroke();});
    // poignées de coin nettes
    const r=10*dpr;
    [[cx,cy],[cx+cw,cy],[cx,cy+ch],[cx+cw,cy+ch]].forEach(([hx,hy])=>{
      ctx.fillStyle=CARAMEL2;ctx.beginPath();ctx.arc(hx,hy,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="white";ctx.lineWidth=1.5*dpr;ctx.beginPath();ctx.arc(hx,hy,r,0,Math.PI*2);ctx.stroke();
    });
  },[crop,loaded,canvasSize]);

  function getPos(e,cv){
    const r=cv.getBoundingClientRect();const cl=e.touches?e.touches[0]:e;
    return{x:(cl.clientX-r.left)/r.width,y:(cl.clientY-r.top)/r.height};
  }
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

  function startDrag(e){
    if(!canvasRef.current)return;e.preventDefault();
    const pos=getPos(e,canvasRef.current);const{x,y,w,h}=crop;
    const hs=[{n:"tl",px:x,py:y},{n:"tr",px:x+w,py:y},{n:"bl",px:x,py:y+h},{n:"br",px:x+w,py:y+h}];
    const hit=hs.find(hd=>Math.hypot(pos.x-hd.px,pos.y-hd.py)<0.08);
    if(hit)setDrag({type:"h",name:hit.n,sc:{...crop}});
    else if(pos.x>=x&&pos.x<=x+w&&pos.y>=y&&pos.y<=y+h)setDrag({type:"m",ox:pos.x-x,oy:pos.y-y,sc:{...crop}});
    else setDrag({type:"n",sx:pos.x,sy:pos.y});
  }
  function onDrag(e){
    if(!drag||!canvasRef.current)return;e.preventDefault();
    const pos=getPos(e,canvasRef.current);
    if(drag.type==="n"){const x=Math.min(pos.x,drag.sx),y=Math.min(pos.y,drag.sy),w=Math.abs(pos.x-drag.sx),h=Math.abs(pos.y-drag.sy);setCrop({x:clamp(x,0,1),y:clamp(y,0,1),w:clamp(w,0.05,1-x),h:clamp(h,0.05,1-y)});}
    else if(drag.type==="m"){const sc=drag.sc;setCrop({...sc,x:clamp(pos.x-drag.ox,0,1-sc.w),y:clamp(pos.y-drag.oy,0,1-sc.h)});}
    else if(drag.type==="h"){const sc=drag.sc;
      if(drag.name==="tl"){const nx=clamp(pos.x,0,sc.x+sc.w-0.05),ny=clamp(pos.y,0,sc.y+sc.h-0.05);setCrop({x:nx,y:ny,w:sc.x+sc.w-nx,h:sc.y+sc.h-ny});}
      else if(drag.name==="tr"){const ny=clamp(pos.y,0,sc.y+sc.h-0.05);setCrop({x:sc.x,y:ny,w:clamp(pos.x-sc.x,0.05,1-sc.x),h:sc.y+sc.h-ny});}
      else if(drag.name==="bl"){const nx=clamp(pos.x,0,sc.x+sc.w-0.05);setCrop({x:nx,y:sc.y,w:sc.x+sc.w-nx,h:clamp(pos.y-sc.y,0.05,1-sc.y)});}
      else{setCrop({x:sc.x,y:sc.y,w:clamp(pos.x-sc.x,0.05,1-sc.x),h:clamp(pos.y-sc.y,0.05,1-sc.y)});}
    }
  }
  function endDrag(){setDrag(null);}

  function confirm(){
    if(!imgRef.current)return;
    const img=imgRef.current;
    const out=document.createElement("canvas");
    const srcX=Math.round(img.naturalWidth*crop.x);
    const srcY=Math.round(img.naturalHeight*crop.y);
    const srcW=Math.round(img.naturalWidth*crop.w);
    const srcH=Math.round(img.naturalHeight*crop.h);
    out.width=srcW;out.height=srcH;
    out.getContext("2d").drawImage(img,srcX,srcY,srcW,srcH,0,0,srcW,srcH);
    onConfirm(out.toDataURL("image/jpeg",.95));
  }

  if(!open||!src)return null;
  return(
    <div style={{...ovl,zIndex:300}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{...mdl,paddingBottom:24}}>
        <div style={{width:36,height:4,background:BDR,borderRadius:2,margin:"0 auto 14px"}}/>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:17,marginBottom:4,color:TXT}}>📐 Recadrer la photo</div>
        <div style={{fontSize:12,color:TXT3,marginBottom:10}}>Tirez les coins pour délimiter la zone à garder</div>
        <div ref={containerRef} style={{borderRadius:12,overflow:"hidden",touchAction:"none",userSelect:"none",background:CREAM2,border:`1px solid ${BDR}`}}>
          {/* Image cachée — source pour le canvas et pour le recadrage final */}
          <img ref={imgRef} src={src} alt="" style={{display:"none"}} onLoad={onImgLoad}/>
          {loaded
            ?<canvas
                ref={canvasRef}
                width={canvasSize.w}
                height={canvasSize.h}
                style={{width:`${canvasSize.cssW}px`,height:`${canvasSize.cssH}px`,display:"block",cursor:"crosshair",touchAction:"none",maxWidth:"100%"}}
                onMouseDown={startDrag} onMouseMove={onDrag} onMouseUp={endDrag} onMouseLeave={endDrag}
                onTouchStart={startDrag} onTouchMove={onDrag} onTouchEnd={endDrag}/>
            :<div style={{height:220,display:"flex",alignItems:"center",justifyContent:"center",color:TXT3,fontSize:13}}>Chargement…</div>
          }
        </div>
        <div style={{fontSize:10,color:TXT3,textAlign:"center",marginTop:6}}>Pleine résolution préservée ✓</div>
        <div style={{display:"flex",gap:8,marginTop:10}}>
          <button style={{...btn("gh"),flex:1}} onClick={onClose}>Annuler</button>
          <button style={{...btn("acc"),flex:1}} onClick={confirm} disabled={!loaded}>✂️ Recadrer</button>
        </div>
      </div>
    </div>
  );
}

// ─── QUICK ADD MODAL (produits fréquents) ─────────────────────
function QuickAddModal({open,product,onConfirm,onClose}){
  const [qty,setQty]=useState(1);
  const [unit,setUnit]=useState("");
  useEffect(()=>{if(open&&product){setQty(1);setUnit(product.lastUnit||"");}},[open,product]);
  if(!open||!product)return null;
  return(
    <Modal open onClose={onClose}>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:20,marginBottom:6}}>Ajouter à la liste</div>
      <div style={{fontSize:15,fontWeight:600,marginBottom:4,color:CARAMEL2}}>{product.name}</div>
      <div style={{fontSize:11,color:TXT3,marginBottom:16}}>{product.category} · {product.count}× acheté</div>
      <div style={{display:"flex",gap:10,alignItems:"flex-end",marginBottom:16}}>
        <div style={{flex:1}}><span style={lbl}>Quantité</span><Stepper value={qty} onChange={setQty}/></div>
        <div style={{flex:1}}><span style={lbl}>Unité</span>
          <select style={{...sel,padding:"9px 12px"}} value={unit} onChange={e=>setUnit(e.target.value)}>
            {UNITS.map(u=><option key={u} value={u}>{UL[u]}</option>)}
          </select>
        </div>
      </div>
      <div style={{display:"flex",gap:8}}>
        <button style={{...btn("gh"),flex:1}} onClick={onClose}>Annuler</button>
        <button style={{...btn("acc"),flex:1}} onClick={()=>onConfirm(product.name,product.category,unit,qty)}>+ Ajouter</button>
      </div>
    </Modal>
  );
}

// ─── HISTORY SESSION ──────────────────────────────────────────
function HistorySession({session,onReloadAll,onReloadSelected}){
  const [open,setOpen]=useState(false);
  const [sel,setSel]=useState(new Set());
  function toggle(name){const s=new Set(sel);if(s.has(name))s.delete(name);else s.add(name);setSel(s);}
  function selAll(){setSel(new Set(session.items.map(i=>i.name)));}
  const items=session.items||[];
  return(
    <div style={{...card,padding:0,overflow:"hidden"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 13px",cursor:"pointer"}} onClick={()=>setOpen(o=>!o)}>
        <div>
          <div style={{fontWeight:600,fontSize:13}}>{session.date}</div>
          <div style={{fontSize:10,color:TXT3,marginTop:2}}>{session.count} articles</div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <button style={{...btn("out"),fontSize:11,padding:"5px 9px"}} onClick={e=>{e.stopPropagation();onReloadAll();}}>Tout ajouter</button>
          <span style={{color:TXT3,fontSize:16,display:"inline-block",transform:open?"rotate(180deg)":"none",transition:"transform .2s"}}>▾</span>
        </div>
      </div>
      {open&&(
        <div style={{borderTop:`1px solid ${BDR}`,padding:"10px 13px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontSize:11,color:TXT3}}>{sel.size} sélectionné{sel.size>1?"s":""}</span>
            <div style={{display:"flex",gap:5}}>
              <button style={{...btn("gh"),fontSize:11,padding:"4px 8px"}} onClick={selAll}>Tout</button>
              <button style={{...btn("gh"),fontSize:11,padding:"4px 8px"}} onClick={()=>setSel(new Set())}>Aucun</button>
              <button style={{...btn("suc"),fontSize:11,padding:"4px 8px"}} onClick={()=>onReloadSelected(sel)} disabled={sel.size===0}>✅ Ajouter ({sel.size})</button>
            </div>
          </div>
          <div style={{maxHeight:240,overflowY:"auto"}}>
            {items.map((item,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 4px",borderBottom:i<items.length-1?`1px solid ${BDR}`:"none",cursor:"pointer",background:sel.has(item.name)?`rgba(200,132,90,.08)`:"transparent"}} onClick={()=>toggle(item.name)}>
                <div style={{width:18,height:18,borderRadius:4,border:sel.has(item.name)?"none":`1.5px solid ${BDR}`,background:sel.has(item.name)?SUC:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>

      )}
    </div>
  );
}

function PageListe({db,setDb,showToast}){
  const [name,setName]=useState("");
  const [qty,setQty]=useState(1);
  const [unit,setUnit]=useState("");
  const [cat,setCat]=useState("🥦 Légumes");
  const [sugg,setSugg]=useState([]);
  const [eqty,setEqty]=useState(null);

  useEffect(()=>{
    if(!name.trim()){setSugg([]);return;}
    const q=name.toLowerCase();
    setSugg(Object.entries(db.productHistory).filter(([n])=>n.toLowerCase().includes(q)).sort((a,b)=>b[1].count-a[1].count).slice(0,6));
  },[name,db.productHistory]);

  function addItem(){
    const n=name.trim();if(!n)return;
    const ni=mergeItem(db.items,n,qty,unit,"manuel",cat);
    const ph={...db.productHistory};
    if(!ph[n])ph[n]={count:0,category:cat,lastUnit:unit};
    ph[n].count++;ph[n].category=cat;ph[n].lastUnit=unit;
    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);
    setName("");setQty(1);setSugg([]);showToast("✅ "+n+" ajouté");
  }
  function toggle(id){const ni=db.items.map(i=>i.id===id?{...i,checked:!i.checked}:i);const nd={...db,items:ni};setDb(nd);saveDB(nd);}
  function del(id){const ni=db.items.filter(i=>i.id!==id);const nd={...db,items:ni};setDb(nd);saveDB(nd);}
  function clrChk(){const ni=db.items.filter(i=>!i.checked);const nd={...db,items:ni};setDb(nd);saveDB(nd);showToast("🗑️ Articles cochés supprimés");}
  function saveHist(){
    if(!db.items.length){showToast("⚠️ Liste vide");return;}
    const h=[{date:new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}),items:JSON.parse(JSON.stringify(db.items)),count:db.items.length},...db.shoppingHistory].slice(0,20);
    const nd={...db,shoppingHistory:h};setDb(nd);saveDB(nd);showToast("💾 Course sauvegardée");
  }
  function confEqty(val,uv){
    if(isNaN(val)||val<0){showToast("⚠️ Quantité invalide");return;}
    const ni=db.items.map(item=>{
      if(item.id!==eqty.itemId)return item;
      const qs=[...item.quantities];
      if(eqty.qi==null)qs.push({qty:roundQ(val),unit:uv,source:"manuel"});
      else qs[eqty.qi]={...qs[eqty.qi],qty:roundQ(val),unit:uv};
      return{...item,quantities:qs};
    });
    const nd={...db,items:ni};setDb(nd);saveDB(nd);setEqty(null);
  }
  function delQty(){
    const ni=db.items.reduce((acc,item)=>{
      if(item.id!==eqty.itemId)return[...acc,item];
      const qs=item.quantities.filter((_,i)=>i!==eqty.qi);
      return qs.length?[...acc,{...item,quantities:qs}]:acc;
    },[]);
    const nd={...db,items:ni};setDb(nd);saveDB(nd);setEqty(null);
  }

  const unc=db.items.filter(i=>!i.checked),chk=db.items.filter(i=>i.checked);
  const total=db.items.length,cc=chk.length,pct=total?Math.round(cc/total*100):0;
  const cats={};unc.forEach(item=>{const c=item.category||"❓ Autre";if(!cats[c])cats[c]=[];cats[c].push(item);});

  return(
    <div style={{padding:14,paddingBottom:90}}>
      {/* Stats card */}
      <div style={{...card,display:"flex",justifyContent:"space-around",padding:"14px 8px",marginBottom:4,background:"rgba(255,255,255,.85)"}}>
        {[["Articles",total],["Cochés",cc],["Restants",total-cc]].map(([l,v])=>(
          <div key={l} style={{textAlign:"center"}}>
            <div style={{fontSize:22,fontWeight:900,color:CARAMEL,fontFamily:"'Fraunces',serif"}}>{v}</div>
            <div style={{fontSize:10,color:TXT3,fontWeight:600,textTransform:"uppercase",letterSpacing:.5}}>{l}</div>
          </div>
        ))}
      </div>
      <div style={{height:4,background:"rgba(255,255,255,.4)",borderRadius:4,marginBottom:12,overflow:"hidden"}}>
        <div style={{height:"100%",background:`linear-gradient(90deg,${CARAMEL},${CARAMEL2})`,width:pct+"%",transition:"width .4s",borderRadius:4}}/>
      </div>
      {/* Add form */}
      <div style={{...card,background:"rgba(255,255,255,.9)"}}>
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <input style={{...inp,flex:1}} placeholder="Nom de l'article…" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addItem()}/>
          <button style={{...btn("acc"),fontSize:18,padding:"10px 16px"}} onClick={addItem}>+</button>
        </div>
        {sugg.length>0&&(
          <div style={{background:CREAM2,border:`1px solid ${BDR}`,borderRadius:12,overflow:"hidden",marginBottom:8}}>
            {sugg.map(([n,d])=>(
              <div key={n} style={{padding:"9px 13px",fontSize:13,cursor:"pointer",borderBottom:`1px solid ${BDR}`,display:"flex",justifyContent:"space-between",color:TXT}}
                onClick={()=>{setName(n);if(d.category)setCat(d.category);if(d.lastUnit!==undefined)setUnit(d.lastUnit);setSugg([]);}}>
                <span style={{fontWeight:600}}>{n}</span>
                <span style={{fontSize:10,color:TXT3,background:CREAM2,padding:"2px 8px",borderRadius:20,fontWeight:600}}>{d.count}× · {UL[d.lastUnit]||"pcs"}</span>
              </div>
            ))}
          </div>
        )}
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <Stepper value={qty} onChange={setQty}/>
          <select style={{...sel,flex:1,minWidth:75,padding:"8px 10px"}} value={unit} onChange={e=>setUnit(e.target.value)}>{UNITS.map(u=><option key={u} value={u}>{UL[u]}</option>)}</select>

        </div>
      </div>
      {db.items.length===0?(
        <div style={{textAlign:"center",padding:"48px 20px"}}>
          <div style={{fontSize:44,marginBottom:12}}>🛍️</div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:6,color:TXT}}>Liste vide</div>
          <div style={{fontSize:13,color:TXT3}}>Ajoutez un article ou importez une recette</div>
        </div>
      ):(
        <>
          {Object.entries(cats).map(([c,items])=>(
            <div key={c}><SecTitle>{c}</SecTitle>
              {items.map(item=><Item key={item.id} item={item} onToggle={toggle} onDel={del} onEqty={(id,qi)=>setEqty({itemId:id,qi})} onAqty={id=>setEqty({itemId:id,qi:null})}/>)}
            </div>
          ))}
          {chk.length>0&&<div><SecTitle>✓ Dans le panier ({chk.length})</SecTitle>{chk.map(item=><Item key={item.id} item={item} onToggle={toggle} onDel={del} onEqty={(id,qi)=>setEqty({itemId:id,qi})} onAqty={id=>setEqty({itemId:id,qi:null})}/>)}</div>}
          <div style={{display:"flex",gap:8,marginTop:8}}>
            <button style={{...btn("gh"),flex:1,fontSize:12}} onClick={clrChk}>🗑️ Supprimer cochés</button>
            <button style={{...btn("out"),flex:1,fontSize:12}} onClick={saveHist}>💾 Sauvegarder</button>
          </div>
        </>
      )}
      <EqtyModal open={!!eqty} item={eqty?db.items.find(i=>i.id===eqty.itemId):null} qi={eqty?.qi} onClose={()=>setEqty(null)} onConf={confEqty} onDel={delQty}/>
    </div>
  );
}

    const recipes=[...db.recipes];

    const nd={...db,recipes};setDb(nd);saveDB(nd);setShowEdit(false);showToast("🍽️ Recette enregistrée !");
  }
  function delRecipe(idx){
    if(!confirm("Supprimer cette recette ?"))return;
    const recipes=db.recipes.filter((_,i)=>i!==idx);
    const nd={...db,recipes};setDb(nd);saveDB(nd);setViewIdx(-1);showToast("🗑️ Recette supprimée");
  }
  function addToList(recipe,vp,haveIdxs){
    const base=recipe.persons||1,scale=vp/base;
    let ni=[...db.items],ph={...db.productHistory},added=0;
    recipe.ingredients.forEach((ing,i)=>{
      if(haveIdxs.has(i))return;
      const qN=ing.qty?roundQ(parseFloat(ing.qty)*scale):1,uv=ing.unit||"",n=ing.name;
      const ct=ph[n]?.category||guessCat(n);
      ni=mergeItem(ni,n,qN,uv,recipe.name,ct);
      if(!ph[n])ph[n]={count:0,category:ct,lastUnit:uv};ph[n].count++;added++;

    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);setViewIdx(-1);
    showToast(`✅ ${added} ingrédient${added>1?"s":""} ajouté${added>1?"s":""} à la liste`);

  return(
    <div style={{padding:14,paddingBottom:90}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>

      </div>
      {db.recipes.length===0?(
        <div style={{textAlign:"center",padding:"48px 20px"}}>
          <div style={{fontSize:44,marginBottom:12}}>🍴</div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:6,color:TXT}}>Aucune recette</div>
          <div style={{fontSize:13,color:TXT3}}>Créez votre première recette ou scannez une page de livre de cuisine</div>

        db.recipes.map((r,i)=>(
          <div key={r.id} style={{...card,padding:0,overflow:"hidden",cursor:"pointer",marginBottom:12,background:"rgba(255,255,255,.92)"}} onClick={()=>setViewIdx(i)}>
            <div style={{height:145,background:`linear-gradient(135deg,${CREAM2},${BDR})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:42,overflow:"hidden"}}>
              {r.photo?<img src={r.photo} alt={r.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:"🍽️"}
            </div>
            <div style={{padding:"11px 14px"}}>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:17,marginBottom:6,color:TXT}}>{r.name}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                <span style={{fontSize:11,background:CREAM2,padding:"3px 8px",borderRadius:20,color:TXT2,fontWeight:600}}>🥗 {r.ingredients.length} ingr.</span>
                {r.persons&&<span style={{fontSize:11,background:CREAM2,padding:"3px 8px",borderRadius:20,color:TXT2,fontWeight:600}}>👥 {r.persons} pers.</span>}
                {r.duration&&<span style={{fontSize:11,background:CREAM2,padding:"3px 8px",borderRadius:20,color:TXT2,fontWeight:600}}>⏱️ {r.duration}</span>}
                <span style={{fontSize:11,background:CREAM2,padding:"3px 8px",borderRadius:20,color:TXT2,fontWeight:600}}>📅 {r.date}</span>
              </div>
            </div>
          </div>
        ))
      )}
      {showEdit&&<RecipeEdit recipe={editIdx>=0?db.recipes[editIdx]:null} onSave={saveRecipe} onClose={()=>setShowEdit(false)} showToast={showToast}/>}
      {viewIdx>=0&&<RecipeView recipe={db.recipes[viewIdx]} onClose={()=>setViewIdx(-1)}
        onEdit={()=>{setViewIdx(-1);setTimeout(()=>{setEditIdx(viewIdx);setShowEdit(true);},200);}}
        onDel={()=>delRecipe(viewIdx)} onAdd={addToList}/>}
    </div>
  );
}

// ─── RECIPE EDIT ──────────────────────────────────────────────
function RecipeEdit({recipe,onSave,onClose,showToast}){
  const [name,setName]=useState(recipe?.name||"");
  const [persons,setPersons]=useState(recipe?.persons||"");
  const [duration,setDuration]=useState(recipe?.duration||"");
  const [photo,setPhoto]=useState(recipe?.photo||null);
  const [ings,setIngs]=useState(recipe?.ingredients?.length?recipe.ingredients.map(i=>({...i})):[{name:"",qty:"",unit:""}]);
  const [steps,setSteps]=useState(recipe?.steps?.length?[...recipe.steps]:[""]);
  const [scanning,setScanning]=useState(false);
  const [scanMsg,setScanMsg]=useState("");
  const [scanStatus,setScanStatus]=useState("idle");
  const [scannedRaw,setScannedRaw]=useState(null);
  const [cropSrc,setCropSrc]=useState(null);
  const [cropFor,setCropFor]=useState(null);
  const [showApiKey,setShowApiKey]=useState(false);
  // Multi-scan
  const [multiMode,setMultiMode]=useState(false);
  const [multiPhotos,setMultiPhotos]=useState([]);
  const [merging,setMerging]=useState(false);
  const scanRef=useRef(),photoRef=useRef(),multiRef=useRef();

  function handlePhoto(e){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();r.onload=ev=>setPhoto(ev.target.result);r.readAsDataURL(file);e.target.value="";
  }

  function handleScanFile(e){
    const file=e.target.files[0];if(!file)return;
    const mt=file.type||"image/jpeg";
    const r=new FileReader();r.onload=ev=>{
      const dataUrl=ev.target.result;
      setScannedRaw({dataUrl,mt});
      doScan(dataUrl,mt);
    };r.readAsDataURL(file);e.target.value="";
  }

  function handleMultiFile(e){
    const file=e.target.files[0];if(!file)return;
    const mt=file.type||"image/jpeg";
    const r=new FileReader();r.onload=ev=>{
      setMultiPhotos(prev=>[...prev,{dataUrl:ev.target.result,mt,id:Date.now()}]);
    };r.readAsDataURL(file);e.target.value="";
  }

  function removeMultiPhoto(id){setMultiPhotos(prev=>prev.filter(p=>p.id!==id));}

  async function doMultiScan(){
    if(multiPhotos.length<2){showToast("⚠️ Ajoutez au moins 2 photos");return;}
    const apiKey=localStorage.getItem("ws_apikey")||"";
    if(!apiKey){setShowApiKey(true);return;}
    setMerging(true);setScanMsg("");setScanStatus("idle");
    const prompt=`Tu es un expert en extraction de recettes de cuisine. On t'envoie ${multiPhotos.length} photos d'une même recette (pages successives ou zones qui se chevauchent).
TÂCHE : Fusionne toutes ces images en UNE SEULE recette cohérente.
RÈGLES DE FUSION :
- Si un ingrédient apparaît plusieurs fois (zones qui se recoupent), ne le garde qu'UNE seule fois
- Pour les étapes, reconstitue l'ordre logique même si elles sont sur des photos différentes
- Prends le titre de la photo qui le montre le mieux
- Si une photo montre une VRAIE PHOTOGRAPHIE d'un plat cuisiné où la nourriture occupe la majorité de l'image (sans texte dominant), "dishPhotoDataPresent":true. Une page de livre avec une petite illustration = false.
RETOURNE UNIQUEMENT ce JSON valide (sans markdown, sans backtick) :
{"title":null,"persons":null,"duration":null,"dishPhotoDataPresent":false,"ingredients":[{"name":"","qty":"","unit":""}],"steps":[]}
INSTRUCTIONS : qty=chiffre seul, unit=unité normalisée (g,kg,ml,cl,L,càs,càc,pincée,sachet,boîte,bouteille,paquet,tranche,botte), noms génériques sans marques, steps dans l'ordre logique`;
    try{
      const content=[
        ...multiPhotos.map((p,i)=>[
          {type:"text",text:`— Photo ${i+1}/${multiPhotos.length} :`},
          {type:"image",source:{type:"base64",media_type:p.mt,data:p.dataUrl.split(",")[1]}}
        ]).flat(),
        {type:"text",text:prompt}
      ];
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,messages:[{role:"user",content}]})
      });
      if(!resp.ok){
        const errData=await resp.json().catch(()=>({}));
        if(resp.status===401){localStorage.removeItem("ws_apikey");setShowApiKey(true);}
        throw new Error("Erreur "+resp.status+(errData.error?.message?" : "+errData.error.message:""));
      }
      const data=await resp.json();
      let text=(data.content||[]).map(c=>c.text||"").join("").trim();
      text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
      const p=JSON.parse(text);
      if(p.title)setName(p.title);
      if(p.persons)setPersons(String(p.persons));
      if(p.duration)setDuration(p.duration);
      if(p.dishPhotoDataPresent&&multiPhotos.length)setPhoto(multiPhotos[0].dataUrl);
      if(p.ingredients?.length)setIngs(p.ingredients.map(i=>({name:i.name||"",qty:i.qty||"",unit:normUnit(i.unit||"")})));
      if(p.steps?.length)setSteps(p.steps.map(s=>s.trim()).filter(Boolean));
      const nbI=p.ingredients?.filter(i=>i.name)?.length||0,nbS=p.steps?.length||0;
      setScanMsg(`✨ ${multiPhotos.length} photos fusionnées — ${nbI} ingrédient${nbI>1?"s":""}, ${nbS} étape${nbS>1?"s":""}`);
      setScanStatus("ok");setMultiMode(false);setMultiPhotos([]);
    }catch(err){
      console.error(err);setScanMsg("❌ "+err.message);setScanStatus("error");
    }
    setMerging(false);
  }

  function handleCropConfirm(dataUrl){
    if(cropFor==="photo"){setPhoto(dataUrl);setCropSrc(null);}
    else if(cropFor==="scan-retry"){setCropSrc(null);doScan(dataUrl,scannedRaw?.mt||"image/jpeg");}
  }

  async function doScan(dataUrl,mt="image/jpeg"){
    const apiKey=localStorage.getItem("ws_apikey")||"";
    if(!apiKey){setShowApiKey(true);return;}
    setScanning(true);setScanMsg("");setScanStatus("idle");
    const base64=dataUrl.split(",")[1];
    const prompt=`Tu es un expert en extraction de recettes de cuisine à partir d'images. Analyse cette image et retourne UNIQUEMENT un objet JSON valide (sans markdown, sans backtick, sans texte autour).

FORMAT EXACT :
{"title":null,"persons":null,"duration":null,"dishPhotoDataPresent":false,"ingredients":[{"name":"","qty":"","unit":""}],"steps":[]}

INSTRUCTIONS PRÉCISES :

1. IDENTIFICATION DU CONTENU :
   - Si l'image contient du TEXTE de recette (livre, magazine, fiche, écran) → extrais les données, "dishPhotoDataPresent":false
   - "dishPhotoDataPresent":true UNIQUEMENT si l'image est une VRAIE PHOTOGRAPHIE d'un plat cuisiné où la nourriture occupe la MAJORITÉ de l'image, sans texte dominant. Une page de livre avec une petite photo en haut = false. Une page avec des ingrédients illustrés = false. Seule une photo réelle d'un plat servi = true.

2. EXTRACTION DES INGRÉDIENTS (priorité absolue) :
   - Cherche la liste d'ingrédients même si elle est dans un encadré, une colonne latérale, ou en petit texte
   - qty = chiffre seul (ex: "200", "2", "0.5"), sans unité
   - unit = unité seule normalisée (g, kg, ml, cl, L, càs, càc, pincée, sachet, boîte, bouteille, paquet, tranche, botte)
   - Si pas de quantité précise : qty=""
   - Ignore les décorations, publicités, numéros de page

3. NOMS D'INGRÉDIENTS :
   - Utilise le nom générique en français (ex: "tomates cerises" et non "Tomates Cerises Barquette Bio")
   - Supprime les marques commerciales

4. title : titre principal de la recette, null si absent
5. persons : nombre de personnes (chiffre seul), null si absent  
6. duration : durée totale ou de préparation (ex: "45 min"), null si absente
7. steps : étapes numérotées extraites du texte, dans l'ordre, texte original conservé`;

    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-api-key":apiKey,
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true"
        },
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:3000,
          messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:mt,data:base64}},
            {type:"text",text:prompt}
          ]}]
        })
      });
      if(!resp.ok){
        const errData=await resp.json().catch(()=>({}));
        if(resp.status===401){
          throw new Error("Clé API invalide (401) — vérifiez sur console.anthropic.com");
        }
        throw new Error("Erreur "+resp.status+(errData.error?.message?" : "+errData.error.message:""));
      }
      const data=await resp.json();
      let text=(data.content||[]).map(c=>c.text||"").join("").trim();
      text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
      const p=JSON.parse(text);
      if(p.title)setName(p.title);
      if(p.persons)setPersons(String(p.persons));
      if(p.duration)setDuration(p.duration);
      // ✅ CORRECTION : utilise dishPhotoDataPresent pour mieux détecter la photo du plat
      if(p.dishPhotoDataPresent)setPhoto(dataUrl);
      if(p.ingredients?.length)setIngs(p.ingredients.map(i=>({name:i.name||"",qty:i.qty||"",unit:normUnit(i.unit||"")})));
      if(p.steps?.length)setSteps(p.steps.map(s=>s.trim()).filter(Boolean));
      // Message de résultat précis
      const nbIngr=p.ingredients?.filter(i=>i.name)?.length||0;
      const nbSteps=p.steps?.length||0;
      setScanMsg(`✨ ${nbIngr} ingrédient${nbIngr>1?"s":""} et ${nbSteps} étape${nbSteps>1?"s":""} extraits !`);
      setScanStatus("ok");
    }catch(err){
      console.error(err);
      if(err.message.includes("401")){
        localStorage.removeItem("ws_apikey");
        setShowApiKey(true);
      }
      setScanMsg("❌ "+err.message);setScanStatus("error");
    }
    setScanning(false);
  }

  function uIng(i,f,v){const n=[...ings];n[i]={...n[i],[f]:v};setIngs(n);}
  function uStep(i,v){const n=[...steps];n[i]=v;setSteps(n);}
  function doSave(){
    if(!name.trim()){showToast("⚠️ Donnez un nom à la recette");return;}
    onSave({id:recipe?.id||Date.now(),name:name.trim(),photo,persons:parseInt(persons)||null,duration:duration.trim()||null,
      ingredients:ings.filter(i=>i.name.trim()),steps:steps.filter(Boolean),
      date:recipe?.date||new Date().toLocaleDateString("fr-FR")});
  }

  return(
    <>
      <Modal open onClose={onClose}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:20,marginBottom:14}}>{recipe?"Modifier":"Nouvelle recette"}</div>

        {/* ── Photo du plat ── */}
        <span style={lbl}>Photo du plat</span>
        <div style={{border:`2px dashed ${BDR}`,borderRadius:12,padding:photo?0:16,textAlign:"center",cursor:photo?"default":"pointer",background:CREAM,overflow:"hidden",marginBottom:6}} onClick={()=>!photo&&photoRef.current.click()}>
          {photo
            ?<img src={photo} style={{width:"100%",maxHeight:140,objectFit:"cover",display:"block"}} alt=""/>
            :<><div style={{fontSize:24,marginBottom:4}}>📷</div><div style={{fontSize:11,color:TXT3}}>Galerie / appareil photo</div></>
          }
        </div>
        <input ref={photoRef} type="file" accept="image/*" style={{display:"none"}} onChange={handlePhoto} capture="environment"/>
        {photo&&(
          <div style={{display:"flex",gap:6,marginBottom:10}}>
            <button style={{...btn("gh"),flex:1,fontSize:11,padding:"6px 10px"}} onClick={()=>photoRef.current.click()}>🔄 Changer</button>
            <button style={{...btn("gh"),flex:1,fontSize:11,padding:"6px 10px"}} onClick={()=>{setCropSrc(photo);setCropFor("photo");}}>✂️ Recadrer</button>
            <button style={{...btn("dng"),fontSize:11,padding:"6px 10px"}} onClick={()=>setPhoto(null)}>✕</button>
          </div>
        )}

        {/* ── Scanner recette IA ── */}
        <span style={lbl}>Scanner une recette par IA</span>

        {/* Choix du mode */}
        {!multiMode&&(
          <div style={{display:"flex",gap:6,marginBottom:8}}>
            <div style={{flex:1,border:`2px dashed rgba(200,132,90,.35)`,borderRadius:12,padding:12,textAlign:"center",cursor:scanning?"not-allowed":"pointer",background:CREAM,opacity:scanning?.7:1}} onClick={()=>!scanning&&scanRef.current.click()}>
              <div style={{fontSize:20,marginBottom:2}}>{scanning?"⏳":"📷"}</div>
              <div style={{fontSize:11,color:CARAMEL2,fontWeight:700}}>{scanning?"Analyse…":"1 photo"}</div>
              <div style={{fontSize:9,color:TXT3,marginTop:1}}>Recette sur une page</div>
            </div>
            <div style={{flex:1,border:`2px dashed rgba(200,132,90,.35)`,borderRadius:12,padding:12,textAlign:"center",cursor:"pointer",background:CREAM}} onClick={()=>{setMultiMode(true);setMultiPhotos([]);setScanMsg("");}}>
              <div style={{fontSize:20,marginBottom:2}}>📷📷</div>
              <div style={{fontSize:11,color:CARAMEL2,fontWeight:700}}>Plusieurs photos</div>
              <div style={{fontSize:9,color:TXT3,marginTop:1}}>Recette sur 2+ pages</div>
            </div>
          </div>
        )}
        <input ref={scanRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleScanFile} capture="environment"/>
        <input ref={multiRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleMultiFile} capture="environment"/>

        {/* Mode multi-photos */}
        {multiMode&&(
          <div style={{background:CREAM2,border:`1.5px solid ${BDR}`,borderRadius:14,padding:12,marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:12,fontWeight:700,color:TXT}}>📷📷 Mode multi-photos</div>
              <button style={{...btn("gh"),fontSize:10,padding:"4px 8px"}} onClick={()=>{setMultiMode(false);setMultiPhotos([]);}}>✕ Annuler</button>
            </div>
            {/* Miniatures des photos ajoutées */}
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
              {multiPhotos.map((p,i)=>(
                <div key={p.id} style={{position:"relative",width:60,height:60}}>
                  <img src={p.dataUrl} style={{width:60,height:60,objectFit:"cover",borderRadius:8,border:`2px solid ${CARAMEL2}`}} alt={`Photo ${i+1}`}/>
                  <div style={{position:"absolute",top:-4,right:-4,width:18,height:18,borderRadius:"50%",background:DNG,color:"white",fontSize:10,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}} onClick={()=>removeMultiPhoto(p.id)}>✕</div>
                  <div style={{position:"absolute",bottom:2,left:2,background:"rgba(0,0,0,.55)",color:"white",fontSize:8,borderRadius:4,padding:"1px 4px",fontWeight:700}}>{i+1}</div>
                </div>
              ))}
              {/* Bouton ajouter photo */}
              <div style={{width:60,height:60,border:`2px dashed ${CARAMEL2}`,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",background:SURF,flexDirection:"column"}} onClick={()=>multiRef.current.click()}>
                <div style={{fontSize:18}}>+</div>
                <div style={{fontSize:8,color:TXT3}}>Photo</div>
              </div>
            </div>
            <div style={{fontSize:10,color:TXT3,marginBottom:8}}>
              {multiPhotos.length===0?"Ajoutez les photos dans l'ordre (début → fin de la recette)":
               multiPhotos.length===1?"Ajoutez au moins une 2ème photo":
               `${multiPhotos.length} photos prêtes — les zones en double seront fusionnées`}
            </div>
            <button style={{...btn("acc"),width:"100%",justifyContent:"center",fontSize:12}} onClick={doMultiScan} disabled={merging||multiPhotos.length<2}>
              {merging?"⏳ Fusion en cours…":`✨ Fusionner et analyser (${multiPhotos.length} photos)`}
            </button>
          </div>
        )}

        {/* Message de résultat */}
        {scanMsg&&(
          <div style={{marginBottom:8}}>
            <div style={{fontSize:11,textAlign:"center",padding:"6px 10px",borderRadius:8,background:scanStatus==="ok"?"rgba(90,138,58,.12)":"rgba(212,96,74,.12)",color:scanStatus==="ok"?SUC:DNG}}>{scanMsg}</div>
            {scanStatus==="error"&&scannedRaw&&(
              <button style={{...btn("gh"),width:"100%",fontSize:11,marginTop:5,justifyContent:"center"}} onClick={()=>{setCropSrc(scannedRaw.dataUrl);setCropFor("scan-retry");}}>
                ✂️ Recadrer l'image et réessayer
              </button>
            )}
            {scanStatus==="error"&&(
              <button style={{...btn("gh"),width:"100%",fontSize:11,marginTop:4,justifyContent:"center"}} onClick={()=>setShowApiKey(true)}>
                🔑 Configurer la clé API
              </button>
            )}
          </div>
        )}
        {!localStorage.getItem("ws_apikey")&&(
          <div style={{fontSize:11,color:TXT3,textAlign:"center",marginBottom:8,padding:"6px 10px",background:CREAM,borderRadius:8,borderLeft:`2px solid ${CARAMEL2}`}}>
            ⚠️ Clé API requise — <span style={{color:CARAMEL2,cursor:"pointer",fontWeight:600}} onClick={()=>setShowApiKey(true)}>Configurer</span>
          </div>
        )}

        <div style={{height:1,background:BDR,margin:"12px 0"}}/>
        <div style={{height:1,background:BDR,margin:"12px 0"}}/>
        <span style={lbl}>Nom de la recette</span>
        <input style={{...inp,marginBottom:10}} placeholder="Ex: Poulet rôti" value={name} onChange={e=>setName(e.target.value)}/>
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          <div style={{flex:1}}><span style={lbl}>Personnes</span><input style={inp} type="number" min="1" placeholder="4" value={persons} onChange={e=>setPersons(e.target.value)}/></div>
          <div style={{flex:1}}><span style={lbl}>Durée</span><input style={inp} placeholder="45 min" value={duration} onChange={e=>setDuration(e.target.value)}/></div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{...lbl,marginBottom:0}}>Ingrédients</span>
          <button style={{...btn("gh"),fontSize:11,padding:"5px 10px"}} onClick={()=>setIngs([...ings,{name:"",qty:"",unit:""}])}>+ Ajouter</button>
        </div>
        {ings.map((ing,i)=>(
          <div key={i} style={{display:"flex",gap:5,alignItems:"center",marginBottom:5,background:CREAM,borderRadius:10,padding:"6px 8px",border:`1px solid ${BDR}`}}>
            <input style={{flex:1,background:"transparent",border:"none",color:TXT,fontFamily:"inherit",fontSize:13,outline:"none",minWidth:0}} placeholder="Ingrédient…" value={ing.name} onChange={e=>uIng(i,"name",e.target.value)}/>
            <input style={{width:44,background:"transparent",border:"none",color:TXT2,fontFamily:"inherit",fontSize:13,textAlign:"right",outline:"none"}} placeholder="Qté" value={ing.qty} onChange={e=>uIng(i,"qty",e.target.value)}/>
            <select style={{width:58,background:"transparent",border:"none",color:TXT3,fontFamily:"inherit",fontSize:12,outline:"none",appearance:"none",cursor:"pointer"}} value={ing.unit} onChange={e=>uIng(i,"unit",e.target.value)}>{UNITS.map(u=><option key={u} value={u}>{UL[u]}</option>)}</select>
            <button style={{background:"none",border:"none",color:TXT3,cursor:"pointer",fontSize:13,padding:"0 2px"}} onClick={()=>setIngs(ings.filter((_,j)=>j!==i))}>✕</button>
          </div>
        ))}
        <div style={{height:1,background:BDR,margin:"12px 0"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{...lbl,marginBottom:0}}>Étapes de préparation</span>
          <button style={{...btn("gh"),fontSize:11,padding:"5px 10px"}} onClick={()=>setSteps([...steps,""])}>+ Étape</button>
        </div>
        {steps.map((step,i)=>(
          <div key={i} style={{display:"flex",gap:6,alignItems:"flex-start",marginBottom:6}}>
            <div style={{width:22,height:22,background:CARAMEL2,color:"white",borderRadius:"50%",fontSize:11,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:8}}>{i+1}</div>
            <textarea style={{...inp,flex:1,padding:"8px 10px",fontSize:13,resize:"none",minHeight:56}} value={step} onChange={e=>uStep(i,e.target.value)}/>
            <button style={{...btn("gh"),padding:"6px 8px",marginTop:4,fontSize:13}} onClick={()=>setSteps(steps.filter((_,j)=>j!==i))}>✕</button>
          </div>
        ))}
        <div style={{height:1,background:BDR,margin:"12px 0"}}/>
        <div style={{display:"flex",gap:8}}>
          <button style={{...btn("gh"),flex:1}} onClick={onClose}>Annuler</button>
          <button style={{...btn("suc"),flex:1}} onClick={doSave}>✅ Enregistrer</button>
        </div>
      </Modal>
      <CropModal open={!!cropSrc} src={cropSrc} onConfirm={handleCropConfirm} onClose={()=>setCropSrc(null)}/>
      <ApiKeyModal open={showApiKey} onSave={k=>{setShowApiKey(false);if(scannedRaw)doScan(scannedRaw.dataUrl,scannedRaw.mt);}} onClose={()=>setShowApiKey(false)}/>
    </>
  );
}

// ─── RECIPE VIEW ──────────────────────────────────────────────
function RecipeView({recipe,onClose,onEdit,onDel,onAdd}){
  const [vp,setVp]=useState(recipe.persons||1);
  const [have,setHave]=useState(new Set());
  const base=recipe.persons||1,scale=vp/base;
  function togHave(i){const s=new Set(have);if(s.has(i))s.delete(i);else s.add(i);setHave(s);}
  function scaleQ(qty){const n=parseFloat(qty);if(isNaN(n))return qty;const r=n*scale;return r%1===0?String(r):r.toFixed(2).replace(/\.?0+$/,"");}
  return(
    <Modal open onClose={onClose}>
      {recipe.photo&&<img src={recipe.photo} alt={recipe.name} style={{width:"100%",borderRadius:14,marginBottom:12,maxHeight:170,objectFit:"cover"}}/>}
      <div style={{fontFamily:"'Fraunces',serif",fontSize:20,marginBottom:10}}>{recipe.name}</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}}>
        {recipe.duration&&<span style={{fontSize:11,background:CREAM2,padding:"3px 8px",borderRadius:20,color:TXT2}}>⏱️ {recipe.duration}</span>}
        {recipe.persons&&<span style={{fontSize:11,background:CREAM2,padding:"3px 8px",borderRadius:20,color:TXT2}}>📖 Base: {recipe.persons} pers.</span>}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10,background:CREAM,border:`1px solid ${BDR}`,borderRadius:10,padding:"10px 14px",marginBottom:10}}>
        <label style={{fontSize:13,flex:1,color:TXT2}}>🍽️ Nombre de personnes</label>
        <Stepper value={vp} onChange={setVp}/>
      </div>
      {scale!==1&&<div style={{fontSize:11,color:CARAMEL2,textAlign:"center",marginBottom:8}}>Quantités ajustées ×{scale.toFixed(2).replace(/\.?0+$/,"")}</div>}
      <span style={lbl}>Ingrédients</span>
      <div style={{background:CREAM,border:`1px solid ${BDR}`,borderRadius:10,padding:"6px 12px",marginBottom:10}}>
        {recipe.ingredients.map((ing,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:i<recipe.ingredients.length-1?`1px solid ${BDR}`:"none",fontSize:13}}>
            <div onClick={()=>togHave(i)} style={{width:20,height:20,borderRadius:5,border:have.has(i)?"none":`1.5px solid ${BDR}`,background:have.has(i)?SUC:"transparent",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}>
              {have.has(i)&&<span style={{color:"white",fontSize:11,fontWeight:700}}>✓</span>}
            </div>
            <span style={{flex:1,textDecoration:have.has(i)?"line-through":"none",opacity:have.has(i)?.5:1}}>{ing.name}</span>
            <span style={{color:TXT3,fontSize:12}}>{scaleQ(ing.qty)}{ing.unit?" "+ing.unit:""}</span>
          </div>
        ))}
      </div>
      <div style={{fontSize:11,color:TXT3,marginBottom:12,padding:"8px 10px",background:CREAM,borderRadius:8,borderLeft:`2px solid ${CARAMEL2}`}}>
        ✅ Cochez les ingrédients que vous <strong style={{color:TXT}}>possédez déjà</strong>. Seuls les non cochés seront ajoutés.
      </div>
      {recipe.steps?.length>0&&(
        <>
          <span style={lbl}>Étapes de préparation</span>
          <div style={{background:CREAM,border:`1px solid ${BDR}`,borderRadius:10,padding:"6px 12px",marginBottom:12}}>
            {recipe.steps.map((step,i)=>(
              <div key={i} style={{display:"flex",gap:10,padding:"8px 0",borderBottom:i<recipe.steps.length-1?`1px solid ${BDR}`:"none",alignItems:"flex-start",fontSize:13,lineHeight:1.5,color:TXT2}}>
                <div style={{width:22,height:22,background:CARAMEL2,color:"white",borderRadius:"50%",fontSize:11,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:2}}>{i+1}</div>
                <div>{step}</div>
              </div>
            ))}
          </div>
        </>
      )}
      <div style={{display:"flex",gap:6,marginBottom:8}}>
        <button style={{...btn("gh"),flex:1,fontSize:11,padding:8}} onClick={onEdit}>✏️ Modifier</button>
        <button style={{...btn("dng"),flex:1,fontSize:11,padding:8}} onClick={onDel}>🗑️ Supprimer</button>
      </div>
      <div style={{display:"flex",gap:8}}>
        <button style={{...btn("gh"),flex:1}} onClick={onClose}>Fermer</button>
        <button style={{...btn("suc"),flex:1}} onClick={()=>onAdd(recipe,vp,have)}>🛒 Ajouter à la liste</button>
      </div>
    </Modal>
  );
}

// PAGE HISTORIQUE
// ═══════════════════════════════════════════════════════════════
function PageHistorique({db,setDb,showToast,goToListe}){
  const [qprod,setQprod]=useState(null);
  const [catF,setCatF]=useState("Toutes");

  function confQuick(name,cat,unit,qty){
    const ni=mergeItem(db.items,name,qty,unit,"manuel",cat);
    const ph={...db.productHistory};
    if(!ph[name])ph[name]={count:0,category:cat,lastUnit:unit};
    ph[name].count++;ph[name].lastUnit=unit;
    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);
    setQprod(null);goToListe();showToast("✅ "+name+" ajouté");
  }

  function reloadAll(idx){
    const s=db.shoppingHistory[idx];let ni=[...db.items];
    s.items.forEach(old=>{
      ni=mergeItem(ni,old.name,(old.quantities||[{qty:1,unit:""}])[0].qty,(old.quantities||[{qty:1,unit:""}])[0].unit,"historique",old.category);
    });
    const nd={...db,items:ni};setDb(nd);saveDB(nd);goToListe();showToast("🔄 Course rechargée");
  }

  function reloadSel(idx,selNames){
    const s=db.shoppingHistory[idx];let ni=[...db.items];
    s.items.filter(item=>selNames.has(item.name)).forEach(old=>{
      (old.quantities||[{qty:1,unit:"",source:"historique"}]).forEach(q=>{
        ni=mergeItem(ni,old.name,q.qty,q.unit,"historique",old.category);
      });
    });
    const nd={...db,items:ni};setDb(nd);saveDB(nd);goToListe();
    showToast(`✅ ${selNames.size} article${selNames.size>1?"s":""} ajouté${selNames.size>1?"s":""}`);
  }

  const allTop=Object.entries(db.productHistory).sort((a,b)=>b[1].count-a[1].count);
  const allCats=["Toutes",...[...new Set(allTop.map(([,d])=>d.category||"❓ Autre").filter(Boolean))]];
  const filtered=(catF==="Toutes"?allTop:allTop.filter(([,d])=>(d.category||"❓ Autre")===catF)).slice(0,24);

  return(
    <div style={{padding:14,paddingBottom:90}}>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:20,marginBottom:14}}>Historique</div>

      {allTop.length>0&&(
        <>
          <span style={lbl}>Produits fréquents</span>
          <div style={{display:"flex",gap:5,overflowX:"auto",marginBottom:10,paddingBottom:4,scrollbarWidth:"none"}}>
            {allCats.map(c=>(
              <div key={c} style={{background:catF===c?ACC:SURF3,color:catF===c?"#111":TXT2,borderRadius:20,padding:"4px 10px",fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0,border:catF===c?"none":`1px solid ${BDR}`}}
                onClick={()=>setCatF(c)}>{c}</div>
            ))}
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:18}}>
            {filtered.map(([name,d])=>(
              <div key={name} style={{background:CREAM2,borderRadius:20,padding:"4px 10px",fontSize:11,color:TXT2,cursor:"pointer",border:`1px solid ${BDR}`,display:"flex",alignItems:"center",gap:4}}
                onClick={()=>setQprod({name,category:d.category||guessCat(name),lastUnit:d.lastUnit||"",count:d.count})}>
                {name}<span style={{opacity:.5,fontSize:10}}>{d.count}×</span><span style={{color:CARAMEL2,fontSize:14,fontWeight:700}}>+</span>
              </div>
            ))}
          </div>
        </>
      )}

      {db.shoppingHistory.length>0?(
        <>
          <span style={lbl}>Courses passées</span>
          {db.shoppingHistory.map((s,i)=>(
            <HistorySession key={i} session={s} onReloadAll={()=>reloadAll(i)} onReloadSelected={sel=>reloadSel(i,sel)}/>
          ))}
        </>
      ):allTop.length===0?(
        <div style={{textAlign:"center",padding:"48px 20px"}}>
          <div style={{fontSize:44,marginBottom:12}}>📦</div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:6}}>Aucun historique</div>
          <div style={{fontSize:13,color:TXT3}}>Vos courses passées apparaîtront ici</div>
        </div>
      ):null}

      <QuickAddModal open={!!qprod} product={qprod} onConfirm={confQuick} onClose={()=>setQprod(null)}/>
    </div>
  );
}

// SYNC FIREBASE
// ═══════════════════════════════════════════════════════════════
function hashPassword(pwd){
  let h=0;for(let i=0;i<pwd.length;i++){h=((h<<5)-h)+pwd.charCodeAt(i);h|=0;}
  return Math.abs(h).toString(36);
}

// Génère un ID unique aléatoire pour un nouveau foyer
function genFoyerId(){
  const chars="abcdefghijklmnopqrstuvwxyz0123456789";
  let id="";for(let i=0;i<10;i++)id+=chars[Math.floor(Math.random()*chars.length)];
  return id;
}

// Récupère le code d'invitation depuis l'URL (?invite=xxx)
function getInviteFromUrl(){
  const p=new URLSearchParams(window.location.search);
  return p.get("invite")||null;
}

function LoginScreen({onLogin}){
  const inviteCode=getInviteFromUrl();
  const [mode,setMode]=useState(inviteCode?"rejoindre":"choix"); // choix | creer | rejoindre
  const [pseudo,setPseudo]=useState(()=>localStorage.getItem("ws_pseudo")||"");
  const [pwd,setPwd]=useState(()=>localStorage.getItem("ws_pwd_saved")||"");
  const [remember,setRemember]=useState(!!localStorage.getItem("ws_pwd_saved"));
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const [inviteLink,setInviteLink]=useState("");
  const [showInvite,setShowInvite]=useState(false);
  const [copied,setCopied]=useState(false);

  async function creerFoyer(){
    if(!pseudo.trim()){setErr("Entrez votre prénom");return;}
    if(!pwd.trim()||pwd.length<4){setErr("Mot de passe trop court (min. 4 caractères)");return;}
    setLoading(true);setErr("");
    const foyerId=genFoyerId();
    const docId="foyer_"+foyerId+"_"+hashPassword(pwd.trim());
    try{
      const{fsdb,doc,setDoc}=window._firebase;
      const ref=doc(fsdb,"households",docId);
      await setDoc(ref,{items:[],productHistory:{},recipes:[],shoppingHistory:[],foyerId,createdAt:Date.now(),members:[pseudo.trim()]});
      localStorage.setItem("ws_pseudo",pseudo.trim());
      localStorage.setItem("ws_docid",docId);
      localStorage.setItem("ws_foyerid",foyerId);
      if(remember){localStorage.setItem("ws_pwd_saved",pwd.trim());}else{localStorage.removeItem("ws_pwd_saved");}
      // Afficher le lien d'invitation
      const link=`${window.location.origin}${window.location.pathname}?invite=${foyerId}`;
      setInviteLink(link);
      setShowInvite(true);
      onLogin(docId,pseudo.trim());
    }catch(e){setErr("Erreur : "+e.message);}
    setLoading(false);
  }

  async function rejoindre(){
    if(!pseudo.trim()){setErr("Entrez votre prénom");return;}
    if(!pwd.trim()||pwd.length<4){setErr("Mot de passe trop court (min. 4 caractères)");return;}
    const fid=inviteCode||"";
    if(!fid){setErr("Code d'invitation manquant");return;}
    setLoading(true);setErr("");
    const docId="foyer_"+fid+"_"+hashPassword(pwd.trim());
    try{
      const{fsdb,doc,getDoc,setDoc}=window._firebase;
      const ref=doc(fsdb,"households",docId);
      const snap=await getDoc(ref);
      if(!snap.exists()){setErr("Mot de passe incorrect ou lien invalide");setLoading(false);return;}
      // Ajouter le membre si pas déjà présent
      const data=snap.data();
      const members=[...(data.members||[])];
      if(!members.includes(pseudo.trim()))members.push(pseudo.trim());
      await setDoc(ref,{...data,members},{merge:true});
      localStorage.setItem("ws_pseudo",pseudo.trim());
      localStorage.setItem("ws_docid",docId);
      localStorage.setItem("ws_foyerid",fid);
      if(remember){localStorage.setItem("ws_pwd_saved",pwd.trim());}else{localStorage.removeItem("ws_pwd_saved");}
      onLogin(docId,pseudo.trim());
    }catch(e){setErr("Erreur : "+e.message);}
    setLoading(false);
  }

  function copyLink(){
    navigator.clipboard.writeText(inviteLink).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
  }

  // Écran lien partagé (après création)
  if(showInvite){
    return(
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:"rgba(255,255,255,.95)",borderRadius:24,padding:32,width:"100%",maxWidth:380,border:`1px solid ${BDR}`,boxShadow:"0 20px 60px rgba(160,90,40,.15)"}}>
          <div style={{textAlign:"center",marginBottom:20}}>
            <div style={{fontSize:44,marginBottom:8}}>🎉</div>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:22,color:CARAMEL,fontWeight:900}}>Foyer créé !</div>
            <div style={{fontSize:12,color:TXT3,marginTop:6}}>Partagez ce lien avec votre foyer pour qu'ils rejoignent votre liste</div>
          </div>
          <div style={{background:CREAM2,border:`1.5px solid ${BDR}`,borderRadius:14,padding:"12px 14px",marginBottom:12,wordBreak:"break-all",fontSize:11,color:TXT2,lineHeight:1.6}}>{inviteLink}</div>
          <button style={{...btn("acc"),width:"100%",justifyContent:"center",marginBottom:10,fontSize:13}} onClick={copyLink}>
            {copied?"✅ Lien copié !":"📋 Copier le lien d'invitation"}
          </button>
          <div style={{fontSize:10,color:TXT3,textAlign:"center",lineHeight:1.6}}>⚠️ Ce lien + votre mot de passe permettent d'accéder au foyer. Partagez-les uniquement avec les personnes de confiance.</div>
        </div>
      </div>
    );
  }

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"rgba(255,255,255,.92)",borderRadius:24,padding:28,width:"100%",maxWidth:380,border:`1px solid ${BDR}`,boxShadow:"0 20px 60px rgba(160,90,40,.15)"}}>

        {/* Logo */}
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontSize:48,marginBottom:8}}>🛒</div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:28,color:CARAMEL,fontWeight:900,letterSpacing:-.5}}>Wisely Shop</div>
          <div style={{fontSize:12,color:TXT3,marginTop:4,fontWeight:500}}>Votre assistant du quotidien pour le foyer</div>
        </div>

        {/* Choix initial */}
        {mode==="choix"&&(
          <>
            <button style={{...btn("acc"),width:"100%",justifyContent:"center",marginBottom:10,fontSize:13,padding:"13px"}} onClick={()=>setMode("creer")}>
              🏠 Créer un nouveau foyer
            </button>
            <button style={{...btn("out"),width:"100%",justifyContent:"center",fontSize:13,padding:"13px"}} onClick={()=>setMode("rejoindre")}>
              🔗 Rejoindre via un lien
            </button>
            <div style={{fontSize:11,color:TXT3,textAlign:"center",marginTop:14,lineHeight:1.7}}>
              Pour rejoindre le foyer de quelqu'un,<br/>utilisez le lien d'invitation qu'il vous a partagé.
            </div>
          </>
        )}

        {/* Créer un foyer */}
        {mode==="creer"&&(
          <>
            <div style={{fontSize:13,fontWeight:700,color:TXT,marginBottom:14}}>🏠 Créer votre foyer</div>
            <span style={lbl}>Votre prénom</span>
            <input style={{...inp,marginBottom:10}} placeholder="Ex: Thomas" value={pseudo} onChange={e=>setPseudo(e.target.value)}/>
            <span style={lbl}>Mot de passe du foyer</span>
            <input style={{...inp,marginBottom:4,letterSpacing:2}} type="password" placeholder="Min. 4 caractères" value={pwd} onChange={e=>setPwd(e.target.value)} onKeyDown={e=>e.key==="Enter"&&creerFoyer()}/>
            <div style={{fontSize:10,color:TXT3,marginBottom:12,lineHeight:1.5}}>Ce mot de passe sera demandé à chaque membre qui rejoint votre foyer.</div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,cursor:"pointer"}} onClick={()=>setRemember(!remember)}>
              <div style={{width:18,height:18,borderRadius:5,border:`2px solid ${remember?CARAMEL:BDR}`,background:remember?CARAMEL:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                {remember&&<span style={{color:"white",fontSize:10,fontWeight:800}}>✓</span>}
              </div>
              <span style={{fontSize:12,color:TXT2,fontWeight:500}}>Se souvenir de moi sur cet appareil</span>
            </div>
            {err&&<div style={{fontSize:12,color:DNG,marginBottom:8,fontWeight:600}}>{err}</div>}
            <button style={{...btn("acc"),width:"100%",justifyContent:"center",marginBottom:8,fontSize:13,padding:"13px"}} onClick={creerFoyer} disabled={loading}>
              {loading?"Création…":"✨ Créer mon foyer"}
            </button>
            <button style={{...btn("gh"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>setMode("choix")}>← Retour</button>
          </>
        )}

        {/* Rejoindre via lien */}
        {mode==="rejoindre"&&(
          <>
            <div style={{fontSize:13,fontWeight:700,color:TXT,marginBottom:14}}>🔗 Rejoindre un foyer</div>
            {inviteCode
              ?<div style={{background:CREAM2,border:`1px solid ${BDR}`,borderRadius:10,padding:"8px 12px",marginBottom:12,fontSize:11,color:TXT2}}>🔗 Code d'invitation détecté : <strong style={{color:CARAMEL}}>{inviteCode}</strong></div>
              :<div style={{background:"rgba(212,96,74,.08)",border:`1px solid rgba(212,96,74,.2)`,borderRadius:10,padding:"8px 12px",marginBottom:12,fontSize:11,color:DNG}}>⚠️ Aucun lien d'invitation détecté. Utilisez le lien complet partagé par votre foyer.</div>
            }
            <span style={lbl}>Votre prénom</span>
            <input style={{...inp,marginBottom:10}} placeholder="Ex: Sophie" value={pseudo} onChange={e=>setPseudo(e.target.value)}/>
            <span style={lbl}>Mot de passe du foyer</span>
            <input style={{...inp,marginBottom:4,letterSpacing:2}} type="password" placeholder="••••••••" value={pwd} onChange={e=>setPwd(e.target.value)} onKeyDown={e=>e.key==="Enter"&&rejoindre()}/>
            <div style={{fontSize:10,color:TXT3,marginBottom:12,lineHeight:1.5}}>Le mot de passe vous a été communiqué par la personne qui a créé le foyer.</div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,cursor:"pointer"}} onClick={()=>setRemember(!remember)}>
              <div style={{width:18,height:18,borderRadius:5,border:`2px solid ${remember?CARAMEL:BDR}`,background:remember?CARAMEL:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                {remember&&<span style={{color:"white",fontSize:10,fontWeight:800}}>✓</span>}
              </div>
              <span style={{fontSize:12,color:TXT2,fontWeight:500}}>Se souvenir de moi sur cet appareil</span>
            </div>
            {err&&<div style={{fontSize:12,color:DNG,marginBottom:8,fontWeight:600}}>{err}</div>}
            <button style={{...btn("acc"),width:"100%",justifyContent:"center",marginBottom:8,fontSize:13,padding:"13px"}} onClick={rejoindre} disabled={loading||!inviteCode}>
              {loading?"Connexion…":"🔓 Rejoindre le foyer"}
            </button>
            <button style={{...btn("gh"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>setMode("choix")}>← Retour</button>
          </>
        )}

      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// APP ROOT
// ═══════════════════════════════════════════════════════════════
function App(){
  const [page,setPage]=useState("liste");
  const [db,setDb]=useState(EMPTY_DB);
  const [toast,setToast]=useState("");
  const [pseudo,setPseudo]=useState(()=>localStorage.getItem("ws_pseudo")||"");
  const [docId,setDocId]=useState(()=>localStorage.getItem("ws_docid")||null);
  const [fbReady,setFbReady]=useState(!!window._firebaseReady);
  const ttRef=useRef(null);
  const localRef=useRef(false);

  // Attendre que Firebase soit prêt
  useEffect(()=>{
    if(window._firebaseReady){setFbReady(true);return;}
    const h=()=>setFbReady(true);
    window.addEventListener("firebaseReady",h);
    return()=>window.removeEventListener("firebaseReady",h);
  },[]);

  // Écouter les changements Firestore en temps réel
  useEffect(()=>{
    if(!docId||!fbReady)return;
    const{fsdb,doc,onSnapshot}=window._firebase;
    const ref=doc(fsdb,"households",docId);
    const unsub=onSnapshot(ref,snap=>{
      if(!snap.exists())return;
      if(localRef.current){localRef.current=false;return;}
      const data=snap.data();
      setDb({
        items:data.items||[],
        productHistory:data.productHistory||{},
        recipes:data.recipes||[],
        shoppingHistory:data.shoppingHistory||[]
      });
    });
    return()=>unsub();
  },[docId,fbReady]);

  function showToast(msg){setToast(msg);clearTimeout(ttRef.current);ttRef.current=setTimeout(()=>setToast(""),2800);}

  // Sauvegarder dans Firestore + localStorage
  function setDbSync(newDb){
    setDb(newDb);
    // localStorage fallback
    try{localStorage.setItem("ws_r1",JSON.stringify(newDb));}catch{}
    // Firestore sync
    if(docId&&fbReady){
      localRef.current=true;
      const{fsdb,doc,setDoc}=window._firebase;
      const ref=doc(fsdb,"households",docId);
      setDoc(ref,{
        items:newDb.items||[],
        productHistory:newDb.productHistory||{},
        recipes:newDb.recipes||[],
        shoppingHistory:newDb.shoppingHistory||[]
      }).catch(e=>console.error("Sync error:",e));
    }
  }

  function handleLogin(id,name){
    setDocId(id);
    setPseudo(name||localStorage.getItem("ws_pseudo")||"");
  }

  function handleLogout(){
    localStorage.removeItem("ws_docid");
    localStorage.removeItem("ws_foyerid");
    // Ne pas supprimer ws_pseudo et ws_pwd_saved si "se souvenir" était coché
    setDocId(null);
    setDb(EMPTY_DB);
  }

  if(!fbReady){
    return(
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:TXT3,fontSize:14,fontWeight:600}}>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:40,marginBottom:12}}>🛒</div>
          Chargement…
        </div>
      </div>
    );
  }

  if(!docId){
    return <LoginScreen onLogin={handleLogin}/>;
  }

  return(
    <div style={{minHeight:"100vh",maxWidth:480,margin:"0 auto",fontFamily:"'Plus Jakarta Sans',sans-serif",color:TXT,position:"relative",overflowX:"hidden"}}>
      {/* HEADER */}
      <div style={{padding:"18px 18px 0",position:"relative"}}>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 80% 20%, rgba(255,255,255,.12) 0%, transparent 60%)",pointerEvents:"none"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",position:"relative"}}>
          <div>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:900,color:"white",letterSpacing:-.3}}>🛒 Wisely Shop</div>
            {pseudo?<div style={{fontSize:11,color:"rgba(255,255,255,.75)",marginTop:2,fontWeight:600}}>Bonjour {pseudo} 👋</div>
            :<div style={{fontSize:10,color:"rgba(255,255,255,.6)",marginTop:2,fontWeight:600}}>Synchronisé en temps réel ☁️</div>}
          </div>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <button style={{background:"rgba(255,255,255,.2)",border:"1.5px solid rgba(255,255,255,.35)",color:"white",borderRadius:12,padding:"7px 10px",fontFamily:"'Plus Jakarta Sans',sans-serif",fontWeight:700,fontSize:10,cursor:"pointer"}}
              onClick={()=>{
                const fid=localStorage.getItem("ws_foyerid");
                if(fid){const link=`${window.location.origin}${window.location.pathname}?invite=${fid}`;navigator.clipboard.writeText(link).then(()=>showToast("🔗 Lien copié !"));}
              }}>🔗</button>
            <button style={{background:"rgba(255,255,255,.2)",border:"1.5px solid rgba(255,255,255,.35)",color:"white",borderRadius:12,padding:"7px 12px",fontFamily:"'Plus Jakarta Sans',sans-serif",fontWeight:700,fontSize:11,cursor:"pointer"}} onClick={handleLogout}>🔒 Déco.</button>
          </div>
        </div>
        {/* NAV TABS */}
        <div style={{display:"flex",marginTop:14,gap:2,paddingBottom:0}}>
          {[{id:"liste",icon:"📋",label:"Liste"},{id:"recettes",icon:"🍽️",label:"Recettes"},{id:"historique",icon:"🕐",label:"Historique"}].map(t=>(
            <div key={t.id} style={{flex:1,padding:"9px 3px",textAlign:"center",fontSize:9,fontWeight:700,letterSpacing:.5,textTransform:"uppercase",color:page===t.id?"white":"rgba(255,255,255,.55)",cursor:"pointer",borderBottom:page===t.id?"2.5px solid white":"2.5px solid transparent",transition:"all .2s",userSelect:"none"}} onClick={()=>setPage(t.id)}>
              <span style={{fontSize:15,display:"block",marginBottom:2}}>{t.icon}</span>{t.label}
            </div>
          ))}
        </div>
      </div>
      {/* PAGE CONTENT */}
      <div style={{background:"rgba(255,255,255,.04)",minHeight:"calc(100vh - 120px)"}}>
        {page==="liste"&&<PageListe db={db} setDb={setDbSync} showToast={showToast}/>}
        {page==="recettes"&&<PageRecettes db={db} setDb={setDbSync} showToast={showToast}/>}
        {page==="historique"&&<PageHistorique db={db} setDb={setDbSync} showToast={showToast} goToListe={()=>setPage("liste")}/>}
      </div>
      <Toast msg={toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js").catch(()=>{});
}
</script>
</body>
</html>
