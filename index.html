      const key=item.genericName.toLowerCase().trim();
      if(!newPriceDB[key])newPriceDB[key]={shops:{}};
      const ref=pricePerKg(item.price,item.qty,item.unit);
      newPriceDB[key].shops[shop]={price:item.price,qty:item.qty||"",unit:item.unit||"",priceRef:ref,updatedAt:now,originalName:item.originalName};
    });
    const total=selected.reduce((s,i)=>s+i.price,0);
    const sessions=[{date:new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long"}),shop,total:Math.round(total*100)/100,count:selected.length,ts:now},...(db.budget?.sessions||[])].slice(0,50);
    setDb({...db,priceDB:newPriceDB,budget:{...(db.budget||{}),sessions}});
    showToast(`💾 ${selected.length} prix sauvegardés !`);
    setScanResult(null);setScanPhotos([]);setScanMsg("");setScanStatus("idle");setShopName("");
    setTab("base");
  }

  const priceEntries=Object.entries(db.priceDB||{}).filter(([k])=>!searchPrice||k.includes(searchPrice.toLowerCase()));
  const sessions=db.budget?.sessions||[];
  const monthlyBudget=db.budget?.monthly||0;
  const now2=new Date();
  const thisMonthTotal=sessions.filter(s=>{const d=new Date(s.ts);return d.getMonth()===now2.getMonth()&&d.getFullYear()===now2.getFullYear();}).reduce((s,i)=>s+i.total,0);
  const budgetPct=monthlyBudget>0?Math.min(100,Math.round(thisMonthTotal/monthlyBudget*100)):0;
  const budgetColor=budgetPct>90?DNG:budgetPct>70?"#c8843a":SUC;
  const currentMonth=now2.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});

  return(
    <div style={{padding:14,paddingBottom:90}}>
      {/* Sous-onglets */}
      <div style={{display:"flex",gap:4,marginBottom:14,background:"rgba(255,255,255,.6)",borderRadius:14,padding:4}}>
        {[{id:"scanner",label:"📷 Scanner"},{id:"base",label:"💰 Base prix"},{id:"budget",label:"📊 Budget"}].map(t=>(
          <div key={t.id} style={{flex:1,padding:"8px 4px",textAlign:"center",fontSize:11,fontWeight:700,borderRadius:10,background:tab===t.id?SURF:"transparent",color:tab===t.id?CARAMEL:TXT3,cursor:"pointer",transition:"all .2s",boxShadow:tab===t.id?"0 2px 8px rgba(160,90,40,.1)":"none"}} onClick={()=>setTab(t.id)}>
            {t.label}
          </div>
        ))}
      </div>

      {tab==="scanner"&&(
        <>
          <div style={{...card,background:"rgba(255,255,255,.9)"}}>
            <span style={lbl}>Magasin</span>
            <input style={inp} placeholder="Ex: Carrefour, Lidl, Monoprix…" value={shopName} onChange={e=>setShopName(e.target.value)}/>
          </div>
          <div style={{...card,background:"rgba(255,255,255,.9)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <span style={{...lbl,marginBottom:0}}>Photos du ticket</span>
              <span style={{fontSize:10,color:TXT3}}>Plusieurs si ticket long</span>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
              {scanPhotos.map((p,i)=>(
                <div key={p.id} style={{position:"relative",width:64,height:64}}>
                  <img src={p.dataUrl} style={{width:64,height:64,objectFit:"cover",borderRadius:10,border:`2px solid ${CARAMEL2}`}} alt={`Ticket ${i+1}`}/>
                  <div style={{position:"absolute",top:-4,right:-4,width:18,height:18,borderRadius:"50%",background:DNG,color:"white",fontSize:10,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}} onClick={()=>setScanPhotos(prev=>prev.filter(x=>x.id!==p.id))}>✕</div>
                  <div style={{position:"absolute",bottom:2,left:2,background:"rgba(0,0,0,.5)",color:"white",fontSize:8,borderRadius:4,padding:"1px 4px",fontWeight:700}}>{i+1}</div>
                </div>
              ))}
              <div style={{width:64,height:64,border:`2px dashed ${CARAMEL2}`,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",background:SURF,flexDirection:"column",gap:2}} onClick={()=>scanRef.current.click()}>
                <div style={{fontSize:22}}>📷</div>
                <div style={{fontSize:8,color:TXT3,fontWeight:600}}>Ajouter</div>
              </div>
            </div>
            <input ref={scanRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleScanFile} capture="environment"/>
            {scanPhotos.length>0&&(
              <button style={{...btn("acc"),width:"100%",justifyContent:"center",fontSize:13}} onClick={doTicketScan} disabled={scanning||!shopName.trim()}>
                {scanning?"⏳ Analyse en cours…":`🔍 Analyser ${scanPhotos.length} photo${scanPhotos.length>1?"s":""}`}
              </button>
            )}
            {!shopName.trim()&&scanPhotos.length>0&&<div style={{fontSize:10,color:DNG,textAlign:"center",marginTop:6,fontWeight:600}}>⚠️ Indiquez d'abord le magasin</div>}
          </div>
          {scanMsg&&<div style={{fontSize:12,textAlign:"center",padding:"8px 12px",borderRadius:10,background:scanStatus==="ok"?"rgba(90,138,58,.1)":"rgba(212,96,74,.1)",color:scanStatus==="ok"?SUC:DNG,marginBottom:10,fontWeight:600}}>{scanMsg}</div>}
          {scanResult&&(
            <div style={{...card,background:"rgba(255,255,255,.95)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <div style={{fontFamily:"'Fraunces',serif",fontSize:16,color:TXT}}>Valider les articles</div>
                <div style={{display:"flex",gap:6}}>
                  <button style={{...btn("gh"),fontSize:10,padding:"4px 8px"}} onClick={()=>setScanResult(prev=>prev.map(i=>({...i,selected:true})))}>Tout</button>
                  <button style={{...btn("gh"),fontSize:10,padding:"4px 8px"}} onClick={()=>setScanResult(prev=>prev.map(i=>({...i,selected:false})))}>Aucun</button>
                </div>
              </div>
              <div style={{maxHeight:320,overflowY:"auto"}}>
                {scanResult.map((item,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 4px",borderBottom:i<scanResult.length-1?`1px solid ${BDR}`:"none",cursor:"pointer",background:item.selected?"rgba(200,132,90,.06)":"transparent",borderRadius:6}} onClick={()=>toggleItem(i)}>
                    <div style={{width:18,height:18,borderRadius:5,border:`2px solid ${item.selected?CARAMEL:BDR}`,background:item.selected?CARAMEL:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                      {item.selected&&<span style={{color:"white",fontSize:10,fontWeight:800}}>✓</span>}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:700,color:TXT}}>{item.genericName}</div>
                      {item.originalName&&item.originalName!==item.genericName&&<div style={{fontSize:9,color:TXT3}}>{item.originalName}</div>}
                      {item.qty&&<div style={{fontSize:10,color:TXT2}}>{item.qty}{item.unit}{item.unit&&fmtPriceRef(item.price,item.qty,item.unit)?` · ${fmtPriceRef(item.price,item.qty,item.unit)}`:""}</div>}
                    </div>
                    <div style={{fontSize:14,fontWeight:800,color:CARAMEL,flexShrink:0}}>{item.price.toFixed(2)}€</div>
                  </div>
                ))}
              </div>
              <div style={{borderTop:`1px solid ${BDR}`,marginTop:8,paddingTop:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontSize:12,color:TXT2,fontWeight:600}}>
                  {scanResult.filter(i=>i.selected).length} art. · <strong style={{color:CARAMEL}}>{scanResult.filter(i=>i.selected).reduce((s,i)=>s+i.price,0).toFixed(2)}€</strong>
                </div>
                <button style={{...btn("acc"),fontSize:12}} onClick={savePrices}>💾 Sauvegarder</button>
              </div>
            </div>
          )}
        </>
      )}

      {tab==="base"&&(
        <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:18,color:TXT}}>Ma base de prix</div>
            <button style={{...btn("gh"),fontSize:11,padding:"5px 10px"}} onClick={togglePriceVisible}>
              {showPriceVisible?"🙈 Masquer":"👁️ Afficher"} liste
            </button>
          </div>
          {priceEntries.length===0?(
            <div style={{textAlign:"center",padding:"40px 20px"}}>
              <div style={{fontSize:40,marginBottom:10}}>💰</div>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:16,color:TXT,marginBottom:6}}>Aucun prix enregistré</div>
              <div style={{fontSize:12,color:TXT3}}>Scannez un ticket pour commencer</div>
            </div>
          ):(
            <>
              <input style={{...inp,marginBottom:10}} placeholder="🔍 Rechercher un produit…" value={searchPrice} onChange={e=>setSearchPrice(e.target.value)}/>
              {priceEntries.map(([name,data])=>{
                const shops=Object.entries(data.shops||{});
                if(!shops.length)return null;
                const best=shops.sort((a,b)=>{
                  const ra=a[1].priceRef?.value??a[1].price;
                  const rb=b[1].priceRef?.value??b[1].price;
                  return ra-rb;
                })[0];
                return(
                  <div key={name} style={{...card,background:"rgba(255,255,255,.9)",marginBottom:8}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
                      <div style={{fontWeight:700,fontSize:13,color:TXT,textTransform:"capitalize"}}>{name}</div>
                      <span style={{fontSize:14}}>{priceFreshness(best[1]?.updatedAt)}</span>
                    </div>
                    {shops.map(([shop,info])=>(
                      <div key={shop} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 8px",background:shop===best[0]?CREAM2:"transparent",borderRadius:8,marginBottom:3}}>
                        <div>
                          <span style={{fontSize:12,fontWeight:600,color:TXT2}}>{shop}</span>
                          {info.qty&&<span style={{fontSize:10,color:TXT3,marginLeft:5}}>{info.qty} {info.unit}</span>}
                        </div>
                        <div style={{textAlign:"right"}}>
                          <div style={{fontSize:13,fontWeight:800,color:CARAMEL}}>{info.price?.toFixed(2)}€</div>
                          {info.priceRef&&<div style={{fontSize:9,color:TXT3}}>{info.priceRef.value.toFixed(2)}{info.priceRef.label}</div>}
                        </div>
                      </div>
                    ))}
                    {shops.length>1&&<div style={{fontSize:10,color:SUC,marginTop:4,fontWeight:600}}>✓ Meilleur prix : {best[0]}</div>}
                  </div>
                );
              })}
            </>
          )}
        </>
      )}

      {tab==="budget"&&(
        <>
          <div style={{...card,background:"rgba(255,255,255,.9)",marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:16,color:TXT}}>Budget {currentMonth}</div>
              <button style={{...btn("gh"),fontSize:11,padding:"5px 10px"}} onClick={()=>{setBudgetInput(String(monthlyBudget||""));setShowBudgetEdit(true);}}>✏️ Modifier</button>
            </div>
            {monthlyBudget>0?(
              <>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                  <span style={{fontSize:13,color:TXT2}}>Dépensé ce mois</span>
                  <span style={{fontSize:14,fontWeight:800,color:budgetColor}}>{thisMonthTotal.toFixed(2)}€ / {monthlyBudget}€</span>
                </div>
                <div style={{height:8,background:CREAM2,borderRadius:4,overflow:"hidden"}}>
                  <div style={{height:"100%",width:budgetPct+"%",background:`linear-gradient(90deg,${SUC},${budgetColor})`,borderRadius:4,transition:"width .4s"}}/>
                </div>
                <div style={{fontSize:10,color:TXT3,marginTop:4,textAlign:"right"}}>{budgetPct}% · {Math.max(0,monthlyBudget-thisMonthTotal).toFixed(2)}€ restant</div>
              </>
            ):(
              <div style={{fontSize:12,color:TXT3,textAlign:"center",padding:"8px 0"}}>Définissez une enveloppe mensuelle pour suivre votre budget</div>
            )}
          </div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:16,color:TXT,marginBottom:10}}>Historique des courses</div>
          {sessions.length===0?(
            <div style={{textAlign:"center",padding:"30px 20px",color:TXT3,fontSize:12}}>Aucune course enregistrée</div>
          ):(
            sessions.map((s,i)=>(
              <div key={i} style={{...card,background:"rgba(255,255,255,.85)",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",marginBottom:6}}>
                <div>
                  <div style={{fontSize:13,fontWeight:700,color:TXT}}>{s.shop}</div>
                  <div style={{fontSize:10,color:TXT3,marginTop:2}}>{s.date} · {s.count} articles</div>
                </div>
                <div style={{fontSize:15,fontWeight:900,color:CARAMEL}}>{s.total?.toFixed(2)}€</div>
              </div>
            ))
          )}
        </>
      )}

      <Modal open={showBudgetEdit} onClose={()=>setShowBudgetEdit(false)}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:10,color:TXT}}>💰 Budget mensuel</div>
        <span style={lbl}>Enveloppe en euros</span>
        <input style={{...inp,marginBottom:14,fontSize:16,textAlign:"center"}} type="number" min="0" placeholder="Ex: 400" value={budgetInput} onChange={e=>setBudgetInput(e.target.value)}/>
        <div style={{display:"flex",gap:8}}>
          <button style={{...btn("gh"),flex:1}} onClick={()=>setShowBudgetEdit(false)}>Annuler</button>
          <button style={{...btn("acc"),flex:1}} onClick={()=>{
            const v=parseFloat(budgetInput)||0;
            setDb({...db,budget:{...(db.budget||{}),monthly:v}});
            setShowBudgetEdit(false);showToast("💰 Budget mis à jour");
          }}>Enregistrer</button>
        </div>
      </Modal>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// APP ROOT
// ═══════════════════════════════════════════════════════════════
function App(){
  const [page,setPage]=useState("liste");
  const [db,setDb]=useState(EMPTY_DB);
  const [toast,setToast]=useState("");
  const [pseudo,setPseudo]=useState(()=>localStorage.getItem("ws_pseudo")||"");
  const [docId,setDocId]=useState(()=>localStorage.getItem("ws_docid")||null);
  const [fbReady,setFbReady]=useState(!!window._firebaseReady);
  const ttRef=useRef(null);
  const localRef=useRef(false);

  // Attendre que Firebase soit prêt
  useEffect(()=>{
    if(window._firebaseReady){setFbReady(true);return;}
    const h=()=>setFbReady(true);
    window.addEventListener("firebaseReady",h);
    return()=>window.removeEventListener("firebaseReady",h);
  },[]);

  // Écouter les changements Firestore en temps réel
  useEffect(()=>{
    if(!docId||!fbReady)return;
    const{fsdb,doc,onSnapshot}=window._firebase;
    const ref=doc(fsdb,"households",docId);
    const unsub=onSnapshot(ref,snap=>{
      if(!snap.exists())return;
      if(localRef.current){localRef.current=false;return;}
      const data=snap.data();
      setDb({
        items:data.items||[],
        productHistory:data.productHistory||{},
        recipes:data.recipes||[],
        shoppingHistory:data.shoppingHistory||[],
        priceDB:data.priceDB||{},
        budget:data.budget||{monthly:0,sessions:[]}
      });
    });
    return()=>unsub();
  },[docId,fbReady]);

  function showToast(msg){setToast(msg);clearTimeout(ttRef.current);ttRef.current=setTimeout(()=>setToast(""),2800);}

  // Sauvegarder dans Firestore + localStorage
  function setDbSync(newDb){
    setDb(newDb);
    // localStorage fallback
    try{localStorage.setItem("ws_r1",JSON.stringify(newDb));}catch{}
    // Firestore sync
    if(docId&&fbReady){
      localRef.current=true;
      const{fsdb,doc,setDoc}=window._firebase;
      const ref=doc(fsdb,"households",docId);
      setDoc(ref,{
        items:newDb.items||[],
        productHistory:newDb.productHistory||{},
        recipes:newDb.recipes||[],
        shoppingHistory:newDb.shoppingHistory||[],
        priceDB:newDb.priceDB||{},
        budget:newDb.budget||{monthly:0,sessions:[]}
      }).catch(e=>console.error("Sync error:",e));
    }
  }

  function handleLogin(id,name){
    setDocId(id);
    setPseudo(name||localStorage.getItem("ws_pseudo")||"");
  }

  function handleLogout(){
    localStorage.removeItem("ws_docid");
    localStorage.removeItem("ws_foyerid");
    // Ne pas supprimer ws_pseudo et ws_pwd_saved si "se souvenir" était coché
    setDocId(null);
    setDb(EMPTY_DB);
  }

  if(!fbReady){
    return(
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:TXT3,fontSize:14,fontWeight:600}}>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:40,marginBottom:12}}>🛒</div>
          Chargement…
        </div>
      </div>
    );
  }

  if(!docId){
    return <LoginScreen onLogin={handleLogin}/>;
  }

  return(
    <div style={{minHeight:"100vh",maxWidth:480,margin:"0 auto",fontFamily:"'Plus Jakarta Sans',sans-serif",color:TXT,position:"relative",overflowX:"hidden"}}>
      {/* HEADER */}
      <div style={{padding:"18px 18px 0",position:"relative"}}>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 80% 20%, rgba(255,255,255,.12) 0%, transparent 60%)",pointerEvents:"none"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",position:"relative"}}>
          <div>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:900,color:"white",letterSpacing:-.3}}>🛒 Wisely Shop</div>
            {pseudo?<div style={{fontSize:11,color:"rgba(255,255,255,.75)",marginTop:2,fontWeight:600}}>Bonjour {pseudo} 👋</div>
            :<div style={{fontSize:10,color:"rgba(255,255,255,.6)",marginTop:2,fontWeight:600}}>Synchronisé en temps réel ☁️</div>}
          </div>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <button style={{background:"rgba(255,255,255,.2)",border:"1.5px solid rgba(255,255,255,.35)",color:"white",borderRadius:12,padding:"7px 10px",fontFamily:"'Plus Jakarta Sans',sans-serif",fontWeight:700,fontSize:10,cursor:"pointer"}}
              onClick={()=>{
                const fid=localStorage.getItem("ws_foyerid");
                if(fid){const link=`${window.location.origin}${window.location.pathname}?invite=${fid}`;navigator.clipboard.writeText(link).then(()=>showToast("🔗 Lien copié !"));}
              }}>🔗</button>
            <button style={{background:"rgba(255,255,255,.2)",border:"1.5px solid rgba(255,255,255,.35)",color:"white",borderRadius:12,padding:"7px 12px",fontFamily:"'Plus Jakarta Sans',sans-serif",fontWeight:700,fontSize:11,cursor:"pointer"}} onClick={handleLogout}>🔒 Déco.</button>
          </div>
        </div>
        {/* NAV TABS */}
        <div style={{display:"flex",marginTop:14,gap:2,paddingBottom:0}}>
          {[{id:"liste",icon:"📋",label:"Liste"},{id:"recettes",icon:"🍽️",label:"Recettes"},{id:"prix",icon:"🧾",label:"Prix"},{id:"historique",icon:"🕐",label:"Historique"}].map(t=>(
            <div key={t.id} style={{flex:1,padding:"9px 3px",textAlign:"center",fontSize:9,fontWeight:700,letterSpacing:.5,textTransform:"uppercase",color:page===t.id?"white":"rgba(255,255,255,.55)",cursor:"pointer",borderBottom:page===t.id?"2.5px solid white":"2.5px solid transparent",transition:"all .2s",userSelect:"none"}} onClick={()=>setPage(t.id)}>
              <span style={{fontSize:15,display:"block",marginBottom:2}}>{t.icon}</span>{t.label}
            </div>
          ))}
        </div>
      </div>
      {/* PAGE CONTENT */}
      <div style={{background:"rgba(255,255,255,.04)",minHeight:"calc(100vh - 120px)"}}>
        {page==="liste"&&<PageListe db={db} setDb={setDbSync} showToast={showToast}/>}
        {page==="recettes"&&<PageRecettes db={db} setDb={setDbSync} showToast={showToast}/>}
        {page==="prix"&&<PagePrix db={db} setDb={setDbSync} showToast={showToast}/>}
        {page==="historique"&&<PageHistorique db={db} setDb={setDbSync} showToast={showToast} goToListe={()=>setPage("liste")}/>}
      </div>
      <Toast msg={toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{regs.forEach(r=>r.unregister());});
}
</script>
</body>
</html>
