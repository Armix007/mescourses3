// ─── RECIPE EDIT ──────────────────────────────────────────────
function RecipeEdit({recipe,onSave,onClose,onDel,showToast}){
  const isNew=!recipe;
  const [name,setName]=useState(recipe?.name||"");
  const [persons,setPersons]=useState(recipe?.persons||"");
  const [duration,setDuration]=useState(recipe?.duration||"");
  const [photo,setPhoto]=useState(recipe?.photo||null);
  const [difficulty,setDifficulty]=useState(recipe?.difficulty||"");
  const [mealType,setMealType]=useState(recipe?.mealType||"");
  const [ings,setIngs]=useState(recipe?.ingredients?.length?recipe.ingredients.map(i=>({...i})):[{name:"",qty:"",unit:""}]);
  const [steps,setSteps]=useState(recipe?.steps?.length?[...recipe.steps]:[""]);
  const [scanning,setScanning]=useState(false);
  const [scanMsg,setScanMsg]=useState("");
  const [scanStatus,setScanStatus]=useState("idle");
  const [scannedRaw,setScannedRaw]=useState(null);
  const [cropSrc,setCropSrc]=useState(null);
  const [cropFor,setCropFor]=useState(null);
  const [showApiKey,setShowApiKey]=useState(false);
  const [multiMode,setMultiMode]=useState(false);
  const [multiPhotos,setMultiPhotos]=useState([]);
  const [merging,setMerging]=useState(false);
  const [openPanel,setOpenPanel]=useState(null); // "note"|"delete"|null
  const [noteText,setNoteText]=useState(recipe?.note||"");
  const scanRef=useRef(),photoRef=useRef(),multiRef=useRef();

  function handlePhoto(e){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();r.onload=ev=>setPhoto(ev.target.result);r.readAsDataURL(file);e.target.value="";
  }

  function handleScanFile(e){
    const file=e.target.files[0];if(!file)return;
    const mt=file.type||"image/jpeg";
    const r=new FileReader();r.onload=ev=>{const dataUrl=ev.target.result;setScannedRaw({dataUrl,mt});doScan(dataUrl,mt);};
    r.readAsDataURL(file);e.target.value="";
  }

  function handleMultiFile(e){
    const file=e.target.files[0];if(!file)return;
    const mt=file.type||"image/jpeg";
    const r=new FileReader();r.onload=ev=>{setMultiPhotos(prev=>[...prev,{dataUrl:ev.target.result,mt,id:Date.now()}]);};
    r.readAsDataURL(file);e.target.value="";
  }

  function removeMultiPhoto(id){setMultiPhotos(prev=>prev.filter(p=>p.id!==id));}

  function handleCropConfirm(dataUrl){
    if(cropFor==="photo"){setPhoto(dataUrl);setCropSrc(null);}
    else if(cropFor==="scan-retry"){setCropSrc(null);doScan(dataUrl,scannedRaw?.mt||"image/jpeg");}
  }

  function uIng(i,f,v){const n=[...ings];n[i]={...n[i],[f]:v};setIngs(n);}
  function uStep(i,v){const n=[...steps];n[i]=v;setSteps(n);}

  function doSave(){
    if(!name.trim()){showToast("⚠️ Donnez un nom à la recette");return;}
    onSave({
      id:recipe?.id||Date.now(),
      name:name.trim(),photo,
      persons:parseInt(persons)||null,
      duration:duration.trim()||null,
      difficulty:difficulty||null,
      mealType:mealType||null,
      ingredients:ings.filter(i=>i.name.trim()),
      steps:steps.filter(Boolean),
      note:noteText.trim()||recipe?.note||null,
      source:recipe?.source||null,
      mealdbId:recipe?.mealdbId||null,
      stars:recipe?.stars||null,
      lastCooked:recipe?.lastCooked||null,
      cookedCount:recipe?.cookedCount||0,
      date:recipe?.date||new Date().toLocaleDateString("fr-FR")
    });
  }

  return(
    <>
      <FullPage open onClose={onClose} noPad>
        <input ref={photoRef} type="file" accept="image/*" style={{display:"none"}} onChange={handlePhoto} capture="environment"/>
        <div style={{height:isNew?140:160,position:"relative",background:`linear-gradient(135deg,${CREAM2},${BDR})`,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0,cursor:isNew&&!photo?"pointer":"default"}}
          onClick={()=>isNew&&!photo&&photoRef.current.click()}>
          {photo
            ?<img src={photo} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>
            :<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
                <EmojiImg emoji={name?guessRecipeEmoji(name):"📷"} size={isNew?48:52}/>
                {isNew&&<div style={{fontSize:11,color:TXT2,fontWeight:600,background:"rgba(255,255,255,.75)",borderRadius:8,padding:"3px 10px"}}>📷 Ajouter une photo</div>}
              </div>
          }
          {/* Bouton changer photo — modification seulement, en haut à gauche */}
          {!isNew&&(
            <button style={{position:"absolute",top:8,left:8,background:"rgba(0,0,0,.48)",border:"none",color:"white",borderRadius:8,padding:"5px 10px",fontSize:11,cursor:"pointer",fontWeight:600,backdropFilter:"blur(4px)"}}
              onClick={()=>photoRef.current.click()}>
              📷 Changer la photo
            </button>
          )}
          <button style={{position:"absolute",top:8,right:8,background:"rgba(0,0,0,.4)",border:"none",color:"white",borderRadius:8,padding:"5px 9px",fontSize:13,cursor:"pointer",backdropFilter:"blur(4px)"}} onClick={onClose}>✕</button>
        </div>

        {/* ── CONTENU SCROLLABLE ── */}
        <div style={{flex:1,overflowY:"auto",padding:"14px 14px 100px"}}>

          <div style={{fontFamily:"'Fraunces',serif",fontSize:19,fontWeight:900,color:TXT,marginBottom:14}}>
            {isNew?"Nouvelle recette":"Modifier la recette"}
          </div>

          {/* ── SCAN IA — création seulement ── */}
          {isNew&&(
            <div style={{background:CREAM2,border:`1.5px solid rgba(200,132,90,.3)`,borderRadius:14,padding:"11px 13px",marginBottom:14}}>
              <div style={{fontSize:9,fontWeight:800,color:TXT2,textTransform:"uppercase",letterSpacing:.7,marginBottom:9}}>🤖 Importer depuis une photo</div>
              {!multiMode&&(
                <div style={{display:"flex",gap:6,marginBottom:scanMsg?8:0}}>
                  <div style={{flex:1,border:`2px dashed rgba(200,132,90,.35)`,borderRadius:11,padding:"10px 8px",textAlign:"center",cursor:scanning?"not-allowed":"pointer",background:SURF,opacity:scanning?.7:1}} onClick={()=>!scanning&&scanRef.current.click()}>
                    <div style={{fontSize:18,marginBottom:2}}>{scanning?"⏳":"📸"}</div>
                    <div style={{fontSize:11,color:CARAMEL2,fontWeight:700}}>{scanning?"Analyse…":"1 page"}</div>
                  </div>
                  <div style={{flex:1,border:`2px dashed rgba(200,132,90,.35)`,borderRadius:11,padding:"10px 8px",textAlign:"center",cursor:"pointer",background:SURF}} onClick={()=>{setMultiMode(true);setMultiPhotos([]);setScanMsg("");}}>
                    <div style={{fontSize:18,marginBottom:2}}>📷📷</div>
                    <div style={{fontSize:11,color:CARAMEL2,fontWeight:700}}>Multi-pages</div>
                  </div>
                </div>
              )}
              <input ref={scanRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleScanFile} capture="environment"/>
              <input ref={multiRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleMultiFile} capture="environment"/>
              {multiMode&&(
                <div style={{background:CREAM,border:`1.5px solid ${BDR}`,borderRadius:11,padding:10,marginBottom:8}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                    <div style={{fontSize:11,fontWeight:700,color:TXT}}>📷📷 Multi-photos</div>
                    <button style={{...btn("gh"),fontSize:10,padding:"3px 8px"}} onClick={()=>{setMultiMode(false);setMultiPhotos([]);}}>✕</button>
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:6}}>
                    {multiPhotos.map((p,i)=>(
                      <div key={p.id} style={{position:"relative",width:56,height:56}}>
                        <img src={p.dataUrl} style={{width:56,height:56,objectFit:"cover",borderRadius:8,border:`2px solid ${CARAMEL2}`}} alt=""/>
                        <div style={{position:"absolute",top:-4,right:-4,width:16,height:16,borderRadius:"50%",background:DNG,color:"white",fontSize:9,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}} onClick={()=>removeMultiPhoto(p.id)}>✕</div>
                        <div style={{position:"absolute",bottom:2,left:2,background:"rgba(0,0,0,.55)",color:"white",fontSize:8,borderRadius:4,padding:"1px 4px",fontWeight:700}}>{i+1}</div>
                      </div>
                    ))}
                    <div style={{width:56,height:56,border:`2px dashed ${CARAMEL2}`,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",background:SURF,flexDirection:"column"}} onClick={()=>multiRef.current.click()}>
                      <div style={{fontSize:16}}>+</div>
                      <div style={{fontSize:8,color:TXT3}}>Photo</div>
                    </div>
                  </div>
                  <div style={{fontSize:9,color:TXT3,marginBottom:6}}>{multiPhotos.length<2?"Ajoutez au moins 2 photos":`${multiPhotos.length} photos · prêt`}</div>
                  <button style={{...btn("acc"),width:"100%",justifyContent:"center",fontSize:11}} onClick={doMultiScan} disabled={merging||multiPhotos.length<2}>
                    {merging?"⏳ Fusion…":`✨ Analyser (${multiPhotos.length} photos)`}
                  </button>
                </div>
              )}
              {scanMsg&&(
                <div style={{fontSize:11,textAlign:"center",padding:"6px 10px",borderRadius:8,background:scanStatus==="ok"?"rgba(90,138,58,.12)":"rgba(212,96,74,.12)",color:scanStatus==="ok"?SUC:DNG,marginTop:scanMsg?4:0}}>{scanMsg}</div>
              )}
              {!localStorage.getItem("ws_apikey")&&(
                <div style={{fontSize:10,color:TXT3,textAlign:"center",marginTop:6}}>⚠️ Clé API requise · <span style={{color:CARAMEL2,cursor:"pointer",fontWeight:700}} onClick={()=>setShowApiKey(true)}>Configurer 🔑</span></div>
              )}
            </div>
          )}

          {/* ── INFOS ── */}
          <div style={{fontSize:9,fontWeight:800,color:TXT2,textTransform:"uppercase",letterSpacing:.7,marginBottom:8,display:"flex",alignItems:"center",gap:7}}>
            Informations<div style={{flex:1,height:1,background:BDR}}/>
          </div>
          <input style={{...inp,marginBottom:8}} placeholder="Nom de la recette *" value={name} onChange={e=>setName(e.target.value)}/>
          <div style={{display:"flex",gap:8,marginBottom:8}}>
            <div style={{flex:1}}><input style={inp} type="number" min="1" placeholder="Personnes" value={persons} onChange={e=>setPersons(e.target.value)}/></div>
            <div style={{flex:1}}><input style={inp} placeholder="Durée (ex: 45 min)" value={duration} onChange={e=>setDuration(e.target.value)}/></div>
          </div>
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            <div style={{flex:1}}>
              <select style={sel} value={difficulty} onChange={e=>setDifficulty(e.target.value)}>
                {RECIPE_DIFFICULTY.map(d=><option key={d.id} value={d.id}>{d.label}</option>)}
              </select>
            </div>
            <div style={{flex:1}}>
              <select style={sel} value={mealType} onChange={e=>setMealType(e.target.value)}>
                {RECIPE_MEAL_TYPE.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}
              </select>
            </div>
          </div>

          {/* ── INGRÉDIENTS ── */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div style={{fontSize:9,fontWeight:800,color:TXT2,textTransform:"uppercase",letterSpacing:.7,display:"flex",alignItems:"center",gap:7}}>
              Ingrédients <span style={{fontSize:9,background:CREAM2,color:TXT3,padding:"1px 7px",borderRadius:10,fontWeight:700}}>{ings.filter(i=>i.name.trim()).length}</span>
            </div>
            <button style={{...btn("gh"),fontSize:11,padding:"5px 10px"}} onClick={()=>setIngs([...ings,{name:"",qty:"",unit:""}])}>+ Ajouter</button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:5,marginBottom:14}}>
            {ings.map((ing,i)=>(
              <div key={i} style={{display:"flex",gap:5,alignItems:"center",background:"rgba(255,255,255,.88)",borderRadius:10,padding:"7px 10px",border:`1px solid ${BDR}`}}>
                <span style={{fontSize:14,flexShrink:0}}>{guessRecipeEmoji(ing.name)||"🥄"}</span>
                <input style={{flex:1,background:"transparent",border:"none",color:TXT,fontFamily:"inherit",fontSize:13,outline:"none",minWidth:0,fontWeight:600}} placeholder="Ingrédient…" value={ing.name} onChange={e=>uIng(i,"name",e.target.value)}/>
                <input style={{width:40,background:"transparent",border:"none",color:TXT2,fontFamily:"inherit",fontSize:12,textAlign:"right",outline:"none"}} placeholder="Qté" value={ing.qty} onChange={e=>uIng(i,"qty",e.target.value)}/>
                <select style={{width:54,background:"transparent",border:"none",color:TXT3,fontFamily:"inherit",fontSize:11,outline:"none",cursor:"pointer"}} value={ing.unit} onChange={e=>uIng(i,"unit",e.target.value)}>{UNITS.map(u=><option key={u} value={u}>{UL[u]}</option>)}</select>
                <button style={{background:"none",border:"none",color:TXT3,cursor:"pointer",fontSize:12,padding:"0 2px",flexShrink:0}} onClick={()=>setIngs(ings.filter((_,j)=>j!==i))}>✕</button>
              </div>
            ))}
          </div>

          {/* ── ÉTAPES ── */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div style={{fontSize:9,fontWeight:800,color:TXT2,textTransform:"uppercase",letterSpacing:.7,display:"flex",alignItems:"center",gap:7}}>
              Étapes <span style={{fontSize:9,background:CREAM2,color:TXT3,padding:"1px 7px",borderRadius:10,fontWeight:700}}>{steps.filter(Boolean).length}</span>
            </div>
            <button style={{...btn("gh"),fontSize:11,padding:"5px 10px"}} onClick={()=>setSteps([...steps,""])}>+ Étape</button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:14}}>
            {steps.map((step,i)=>(
              <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start"}}>
                <div style={{width:22,height:22,background:CARAMEL2,color:"white",borderRadius:"50%",fontSize:10,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:9}}>{i+1}</div>
                <textarea style={{...inp,flex:1,padding:"8px 10px",fontSize:12,resize:"none",minHeight:52}} value={step} onChange={e=>uStep(i,e.target.value)} placeholder="Décrivez cette étape…"/>
                <button style={{...btn("gh"),padding:"6px 8px",marginTop:4,fontSize:12,flexShrink:0}} onClick={()=>setSteps(steps.filter((_,j)=>j!==i))}>✕</button>
              </div>
            ))}
          </div>

          {/* ── ACTIONS SECONDAIRES — modification seulement ── */}
          {!isNew&&(
            <>
              <div style={{display:"flex",gap:7,marginTop:6}}>
                <button style={{
                  flex:1,justifyContent:"center",fontSize:11,padding:"9px 4px",
                  border:`1.5px solid ${openPanel==="note"?CARAMEL:BDR}`,
                  color:openPanel==="note"?CARAMEL:TXT2,borderRadius:11,cursor:"pointer",
                  fontFamily:"inherit",fontWeight:700,display:"flex",alignItems:"center",gap:5,
                  background:openPanel==="note"?`rgba(184,112,58,.06)`:"transparent"
                }} onClick={()=>togglePanel("note")}>
                  📝 Note personnelle
                </button>
                <button style={{
                  flex:1,justifyContent:"center",fontSize:11,padding:"9px 4px",
                  border:`1.5px solid ${openPanel==="delete"?"rgba(212,96,74,.35)":BDR}`,
                  color:openPanel==="delete"?DNG:TXT2,borderRadius:11,cursor:"pointer",
                  fontFamily:"inherit",fontWeight:700,display:"flex",alignItems:"center",gap:5,
                  background:openPanel==="delete"?`rgba(212,96,74,.05)`:"transparent"
                }} onClick={()=>togglePanel("delete")}>
                  🗑️ Supprimer
                </button>
              </div>

              {/* Panel Note */}
              {openPanel==="note"&&(
                <div style={{background:CREAM2,border:`1px solid ${BDR}`,borderRadius:13,padding:"12px 13px",marginTop:8}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                    <div style={{fontSize:10,fontWeight:800,color:TXT2,textTransform:"uppercase",letterSpacing:.6}}>📝 Note personnelle</div>
                    <button onClick={()=>setOpenPanel(null)} style={{background:"none",border:"none",fontSize:13,color:TXT3,cursor:"pointer"}}>✕</button>
                  </div>
                  <textarea style={{...inp,minHeight:64,resize:"none",fontSize:12,marginBottom:8}} placeholder="Astuces, variantes, ce que j'ai changé…" value={noteText} onChange={e=>setNoteText(e.target.value)}/>
                  <div style={{fontSize:10,color:TXT3}}>💡 Cette note sera visible sur la page de détail de la recette</div>
                </div>
              )}

              {/* Panel Supprimer */}
              {openPanel==="delete"&&(
                <div style={{background:"rgba(212,96,74,.05)",border:`1.5px solid rgba(212,96,74,.2)`,borderRadius:13,padding:"12px 13px",marginTop:8}}>
                  <div style={{fontSize:12,fontWeight:700,color:DNG,marginBottom:4}}>Supprimer cette recette ?</div>
                  <div style={{fontSize:11,color:TXT2,marginBottom:10}}>Cette action est irréversible.</div>
                  <div style={{display:"flex",gap:7}}>
                    <button style={{...btn("gh"),flex:1,fontSize:11,justifyContent:"center"}} onClick={()=>setOpenPanel(null)}>Annuler</button>
                    <button style={{...btn("dng"),flex:1,fontSize:11,justifyContent:"center"}} onClick={onDel}>🗑️ Supprimer</button>
                  </div>
                </div>
              )}
            </>
          )}
        </div>

        {/* ── BARRE BAS FIXE ── */}
        <div style={{position:"sticky",bottom:0,background:`rgba(253,248,240,.96)`,backdropFilter:"blur(12px)",borderTop:`1px solid ${BDR}`,padding:"10px 14px",display:"flex",gap:8,flexShrink:0}}>
          <button style={{...btn("gh"),flex:1,justifyContent:"center"}} onClick={onClose}>Annuler</button>
          <button style={{...btn("suc"),flex:2,justifyContent:"center"}} onClick={doSave}>
            {isNew?"✅ Créer la recette":"✅ Enregistrer"}
          </button>
        </div>
      </FullPage>
      <CropModal open={!!cropSrc} src={cropSrc} onConfirm={handleCropConfirm} onClose={()=>setCropSrc(null)}/>
      <ApiKeyModal open={showApiKey} onSave={k=>{setShowApiKey(false);if(scannedRaw)doScan(scannedRaw.dataUrl,scannedRaw.mt);}} onClose={()=>setShowApiKey(false)}/>
    </>
  );
}

// ─── COOKING MODE ─────────────────────────────────────────────
function CookingMode({recipe,onClose,onFinish}){
  const [step,setStep]=useState(0);
  const [timer,setTimer]=useState(null);
  const [running,setRunning]=useState(false);
  const [inputMin,setInputMin]=useState("5");
  const [showDone,setShowDone]=useState(false);
  const [donePhoto,setDonePhoto]=useState(null);
  const [doneNote,setDoneNote]=useState("");
  const [doneStars,setDoneStars]=useState(0);
  const timerRef=useRef(null);
  const donePhotoRef=useRef();
  const steps=recipe.steps||[];
  const total=steps.length;

  useEffect(()=>{
    if(running&&timer>0){timerRef.current=setInterval(()=>setTimer(t=>t-1),1000);}
    else if(timer===0){clearInterval(timerRef.current);setRunning(false);}
    return()=>clearInterval(timerRef.current);
  },[running,timer]);

  useEffect(()=>{
    let wake=null;
    if(navigator.wakeLock){navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{});}
    return()=>{if(wake)wake.release();}
  },[]);

  function startTimer(){const s=parseInt(inputMin)*60;if(s>0){setTimer(s);setRunning(true);}}
  function pauseTimer(){setRunning(false);clearInterval(timerRef.current);}
  function resetTimer(){setRunning(false);clearInterval(timerRef.current);setTimer(null);}
  function fmtTime(s){const m=Math.floor(s/60),sec=s%60;return`${m}:${sec.toString().padStart(2,"0")}`;}

  function handleDonePhoto(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>setDonePhoto(ev.target.result);
    reader.readAsDataURL(file);e.target.value="";
  }

  function confirmFinish(skip){
    if(skip){onFinish({});return;}
    onFinish({photo:donePhoto,note:doneNote,stars:doneStars});
  }

  if(showDone) return(
    <div style={{position:"fixed",inset:0,background:`linear-gradient(160deg,${CARAMEL} 0%,#7a3a1a 100%)`,zIndex:500,display:"flex",flexDirection:"column",padding:20,paddingTop:50,overflowY:"auto"}}>
      <input ref={donePhotoRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleDonePhoto} capture="environment"/>
      <div style={{textAlign:"center",marginBottom:20}}>
        <div style={{fontSize:50,marginBottom:8}}>🎉</div>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:22,color:"white",fontWeight:900}}>Bon appétit !</div>
        <div style={{fontSize:13,color:"rgba(255,255,255,.7)",marginTop:4}}>{recipe.name} est prêt·e !</div>
      </div>
      {donePhoto
        ?<div style={{position:"relative",borderRadius:16,overflow:"hidden",marginBottom:14}}>
            <img src={donePhoto} alt="" style={{width:"100%",maxHeight:200,objectFit:"cover",borderRadius:16}}/>
            <button style={{position:"absolute",bottom:8,right:8,background:"rgba(0,0,0,.5)",border:"none",color:"white",borderRadius:8,padding:"4px 10px",fontSize:11,cursor:"pointer"}} onClick={()=>donePhotoRef.current.click()}>📷 Changer</button>
          </div>
        :<div style={{border:"2px dashed rgba(255,255,255,.4)",borderRadius:16,padding:"16px",textAlign:"center",cursor:"pointer",marginBottom:14}} onClick={()=>donePhotoRef.current.click()}>
            <div style={{marginBottom:4}}><EmojiImg emoji="📷" size={24}/></div>
            <div style={{fontSize:12,color:"rgba(255,255,255,.8)",fontWeight:700}}>Immortaliser votre réalisation</div>
          </div>
      }
      <div style={{background:"rgba(255,255,255,.1)",borderRadius:14,padding:"12px 16px",marginBottom:10,textAlign:"center"}}>
        <div style={{fontSize:11,color:"rgba(255,255,255,.7)",marginBottom:8,fontWeight:700}}>Comment était-ce ?</div>
        <div style={{display:"flex",justifyContent:"center",gap:8}}>
          {[1,2,3,4,5].map(s=>(
            <span key={s} style={{fontSize:28,cursor:"pointer",opacity:s<=doneStars?1:.35,transition:"all .15s"}} onClick={()=>setDoneStars(s)}>⭐</span>
          ))}
        </div>
        {doneStars>0&&<div style={{fontSize:11,color:"rgba(255,255,255,.6)",marginTop:4}}>{["","Bof…","Pas mal","Bien !","Très bien !","Parfait ! 🏆"][doneStars]}</div>}
      </div>
      <div style={{marginBottom:16}}>
        <div style={{fontSize:11,color:"rgba(255,255,255,.7)",marginBottom:5,fontWeight:700}}>📝 Commentaire</div>
        <textarea style={{width:"100%",background:"rgba(255,255,255,.15)",border:"1.5px solid rgba(255,255,255,.25)",borderRadius:10,padding:"10px 12px",color:"white",fontSize:13,fontFamily:"inherit",resize:"none",minHeight:56,outline:"none"}} placeholder="Astuces, variantes…" value={doneNote} onChange={e=>setDoneNote(e.target.value)}/>
      </div>
      <button style={{width:"100%",padding:"15px",background:"white",border:"none",borderRadius:14,color:CARAMEL,fontWeight:800,fontSize:14,cursor:"pointer",marginBottom:8}} onClick={()=>confirmFinish(false)}>✅ Terminer</button>
      <button style={{width:"100%",padding:"11px",background:"rgba(255,255,255,.15)",border:"none",borderRadius:12,color:"rgba(255,255,255,.8)",fontWeight:600,fontSize:12,cursor:"pointer"}} onClick={()=>confirmFinish(true)}>Passer</button>
    </div>
  );

  return(
    <div style={{position:"fixed",inset:0,background:`linear-gradient(160deg,${CARAMEL} 0%,#7a3a1a 100%)`,zIndex:500,display:"flex",flexDirection:"column",padding:20,paddingTop:40}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:18,color:"white",flex:1,paddingRight:10}}>{recipe.name}</div>
        <button style={{background:"rgba(255,255,255,.2)",border:"1.5px solid rgba(255,255,255,.4)",color:"white",borderRadius:10,padding:"8px 14px",fontWeight:700,fontSize:12,cursor:"pointer"}} onClick={onClose}>✕ Quitter</button>
      </div>
      <div style={{display:"flex",gap:4,marginBottom:20}}>
        {steps.map((_,i)=>(
          <div key={i} style={{flex:1,height:4,borderRadius:2,background:i<step?"white":i===step?"rgba(255,255,255,.7)":"rgba(255,255,255,.2)",cursor:"pointer"}} onClick={()=>setStep(i)}/>
        ))}
      </div>
      <div style={{flex:1,background:"rgba(255,255,255,.1)",borderRadius:20,padding:24,display:"flex",flexDirection:"column",justifyContent:"center",overflowY:"auto"}}>
        <div style={{fontSize:13,color:"rgba(255,255,255,.6)",fontWeight:700,letterSpacing:1,textTransform:"uppercase",marginBottom:12}}>Étape {step+1} / {total}</div>
        <div style={{fontSize:17,color:"white",lineHeight:1.7,fontWeight:500,marginBottom:16}}>{steps[step]}</div>
        {(()=>{
          const stepText=(steps[step]||"").toLowerCase();
          const mentioned=(recipe.ingredients||[]).filter(ing=>{
            const n=ing.name.toLowerCase();
            return stepText.includes(n)||(n.length>4&&stepText.includes(n.slice(0,-1)));
          });
          return mentioned.length>0?(
            <div style={{borderTop:"1px solid rgba(255,255,255,.2)",paddingTop:10}}>
              <div style={{fontSize:10,color:"rgba(255,255,255,.5)",fontWeight:700,letterSpacing:.5,marginBottom:6}}>INGRÉDIENTS POUR CETTE ÉTAPE</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                {mentioned.map((ing,i)=>(
                  <div key={i} style={{background:"rgba(255,255,255,.15)",borderRadius:8,padding:"3px 8px",fontSize:11,color:"rgba(255,255,255,.9)",fontWeight:600}}>
                    {ing.qty?`${ing.qty}${ing.unit?" "+ing.unit:""} `:""}• {ing.name}
                  </div>
                ))}
              </div>
            </div>
          ):null;
        })()}
      </div>
      <div style={{background:"rgba(255,255,255,.1)",borderRadius:16,padding:"14px 16px",marginTop:16}}>
        {timer===null?(
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <div style={{fontSize:13,color:"rgba(255,255,255,.8)",flex:1}}>⏱️ Minuteur</div>
            <input style={{width:48,background:"rgba(255,255,255,.2)",border:"1px solid rgba(255,255,255,.3)",borderRadius:8,padding:"6px 8px",color:"white",fontSize:13,textAlign:"center",outline:"none"}} value={inputMin} onChange={e=>setInputMin(e.target.value)} type="number" min="1"/>
            <span style={{color:"rgba(255,255,255,.7)",fontSize:12}}>min</span>
            <button style={{background:"white",border:"none",borderRadius:8,padding:"6px 12px",color:CARAMEL,fontWeight:700,fontSize:12,cursor:"pointer"}} onClick={startTimer}>Démarrer</button>
          </div>
        ):(
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{fontSize:28,fontWeight:900,color:timer<30?"#ff8080":"white",fontFamily:"monospace",flex:1}}>{fmtTime(timer)}</div>
            {running
              ?<button style={{background:"rgba(255,255,255,.2)",border:"none",borderRadius:8,padding:"8px 14px",color:"white",fontWeight:700,cursor:"pointer"}} onClick={pauseTimer}>⏸</button>
              :<button style={{background:"rgba(255,255,255,.2)",border:"none",borderRadius:8,padding:"8px 14px",color:"white",fontWeight:700,cursor:"pointer"}} onClick={()=>setRunning(true)}>▶</button>
            }
            <button style={{background:"rgba(255,255,255,.15)",border:"none",borderRadius:8,padding:"8px 14px",color:"white",fontWeight:700,cursor:"pointer"}} onClick={resetTimer}>✕</button>
          </div>
        )}
      </div>
      <div style={{display:"flex",gap:10,marginTop:14}}>
        <button style={{flex:1,padding:"14px",background:"rgba(255,255,255,.15)",border:"1.5px solid rgba(255,255,255,.3)",borderRadius:14,color:"white",fontWeight:700,fontSize:14,cursor:"pointer",opacity:step===0?.4:1}} onClick={()=>setStep(s=>Math.max(0,s-1))} disabled={step===0}>← Précédent</button>
        {step<total-1
          ?<button style={{flex:2,padding:"14px",background:"white",border:"none",borderRadius:14,color:CARAMEL,fontWeight:800,fontSize:14,cursor:"pointer"}} onClick={()=>{resetTimer();setStep(s=>s+1);}}>Suivant →</button>
          :<button style={{flex:2,padding:"14px",background:"white",border:"none",borderRadius:14,color:SUC,fontWeight:800,fontSize:14,cursor:"pointer"}} onClick={()=>setShowDone(true)}>🎉 Terminé !</button>
        }
      </div>
    </div>
  );
}

// ─── AI RECIPE GENERATOR ──────────────────────────────────────
function AIRecipeGen({onImport,onClose,showToast,items}){
  const [mode,setMode]=useState("frigo");
  const [fridgeInput,setFridgeInput]=useState("");
  const [variationBase,setVariationBase]=useState("");
  const [variationType,setVariationType]=useState("végétarien");
  const [generating,setGenerating]=useState(false);
  const [result,setResult]=useState(null);
  const [listening,setListening]=useState(false);
  const [chatMsg,setChatMsg]=useState("");
  const [chatHistory,setChatHistory]=useState([]);
  const [chatLoading,setChatLoading]=useState(false);
  const recognitionRef=useRef(null);

  useEffect(()=>{
    if(items?.length)setFridgeInput(items.map(i=>i.name).join(", "));
  },[]);

  function startVoice(target){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){showToast("⚠️ Reconnaissance vocale non supportée");return;}
    const recog=new SR();recog.lang="fr-FR";recog.continuous=false;recog.interimResults=false;
    recog.onstart=()=>setListening(true);recog.onend=()=>setListening(false);
    recog.onresult=(e)=>{
      const text=e.results[0][0].transcript.trim();
      if(target==="fridge")setFridgeInput(prev=>prev?prev+", "+text:text);
      else if(target==="chat")setChatMsg(text);
      showToast(`🎤 "${text}"`);
    };
    recog.onerror=()=>{setListening(false);showToast("❌ Erreur micro");};
    recognitionRef.current=recog;recog.start();
  }

  async function generate(){
    const apiKey=localStorage.getItem("ws_apikey")||"";
    if(!apiKey){showToast("⚠️ Clé API requise — configurez via 🔑");return;}
    setGenerating(true);setResult(null);setChatHistory([]);
    const prompt=mode==="frigo"
      ?`Tu es un chef cuisinier créatif. Propose UNE recette réalisable avec ces ingrédients : ${fridgeInput}\n\nRETOURNE UNIQUEMENT ce JSON valide (sans markdown) :\n{"title":"","persons":4,"duration":"30 min","ingredients":[{"name":"","qty":"","unit":""}],"steps":["étape complète en français"],"tip":"astuce en 1 phrase"}`
      :`Tu es un chef cuisinier expert. Crée une variation ${variationType} de : "${variationBase}"\n\nRETOURNE UNIQUEMENT ce JSON valide (sans markdown) :\n{"title":"","persons":4,"duration":"30 min","ingredients":[{"name":"","qty":"","unit":""}],"steps":["étape complète en français"],"tip":"astuce en 1 phrase"}`;
    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:3000,messages:[{role:"user",content:prompt}]})});
      const data=await resp.json();
      let text=(data.content||[]).map(c=>c.text||"").join("").trim();
      text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
      const p=JSON.parse(text);
      const r={id:Date.now(),name:p.title,persons:p.persons||4,duration:p.duration||"",photo:null,source:"ai",ingredients:p.ingredients||[],steps:p.steps||[],tip:p.tip||"",date:new Date().toLocaleDateString("fr-FR")};
      setResult(r);
      setChatHistory([{role:"user",content:prompt},{role:"assistant",content:JSON.stringify(p)}]);
    }catch(e){showToast("❌ "+e.message);}
    setGenerating(false);
  }

  async function sendChat(){
    if(!chatMsg.trim()||!result)return;
    const apiKey=localStorage.getItem("ws_apikey")||"";
    if(!apiKey){showToast("⚠️ Clé API requise");return;}
    setChatLoading(true);
    const userMsg=chatMsg.trim();setChatMsg("");
    const systemPrompt=`Tu es un chef cuisinier expert. Tu modifies une recette selon les demandes. Recette actuelle : ${JSON.stringify({name:result.name,ingredients:result.ingredients,steps:result.steps})}. RETOURNE UNIQUEMENT le JSON modifié (sans markdown) : {"title":"","persons":${result.persons||4},"duration":"${result.duration||"30 min"}","ingredients":[{"name":"","qty":"","unit":""}],"steps":["étape complète"],"tip":""}`;
    const newHistory=[...chatHistory,{role:"user",content:userMsg}];
    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:3000,system:systemPrompt,messages:newHistory})});
      const data=await resp.json();
      let text=(data.content||[]).map(c=>c.text||"").join("").trim();
      text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
      const p=JSON.parse(text);
      setResult(r=>({...r,name:p.title||r.name,ingredients:p.ingredients||r.ingredients,steps:p.steps||r.steps,tip:p.tip||r.tip,duration:p.duration||r.duration}));
      setChatHistory([...newHistory,{role:"assistant",content:text}]);
      showToast("✅ Recette modifiée !");
    }catch(e){showToast("❌ "+e.message);}
    setChatLoading(false);
  }

  return(
    <FullPage open onClose={onClose}>
      {/* ── HEADER ── */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 14px 10px",borderBottom:`1px solid ${BDR}`,flexShrink:0}}>
        <div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:20,fontWeight:900,color:TXT}}>🤖 Recette par IA</div>
          <div style={{fontSize:10,color:TXT3,marginTop:2}}>Générez et affinez par chat</div>
        </div>
        <button style={{...btn("gh"),padding:"8px 12px",fontSize:12}} onClick={onClose}>✕ Fermer</button>
      </div>

      {/* ── CONTENU SCROLLABLE ── */}
      <div style={{flex:1,overflowY:"auto",padding:"14px 14px 100px"}}>

        {/* ① MODE */}
        <div style={{fontSize:9,fontWeight:800,color:TXT2,textTransform:"uppercase",letterSpacing:.7,marginBottom:8}}>① Mode</div>
        <div style={{display:"flex",gap:8,marginBottom:20}}>
          {[{id:"frigo",emoji:"🧊",label:"Avec ce que j'ai",sub:"Mes ingrédients → recette"},
            {id:"variation",emoji:"✨",label:"Adapter",sub:"Variation d'une recette"}
          ].map(m=>(
            <div key={m.id} style={{flex:1,padding:"11px 8px",textAlign:"center",borderRadius:13,cursor:"pointer",border:`2px solid ${mode===m.id?CARAMEL:BDR}`,background:mode===m.id?`rgba(184,112,58,.07)`:"rgba(255,255,255,.75)",transition:"all .15s"}} onClick={()=>{setMode(m.id);setResult(null);setChatHistory([]);}}>
              <div style={{fontSize:22,marginBottom:4}}>{m.emoji}</div>
              <div style={{fontSize:11,fontWeight:800,color:mode===m.id?CARAMEL:TXT2}}>{m.label}</div>
              <div style={{fontSize:9,color:TXT3,marginTop:2}}>{m.sub}</div>
            </div>
          ))}
        </div>

        {!result?(
          <>
            {/* ② SAISIE selon le mode */}
            {mode==="frigo"?(
              <>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <div style={{fontSize:9,fontWeight:800,color:TXT2,textTransform:"uppercase",letterSpacing:.7}}>② Mes ingrédients disponibles</div>
                  <button style={{...btn("gh"),fontSize:10,padding:"4px 9px",background:"rgba(184,112,58,.1)",border:"1px solid rgba(184,112,58,.2)",color:CARAMEL,borderRadius:8}} onClick={()=>startVoice("fridge")} disabled={listening}>{listening?"🎤 Écoute…":"🎤 Vocal"}</button>
                </div>
                {items?.length>0&&<div style={{fontSize:9,color:SUC,fontWeight:700,marginBottom:6}}>✓ Pré-rempli depuis votre liste de courses</div>}
                <div style={{background:"rgba(255,255,255,.94)",border:`1.5px solid ${CARAMEL}`,borderRadius:13,overflow:"hidden",marginBottom:6}}>
                  {fridgeInput.split(",").map(s=>s.trim()).filter(Boolean).map((ing,i,arr)=>(
                    <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 11px",borderBottom:i<arr.length-1?`1px solid ${BDR}`:"none"}}>
                      <span style={{fontSize:13,flexShrink:0}}>{guessRecipeEmoji(ing)||"🥄"}</span>
                      <span style={{flex:1,fontSize:13,fontWeight:600,color:TXT}}>{ing}</span>
                      <button style={{background:"none",border:"none",color:TXT3,cursor:"pointer",fontSize:12,padding:"0 2px"}} onClick={()=>setFridgeInput(fridgeInput.split(",").filter((_,j)=>j!==i).join(", "))}>✕</button>
                    </div>
                  ))}
                  {fridgeInput.split(",").filter(s=>s.trim()).length===0&&(
                    <div style={{padding:"12px",textAlign:"center",color:TXT3,fontSize:12}}>Aucun ingrédient · tapez ci-dessous ou dictez</div>
                  )}
                </div>
                <input style={{...inp,fontSize:12,marginBottom:16}} placeholder="Ajouter un ingrédient…" onKeyDown={e=>{if(e.key==="Enter"&&e.target.value.trim()){setFridgeInput(prev=>prev?prev+", "+e.target.value.trim():e.target.value.trim());e.target.value="";}}}/>
              </>
            ):(
              <>
                <div style={{fontSize:9,fontWeight:800,color:TXT2,textTransform:"uppercase",letterSpacing:.7,marginBottom:8}}>② Recette de base</div>
                <input style={{...inp,marginBottom:14}} placeholder="Ex: Poulet rôti, Quiche lorraine…" value={variationBase} onChange={e=>setVariationBase(e.target.value)}/>
                <div style={{fontSize:9,fontWeight:800,color:TXT2,textTransform:"uppercase",letterSpacing:.7,marginBottom:8}}>Type de variation</div>
                <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:16}}>
                  {["végétarien","vegan","sans gluten","sans lactose","plus rapide","version légère","version enfants"].map(v=>(
                    <div key={v} style={{padding:"5px 11px",borderRadius:20,fontSize:11,fontWeight:700,background:variationType===v?CARAMEL:"rgba(255,255,255,.75)",color:variationType===v?"white":TXT2,border:`1.5px solid ${variationType===v?CARAMEL:BDR}`,cursor:"pointer"}} onClick={()=>setVariationType(v)}>{v}</div>
                  ))}
                </div>
              </>
            )}

            {/* ③ PRÉFÉRENCES */}
            <div style={{fontSize:9,fontWeight:800,color:TXT2,textTransform:"uppercase",letterSpacing:.7,marginBottom:8}}>③ Préférences <span style={{fontWeight:600,color:TXT3,textTransform:"none",fontSize:9}}>(optionnel)</span></div>
            <input style={{...inp,fontSize:12,marginBottom:16}} placeholder="Ex: pas trop épicé, avec une sauce crémeuse, pour un repas léger…"/>

            {/* ④ GÉNÉRER */}
            <button style={{...btn("acc"),width:"100%",justifyContent:"center",padding:"14px",fontSize:14,borderRadius:13}} onClick={generate} disabled={generating}>
              {generating?"⏳ Génération en cours…":"✨ Générer ma recette"}
            </button>
            {!localStorage.getItem("ws_apikey")&&(
              <div style={{fontSize:10,color:TXT3,textAlign:"center",marginTop:10}}>⚠️ Clé API requise · <span style={{color:CARAMEL2,fontWeight:700,cursor:"pointer",textDecoration:"underline"}} onClick={()=>showToast("⚠️ Configurez la clé API via les paramètres 🔑")}>Configurer 🔑</span></div>
            )}
          </>
        ):(
          <>
            {/* RÉSULTAT */}
            <div style={{background:`linear-gradient(135deg,rgba(42,20,8,.95),rgba(90,45,15,.9))`,borderRadius:16,padding:"14px 16px",marginBottom:12,position:"relative",overflow:"hidden"}}>
              <div style={{position:"relative",zIndex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                  <span style={{fontSize:34}}>{guessRecipeEmoji(result.name)||"🥘"}</span>
                  <div style={{fontFamily:"'Fraunces',serif",fontSize:17,fontWeight:900,color:"white",lineHeight:1.25}}>{result.name}</div>
                </div>
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  {result.duration&&<div style={{background:"rgba(255,255,255,.15)",color:"white",fontSize:10,borderRadius:20,padding:"2px 9px",fontWeight:700}}>⏱️ {result.duration}</div>}
                  {result.persons&&<div style={{background:"rgba(255,255,255,.15)",color:"white",fontSize:10,borderRadius:20,padding:"2px 9px",fontWeight:700}}>👥 {result.persons} pers.</div>}
                  <div style={{background:"rgba(184,112,58,.4)",color:"rgba(255,220,160,.9)",fontSize:10,borderRadius:20,padding:"2px 9px",fontWeight:700}}>🤖 IA</div>
                </div>
              </div>
            </div>

            {result.tip&&(
              <div style={{background:"rgba(184,112,58,.08)",border:`1.5px solid rgba(184,112,58,.2)`,borderRadius:12,padding:"10px 12px",marginBottom:12,display:"flex",gap:8}}>
                <span style={{fontSize:14,flexShrink:0}}>💡</span>
                <div style={{fontSize:11,color:TXT2,lineHeight:1.55}}>{result.tip}</div>
              </div>
            )}

            <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:1,color:TXT2,marginBottom:8,display:"flex",alignItems:"center",gap:7}}>
              Ingrédients <span style={{fontSize:9,background:CREAM2,color:TXT3,padding:"1px 7px",borderRadius:10,fontWeight:700}}>{result.ingredients.length}</span>
              <div style={{flex:1,height:1,background:BDR}}/>
            </div>
            <div style={{...card,padding:0,overflow:"hidden",marginBottom:12}}>
              {result.ingredients.map((ing,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"8px 12px",borderBottom:i<result.ingredients.length-1?`1px solid ${BDR}`:"none",fontSize:12}}>
                  <span style={{color:TXT,fontWeight:600}}>{ing.name}</span>
                  <span style={{color:TXT3}}>{ing.qty}{ing.unit?" "+ing.unit:""}</span>
                </div>
              ))}
            </div>

            {result.steps?.length>0&&(
              <>
                <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:1,color:TXT2,marginBottom:8,display:"flex",alignItems:"center",gap:7}}>
                  Préparation <span style={{fontSize:9,background:CREAM2,color:TXT3,padding:"1px 7px",borderRadius:10,fontWeight:700}}>{result.steps.length}</span>
                  <div style={{flex:1,height:1,background:BDR}}/>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
                  {result.steps.map((step,i)=>(
                    <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start",fontSize:12,lineHeight:1.6,color:TXT2}}>
                      <div style={{width:22,height:22,background:CARAMEL2,color:"white",borderRadius:"50%",fontSize:10,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:2}}>{i+1}</div>
                      <div>{step}</div>
                    </div>
                  ))}
                </div>
              </>
            )}

            {/* Chat modification */}
            <div style={{background:"rgba(184,112,58,.06)",border:`1.5px solid rgba(184,112,58,.2)`,borderRadius:14,padding:12,marginBottom:10}}>
              <div style={{fontSize:11,fontWeight:800,color:CARAMEL,marginBottom:3}}>💬 Modifier cette recette</div>
              <div style={{fontSize:10,color:TXT3,marginBottom:8}}>Ex : "Rends-la végétarienne", "Ajoute une sauce crémeuse"…</div>
              {chatHistory.filter(m=>m.role==="user").slice(1).slice(-2).map((m,i)=>(
                <div key={i} style={{fontSize:10,color:TXT2,padding:"3px 8px",background:"rgba(200,132,90,.08)",borderRadius:6,marginBottom:4}}>💬 {m.content}</div>
              ))}
              <div style={{display:"flex",gap:6}}>
                <input style={{...inp,flex:1,fontSize:12,padding:"8px 10px"}} placeholder="Votre demande…" value={chatMsg} onChange={e=>setChatMsg(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!chatLoading&&sendChat()}/>
                <button style={{...btn("gh"),padding:"8px 10px",fontSize:14}} onClick={()=>startVoice("chat")} disabled={listening}>🎤</button>
                <button style={{...btn("acc"),padding:"8px 12px",fontSize:12}} onClick={sendChat} disabled={chatLoading||!chatMsg.trim()}>{chatLoading?"⏳":"→"}</button>
              </div>
            </div>
          </>
        )}
      </div>

      {/* ── BARRE BAS FIXE ── */}
      <div style={{borderTop:`1px solid ${BDR}`,padding:"10px 14px",display:"flex",gap:8,flexShrink:0,background:`rgba(253,248,240,.97)`,backdropFilter:"blur(12px)"}}>
        {result?(
          <>
            <button style={{...btn("gh"),flex:1,justifyContent:"center",fontSize:11}} onClick={()=>{setResult(null);setChatHistory([]);}}>↩ Régénérer</button>
            <button style={{...btn("acc"),flex:2,justifyContent:"center",fontSize:12}} onClick={()=>onImport(result)}>💾 Enregistrer</button>
          </>
        ):(
          <button style={{...btn("gh"),flex:1,justifyContent:"center"}} onClick={onClose}>Annuler</button>
        )}
      </div>
    </FullPage>
  );
}

// ─── FOLDER MANAGER ───────────────────────────────────────────
function FolderManager({db,setDb,showToast,onClose}){
  const [newName,setNewName]=useState("");
  const folders=db.folders||[];
  const liked=db.likedRecipes||[];

  function createFolder(){
    if(!newName.trim())return;
    if(folders.find(f=>f.name===newName.trim())){showToast("⚠️ Ce dossier existe déjà");return;}
    const nd={...db,folders:[...folders,{id:Date.now(),name:newName.trim(),recipeIds:[]}]};
    setDb(nd);setNewName("");showToast("🏷️ Thème créé !");
  }
  function deleteFolder(id){
    if(!confirm("Supprimer ce thème ?"))return;
    setDb({...db,folders:folders.filter(f=>f.id!==id)});
  }
  function addToFolder(folderId,recipeId){
    const nd={...db,folders:folders.map(f=>f.id===folderId?{...f,recipeIds:[...new Set([...(f.recipeIds||[]),recipeId])]}:f)};
    setDb(nd);showToast("✅ Recette ajoutée au thème");
  }

  return(
    <Modal open onClose={onClose}>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:12,color:TXT}}>🏷️ Mes thèmes</div>
      {/* Thème Favoris automatique */}
      <div style={{...card,background:CREAM2,marginBottom:8,padding:"10px 14px"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:20}}>❤️</span>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:700,color:TXT}}>Favoris</div>
            <div style={{fontSize:11,color:TXT3}}>{liked.length} recette{liked.length!==1?"s":""}</div>
          </div>
        </div>
      </div>
      {/* Thèmes personnalisés */}
      {folders.map(f=>{
        const count=(f.recipeIds||[]).length;
        return(
          <div key={f.id} style={{...card,background:"rgba(255,255,255,.9)",marginBottom:6,padding:"10px 14px",display:"flex",alignItems:"center",gap:8}}>
            <EmojiImg emoji="🏷️" size={20}/>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700,color:TXT}}>{f.name}</div>
              <div style={{fontSize:11,color:TXT3}}>{count} recette{count!==1?"s":""}</div>
            </div>
            <button style={{background:"none",border:"none",color:DNG,cursor:"pointer",fontSize:14}} onClick={()=>deleteFolder(f.id)}>🗑️</button>
          </div>
        );
      })}
      {/* Créer un nouveau thème */}
      <div style={{display:"flex",gap:8,marginTop:10}}>
        <input style={{...inp,flex:1}} placeholder="Nom du thème… (ex: Été, Barbecue)" value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&createFolder()}/>
        <button style={{...btn("acc"),padding:"10px 14px"}} onClick={createFolder}>+ Créer</button>
      </div>
    </Modal>
  );
}

// ─── RECIPE VIEW ──────────────────────────────────────────────
function RecipeView({recipe,priceDB,db,setDb,onClose,onEdit,onDel,onAdd,showToast,onPlanFromView}){
  const [vp,setVp]=useState(recipe.persons||1);
  const [have,setHave]=useState(new Set());
  const [cooking,setCooking]=useState(false);
  const [openPanel,setOpenPanel]=useState(null); // "plan"|"theme"|null
  const [planConflict,setPlanConflict]=useState(null);
  const base=recipe.persons||1,scale=vp/base;
  const cost=estimateRecipeCost(recipe,priceDB,vp);
  const isLiked=(db.likedRecipes||[]).includes(recipe.id);
  const folders=db.folders||[];
  const calendar=db.calendar||{};
  const cookedCount=recipe.cookedCount||0;

  function togglePanel(p){setOpenPanel(prev=>prev===p?null:p);}

  async function doScan(dataUrl,mt="image/jpeg"){
    const apiKey=localStorage.getItem("ws_apikey")||"";
    if(!apiKey){setShowApiKey(true);return;}
    setScanning(true);setScanMsg("");setScanStatus("idle");
    const base64=dataUrl.split(",")[1];
    const prompt=`Tu es un expert en extraction de recettes de cuisine à partir d'images. Analyse cette image et retourne UNIQUEMENT un objet JSON valide (sans markdown, sans backtick, sans texte autour).
FORMAT EXACT :
{"title":null,"persons":null,"duration":null,"dishPhotoDataPresent":false,"ingredients":[{"name":"","qty":"","unit":""}],"steps":[]}
INSTRUCTIONS : qty=chiffre seul, unit=unité normalisée (g,kg,ml,cl,L,càs,càc,pincée,sachet,boîte,bouteille,paquet,tranche,botte), noms génériques sans marques, steps dans l'ordre logique. "dishPhotoDataPresent":true UNIQUEMENT si photo réelle d'un plat cuisiné où la nourriture occupe la majorité de l'image.`;
    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:3000,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:mt,data:base64}},{type:"text",text:prompt}]}]})});
      if(!resp.ok){const errData=await resp.json().catch(()=>({}));if(resp.status===401){throw new Error("Clé API invalide (401)");}throw new Error("Erreur "+resp.status+(errData.error?.message?" : "+errData.error.message:""));}
      const data=await resp.json();
      let text=(data.content||[]).map(c=>c.text||"").join("").trim();
      text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
      const p=JSON.parse(text);
      if(p.title)setName(p.title);if(p.persons)setPersons(String(p.persons));if(p.duration)setDuration(p.duration);
      if(p.dishPhotoDataPresent)setPhoto(dataUrl);
      if(p.ingredients?.length)setIngs(p.ingredients.map(i=>({name:i.name||"",qty:i.qty||"",unit:normUnit(i.unit||"")})));
      if(p.steps?.length)setSteps(p.steps.map(s=>s.trim()).filter(Boolean));
      const nb=p.ingredients?.filter(i=>i.name)?.length||0,ns=p.steps?.length||0;
      setScanMsg(`✨ ${nb} ingrédient${nb>1?"s":""} et ${ns} étape${ns>1?"s":""} extraits !`);setScanStatus("ok");
    }catch(err){console.error(err);if(err.message.includes("401")){localStorage.removeItem("ws_apikey");setShowApiKey(true);}setScanMsg("❌ "+err.message);setScanStatus("error");}
    setScanning(false);
  }

  async function doMultiScan(){
    if(multiPhotos.length<2){showToast("⚠️ Ajoutez au moins 2 photos");return;}
    const apiKey=localStorage.getItem("ws_apikey")||"";
    if(!apiKey){setShowApiKey(true);return;}
    setMerging(true);setScanMsg("");setScanStatus("idle");
    const prompt=`Fusionne ces ${multiPhotos.length} photos d'une même recette en UN SEUL JSON valide (sans markdown).
FORMAT : {"title":null,"persons":null,"duration":null,"dishPhotoDataPresent":false,"ingredients":[{"name":"","qty":"","unit":""}],"steps":[]}
RÈGLES : pas de doublons, ordre logique des étapes, noms génériques français, qty=chiffre seul, unit normalisée.`;
    try{
      const content=[...multiPhotos.map((p,i)=>[{type:"text",text:`Photo ${i+1}/${multiPhotos.length} :`},{type:"image",source:{type:"base64",media_type:p.mt,data:p.dataUrl.split(",")[1]}}]).flat(),{type:"text",text:prompt}];
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,messages:[{role:"user",content}]})});
      if(!resp.ok){const e=await resp.json().catch(()=>({}));if(resp.status===401){localStorage.removeItem("ws_apikey");setShowApiKey(true);}throw new Error("Erreur "+resp.status);}
      const data=await resp.json();
      let text=(data.content||[]).map(c=>c.text||"").join("").trim();
      text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
      const p=JSON.parse(text);
      if(p.title)setName(p.title);if(p.persons)setPersons(String(p.persons));if(p.duration)setDuration(p.duration);
      if(p.dishPhotoDataPresent&&multiPhotos.length)setPhoto(multiPhotos[0].dataUrl);
      if(p.ingredients?.length)setIngs(p.ingredients.map(i=>({name:i.name||"",qty:i.qty||"",unit:normUnit(i.unit||"")})));
      if(p.steps?.length)setSteps(p.steps.map(s=>s.trim()).filter(Boolean));
      const nb=p.ingredients?.filter(i=>i.name)?.length||0,ns=p.steps?.length||0;
      setScanMsg(`✨ ${multiPhotos.length} photos fusionnées — ${nb} ingr., ${ns} étapes`);setScanStatus("ok");setMultiMode(false);setMultiPhotos([]);
    }catch(err){console.error(err);setScanMsg("❌ "+err.message);setScanStatus("error");}
    setMerging(false);
  }
  function togHave(i){const s=new Set(have);if(s.has(i))s.delete(i);else s.add(i);setHave(s);}
  function scaleQ(qty){const n=parseFloat(qty);if(isNaN(n))return qty;const r=n*scale;return r%1===0?String(r):r.toFixed(2).replace(/\.?0+$/,"");}

  function toggleLike(){
    const liked=db.likedRecipes||[];
    const nd={...db,likedRecipes:isLiked?liked.filter(id=>id!==recipe.id):[...liked,recipe.id]};
    setDb(nd);showToast(isLiked?"💔 Retiré des favoris":"❤️ Ajouté aux favoris");
  }

  function handleFinishCooking({photo,note,stars}){
    const today=new Date().toLocaleDateString("fr-FR");
    const recipes=db.recipes.map(r=>{
      if(r.id!==recipe.id)return r;
      const u={...r,lastCooked:today,cookedCount:(r.cookedCount||0)+1};
      if(photo)u.photo=photo;
      if(note)u.note=note;
      if(stars)u.stars=stars;
      return u;
    });
    const nd={...db,recipes};
    setDb(nd);saveDB(nd);setCooking(false);
    showToast(stars>=4?"⭐ Superbe ! Recette mise à jour":"👨‍🍳 Recette mise à jour");
  }

  function planMeal(dk,slot){
    const existing=calendar[dk]?.[slot];
    if(existing&&String(existing)!==String(recipe.id)){
      const existingR=db.recipes.find(r=>String(r.id)===String(existing));
      setPlanConflict({dk,slot,existing:existingR});
    } else {
      applyPlan(dk,slot);
    }
    togglePanel(null);
  }

  function applyPlan(dk,slot){
    const nd={...db,calendar:{...calendar,[dk]:{...(calendar[dk]||{}),[slot]:recipe.id}}};
    setDb(nd);saveDB(nd);setPlanConflict(null);showToast("📅 Planifié !");
  }

  function addToFolder(folderId){
    const nd={...db,folders:folders.map(f=>f.id===folderId?{...f,recipeIds:[...new Set([...(f.recipeIds||[]),recipe.id])]}:f)};
    setDb(nd);showToast("🏷️ Ajouté au thème");togglePanel(null);
  }

  const diffLabel=RECIPE_DIFFICULTY.find(d=>d.id===recipe.difficulty)?.label;

  if(cooking)return<CookingMode recipe={recipe} onClose={()=>setCooking(false)} onFinish={handleFinishCooking}/>;

  return(
    <Modal open onClose={onClose} noPad>

      {/* ── HERO PHOTO ── */}
      <div style={{height:210,position:"relative",overflow:"hidden",background:`linear-gradient(135deg,${CREAM2},${BDR})`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
        {recipe.photo
          ?<img src={recipe.photo} alt={recipe.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
          :<EmojiImg emoji={guessRecipeEmoji(recipe.name)} size={80}/>
        }
        {/* Gradient overlay */}
        <div style={{position:"absolute",inset:0,background:"linear-gradient(0deg,rgba(20,10,4,.88) 0%,rgba(20,10,4,.2) 55%,transparent 100%)"}}/>
        {/* Top badges + boutons */}
        <div style={{position:"absolute",top:12,left:12,right:12,display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {recipe.source==="mealdb"&&<div style={{background:"rgba(0,0,0,.44)",color:"white",fontSize:9,borderRadius:7,padding:"3px 8px",fontWeight:700,backdropFilter:"blur(4px)"}}>🌐 TheMealDB</div>}
            {recipe.source==="ai"&&<div style={{background:"rgba(184,112,58,.65)",color:"white",fontSize:9,borderRadius:7,padding:"3px 8px",fontWeight:700,backdropFilter:"blur(4px)"}}>🤖 IA</div>}
            {recipe.lastCooked&&<div style={{background:"rgba(0,0,0,.35)",color:"white",fontSize:9,borderRadius:7,padding:"3px 8px",backdropFilter:"blur(4px)"}}>📅 {recipe.lastCooked}</div>}
          </div>
          <div style={{display:"flex",gap:5}}>
            <button style={{width:32,height:32,borderRadius:9,background:"rgba(0,0,0,.4)",border:"none",color:"white",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(4px)"}} onClick={toggleLike}>
              {isLiked?"❤️":"🤍"}
            </button>
            <button style={{width:32,height:32,borderRadius:9,background:"rgba(0,0,0,.4)",border:"none",color:"white",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(4px)"}} onClick={onClose}>✕</button>
          </div>
        </div>
        {/* Titre + chips dans la photo */}
        <div style={{position:"absolute",bottom:12,left:14,right:14}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:20,fontWeight:900,color:"white",lineHeight:1.2,marginBottom:7,textShadow:"0 1px 6px rgba(0,0,0,.4)"}}>{recipe.name}</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {recipe.duration&&<div style={{background:"rgba(255,255,255,.2)",color:"white",fontSize:10,borderRadius:20,padding:"2px 9px",fontWeight:700,backdropFilter:"blur(4px)"}}>⏱️ {recipe.duration}</div>}
            {recipe.persons&&<div style={{background:"rgba(255,255,255,.2)",color:"white",fontSize:10,borderRadius:20,padding:"2px 9px",fontWeight:700,backdropFilter:"blur(4px)"}}>👥 {recipe.persons} pers.</div>}
            {diffLabel&&<div style={{background:"rgba(255,255,255,.2)",color:"white",fontSize:10,borderRadius:20,padding:"2px 9px",fontWeight:700,backdropFilter:"blur(4px)"}}>{diffLabel}</div>}
            {cost&&<div style={{background:"rgba(90,138,58,.4)",color:"#a8e878",fontSize:10,borderRadius:20,padding:"2px 9px",fontWeight:700,backdropFilter:"blur(4px)"}}>~{cost.total.toFixed(2)}€</div>}
          </div>
        </div>
        {/* Bouton changer photo — sur le hero */}
        <button style={{position:"absolute",bottom:8,left:14,background:"rgba(0,0,0,.42)",border:"none",color:"white",borderRadius:8,padding:"4px 10px",fontSize:11,cursor:"pointer",fontWeight:600,backdropFilter:"blur(4px)"}} onClick={()=>photoRef.current.click()}>
          📷 Changer la photo
        </button>
      </div>

      {/* ── CONTENU SCROLLABLE ── */}
      <div style={{flex:1,overflowY:"auto",padding:"14px 14px 100px"}}>

        {/* Étoiles + compteur cuissons — toujours visible */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:recipe.note?6:12}}>
          <div style={{display:"flex",gap:2}}>
            {[1,2,3,4,5].map(s=><span key={s} style={{fontSize:14,opacity:s<=(recipe.stars||0)?1:.2}}>⭐</span>)}
          </div>
          {cookedCount>0&&<span style={{fontSize:10,color:TXT3,fontWeight:600}}>Cuisiné {cookedCount}×</span>}
        </div>

        {/* Note perso — lecture seule */}
        {recipe.note&&(
          <div style={{fontSize:11,color:TXT2,padding:"8px 11px",background:CREAM,borderRadius:10,borderLeft:`2.5px solid ${CARAMEL2}`,marginBottom:12,lineHeight:1.55}}>
            📝 {recipe.note}
          </div>
        )}

        {/* ── ACTION PRINCIPALE : AJOUTER À LA LISTE ── */}
        <div style={{...card,padding:"12px 14px",marginBottom:14}}>
          <div style={{fontSize:9,fontWeight:800,textTransform:"uppercase",letterSpacing:.8,color:TXT3,marginBottom:9}}>Ajouter à la liste de courses</div>
          <div style={{display:"flex",gap:8,marginBottom:7,alignItems:"center"}}>
            <Stepper value={vp} onChange={setVp}/>
            <button style={{...btn("suc"),flex:1,fontSize:12,justifyContent:"center"}} onClick={()=>onAdd(recipe,vp,have)}>🛒 Ajouter les ingrédients</button>
          </div>
          {scale!==1&&<div style={{fontSize:10,color:CARAMEL2,textAlign:"center",marginBottom:4}}>Quantités ajustées ×{scale.toFixed(2).replace(/\.?0+$/,"")}</div>}
          <div style={{fontSize:10,color:TXT3,textAlign:"center"}}>Cochez ce que vous avez déjà · seul le reste sera ajouté</div>
        </div>

        {/* ── INGRÉDIENTS ── */}
        <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:1,color:TXT2,marginBottom:8,display:"flex",alignItems:"center",gap:7}}>
          Ingrédients <span style={{fontSize:9,background:CREAM2,color:TXT3,padding:"1px 7px",borderRadius:10,fontWeight:700}}>{recipe.ingredients.length}</span>
          <div style={{flex:1,height:1,background:BDR}}/>
        </div>
        <div style={{...card,padding:0,overflow:"hidden",marginBottom:14}}>
          <div style={{padding:"6px 12px",background:"rgba(90,138,58,.06)",borderBottom:`1px solid ${BDR}`}}>
            <span style={{fontSize:10,fontWeight:700,color:SUC}}>☑ Cocher ce que j'ai déjà</span>
          </div>
          {recipe.ingredients.map((ing,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",borderBottom:i<recipe.ingredients.length-1?`1px solid ${BDR}`:"none",fontSize:13,opacity:have.has(i)?.45:1,transition:"opacity .15s"}}>
              <div onClick={()=>togHave(i)} style={{width:20,height:20,borderRadius:5,border:have.has(i)?"none":`1.5px solid ${BDR}`,background:have.has(i)?SUC:"transparent",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,transition:"all .15s"}}>
                {have.has(i)&&<span style={{color:"white",fontSize:11,fontWeight:800}}>✓</span>}
              </div>
              <span style={{flex:1,textDecoration:have.has(i)?"line-through":"none"}}>{ing.name}</span>
              <span style={{color:TXT3,fontSize:12,fontWeight:600}}>{scaleQ(ing.qty)}{ing.unit?" "+ing.unit:""}</span>
            </div>
          ))}
        </div>

        {/* ── ÉTAPES ── */}
        {recipe.steps?.length>0&&(
          <>
            <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:1,color:TXT2,marginBottom:8,display:"flex",alignItems:"center",gap:7}}>
              Préparation <span style={{fontSize:9,background:CREAM2,color:TXT3,padding:"1px 7px",borderRadius:10,fontWeight:700}}>{recipe.steps.length}</span>
              <div style={{flex:1,height:1,background:BDR}}/>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
              {recipe.steps.map((step,i)=>(
                <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start",fontSize:13,lineHeight:1.6,color:TXT2}}>
                  <div style={{width:22,height:22,background:CARAMEL2,color:"white",borderRadius:"50%",fontSize:10,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:2}}>{i+1}</div>
                  <div>{step}</div>
                </div>
              ))}
            </div>
          </>
        )}

        {/* Source MealDB */}
        {recipe.source==="mealdb"&&(
          <div style={{fontSize:10,color:TXT3,marginBottom:14,padding:"7px 10px",background:CREAM,borderRadius:9,borderLeft:`2px solid ${BDR}`,lineHeight:1.6}}>
            📖 Source : <span style={{color:CARAMEL2,fontWeight:700,cursor:"pointer",textDecoration:"underline"}} onClick={()=>window.open(`https://www.themealdb.com/meal/${recipe.mealdbId}`,"_blank")}>TheMealDB — voir l'original</span> · Licence CC BY-SA
          </div>
        )}

        {/* ── 3 BOUTONS SECONDAIRES OUTLINE ── */}
        <div style={{display:"flex",gap:7,marginBottom:openPanel?8:0}}>
          <button style={{...btn("gh"),flex:1,justifyContent:"center",fontSize:11,padding:"8px 4px",border:`1.5px solid ${BDR}`,borderColor:openPanel==="plan"?CARAMEL:BDR,color:openPanel==="plan"?CARAMEL:TXT2,background:openPanel==="plan"?`rgba(184,112,58,.06)`:"transparent"}} onClick={()=>togglePanel("plan")}>
            📅 Planifier
          </button>
          <button style={{...btn("gh"),flex:1,justifyContent:"center",fontSize:11,padding:"8px 4px",border:`1.5px solid ${BDR}`,borderColor:openPanel==="theme"?CARAMEL:BDR,color:openPanel==="theme"?CARAMEL:TXT2,background:openPanel==="theme"?`rgba(184,112,58,.06)`:"transparent"}} onClick={()=>togglePanel("theme")}>
            🏷️ Thème
          </button>
          <button style={{...btn("gh"),flex:1,justifyContent:"center",fontSize:11,padding:"8px 4px",border:`1.5px solid ${BDR}`,borderColor:openPanel==="modifier"?CARAMEL:BDR,color:openPanel==="modifier"?CARAMEL:TXT2,background:openPanel==="modifier"?`rgba(184,112,58,.06)`:"transparent"}} onClick={onEdit}>
            ✏️ Modifier
          </button>
        </div>

        {/* Panel Planifier */}
        {openPanel==="plan"&&(
          <div style={{background:CREAM2,border:`1px solid ${BDR}`,borderRadius:13,padding:"12px 13px",marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:10,fontWeight:800,color:TXT2,textTransform:"uppercase",letterSpacing:.6}}>📅 Choisir un créneau</div>
              <button onClick={()=>setOpenPanel(null)} style={{background:"none",border:"none",fontSize:13,color:TXT3,cursor:"pointer"}}>✕</button>
            </div>
            <div style={{maxHeight:200,overflowY:"auto"}}>
              {(()=>{
                const days=[];
                for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()+i);days.push(d);}
                return days.map(d=>{
                  const dk=dateKey(d);
                  const isToday=dk===dateKey(new Date());
                  return(
                    <div key={dk} style={{marginBottom:8}}>
                      <div style={{fontSize:9,fontWeight:700,color:TXT3,marginBottom:4}}>{isToday?"Aujourd'hui":d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"short"})}</div>
                      <div style={{display:"flex",gap:5}}>
                        {MEAL_SLOTS.map(slot=>{
                          const taken=calendar[dk]?.[slot];
                          const takenName=taken?db.recipes.find(r=>String(r.id)===String(taken))?.name:"";
                          return(
                            <div key={slot} style={{flex:1,padding:"6px 4px",borderRadius:9,background:taken?"rgba(212,96,74,.07)":SURF,border:`1px solid ${taken?"rgba(212,96,74,.25)":BDR}`,cursor:"pointer",fontSize:10,textAlign:"center"}} onClick={()=>planMeal(dk,slot)}>
                              <div style={{fontWeight:700,color:TXT2,marginBottom:1}}>{MEAL_LABELS[slot]}</div>
                              {taken?<div style={{color:DNG,fontSize:9,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{takenName||"Occupé"}</div>:<div style={{color:TXT3,fontSize:9}}>+ Ajouter</div>}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                });
              })()}
            </div>
          </div>
        )}

        {/* Panel Thème */}
        {openPanel==="theme"&&(
          <div style={{background:CREAM2,border:`1px solid ${BDR}`,borderRadius:13,padding:"12px 13px",marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:10,fontWeight:800,color:TXT2,textTransform:"uppercase",letterSpacing:.6}}>🏷️ Ajouter à un thème</div>
              <button onClick={()=>setOpenPanel(null)} style={{background:"none",border:"none",fontSize:13,color:TXT3,cursor:"pointer"}}>✕</button>
            </div>
            {folders.length===0
              ?<div style={{fontSize:11,color:TXT3,textAlign:"center",padding:"8px 0"}}>Aucun thème · créez-en un depuis la page Recettes</div>
              :<div style={{display:"flex",flexDirection:"column",gap:5}}>
                {folders.map(f=>(
                  <div key={f.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:9,background:"rgba(255,255,255,.7)",fontSize:12,fontWeight:600,cursor:"pointer"}} onClick={()=>addToFolder(f.id)}>
                    🏷️ {f.name}
                  </div>
                ))}

    </Modal>
  );
}

function PageHistorique({db,setDb,showToast,goToListe}){
  const [qprod,setQprod]=useState(null);
  const [catF,setCatF]=useState("Toutes");

  function confQuick(name,cat,unit,qty){
    const ni=mergeItem(db.items,name,qty,unit,"manuel",cat);
    const ph={...db.productHistory};
    if(!ph[name])ph[name]={count:0,category:cat,lastUnit:unit};
    ph[name].count++;ph[name].lastUnit=unit;
    const nd={...db,items:ni,productHistory:ph};setDb(nd);saveDB(nd);
    setQprod(null);goToListe();showToast("✅ "+name+" ajouté");
  }

  function deleteHistItem(sessionIdx,itemName){
    const h=db.shoppingHistory.map((s,i)=>{
      if(i!==sessionIdx)return s;
      const items=s.items.filter(it=>it.name!==itemName);
      return{...s,items,count:items.length};
    }).filter(s=>s.items.length>0);
    const nd={...db,shoppingHistory:h};setDb(nd);saveDB(nd);showToast("🗑️ Article supprimé");
  }

  function reloadAll(idx){
    const s=db.shoppingHistory[idx];let ni=[...db.items];
    s.items.forEach(old=>{
      ni=mergeItem(ni,old.name,(old.quantities||[{qty:1,unit:""}])[0].qty,(old.quantities||[{qty:1,unit:""}])[0].unit,"historique",old.category);
    });
    const nd={...db,items:ni};setDb(nd);saveDB(nd);goToListe();showToast("🔄 Course rechargée");
  }

  function reloadSel(idx,selNames){
    const s=db.shoppingHistory[idx];let ni=[...db.items];
    s.items.filter(item=>selNames.has(item.name)).forEach(old=>{
      (old.quantities||[{qty:1,unit:"",source:"historique"}]).forEach(q=>{
        ni=mergeItem(ni,old.name,q.qty,q.unit,"historique",old.category);
      });
    });
    const nd={...db,items:ni};setDb(nd);saveDB(nd);goToListe();
    showToast(`✅ ${selNames.size} article${selNames.size>1?"s":""} ajouté${selNames.size>1?"s":""}`);
  }

  const allTop=Object.entries(db.productHistory).sort((a,b)=>b[1].count-a[1].count);
  const allCats=["Toutes",...[...new Set(allTop.map(([,d])=>d.category||"❓ Autre").filter(Boolean))]];
  const filtered=(catF==="Toutes"?allTop:allTop.filter(([,d])=>(d.category||"❓ Autre")===catF)).slice(0,24);

  return(
    <div style={{padding:14,paddingBottom:90}}>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:20,marginBottom:14,color:TXT}}>Historique</div>

      {allTop.length>0&&(
        <div style={{...card,background:"rgba(255,255,255,.88)",marginBottom:14}}>
          <div style={{fontSize:13,fontWeight:700,color:TXT2,marginBottom:8}}>🔁 Produits fréquents</div>
          <div style={{display:"flex",gap:5,overflowX:"auto",marginBottom:8,paddingBottom:4,scrollbarWidth:"none"}}>
            {allCats.map(c=>(
              <div key={c} style={{background:catF===c?CARAMEL2:CREAM2,color:catF===c?"white":TXT2,borderRadius:20,padding:"4px 10px",fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0,border:`1px solid ${catF===c?CARAMEL2:BDR}`}}
                onClick={()=>setCatF(c)}>{c}</div>
            ))}
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {filtered.map(([name,d])=>(
              <div key={name} style={{background:CREAM,border:`1px solid ${BDR}`,borderRadius:20,padding:"5px 12px",fontSize:12,color:TXT2,cursor:"pointer",display:"flex",alignItems:"center",gap:5,fontWeight:600}}
                onClick={()=>setQprod({name,category:d.category||getCat(name),lastUnit:d.lastUnit||"",count:d.count})}>
                <span style={{fontSize:14}}>{(d.category||getCat(name)).split(" ")[0]}</span>
                <span style={{color:TXT}}>{name}</span>
                <span style={{fontSize:10,color:TXT3}}>{d.count}×</span>
                <span style={{color:CARAMEL2,fontSize:15,fontWeight:700}}>+</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {db.shoppingHistory.length>0?(
        <>
          <div style={{fontSize:13,fontWeight:700,color:TXT2,marginBottom:8}}>🕐 Courses passées</div>
          {db.shoppingHistory.map((s,i)=>(
            <HistorySession key={i} session={s} onReloadAll={()=>reloadAll(i)} onReloadSelected={sel=>reloadSel(i,sel)} onDeleteItem={name=>deleteHistItem(i,name)}/>
          ))}
        </>
      ):allTop.length===0?(
        <div style={{textAlign:"center",padding:"48px 20px"}}>
          <div style={{fontSize:44,marginBottom:12}}>📦</div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:6,color:TXT}}>Aucun historique</div>

function hashPassword(pwd){
  let h=0;for(let i=0;i<pwd.length;i++){h=((h<<5)-h)+pwd.charCodeAt(i);h|=0;}
  return Math.abs(h).toString(36);
}

// Génère un ID unique aléatoire pour un nouveau foyer
function genFoyerId(){
  const chars="abcdefghijklmnopqrstuvwxyz0123456789";
  let id="";for(let i=0;i<10;i++)id+=chars[Math.floor(Math.random()*chars.length)];
  return id;
}

// Récupère le code d'invitation depuis l'URL (?invite=xxx)

  const p=new URLSearchParams(window.location.search);
  return p.get("invite")||null;
}
