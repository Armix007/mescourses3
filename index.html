// Traduction FR → EN pour la recherche TheMealDB
const SEARCH_FR_TO_EN={"poulet":"chicken","boeuf":"beef","bœuf":"beef","porc":"pork","agneau":"lamb","poisson":"fish","saumon":"salmon","crevette":"shrimp","pâtes":"pasta","riz":"rice","soupe":"soup","salade":"salad","tarte":"pie","pizza":"pizza","curry":"curry","risotto":"risotto","omelette":"omelette","crêpe":"crepe","ratatouille":"ratatouille","bouillabaisse":"bouillabaisse","cassoulet":"cassoulet","gratin":"gratin"};
function translateMealName(enName){return MEAL_NAME_FR[enName]||enName;}
function translateSearchToEN(frTerm){
  const low=frTerm.toLowerCase().trim();
  return SEARCH_FR_TO_EN[low]||frTerm;
}
function parseMealDBMeasure(measure){
  if(!measure)return{qty:"",unit:""};
  const fracs={"1/2":"0.5","1/3":"0.33","1/4":"0.25","2/3":"0.67","3/4":"0.75"};
  let s=measure.trim().toLowerCase();
  Object.entries(fracs).forEach(([f,v])=>{s=s.replace(f,v);});
  const match=s.match(/^([\d.]+)\s*([a-zéàèêâ ]*)/);
  if(!match)return{qty:"",unit:""};
  const qty=match[1];
  const rawUnit=(match[2]||"").trim();
  const unitMap={g:"g",kg:"kg",ml:"ml",cl:"cl",l:"L",cup:"",cups:"",tbsp:"càs",tbs:"càs",tsp:"càc",oz:"g",lb:"kg",pinch:"pincée",bunch:"botte",clove:"pièce",cloves:"pièce",slice:"tranche",slices:"tranche",can:"boîte",jar:"boîte",bag:"paquet",packet:"paquet",bottle:"bouteille"};
  return{qty,unit:(unitMap[rawUnit]!==undefined?unitMap[rawUnit]:"").trim()};
}

function MealDBSearch({onImport,onClose,showToast,initialMeal}){
  const [view,setView]=useState(initialMeal?"detail":"categories");
  const [categories,setCategories]=useState([]);
  const [query,setQuery]=useState("");
  const [results,setResults]=useState([]);
  const [loading,setLoading]=useState(false);
  const [detail,setDetail]=useState(null);
  const detailRef=useRef(null);
  const [translating,setTranslating]=useState(false);
  const [selectedCat,setSelectedCat]=useState("");

  useEffect(()=>{
    if(!initialMeal)fetch("https://www.themealdb.com/api/json/v1/1/categories.php")
      .then(r=>r.json()).then(d=>setCategories(d.categories||[])).catch(()=>{});
  },[]);

  useEffect(()=>{
    if(!initialMeal) return;
    if(initialMeal._preloaded){
      // Recette locale pré-chargée → afficher directement
      detailRef.current=initialMeal._preloaded;
      setDetail(initialMeal._preloaded);
      setView("detail");
    } else if(initialMeal?.mealdbId){
      loadDetail(initialMeal.mealdbId);
    }
  },[initialMeal]);

  async function browseCategory(cat){
    setSelectedCat(cat);setLoading(true);setResults([]);setView("list");
    try{
      // 1. Cache local en priorité
      const localHits = filterLocalByCategory(cat, 200);
      if(localHits.length > 0){
        setResults(localHits.map(m=>({
          idMeal: m.id||"",
          strMeal: m.nom||m.nomEN||"",
          strCategory: cat,
          _localData: m
        })));
        setLoading(false);
        return;
      }
      // 2. API en ligne
      const r=await fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?c=${encodeURIComponent(cat)}`);
      const d=await r.json();setResults(d.meals||[]);
    }catch(_e){showToast("❌ Erreur de connexion");}
    setLoading(false);
  }

  async function search(){
    if(!query.trim())return;
    setLoading(true);setResults([]);setView("list");setSelectedCat("");
    try{
      // 1. Cache local en priorité
      const localHits = searchLocalMealDB(query, 50);
      if(localHits.length > 0){
        setResults(localHits.map(m=>({
          idMeal: m.id||"",
          strMeal: m.nom||m.nomEN||"",
          strCategory: m.categorieEN||m.categorie||"",
          _localData: m
        })));
        setLoading(false);
        return;
      }
      // 2. API en ligne
      const r=await fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${encodeURIComponent(query)}`);
      const d=await r.json();setResults(d.meals||[]);
      if(!d.meals?.length)showToast("Aucune recette trouvée");
    }catch(_e){showToast("❌ Erreur de connexion");}
    setLoading(false);
  }

  async function browseArea(area){
    setSelectedCat("__area__"+area);setLoading(true);setResults([]);setView("list");
    try{
      // 1. Cache local en priorité
      const localHits = filterLocalByArea(area, 200);
      if(localHits.length > 0){
        setResults(localHits.map(m=>({
          idMeal: m.id||"",
          strMeal: m.nom||m.nomEN||"",
          strCategory: m.categorieEN||m.categorie||"",
          _localData: m
        })));
        setLoading(false);
        return;
      }
      // 2. API en ligne
      const r=await fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?a=${encodeURIComponent(area)}`);
      const d=await r.json();setResults(d.meals||[]);
    }catch(_e){showToast("❌ Erreur de connexion");}
    setLoading(false);
  }

  async function loadDetail(id){
    setLoading(true);setDetail(null);setView("detail");
    try{
      // 1. Chercher dans le cache local (id numérique ou string)
      const localMatch = _localArray().find(m=>String(m.id)===String(id));
      if(localMatch){
        // Déjà traduit → afficher directement, pas besoin d'IA
        setDetail(localMealToWisely(localMatch));
        setLoading(false);
        return;
      }
      // 2. Fallback : API en ligne + traduction IA si clé dispo
      const r=await fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${id}`);
      const d=await r.json();
      const m=d.meals?.[0];if(!m){showToast("❌ Introuvable");setView("list");setLoading(false);return;}
      const ings=[];
      for(let i=1;i<=20;i++){
        const name=(m[`strIngredient${i}`]||"").trim();
        const measure=(m[`strMeasure${i}`]||"").trim();
        if(!name)continue;
        const normalized = normalizeIngredient(name);
        ings.push({name:normalized.nom,...parseMealDBMeasure(measure),category:normalized.categorie});
      }
      // Nettoyage des étapes : supprimer les "STEP 1", "Step 1:", etc. parasites
      const rawSteps=(m.strInstructions||"").split(/\r?\n/).map(s=>s.trim()).filter(s=>s.length>3);
      const steps=rawSteps.map(s=>s.replace(/^(STEP|Step|step)\s*\d+[:\.\s]*/,"").trim()).filter(s=>s.length>3);
      const raw={
        id:Date.now(),name:m.strMeal,persons:null,duration:null,photo:null,
        source:"mealdb",mealdbId:m.idMeal,
        category:CAT_FR[m.strCategory]||m.strCategory||"",
        area:AREA_FR[m.strArea]||m.strArea||"",
        ingredients:ings,steps,
        date:new Date().toLocaleDateString("fr-FR")
      };
      setLoading(false);
      // Traduire avec Anthropic si clé dispo — ingrédients EN PRIORITÉ
      const apiKey=localStorage.getItem("ws_apikey")||"";
      if(apiKey){
        setTranslating(true);
        try{
          const prompt=`Tu es un traducteur culinaire français expert. Traduis cette recette anglaise en français.

RÈGLES STRICTES :
- Traduis le nom du plat en français naturel (si traduction connue), sinon garde l'original
- Pour chaque ingrédient : traduis en nom générique français COURANT (ex: "chicken thighs" → "cuisses de poulet", "garlic cloves" → "gousses d'ail", "olive oil" → "huile d'olive", "chorizo" → "chorizo")
- Traduis chaque étape en français naturel et fluide
- Conserve exactement les mêmes qty et unit pour chaque ingrédient
- Ne jamais laisser de mots anglais dans les noms d'ingrédients
- Réponds UNIQUEMENT en JSON valide (pas de markdown, pas de backtick, pas de commentaire)

FORMAT EXACT :
{"name":"string","ingredients":[{"name":"string","qty":"string","unit":"string"}],"steps":["string"]}

DONNÉES À TRADUIRE :
Nom: ${raw.name}
Ingrédients: ${JSON.stringify(raw.ingredients)}
Étapes: ${JSON.stringify(raw.steps)}`;
          const resp=await fetch("https://api.anthropic.com/v1/messages",{
            method:"POST",
            headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
            body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,messages:[{role:"user",content:prompt}]})
          });
          if(resp.ok){
            const data=await resp.json();
            let text=(data.content||[]).map(c=>c.text||"").join("").trim();
            text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
            const translated=JSON.parse(text);
            if(translated.name)raw.name=translated.name;
            if(translated.ingredients?.length===raw.ingredients.length)raw.ingredients=translated.ingredients;
            if(translated.steps?.length)raw.steps=translated.steps;
          }
        }catch(e){console.warn("Traduction échouée:",e);}
        setTranslating(false);
      }
      detailRef.current={...raw};
      setDetail({...raw});
    }catch(e){showToast("❌ "+e.message);setView("list");}
    setLoading(false);setTranslating(false);
  }

  const [catTab,setCatTab]=useState("categories"); // categories | areas

  return(
    <FullPage open onClose={onClose}>
      {/* ── HEADER ── */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 14px 10px",borderBottom:`1px solid ${BDR}`,flexShrink:0}}>
        <div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:20,fontWeight:900,color:TXT}}>🌐 TheMealDB</div>
          <div style={{fontSize:10,color:TXT3,marginTop:2}}>
            {_localArray().length>0
              ?<span>📦 <b style={{color:SUC}}>{_localArray().length} recettes</b> hors-ligne</span>
              :<span>Recettes CC BY-SA · <span style={{color:CARAMEL2,fontWeight:700,cursor:"pointer",textDecoration:"underline"}} onClick={()=>window.open("https://www.themealdb.com","_blank")}>themealdb.com</span></span>
            }
          </div>
        </div>
        <button style={{...btn("gh"),padding:"8px 12px",fontSize:12}} onClick={onClose}>✕ Annuler</button>
      </div>

      {/* ── CONTENU SCROLLABLE ── */}
      <div style={{flex:1,overflowY:"auto",padding:"14px 14px 40px"}}>

      {/* VUE CATÉGORIES */}
      {view==="categories"&&(
        <>
          {/* Recherche */}
          <div style={{position:"relative",marginBottom:12}}>
            <input style={{...inp,paddingLeft:34}} placeholder={_localArray().length>0?"Rechercher en français…":"Rechercher (en anglais)…"} value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==="Enter"&&search()}/>
            <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",fontSize:14,pointerEvents:"none"}}>🔍</span>
            <button style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",...btn("acc"),padding:"6px 12px",fontSize:12}} onClick={search} disabled={loading}>{loading?"⏳":"→"}</button>
          </div>

          {/* Tabs Catégories / Origines */}
          <div style={{display:"flex",background:"rgba(0,0,0,.06)",borderRadius:12,padding:3,gap:2,marginBottom:14}}>
            {[{id:"categories",label:"🍽️ Catégories"},{id:"areas",label:"🌍 Origines"}].map(t=>(
              <div key={t.id} style={{flex:1,padding:"8px 4px",textAlign:"center",fontSize:12,fontWeight:700,borderRadius:9,background:catTab===t.id?SURF:"transparent",color:catTab===t.id?CARAMEL:TXT2,cursor:"pointer",transition:"all .15s",boxShadow:catTab===t.id?"0 1px 4px rgba(0,0,0,.08)":"none"}} onClick={()=>setCatTab(t.id)}>
                {t.label}

                  <span style={{fontSize:22,flexShrink:0}}>{(CAT_FR[cat.strCategory]||cat.strCategory).split(" ")[0]}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:700,color:TXT,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{(CAT_FR[cat.strCategory]||cat.strCategory).replace(/^[^ ]+ /,"")}</div>
                  </div>

          )}
          {catTab==="areas"&&(
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {Object.entries(AREA_FR).map(([en,fr])=>(
                <div key={en} style={{display:"flex",alignItems:"center",gap:8,padding:"11px 12px",background:"rgba(255,255,255,.9)",border:`1px solid ${BDR}`,borderRadius:13,cursor:"pointer"}} onClick={()=>browseArea(en)}>
                  <span style={{fontSize:22,flexShrink:0}}>{fr.split(" ")[0]}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:700,color:TXT,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{fr.replace(/^[^ ]+ /,"")}</div>
                  </div>
                  <span style={{color:CARAMEL2,fontWeight:700,fontSize:14}}>›</span>
                </div>
              ))}
            </div>
          )}

          <div style={{fontSize:10,color:TXT3,marginTop:14,padding:"8px 11px",background:CREAM,borderRadius:9,borderLeft:`2px solid ${BDR}`,lineHeight:1.55}}>
            📖 Recettes issues de <span style={{color:CARAMEL2,fontWeight:700,cursor:"pointer",textDecoration:"underline"}} onClick={()=>window.open("https://www.themealdb.com","_blank")}>TheMealDB.com</span> · Licence CC BY-SA
          </div>
        </>
      )}

      {/* VUE LISTE */}
      {view==="list"&&(
        <>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
            <button style={{...btn("gh"),fontSize:11,padding:"7px 12px"}} onClick={()=>{setView("categories");setResults([]);}}>← Retour</button>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:16,fontWeight:800,color:TXT,flex:1}}>
              {selectedCat.startsWith("__area__")?AREA_FR[selectedCat.replace("__area__","")]||selectedCat.replace("__area__",""):selectedCat?CAT_FR[selectedCat]||selectedCat:"Résultats"}
            </div>
            <span style={{fontSize:11,color:TXT3,fontWeight:600}}>{results.length}</span>
          </div>
          {loading&&<div style={{textAlign:"center",padding:20,color:TXT3}}>⏳ Chargement…</div>}
          <div style={{display:"flex",flexDirection:"column",gap:0}}>
            {results.map(m=>(
              <div key={m.idMeal||m._localData?.id||Math.random()} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:`1px solid ${BDR}`,cursor:"pointer"}} onClick={()=>{
                if(m._localData){const ld=localMealToWisely(m._localData);detailRef.current=ld;setDetail(ld);setView("detail");}
                else{loadDetail(m.idMeal);}
              }}>
                <div style={{width:46,height:46,borderRadius:10,background:`linear-gradient(135deg,${CREAM2},${BDR})`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,overflow:"hidden"}}>
                  {m._localData?.photo?<img src={m._localData.photo} alt="" style={{width:"100%",height:"100%",objectFit:"cover",borderRadius:10}}/>:<EmojiImg emoji={guessRecipeEmoji(m._localData?.name||m.strMeal||"")} size={24}/>}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:700,color:TXT,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m._localData?.name||m.strMeal||""}</div>
                  {(m._localData?.category||m.strCategory)&&<div style={{fontSize:10,color:TXT3,marginTop:1}}>{m._localData?.category||(CAT_FR[m.strCategory]||m.strCategory)}{m._localData?.area?` · ${m._localData.area}`:""}</div>}
                </div>
                <span style={{color:TXT3,fontSize:16}}>›</span>
              </div>
            ))}
          </div>
        </>
      )}

      {/* VUE DÉTAIL */}
      {view==="detail"&&(
        <>
          {(loading||translating)&&(
            <div style={{textAlign:"center",padding:"40px 20px"}}>
              <div style={{marginBottom:8}}><EmojiImg emoji="⏳" size={32}/></div>
              <div style={{fontSize:13,color:TXT2,fontWeight:600}}>{translating?"✨ Traduction en cours…":"Chargement…"}</div>
              {translating&&<div style={{fontSize:11,color:TXT3,marginTop:4}}>L'IA traduit le nom, les ingrédients et les étapes</div>}
            </div>
          )}
          {detail&&!loading&&!translating&&(
            <>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                <button style={{...btn("gh"),fontSize:11,padding:"7px 12px"}} onClick={()=>{setDetail(null);setView("list");}}>← Retour</button>
                <div style={{fontFamily:"'Fraunces',serif",fontSize:16,color:TXT,flex:1,lineHeight:1.3,fontWeight:800}}>{detail.name}</div>
              </div>

              {/* Bannière import */}
              <div style={{background:`linear-gradient(135deg,rgba(184,112,58,.08),rgba(184,112,58,.04))`,border:`1.5px solid rgba(184,112,58,.25)`,borderRadius:13,padding:"11px 13px",marginBottom:14,display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:20,flexShrink:0}}>📥</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:12,fontWeight:800,color:CARAMEL}}>Non enregistrée</div>
                  <div style={{fontSize:10,color:TXT2,marginTop:1}}>Importez pour modifier et retrouver dans vos recettes</div>
                </div>
              </div>

              <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:12}}>
                {detail.category&&<span style={{fontSize:10,background:CREAM2,padding:"2px 8px",borderRadius:20,color:TXT2,fontWeight:600}}>{detail.category}</span>}
                {detail.area&&<span style={{fontSize:10,background:CREAM2,padding:"2px 8px",borderRadius:20,color:TXT2,fontWeight:600}}>{detail.area}</span>}
                <span style={{fontSize:10,background:CREAM2,padding:"2px 8px",borderRadius:20,color:TXT2,fontWeight:600}}>🥗 {detail.ingredients.length} ingr.</span>
                {detail.steps?.length>0&&<span style={{fontSize:10,background:CREAM2,padding:"2px 8px",borderRadius:20,color:TXT2,fontWeight:600}}>📋 {detail.steps.length} étapes</span>}
                <span style={{fontSize:10,background:CREAM2,padding:"2px 8px",borderRadius:20,color:TXT2,fontWeight:600}}>👥 {detail.persons||"?"} pers.</span>
                {detail.duration&&<span style={{fontSize:10,background:CREAM2,padding:"2px 8px",borderRadius:20,color:TXT2,fontWeight:600}}>⏱️ {detail.duration}</span>}
              </div>

              {/* Ingrédients */}
              <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:1,color:TXT2,marginBottom:8,display:"flex",alignItems:"center",gap:7}}>
                Ingrédients <span style={{fontSize:9,background:CREAM2,color:TXT3,padding:"1px 7px",borderRadius:10,fontWeight:700}}>{detail.ingredients.length}</span>
                <div style={{flex:1,height:1,background:BDR}}/>
              </div>
              <div style={{...card,padding:0,overflow:"hidden",marginBottom:12}}>
                {detail.ingredients.map((ing,i)=>(
                  <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"8px 12px",borderBottom:i<detail.ingredients.length-1?`1px solid ${BDR}`:"none",fontSize:13}}>
                    <span style={{color:TXT,fontWeight:600}}>{ing.name}</span>
                    <span style={{color:TXT3}}>{ing.qty}{ing.unit?" "+ing.unit:""}</span>
                  </div>
                ))}
              </div>

              {/* Étapes */}
              {detail.steps?.length>0&&(
                <>
                  <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:1,color:TXT2,marginBottom:8,display:"flex",alignItems:"center",gap:7}}>
                    Préparation <span style={{fontSize:9,background:CREAM2,color:TXT3,padding:"1px 7px",borderRadius:10,fontWeight:700}}>{detail.steps.length}</span>
                    <div style={{flex:1,height:1,background:BDR}}/>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
                    {detail.steps.map((step,i)=>(
                      <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start",fontSize:12,lineHeight:1.6,color:TXT2}}>
                        <div style={{width:22,height:22,background:CARAMEL2,color:"white",borderRadius:"50%",fontSize:10,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:2}}>{i+1}</div>
                        <div>{step}</div>
                      </div>
                    ))}
                  </div>
                </>
              )}

              <div style={{fontSize:10,color:TXT3,padding:"7px 10px",background:CREAM,borderRadius:9,borderLeft:`2px solid ${BDR}`,lineHeight:1.6}}>
                📖 Source : <span style={{color:CARAMEL2,fontWeight:700,cursor:"pointer",textDecoration:"underline"}} onClick={()=>window.open(`https://www.themealdb.com/meal/${detail.mealdbId}`,"_blank")}>TheMealDB — voir la recette originale</span><br/>
                Licence Creative Commons CC BY-SA · Traduction automatique par IA
              </div>
            </>
          )}
        </>
      )}

      </div>

      {/* Barre bas fixe — import uniquement dans le détail */}
      {view==="detail"&&detail&&!loading&&!translating&&(
        <div style={{borderTop:`1px solid ${BDR}`,padding:"10px 14px",display:"flex",gap:8,flexShrink:0,background:`rgba(253,248,240,.97)`,backdropFilter:"blur(12px)"}}>
          <button style={{...btn("gh"),flex:1,justifyContent:"center"}} onClick={()=>{setDetail(null);setView("list");}}>← Retour</button>
          <button style={{...btn("acc"),flex:2,justifyContent:"center"}} onClick={()=>onImport(detailRef.current||detail)}>📥 Importer dans mes recettes</button>
        </div>
      )}
    </FullPage>
  );
}

    <Modal open={open} onClose={onClose}>

        Pour analyser des recettes par IA, entrez votre clé API Anthropic.<br/>
        Obtenez-la sur <strong style={{color:CARAMEL2}}>console.anthropic.com</strong> → API Keys.<br/>
        Elle sera sauvegardée localement sur cet appareil.
      </div>
      <span style={lbl}>Clé API (sk-ant-...)</span>
      <input style={{...inp,marginBottom:14,fontFamily:"monospace",fontSize:12}} type="password" placeholder="sk-ant-api03-..." value={k} onChange={e=>setK(e.target.value)}/>
      <div style={{display:"flex",gap:8}}>
        <button style={{...btn("gh"),flex:1}} onClick={onClose}>Annuler</button>

  );
}

// ─── RECIPE EDIT ──────────────────────────────────────────────
function RecipeEdit({recipe,onSave,onClose,onDel,showToast}){
  const isNew=!recipe;
  const [name,setName]=useState(recipe?.name||"");
  const [persons,setPersons]=useState(recipe?.persons||"");
  const [duration,setDuration]=useState(recipe?.duration||"");
  const [photo,setPhoto]=useState(recipe?.photo||null);
  const [difficulty,setDifficulty]=useState(recipe?.difficulty||"");
  const [mealType,setMealType]=useState(recipe?.mealType||"");
  const [ings,setIngs]=useState(recipe?.ingredients?.length?recipe.ingredients.map(i=>({...i})):[{name:"",qty:"",unit:""}]);
  const [steps,setSteps]=useState(recipe?.steps?.length?[...recipe.steps]:[""]);
  const [scanning,setScanning]=useState(false);
  const [scanMsg,setScanMsg]=useState("");
  const [scanStatus,setScanStatus]=useState("idle");
  const [scannedRaw,setScannedRaw]=useState(null);
  const [cropSrc,setCropSrc]=useState(null);
  const [cropFor,setCropFor]=useState(null);
  const [showApiKey,setShowApiKey]=useState(false);
  const [multiMode,setMultiMode]=useState(false);
  const [multiPhotos,setMultiPhotos]=useState([]);
  const [merging,setMerging]=useState(false);
  const [openPanel,setOpenPanel]=useState(null); // "note"|"delete"|null
  const [noteText,setNoteText]=useState(recipe?.note||"");
  const scanRef=useRef(),photoRef=useRef(),multiRef=useRef();

  function handlePhoto(e){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();r.onload=ev=>setPhoto(ev.target.result);r.readAsDataURL(file);e.target.value="";
  }

  function handleScanFile(e){
    const file=e.target.files[0];if(!file)return;
    const mt=file.type||"image/jpeg";
    const r=new FileReader();r.onload=ev=>{const dataUrl=ev.target.result;setScannedRaw({dataUrl,mt});doScan(dataUrl,mt);};
    r.readAsDataURL(file);e.target.value="";
  }

  function handleMultiFile(e){
    const file=e.target.files[0];if(!file)return;
    const mt=file.type||"image/jpeg";
    const r=new FileReader();r.onload=ev=>{setMultiPhotos(prev=>[...prev,{dataUrl:ev.target.result,mt,id:Date.now()}]);};
    r.readAsDataURL(file);e.target.value="";
  }

  function removeMultiPhoto(id){setMultiPhotos(prev=>prev.filter(p=>p.id!==id));}

  function handleCropConfirm(dataUrl){
    if(cropFor==="photo"){setPhoto(dataUrl);setCropSrc(null);}
    else if(cropFor==="scan-retry"){setCropSrc(null);doScan(dataUrl,scannedRaw?.mt||"image/jpeg");}
  }

  function uIng(i,f,v){const n=[...ings];n[i]={...n[i],[f]:v};setIngs(n);}
  function uStep(i,v){const n=[...steps];n[i]=v;setSteps(n);}

  function doSave(){
    if(!name.trim()){showToast("⚠️ Donnez un nom à la recette");return;}
    onSave({
      id:recipe?.id||Date.now(),
      name:name.trim(),photo,
      persons:parseInt(persons)||null,
      duration:duration.trim()||null,
      difficulty:difficulty||null,
      mealType:mealType||null,
      ingredients:ings.filter(i=>i.name.trim()),
      steps:steps.filter(Boolean),
      note:noteText.trim()||recipe?.note||null,
      source:recipe?.source||null,
      mealdbId:recipe?.mealdbId||null,
      stars:recipe?.stars||null,
      lastCooked:recipe?.lastCooked||null,
      cookedCount:recipe?.cookedCount||0,
      date:recipe?.date||new Date().toLocaleDateString("fr-FR")
    });
  }

  return(
    <>
      <FullPage open onClose={onClose} noPad>
        <input ref={photoRef} type="file" accept="image/*" style={{display:"none"}} onChange={handlePhoto} capture="environment"/>
        <div style={{height:isNew?140:160,position:"relative",background:`linear-gradient(135deg,${CREAM2},${BDR})`,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0,cursor:isNew&&!photo?"pointer":"default"}}
          onClick={()=>isNew&&!photo&&photoRef.current.click()}>
          {photo
            ?<img src={photo} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>
            :<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
                <EmojiImg emoji={name?guessRecipeEmoji(name):"📷"} size={isNew?48:52}/>
                {isNew&&<div style={{fontSize:11,color:TXT2,fontWeight:600,background:"rgba(255,255,255,.75)",borderRadius:8,padding:"3px 10px"}}>📷 Ajouter une photo</div>}
              </div>
          }
          {/* Bouton changer photo — modification seulement, en haut à gauche */}
          {!isNew&&(
            <button style={{position:"absolute",top:8,left:8,background:"rgba(0,0,0,.48)",border:"none",color:"white",borderRadius:8,padding:"5px 10px",fontSize:11,cursor:"pointer",fontWeight:600,backdropFilter:"blur(4px)"}}
              onClick={()=>photoRef.current.click()}>
              📷 Changer la photo
            </button>
          )}
          <button style={{position:"absolute",top:8,right:8,background:"rgba(0,0,0,.4)",border:"none",color:"white",borderRadius:8,padding:"5px 9px",fontSize:13,cursor:"pointer",backdropFilter:"blur(4px)"}} onClick={onClose}>✕</button>
        </div>

        {/* ── CONTENU SCROLLABLE ── */}
        <div style={{flex:1,overflowY:"auto",padding:"14px 14px 100px"}}>

          <div style={{fontFamily:"'Fraunces',serif",fontSize:19,fontWeight:900,color:TXT,marginBottom:14}}>
            {isNew?"Nouvelle recette":"Modifier la recette"}
          </div>

          {/* ── SCAN IA — création seulement ── */}
          {isNew&&(
            <div style={{background:CREAM2,border:`1.5px solid rgba(200,132,90,.3)`,borderRadius:14,padding:"11px 13px",marginBottom:14}}>
              <div style={{fontSize:9,fontWeight:800,color:TXT2,textTransform:"uppercase",letterSpacing:.7,marginBottom:9}}>🤖 Importer depuis une photo</div>
              {!multiMode&&(
                <div style={{display:"flex",gap:6,marginBottom:scanMsg?8:0}}>
                  <div style={{flex:1,border:`2px dashed rgba(200,132,90,.35)`,borderRadius:11,padding:"10px 8px",textAlign:"center",cursor:scanning?"not-allowed":"pointer",background:SURF,opacity:scanning?.7:1}} onClick={()=>!scanning&&scanRef.current.click()}>
                    <div style={{fontSize:18,marginBottom:2}}>{scanning?"⏳":"📸"}</div>
                    <div style={{fontSize:11,color:CARAMEL2,fontWeight:700}}>{scanning?"Analyse…":"1 page"}</div>
                  </div>
                  <div style={{flex:1,border:`2px dashed rgba(200,132,90,.35)`,borderRadius:11,padding:"10px 8px",textAlign:"center",cursor:"pointer",background:SURF}} onClick={()=>{setMultiMode(true);setMultiPhotos([]);setScanMsg("");}}>
                    <div style={{fontSize:18,marginBottom:2}}>📷📷</div>
                    <div style={{fontSize:11,color:CARAMEL2,fontWeight:700}}>Multi-pages</div>
                  </div>
                </div>
              )}
              <input ref={scanRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleScanFile} capture="environment"/>
              <input ref={multiRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleMultiFile} capture="environment"/>
              {multiMode&&(
                <div style={{background:CREAM,border:`1.5px solid ${BDR}`,borderRadius:11,padding:10,marginBottom:8}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                    <div style={{fontSize:11,fontWeight:700,color:TXT}}>📷📷 Multi-photos</div>
                    <button style={{...btn("gh"),fontSize:10,padding:"3px 8px"}} onClick={()=>{setMultiMode(false);setMultiPhotos([]);}}>✕</button>
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:6}}>
                    {multiPhotos.map((p,i)=>(
                      <div key={p.id} style={{position:"relative",width:56,height:56}}>
                        <img src={p.dataUrl} style={{width:56,height:56,objectFit:"cover",borderRadius:8,border:`2px solid ${CARAMEL2}`}} alt=""/>
                        <div style={{position:"absolute",top:-4,right:-4,width:16,height:16,borderRadius:"50%",background:DNG,color:"white",fontSize:9,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}} onClick={()=>removeMultiPhoto(p.id)}>✕</div>
                        <div style={{position:"absolute",bottom:2,left:2,background:"rgba(0,0,0,.55)",color:"white",fontSize:8,borderRadius:4,padding:"1px 4px",fontWeight:700}}>{i+1}</div>
                      </div>
                    ))}
                    <div style={{width:56,height:56,border:`2px dashed ${CARAMEL2}`,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",background:SURF,flexDirection:"column"}} onClick={()=>multiRef.current.click()}>
                      <div style={{fontSize:16}}>+</div>
                      <div style={{fontSize:8,color:TXT3}}>Photo</div>
                    </div>
                  </div>
                  <div style={{fontSize:9,color:TXT3,marginBottom:6}}>{multiPhotos.length<2?"Ajoutez au moins 2 photos":`${multiPhotos.length} photos · prêt`}</div>
                  <button style={{...btn("acc"),width:"100%",justifyContent:"center",fontSize:11}} onClick={doMultiScan} disabled={merging||multiPhotos.length<2}>
                    {merging?"⏳ Fusion…":`✨ Analyser (${multiPhotos.length} photos)`}
                  </button>
                </div>
              )}
              {scanMsg&&(
                <div style={{fontSize:11,textAlign:"center",padding:"6px 10px",borderRadius:8,background:scanStatus==="ok"?"rgba(90,138,58,.12)":"rgba(212,96,74,.12)",color:scanStatus==="ok"?SUC:DNG,marginTop:scanMsg?4:0}}>{scanMsg}</div>
              )}
              {!localStorage.getItem("ws_apikey")&&(
                <div style={{fontSize:10,color:TXT3,textAlign:"center",marginTop:6}}>⚠️ Clé API requise · <span style={{color:CARAMEL2,cursor:"pointer",fontWeight:700}} onClick={()=>setShowApiKey(true)}>Configurer 🔑</span></div>
              )}
            </div>
          )}

          {/* ── INFOS ── */}
          <div style={{fontSize:9,fontWeight:800,color:TXT2,textTransform:"uppercase",letterSpacing:.7,marginBottom:8,display:"flex",alignItems:"center",gap:7}}>
            Informations<div style={{flex:1,height:1,background:BDR}}/>
          </div>
          <input style={{...inp,marginBottom:8}} placeholder="Nom de la recette *" value={name} onChange={e=>setName(e.target.value)}/>
          <div style={{display:"flex",gap:8,marginBottom:8}}>
            <div style={{flex:1}}><input style={inp} type="number" min="1" placeholder="Personnes" value={persons} onChange={e=>setPersons(e.target.value)}/></div>
            <div style={{flex:1}}><input style={inp} placeholder="Durée (ex: 45 min)" value={duration} onChange={e=>setDuration(e.target.value)}/></div>
          </div>
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            <div style={{flex:1}}>
              <select style={sel} value={difficulty} onChange={e=>setDifficulty(e.target.value)}>
                {RECIPE_DIFFICULTY.map(d=><option key={d.id} value={d.id}>{d.label}</option>)}
              </select>
            </div>
            <div style={{flex:1}}>
              <select style={sel} value={mealType} onChange={e=>setMealType(e.target.value)}>
                {RECIPE_MEAL_TYPE.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}
              </select>
            </div>
          </div>

          {/* ── INGRÉDIENTS ── */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div style={{fontSize:9,fontWeight:800,color:TXT2,textTransform:"uppercase",letterSpacing:.7,display:"flex",alignItems:"center",gap:7}}>
              Ingrédients <span style={{fontSize:9,background:CREAM2,color:TXT3,padding:"1px 7px",borderRadius:10,fontWeight:700}}>{ings.filter(i=>i.name.trim()).length}</span>
            </div>
            <button style={{...btn("gh"),fontSize:11,padding:"5px 10px"}} onClick={()=>setIngs([...ings,{name:"",qty:"",unit:""}])}>+ Ajouter</button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:5,marginBottom:14}}>
            {ings.map((ing,i)=>(
              <div key={i} style={{display:"flex",gap:5,alignItems:"center",background:"rgba(255,255,255,.88)",borderRadius:10,padding:"7px 10px",border:`1px solid ${BDR}`}}>
                <span style={{fontSize:14,flexShrink:0}}>{guessRecipeEmoji(ing.name)||"🥄"}</span>

// ─── COOKING MODE ─────────────────────────────────────────────
function CookingMode({recipe,onClose,onFinish}){
  const [step,setStep]=useState(0);
  const [timer,setTimer]=useState(null);
  const [running,setRunning]=useState(false);
  const [inputMin,setInputMin]=useState("5");
  const [showDone,setShowDone]=useState(false);
  const [donePhoto,setDonePhoto]=useState(null);
  const [doneNote,setDoneNote]=useState("");
  const [doneStars,setDoneStars]=useState(0);
  const timerRef=useRef(null);
  const donePhotoRef=useRef();
  const steps=recipe.steps||[];
  const total=steps.length;

  useEffect(()=>{
    if(running&&timer>0){timerRef.current=setInterval(()=>setTimer(t=>t-1),1000);}
    else if(timer===0){clearInterval(timerRef.current);setRunning(false);}
    return()=>clearInterval(timerRef.current);
  },[running,timer]);

  useEffect(()=>{
    let wake=null;
    if(navigator.wakeLock){navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{});}
    return()=>{if(wake)wake.release();}
  },[]);

  function startTimer(){const s=parseInt(inputMin)*60;if(s>0){setTimer(s);setRunning(true);}}
  function pauseTimer(){setRunning(false);clearInterval(timerRef.current);}
  function resetTimer(){setRunning(false);clearInterval(timerRef.current);setTimer(null);}
  function fmtTime(s){const m=Math.floor(s/60),sec=s%60;return`${m}:${sec.toString().padStart(2,"0")}`;}

  function handleDonePhoto(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>setDonePhoto(ev.target.result);
    reader.readAsDataURL(file);e.target.value="";
  }

  function confirmFinish(skip){
    if(skip){onFinish({});return;}
    onFinish({photo:donePhoto,note:doneNote,stars:doneStars});
  }

  if(showDone) return(
    <div style={{position:"fixed",inset:0,background:`linear-gradient(160deg,${CARAMEL} 0%,#7a3a1a 100%)`,zIndex:500,display:"flex",flexDirection:"column",padding:20,paddingTop:50,overflowY:"auto"}}>
      <input ref={donePhotoRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleDonePhoto} capture="environment"/>
      <div style={{textAlign:"center",marginBottom:20}}>
        <div style={{fontSize:50,marginBottom:8}}>🎉</div>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:22,color:"white",fontWeight:900}}>Bon appétit !</div>
        <div style={{fontSize:13,color:"rgba(255,255,255,.7)",marginTop:4}}>{recipe.name} est prêt·e !</div>
      </div>
      {donePhoto
        ?<div style={{position:"relative",borderRadius:16,overflow:"hidden",marginBottom:14}}>
            <img src={donePhoto} alt="" style={{width:"100%",maxHeight:200,objectFit:"cover",borderRadius:16}}/>
            <button style={{position:"absolute",bottom:8,right:8,background:"rgba(0,0,0,.5)",border:"none",color:"white",borderRadius:8,padding:"4px 10px",fontSize:11,cursor:"pointer"}} onClick={()=>donePhotoRef.current.click()}>📷 Changer</button>
          </div>
        :<div style={{border:"2px dashed rgba(255,255,255,.4)",borderRadius:16,padding:"16px",textAlign:"center",cursor:"pointer",marginBottom:14}} onClick={()=>donePhotoRef.current.click()}>
            <div style={{marginBottom:4}}><EmojiImg emoji="📷" size={24}/></div>
            <div style={{fontSize:12,color:"rgba(255,255,255,.8)",fontWeight:700}}>Immortaliser votre réalisation</div>
          </div>
      }
      <div style={{background:"rgba(255,255,255,.1)",borderRadius:14,padding:"12px 16px",marginBottom:10,textAlign:"center"}}>
        <div style={{fontSize:11,color:"rgba(255,255,255,.7)",marginBottom:8,fontWeight:700}}>Comment était-ce ?</div>
        <div style={{display:"flex",justifyContent:"center",gap:8}}>
          {[1,2,3,4,5].map(s=>(
            <span key={s} style={{fontSize:28,cursor:"pointer",opacity:s<=doneStars?1:.35,transition:"all .15s"}} onClick={()=>setDoneStars(s)}>⭐</span>
          ))}
        </div>
        {doneStars>0&&<div style={{fontSize:11,color:"rgba(255,255,255,.6)",marginTop:4}}>{["","Bof…","Pas mal","Bien !","Très bien !","Parfait ! 🏆"][doneStars]}</div>}
      </div>
      <div style={{marginBottom:16}}>
        <div style={{fontSize:11,color:"rgba(255,255,255,.7)",marginBottom:5,fontWeight:700}}>📝 Commentaire</div>
        <textarea style={{width:"100%",background:"rgba(255,255,255,.15)",border:"1.5px solid rgba(255,255,255,.25)",borderRadius:10,padding:"10px 12px",color:"white",fontSize:13,fontFamily:"inherit",resize:"none",minHeight:56,outline:"none"}} placeholder="Astuces, variantes…" value={doneNote} onChange={e=>setDoneNote(e.target.value)}/>
      </div>
      <button style={{width:"100%",padding:"15px",background:"white",border:"none",borderRadius:14,color:CARAMEL,fontWeight:800,fontSize:14,cursor:"pointer",marginBottom:8}} onClick={()=>confirmFinish(false)}>✅ Terminer</button>
      <button style={{width:"100%",padding:"11px",background:"rgba(255,255,255,.15)",border:"none",borderRadius:12,color:"rgba(255,255,255,.8)",fontWeight:600,fontSize:12,cursor:"pointer"}} onClick={()=>confirmFinish(true)}>Passer</button>
    </div>
  );

  return(
    <div style={{position:"fixed",inset:0,background:`linear-gradient(160deg,${CARAMEL} 0%,#7a3a1a 100%)`,zIndex:500,display:"flex",flexDirection:"column",padding:20,paddingTop:40}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:18,color:"white",flex:1,paddingRight:10}}>{recipe.name}</div>
        <button style={{background:"rgba(255,255,255,.2)",border:"1.5px solid rgba(255,255,255,.4)",color:"white",borderRadius:10,padding:"8px 14px",fontWeight:700,fontSize:12,cursor:"pointer"}} onClick={onClose}>✕ Quitter</button>
      </div>
      <div style={{display:"flex",gap:4,marginBottom:20}}>
        {steps.map((_,i)=>(
          <div key={i} style={{flex:1,height:4,borderRadius:2,background:i<step?"white":i===step?"rgba(255,255,255,.7)":"rgba(255,255,255,.2)",cursor:"pointer"}} onClick={()=>setStep(i)}/>
        ))}
      </div>
      <div style={{flex:1,background:"rgba(255,255,255,.1)",borderRadius:20,padding:24,display:"flex",flexDirection:"column",justifyContent:"center",overflowY:"auto"}}>
        <div style={{fontSize:13,color:"rgba(255,255,255,.6)",fontWeight:700,letterSpacing:1,textTransform:"uppercase",marginBottom:12}}>Étape {step+1} / {total}</div>
        <div style={{fontSize:17,color:"white",lineHeight:1.7,fontWeight:500,marginBottom:16}}>{steps[step]}</div>
        {(()=>{
          const stepText=(steps[step]||"").toLowerCase();
          const mentioned=(recipe.ingredients||[]).filter(ing=>{
            const n=ing.name.toLowerCase();
            return stepText.includes(n)||(n.length>4&&stepText.includes(n.slice(0,-1)));
          });
          return mentioned.length>0?(
            <div style={{borderTop:"1px solid rgba(255,255,255,.2)",paddingTop:10}}>
              <div style={{fontSize:10,color:"rgba(255,255,255,.5)",fontWeight:700,letterSpacing:.5,marginBottom:6}}>INGRÉDIENTS POUR CETTE ÉTAPE</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                {mentioned.map((ing,i)=>(
                  <div key={i} style={{background:"rgba(255,255,255,.15)",borderRadius:8,padding:"3px 8px",fontSize:11,color:"rgba(255,255,255,.9)",fontWeight:600}}>
                    {ing.qty?`${ing.qty}${ing.unit?" "+ing.unit:""} `:""}• {ing.name}
                  </div>
                ))}
              </div>
            </div>
          ):null;
        })()}
      </div>
      <div style={{background:"rgba(255,255,255,.1)",borderRadius:16,padding:"14px 16px",marginTop:16}}>
        {timer===null?(
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <div style={{fontSize:13,color:"rgba(255,255,255,.8)",flex:1}}>⏱️ Minuteur</div>
            <input style={{width:48,background:"rgba(255,255,255,.2)",border:"1px solid rgba(255,255,255,.3)",borderRadius:8,padding:"6px 8px",color:"white",fontSize:13,textAlign:"center",outline:"none"}} value={inputMin} onChange={e=>setInputMin(e.target.value)} type="number" min="1"/>
            <span style={{color:"rgba(255,255,255,.7)",fontSize:12}}>min</span>
            <button style={{background:"white",border:"none",borderRadius:8,padding:"6px 12px",color:CARAMEL,fontWeight:700,fontSize:12,cursor:"pointer"}} onClick={startTimer}>Démarrer</button>
          </div>
        ):(
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{fontSize:28,fontWeight:900,color:timer<30?"#ff8080":"white",fontFamily:"monospace",flex:1}}>{fmtTime(timer)}</div>
            {running
              ?<button style={{background:"rgba(255,255,255,.2)",border:"none",borderRadius:8,padding:"8px 14px",color:"white",fontWeight:700,cursor:"pointer"}} onClick={pauseTimer}>⏸</button>
              :<button style={{background:"rgba(255,255,255,.2)",border:"none",borderRadius:8,padding:"8px 14px",color:"white",fontWeight:700,cursor:"pointer"}} onClick={()=>setRunning(true)}>▶</button>
            }
            <button style={{background:"rgba(255,255,255,.15)",border:"none",borderRadius:8,padding:"8px 14px",color:"white",fontWeight:700,cursor:"pointer"}} onClick={resetTimer}>✕</button>
          </div>
        )}
      </div>
      <div style={{display:"flex",gap:10,marginTop:14}}>
        <button style={{flex:1,padding:"14px",background:"rgba(255,255,255,.15)",border:"1.5px solid rgba(255,255,255,.3)",borderRadius:14,color:"white",fontWeight:700,fontSize:14,cursor:"pointer",opacity:step===0?.4:1}} onClick={()=>setStep(s=>Math.max(0,s-1))} disabled={step===0}>← Précédent</button>
        {step<total-1
          ?<button style={{flex:2,padding:"14px",background:"white",border:"none",borderRadius:14,color:CARAMEL,fontWeight:800,fontSize:14,cursor:"pointer"}} onClick={()=>{resetTimer();setStep(s=>s+1);}}>Suivant →</button>
          :<button style={{flex:2,padding:"14px",background:"white",border:"none",borderRadius:14,color:SUC,fontWeight:800,fontSize:14,cursor:"pointer"}} onClick={()=>setShowDone(true)}>🎉 Terminé !</button>
        }
      </div>
    </div>
  );
}

// ─── AI RECIPE GENERATOR ──────────────────────────────────────
function AIRecipeGen({onImport,onClose,showToast,items,db}){
  const [mode,setMode]=useState("frigo");

  // ── MODE FRIGO
  const [fridgeItems,setFridgeItems]=useState([]);
  const [fridgeName,setFridgeName]=useState("");
  const [fridgeSugg,setFridgeSugg]=useState([]);
  const [fridgeQty,setFridgeQty]=useState(1);
  const [fridgeUnit,setFridgeUnit]=useState("");
  const [fridgeCat,setFridgeCat]=useState("🥦 Légumes");
  const [fridgeShowQty,setFridgeShowQty]=useState(false);
  const [fridgeEqty,setFridgeEqty]=useState(null);
  const [vocalActive,setVocalActive]=useState(false);
  const vocalRef=useRef(null);

  // ── MODE VARIATION
  const [varBaseText,setVarBaseText]=useState("");       // texte libre
  const [varBaseRecipe,setVarBaseRecipe]=useState(null); // recette choisie {name,photo,ingredients,steps}
  const [showPickRecipe,setShowPickRecipe]=useState(false); // sélecteur de recette
  const [varIngItems,setVarIngItems]=useState([]);       // ingrédients de la recette de base (modifiables)
  const [varIngName,setVarIngName]=useState("");
  const [varIngSugg,setVarIngSugg]=useState([]);
  const [varIngQty,setVarIngQty]=useState(1);
  const [varIngUnit,setVarIngUnit]=useState("");
  const [varIngCat,setVarIngCat]=useState("🥦 Légumes");
  const [varIngShowQty,setVarIngShowQty]=useState(false);
  const [varIngEqty,setVarIngEqty]=useState(null);
  const [varPref,setVarPref]=useState("");

  // ── FILTRES
  const [dietFilters,setDietFilters]=useState(new Set());
  const filterScrollRef=useRef(null);
  function toggleFilter(val){setDietFilters(prev=>{const s=new Set(prev);s.has(val)?s.delete(val):s.add(val);return s;});}

  // ── GENERATION
  const [generating,setGenerating]=useState(false);
  const [result,setResult]=useState(null);
  const [genError,setGenError]=useState(null); // message d'erreur génération
  const [changedIngNames,setChangedIngNames]=useState(new Set()); // pour coloration verte
  const [changedStepIdxs,setChangedStepIdxs]=useState(new Set());
  const [chatMsg,setChatMsg]=useState("");
  const [chatHistory,setChatHistory]=useState([]);
  const [chatLoading,setChatLoading]=useState(false);
  const [extraSugg,setExtraSugg]=useState(null);

  const PANTRY_DEFAULTS=["Sel","Poivre","Huile d'olive","Beurre","Ail","Oignon","Farine","Sucre","Œufs","Lait","Pâtes","Riz","Lentilles","Tomates concassées","Concentré de tomate","Cumin","Paprika","Herbes de Provence","Thym","Moutarde","Vinaigre","Sauce soja","Bouillon de légumes","Pommes de terre","Carottes"];

  // Suggestions frigo
  useEffect(()=>{
    if(!fridgeName.trim()){setFridgeSugg([]);return;}
    const q=fridgeName.toLowerCase();
    const already=new Set(fridgeItems.map(i=>i.name.toLowerCase()));
    setFridgeSugg(PRODUCTS_DB.filter(p=>p.toLowerCase().includes(q)&&!already.has(p.toLowerCase())).slice(0,5));
    const info=normalizeIngredient(fridgeName);
    if(info.categorie) setFridgeCat(normalizeCat(info.categorie));
    if(info.unite) setFridgeUnit(info.unite);
  },[fridgeName,fridgeItems]);

  // Suggestions ingr variation
  useEffect(()=>{
    if(!varIngName.trim()){setVarIngSugg([]);return;}
    const q=varIngName.toLowerCase();
    const already=new Set(varIngItems.map(i=>i.name.toLowerCase()));
    setVarIngSugg(PRODUCTS_DB.filter(p=>p.toLowerCase().includes(q)&&!already.has(p.toLowerCase())).slice(0,5));
    const info=normalizeIngredient(varIngName);
    if(info.categorie) setVarIngCat(normalizeCat(info.categorie));
    if(info.unite) setVarIngUnit(info.unite);
  },[varIngName,varIngItems]);

  function addFridgeItem(nameOverride){
    const n=(nameOverride||fridgeName).trim(); if(!n)return;
    const info=normalizeIngredient(n);
    const useQty=fridgeShowQty?fridgeQty:0; const useUnit=fridgeShowQty?fridgeUnit:"";
    setFridgeItems(prev=>[...prev,{id:Date.now()+Math.random(),name:n,category:normalizeCat(info.categorie||fridgeCat||getCat(n)),quantities:[{qty:useQty,unit:useUnit,source:"manuel"}]}]);
    if(!nameOverride){setFridgeName("");setFridgeSugg([]);setFridgeQty(1);setFridgeUnit("");setFridgeShowQty(false);}
  }
  function removeFridgeItem(id){setFridgeItems(prev=>prev.filter(i=>i.id!==id));}
  function editFridgeQty(idx,qi,v,u){
    setFridgeItems(prev=>prev.map((item,i)=>{
      if(i!==idx)return item;
      const qs=[...item.quantities];
      if(qi==null)qs.push({qty:roundQ(v),unit:u,source:"manuel"});
      else qs[qi]={...qs[qi],qty:roundQ(v),unit:u};
      return{...item,quantities:qs};
    }));
    setFridgeEqty(null);
  }

  function addVarIng(nameOverride){
    const n=(nameOverride||varIngName).trim(); if(!n)return;
    const info=normalizeIngredient(n);
    const useQty=varIngShowQty?varIngQty:0; const useUnit=varIngShowQty?varIngUnit:"";
    setVarIngItems(prev=>[...prev,{id:Date.now()+Math.random(),name:n,category:normalizeCat(info.categorie||varIngCat||getCat(n)),quantities:[{qty:useQty,unit:useUnit,source:"manuel"}]}]);
    if(!nameOverride){setVarIngName("");setVarIngSugg([]);setVarIngQty(1);setVarIngUnit("");setVarIngShowQty(false);}
  }
  function removeVarIng(id){setVarIngItems(prev=>prev.filter(i=>i.id!==id));}
  function editVarIngQty(idx,qi,v,u){
    setVarIngItems(prev=>prev.map((item,i)=>{
      if(i!==idx)return item;
      const qs=[...item.quantities];
      if(qi==null)qs.push({qty:roundQ(v),unit:u,source:"manuel"});
      else qs[qi]={...qs[qi],qty:roundQ(v),unit:u};
      return{...item,quantities:qs};
    }));
    setVarIngEqty(null);
  }

  // Quand une recette est sélectionnée dans le picker
  function selectBaseRecipe(recipe){
    setVarBaseRecipe(recipe);
    // Convertir ses ingrédients

  // ── VOCAL frigo
  function startVocal(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){showToast("⚠️ Non supporté");return;}
    const rec=new SR();rec.lang="fr-FR";rec.continuous=true;rec.interimResults=false;
    vocalRef.current=rec;setVocalActive(true);
    rec.onresult=e=>{
      const text=Array.from(e.results).slice(e.resultIndex).map(r=>r[0].transcript).join(" ").trim();
      if(!text)return;
      text.split(/,|\bvirgule\b/i).map(s=>s.trim()).filter(Boolean).forEach(seg=>{
        const info=normalizeIngredient(seg);
        const n=info.nom||seg.charAt(0).toUpperCase()+seg.slice(1);
        setFridgeItems(prev=>[...prev,{id:Date.now()+Math.random(),name:n,category:normalizeCat(info.categorie||getCat(n)),quantities:[{qty:0,unit:"",source:"vocal"}]}]);
      });
    };
    rec.onerror=()=>{setVocalActive(false);showToast("❌ Erreur micro");};
    rec.onend=()=>{};rec.start();
  }
  function stopVocal(){vocalRef.current?.stop();setVocalActive(false);}

  async function generate(){
    console.log("[AI] generate() start, mode="+mode);
    const apiKey=localStorage.getItem("ws_apikey")||"";
    if(!apiKey){setGenError("⚠️ Clé API requise — configurez via ⚙️");return;}
    if(mode==="frigo"&&fridgeItems.length===0){setGenError("⚠️ Ajoutez au moins un ingrédient");return;}
    if(mode==="variation"&&!varBaseText.trim()&&varIngItems.length===0){setGenError("⚠️ Entrez une recette de base");return;}

    setGenerating(true);setResult(null);setGenError(null);setChatHistory([]);setExtraSugg(null);

    try{
      console.log("[AI] construction prompt...");
      const dietStr=[...dietFilters].join(", ");
      const dietNote=dietStr?"Contraintes : "+dietStr+".":"";

      let prompt="";
      if(mode==="frigo"){
        const ingList=fridgeItems.map(i=>i.name).join(", ");
        prompt="Chef cuisinier. "+dietNote+" Ingrédients : "+ingList+". Propose une recette. JSON uniquement sans markdown :\n"
          +'{"title":"","persons":4,"duration":"30 min","difficulty":"easy","meal_type":"main","diets":[],"ingredients":[{"name":"","qty":"","unit":""}],"steps":["etape"],"tip":"","extra_suggestions":[{"name":"","reason":""}]}';
      } else {
        const base=String(varBaseRecipe?varBaseRecipe.name:varBaseText);
        const ings=varIngItems.length>0?varIngItems.map(i=>i.name).join(", "):"non précisés";
        prompt="Chef cuisinier. "+dietNote+" Adapte la recette : "+base+". Ingrédients : "+ings+". JSON uniquement sans markdown :\n"
          +'{"title":"","persons":4,"duration":"30 min","difficulty":"easy","meal_type":"main","diets":[],"ingredients":[{"name":"","qty":"","unit":""}],"steps":["etape"],"tip":"","extra_suggestions":[],"changed_ingredients":[],"changed_steps":[]}';
      }

      console.log("[AI] prompt ok, longueur="+prompt.length+", envoi API...");

      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-api-key":apiKey,
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true"
        },
        body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:2000,messages:[{role:"user",content:prompt}]})
      });

      console.log("[AI] réponse HTTP:",resp.status);

      const data=await resp.json();
      console.log("[AI] data:",JSON.stringify(data).slice(0,150));

      if(!resp.ok||data.error){
        const msg="❌ "+(data?.error?.message||"Erreur HTTP "+resp.status);
        setGenError(msg);return;
      }

      const raw=(data.content||[]).map(b=>b.text||"").join("").trim()
        .replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();

      console.log("[AI] raw JSON:",raw.slice(0,150));

      let p;
      try{p=JSON.parse(raw);}
      catch(_e){setGenError("❌ Réponse IA non parseable. Réessayez.");return;}

      if(!p||!p.title){setGenError("❌ Réponse incomplète. Réessayez.");return;}

      setResult({
        id:Date.now(),name:p.title,persons:p.persons||4,duration:p.duration||"",
        difficulty:p.difficulty||"",mealType:p.meal_type||"",diets:p.diets||[],
        photo:null,source:"ai",ingredients:p.ingredients||[],steps:p.steps||[],
        tip:p.tip||"",date:new Date().toLocaleDateString("fr-FR")
      });
      setChatHistory([{role:"user",content:prompt},{role:"assistant",content:raw}]);
      const cleanExtra=(p.extra_suggestions||[]).filter(x=>x&&x.name&&typeof x.name==="string");if(cleanExtra.length>0) setExtraSugg({items:cleanExtra,accepted:new Set(),refused:false});
      if(mode==="variation"){
        setChangedIngNames(new Set(p.changed_ingredients||[]));
        setChangedStepIdxs(new Set((p.changed_steps||[]).map(Number)));
      } else {
        setChangedIngNames(new Set());setChangedStepIdxs(new Set());
      }
      console.log("[AI] succès !");
    }catch(e){
      console.error("[AI] ERREUR:",e.name,e.message,e.stack);
      setGenError("❌ "+e.message);
    }finally{
      setGenerating(false);
    }
  }

  async function sendChat(){
    if(!chatMsg.trim()||!result)return;
    const apiKey=localStorage.getItem("ws_apikey")||"";
    if(!apiKey)return;
    setChatLoading(true);
    const userMsg=chatMsg.trim();setChatMsg("");
    const sys=`Tu es un chef cuisinier expert. Modifie la recette selon la demande. Recette actuelle : ${JSON.stringify({name:result.name,ingredients:result.ingredients,steps:result.steps})}. RETOURNE UNIQUEMENT le JSON modifié (sans markdown) : {"title":"","persons":${result.persons||4},"duration":"${result.duration||"30 min"}","difficulty":"${result.difficulty||"easy"}","meal_type":"${result.mealType||"main"}","diets":${JSON.stringify(result.diets||[])},"ingredients":[{"name":"","qty":"","unit":""}],"steps":["étape complète"],"tip":"","extra_suggestions":[],"changed_ingredients":[],"changed_steps":[]}`;
    const newHist=[...chatHistory,{role:"user",content:userMsg}];
    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:3000,system:sys,messages:newHist})});
      const data=await resp.json();
      let text=(data.content||[]).map(c=>c.text||"").join("").trim();
      text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
      const p=JSON.parse(text);
      setResult(r=>({...r,name:p.title||r.name,ingredients:p.ingredients||r.ingredients,steps:p.steps||r.steps,tip:p.tip||r.tip,duration:p.duration||r.duration,diets:p.diets||r.diets}));
      setChangedIngNames(new Set(p.changed_ingredients||[]));
      setChangedStepIdxs(new Set((p.changed_steps||[]).map(Number)));
      setChatHistory([...newHist,{role:"assistant",content:text}]);
      showToast("✅ Recette modifiée !");
    }catch(e){showToast("❌ "+e.message);}
    setChatLoading(false);
  }

// ─── FOLDER MANAGER ───────────────────────────────────────────
function FolderManager({db,setDb,showToast,onClose}){
  const [newName,setNewName]=useState("");
  const folders=db.folders||[];
  const liked=db.likedRecipes||[];

  function createFolder(){
    if(!newName.trim())return;
    if(folders.find(f=>f.name===newName.trim())){showToast("⚠️ Ce dossier existe déjà");return;}
    const nd={...db,folders:[...folders,{id:Date.now(),name:newName.trim(),recipeIds:[]}]};
    setDb(nd);setNewName("");showToast("🏷️ Thème créé !");
  }
  function deleteFolder(id){
    if(!confirm("Supprimer ce thème ?"))return;
    setDb({...db,folders:folders.filter(f=>f.id!==id)});
  }
  function addToFolder(folderId,recipeId){
    const nd={...db,folders:folders.map(f=>f.id===folderId?{...f,recipeIds:[...new Set([...(f.recipeIds||[]),recipeId])]}:f)};
    setDb(nd);showToast("✅ Recette ajoutée au thème");
  }

  return(
    <Modal open onClose={onClose}>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:12,color:TXT}}>🏷️ Mes thèmes</div>
      {/* Thème Favoris automatique */}
      <div style={{...card,background:CREAM2,marginBottom:8,padding:"10px 14px"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:20}}>❤️</span>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:700,color:TXT}}>Favoris</div>
            <div style={{fontSize:11,color:TXT3}}>{liked.length} recette{liked.length!==1?"s":""}</div>
          </div>
        </div>
      </div>
      {/* Thèmes personnalisés */}
      {folders.map(f=>{
        const count=(f.recipeIds||[]).length;
        return(
          <div key={f.id} style={{...card,background:"rgba(255,255,255,.9)",marginBottom:6,padding:"10px 14px",display:"flex",alignItems:"center",gap:8}}>
            <EmojiImg emoji="🏷️" size={20}/>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700,color:TXT}}>{f.name}</div>
              <div style={{fontSize:11,color:TXT3}}>{count} recette{count!==1?"s":""}</div>
            </div>
            <button style={{background:"none",border:"none",color:DNG,cursor:"pointer",fontSize:14}} onClick={()=>deleteFolder(f.id)}>🗑️</button>
          </div>
        );
      })}
      {/* Créer un nouveau thème */}
      <div style={{display:"flex",gap:8,marginTop:10}}>
        <input style={{...inp,flex:1}} placeholder="Nom du thème… (ex: Été, Barbecue)" value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&createFolder()}/>
        <button style={{...btn("acc"),padding:"10px 14px"}} onClick={createFolder}>+ Créer</button>
      </div>
    </Modal>
  );
}

function RecipeView({recipe,priceDB,db,setDb,onClose,onEdit,onDel,onAdd,showToast,onPlanFromView}){
  const [vp,setVp]=useState(recipe.persons||1);
  const [have,setHave]=useState(new Set());
  const [cooking,setCooking]=useState(false);
  const [openPanel,setOpenPanel]=useState(null); // "plan"|"theme"|null
  const [planConflict,setPlanConflict]=useState(null);
  const base=recipe.persons||1,scale=vp/base;
  const cost=estimateRecipeCost(recipe,priceDB,vp);
  const isLiked=(db.likedRecipes||[]).includes(recipe.id);
  const folders=db.folders||[];
  const calendar=db.calendar||{};
  const cookedCount=recipe.cookedCount||0;

  function togglePanel(p){setOpenPanel(prev=>prev===p?null:p);}

  async function doScan(dataUrl,mt="image/jpeg"){
    const apiKey=localStorage.getItem("ws_apikey")||"";
    if(!apiKey){setShowApiKey(true);return;}
    setScanning(true);setScanMsg("");setScanStatus("idle");
    const base64=dataUrl.split(",")[1];
    const prompt=`Tu es un expert en extraction de recettes de cuisine à partir d'images. Analyse cette image et retourne UNIQUEMENT un objet JSON valide (sans markdown, sans backtick, sans texte autour).
FORMAT EXACT :
{"title":null,"persons":null,"duration":null,"dishPhotoDataPresent":false,"ingredients":[{"name":"","qty":"","unit":""}],"steps":[]}
INSTRUCTIONS : qty=chiffre seul, unit=unité normalisée (g,kg,ml,cl,L,càs,càc,pincée,sachet,boîte,bouteille,paquet,tranche,botte), noms génériques sans marques, steps dans l'ordre logique. "dishPhotoDataPresent":true UNIQUEMENT si photo réelle d'un plat cuisiné où la nourriture occupe la majorité de l'image.`;
    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:3000,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:mt,data:base64}},{type:"text",text:prompt}]}]})});
      if(!resp.ok){const errData=await resp.json().catch(()=>({}));if(resp.status===401){throw new Error("Clé API invalide (401)");}throw new Error("Erreur "+resp.status+(errData.error?.message?" : "+errData.error.message:""));}
      const data=await resp.json();
      let text=(data.content||[]).map(c=>c.text||"").join("").trim();
      text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
      const p=JSON.parse(text);
      if(p.title)setName(p.title);if(p.persons)setPersons(String(p.persons));if(p.duration)setDuration(p.duration);
      if(p.dishPhotoDataPresent)setPhoto(dataUrl);
      if(p.ingredients?.length)setIngs(p.ingredients.map(i=>({name:i.name||"",qty:i.qty||"",unit:normUnit(i.unit||"")})));
      if(p.steps?.length)setSteps(p.steps.map(s=>s.trim()).filter(Boolean));
      const nb=p.ingredients?.filter(i=>i.name)?.length||0,ns=p.steps?.length||0;
      setScanMsg(`✨ ${nb} ingrédient${nb>1?"s":""} et ${ns} étape${ns>1?"s":""} extraits !`);setScanStatus("ok");
    }catch(err){console.error(err);if(err.message.includes("401")){localStorage.removeItem("ws_apikey");setShowApiKey(true);}setScanMsg("❌ "+err.message);setScanStatus("error");}
    setScanning(false);
  }

  async function doMultiScan(){
    if(multiPhotos.length<2){showToast("⚠️ Ajoutez au moins 2 photos");return;}
    const apiKey=localStorage.getItem("ws_apikey")||"";
    if(!apiKey){setShowApiKey(true);return;}
