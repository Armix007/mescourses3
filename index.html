// PAGE CALENDRIER — Phase 8 — Planning repas
// ═══════════════════════════════════════════════════════════════
const MEAL_SLOTS=["midi","soir"];
const MEAL_LABELS={midi:"☀️ Midi",soir:"🌙 Soir"};
const DAY_NAMES=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const DAY_NAMES_FULL=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];

function getWeekDates(offset=0){
  const now=new Date();
  const day=now.getDay();
  const monday=new Date(now);
  monday.setDate(now.getDate()-(day===0?6:day-1)+offset*7);
  return Array.from({length:7},(_,i)=>{
    const d=new Date(monday);d.setDate(monday.getDate()+i);
    return d;
  });
}

function dateKey(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}

function PageCalendrier({db,setDb,showToast,goToRecettes,goToListe}){
  const [weekOffset,setWeekOffset]=useState(0);
  const [showPicker,setShowPicker]=useState(null); // {dateKey, slot}
  const [showActions,setShowActions]=useState(null); // {dateKey, slot, meal}
  const calendar=db.calendar||{};
  const pantry=db.pantry||[];
  const redItems=pantry.filter(i=>i.signal==="red");
  const weekDates=getWeekDates(weekOffset);
  const today=dateKey(new Date());

  function setMeal(dk,slot,recipeId){
    const newCal={...calendar,[dk]:{...(calendar[dk]||{}),[slot]:recipeId}};
    const nd={...db,calendar:newCal};setDb(nd);saveDB(nd);
    setShowPicker(null);
  }
  function removeMeal(dk,slot){
    const newCal={...calendar,[dk]:{...(calendar[dk]||{}),[slot]:null}};
    const nd={...db,calendar:newCal};setDb(nd);saveDB(nd);
    setShowActions(null);
  }

  function generateShoppingList(){
    // Collect all recipes planned from today onwards
    const todayD=new Date();todayD.setHours(0,0,0,0);
    const planned=[];
    Object.entries(calendar).forEach(([dk,slots])=>{
      const d=new Date(dk);d.setHours(0,0,0,0);
      if(d<todayD)return;
      Object.values(slots||{}).forEach(recipeId=>{
        if(!recipeId)return;
        const recipe=db.recipes?.find(r=>String(r.id)===String(recipeId));
        if(recipe)planned.push(recipe);
      });
    });
    if(!planned.length){showToast("⚠️ Aucun repas planifié à venir");return;}
    // Add all ingredients to list
    let added=0;
    let items=[...db.items];
    planned.forEach(recipe=>{
      (recipe.ingredients||[]).forEach(ing=>{
        if(!ing.name?.trim())return;
        items=mergeItem(items,ing.name,parseFloat(ing.qty)||1,ing.unit||"","recette",guessCat(ing.name));
        added++;
      });
    });
    const nd={...db,items};setDb(nd);saveDB(nd);
    showToast(`✅ ${added} ingrédient${added>1?"s":""} ajouté${added>1?"s":""} à la liste`);
    goToListe();
  }

  // Suggest recipes using red pantry items
  function antiGaspiSuggestions(){
    if(!redItems.length||!db.recipes?.length)return[];
    const redNames=redItems.map(i=>i.name.toLowerCase());
    return(db.recipes||[]).filter(r=>r.ingredients?.some(ing=>redNames.some(rn=>rn.includes(ing.name?.toLowerCase())||ing.name?.toLowerCase()?.includes(rn)))).slice(0,3);
  }
  const suggestions=antiGaspiSuggestions();

  return(
    <div style={{padding:14,paddingBottom:90}}>
      {/* Header */}
      <div style={{...card,background:"rgba(255,255,255,.88)",padding:"14px 16px",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:20,color:TXT}}>📅 Planning repas</div>
          <button style={{...btn("acc"),fontSize:11,padding:"7px 12px"}} onClick={generateShoppingList}>🛒 Générer la liste</button>
        </div>
        {/* Navigation semaine */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <button style={{...btn("gh"),padding:"6px 12px",fontSize:16}} onClick={()=>setWeekOffset(w=>w-1)}>‹</button>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:13,fontWeight:700,color:TXT}}>
              {weekOffset===0?"Cette semaine":weekOffset===1?"Semaine prochaine":weekOffset===-1?"Semaine dernière":`Semaine du ${weekDates[0].getDate()}/${weekDates[0].getMonth()+1}`}
            </div>
            <div style={{fontSize:10,color:TXT3}}>
              {weekDates[0].getDate()}/{weekDates[0].getMonth()+1} — {weekDates[6].getDate()}/{weekDates[6].getMonth()+1}/{weekDates[6].getFullYear()}
            </div>
          </div>
          <button style={{...btn("gh"),padding:"6px 12px",fontSize:16}} onClick={()=>setWeekOffset(w=>w+1)}>›</button>
        </div>
        {weekOffset!==0&&<button style={{...btn("out"),width:"100%",justifyContent:"center",fontSize:11,marginTop:8,padding:"5px"}} onClick={()=>setWeekOffset(0)}>Retour à cette semaine</button>}
      </div>

      {/* Alerte anti-gaspi */}
      {redItems.length>0&&suggestions.length>0&&(
        <div style={{background:"rgba(212,96,74,.08)",border:"1.5px solid rgba(212,96,74,.25)",borderRadius:12,padding:"10px 14px",marginBottom:10}}>
          <div style={{fontSize:12,fontWeight:700,color:DNG,marginBottom:6}}>⚠️ Produits à utiliser vite — recettes suggérées :</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {suggestions.map(r=>(
              <div key={r.id} style={{fontSize:11,background:SURF,border:`1px solid ${BDR}`,borderRadius:20,padding:"4px 10px",color:TXT2,cursor:"pointer",fontWeight:600}} onClick={()=>{
                // Find next free slot
                let placed=false;
                for(const d of weekDates){
                  for(const slot of MEAL_SLOTS){
                    const dk=dateKey(d);
                    if(!(calendar[dk]?.[slot])){setMeal(dk,slot,r.id);placed=true;break;}
                  }
                  if(placed)break;
                }
                if(!placed)showToast("⚠️ Semaine complète");
                else showToast(`✅ ${r.name} planifié`);
              }}>
                {guessRecipeEmoji(r.name)} {r.name}
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Grille de la semaine */}
      {weekDates.map((d,di)=>{
        const dk=dateKey(d);
        const isToday=dk===today;
        const isPast=d<new Date(new Date().setHours(0,0,0,0));
        return(
          <div key={dk} style={{...card,background:isToday?"rgba(200,132,90,.08)":isPast?"rgba(255,255,255,.6)":"rgba(255,255,255,.88)",marginBottom:6,border:isToday?`1.5px solid ${CARAMEL2}`:`1px solid ${BDR}`,opacity:isPast&&!isToday?.75:1}}>
            {/* Jour header */}
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <div style={{width:34,height:34,borderRadius:10,background:isToday?`linear-gradient(135deg,${CARAMEL},${CARAMEL2})`:"rgba(200,132,90,.12)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <div style={{fontSize:8,fontWeight:800,color:isToday?"rgba(255,255,255,.8)":TXT3,letterSpacing:.5}}>{DAY_NAMES[di]}</div>
                <div style={{fontSize:15,fontWeight:900,color:isToday?"white":TXT,fontFamily:"'Fraunces',serif",lineHeight:1}}>{d.getDate()}</div>
              </div>
              <div style={{fontSize:12,fontWeight:700,color:isToday?CARAMEL:TXT2}}>{DAY_NAMES_FULL[di]}{isToday&&<span style={{fontSize:10,color:CARAMEL2,marginLeft:6,fontWeight:600}}>· Aujourd'hui</span>}</div>
            </div>
            {/* Créneaux */}
            <div style={{display:"flex",gap:6}}>
              {MEAL_SLOTS.map(slot=>{
                const recipeId=calendar[dk]?.[slot];
                const recipe=recipeId?db.recipes?.find(r=>String(r.id)===String(recipeId)):null;
                return(
                  <div key={slot} style={{flex:1,borderRadius:10,border:`1.5px dashed ${recipe?CARAMEL2:BDR}`,background:recipe?"rgba(200,132,90,.06)":CREAM,padding:"7px 8px",cursor:"pointer",minHeight:52,display:"flex",flexDirection:"column",justifyContent:"center"}}
                    onClick={()=>recipe?setShowActions({dk,slot,recipe}):setShowPicker({dk,slot})}>
                    <div style={{fontSize:9,fontWeight:700,color:TXT3,marginBottom:3}}>{MEAL_LABELS[slot]}</div>
                    {recipe?(
                      <div style={{display:"flex",alignItems:"center",gap:5}}>
                        <span style={{fontSize:14}}>{guessRecipeEmoji(recipe.name)}</span>
                        <div style={{fontSize:10,fontWeight:700,color:TXT,lineHeight:1.2,flex:1}}>{recipe.name}</div>
                      </div>
                    ):(
                      <div style={{fontSize:10,color:TXT3,textAlign:"center"}}>+ Ajouter</div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}

      {/* Légende */}
      <div style={{textAlign:"center",padding:"10px 0",fontSize:10,color:TXT3}}>
        Appuyez sur un créneau pour ajouter une recette · 🛒 Génère la liste des courses à partir du planning
      </div>

      {/* Modal picker de recette */}
      {showPicker&&(
        <Modal open onClose={()=>setShowPicker(null)}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:4,color:TXT}}>Choisir une recette</div>
          <div style={{fontSize:11,color:TXT3,marginBottom:12}}>
            {DAY_NAMES_FULL[new Date(showPicker.dk).getDay()===0?6:new Date(showPicker.dk).getDay()-1]} · {MEAL_LABELS[showPicker.slot]}
          </div>
          {db.recipes?.length===0?(
            <div style={{textAlign:"center",padding:"20px",color:TXT3,fontSize:12}}>
              Aucune recette disponible — créez d'abord vos recettes
              <button style={{...btn("out"),width:"100%",justifyContent:"center",marginTop:10,fontSize:11}} onClick={()=>{setShowPicker(null);goToRecettes();}}>→ Aller aux recettes</button>
            </div>
          ):(
            <div style={{maxHeight:380,overflowY:"auto"}}>
              {/* Anti-gaspi suggestions en tête si pertinent */}
              {suggestions.length>0&&(
                <div style={{marginBottom:8}}>
                  <div style={{fontSize:10,fontWeight:700,color:DNG,marginBottom:5}}>⚠️ Utilise des produits à finir :</div>
                  {suggestions.map(r=>(
                    <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 8px",borderRadius:10,background:"rgba(212,96,74,.06)",border:`1px solid rgba(212,96,74,.2)`,cursor:"pointer",marginBottom:5}} onClick={()=>setMeal(showPicker.dk,showPicker.slot,r.id)}>
                      <span style={{fontSize:20}}>{guessRecipeEmoji(r.name)}</span>
                      <div style={{flex:1}}>
                        <div style={{fontSize:13,fontWeight:700,color:TXT}}>{r.name}</div>
                        {r.duration&&<div style={{fontSize:10,color:TXT3}}>⏱️ {r.duration}</div>}
                      </div>
                      <span style={{fontSize:10,color:DNG,fontWeight:700}}>⚠️</span>
                    </div>
                  ))}
                  <div style={{borderBottom:`1px solid ${BDR}`,marginBottom:8}}/>
                </div>
              )}
              {(db.recipes||[]).map(r=>(
                <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 4px",borderBottom:`1px solid ${BDR}`,cursor:"pointer"}} onClick={()=>setMeal(showPicker.dk,showPicker.slot,r.id)}>
                  <span style={{fontSize:20,flexShrink:0}}>{guessRecipeEmoji(r.name)}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:700,color:TXT,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}</div>
                    <div style={{fontSize:10,color:TXT3}}>
                      {r.duration&&<span style={{marginRight:6}}>⏱️ {r.duration}</span>}
                      {r.persons&&<span>👥 {r.persons} pers.</span>}
                    </div>
                  </div>
                  <span style={{color:TXT3,fontSize:16}}>›</span>
                </div>
              ))}
            </div>
          )}
        </Modal>
      )}

      {/* Modal actions sur un repas planifié */}
      {showActions&&(
        <Modal open onClose={()=>setShowActions(null)}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
            <span style={{fontSize:32}}>{guessRecipeEmoji(showActions.recipe.name)}</span>
            <div>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:16,color:TXT}}>{showActions.recipe.name}</div>
              <div style={{fontSize:11,color:TXT3}}>{DAY_NAMES_FULL[new Date(showActions.dk).getDay()===0?6:new Date(showActions.dk).getDay()-1]} · {MEAL_LABELS[showActions.slot]}</div>
            </div>
          </div>
          {showActions.recipe.duration&&<div style={{fontSize:12,color:TXT2,marginBottom:10}}>⏱️ {showActions.recipe.duration} · 👥 {showActions.recipe.persons||"❓"} pers.</div>}
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            <button style={{...btn("out"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>{setShowPicker({dk:showActions.dk,slot:showActions.slot});setShowActions(null);}}>🔄 Changer la recette</button>
            <button style={{...btn("dng"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>removeMeal(showActions.dk,showActions.slot)}>🗑️ Retirer ce repas</button>
            <button style={{...btn("gh"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>setShowActions(null)}>Fermer</button>
          </div>
        </Modal>
      )}
    </div>
  );
}


// ═══════════════════════════════════════════════════════════════
// APP ROOT
// ═══════════════════════════════════════════════════════════════
function App(){
  const [page,setPage]=useState("liste");
  const [db,setDb]=useState(EMPTY_DB);
  const [toast,setToast]=useState("");
  const [pseudo,setPseudo]=useState(()=>localStorage.getItem("ws_pseudo")||"");
  const [docId,setDocId]=useState(()=>localStorage.getItem("ws_docid")||null);
  const [fbReady,setFbReady]=useState(!!window._firebaseReady);
  const [showApiKeyGlobal,setShowApiKeyGlobal]=useState(false);
  const ttRef=useRef(null);
  const localRef=useRef(false);

  // Attendre que Firebase soit prêt
  useEffect(()=>{
    if(window._firebaseReady){setFbReady(true);return;}
    const h=()=>setFbReady(true);
    window.addEventListener("firebaseReady",h);
    return()=>window.removeEventListener("firebaseReady",h);
  },[]);

  // Écouter les changements Firestore en temps réel
  useEffect(()=>{
    if(!docId||!fbReady)return;
    const{fsdb,doc,onSnapshot}=window._firebase;
    const ref=doc(fsdb,"households",docId);
    const unsub=onSnapshot(ref,snap=>{
      if(!snap.exists())return;
      if(localRef.current){localRef.current=false;return;}
      const data=snap.data();
      setDb({
        items:data.items||[],
        productHistory:data.productHistory||{},
        recipes:data.recipes||[],
        shoppingHistory:data.shoppingHistory||[],
        priceDB:data.priceDB||{},
        budget:data.budget||{monthly:0,sessions:[]},
        folders:data.folders||[],
        likedRecipes:data.likedRecipes||[],
        pantry:data.pantry||[],
        calendar:data.calendar||{}
      });
    });
    return()=>unsub();
  },[docId,fbReady]);

  function showToast(msg){setToast(msg);clearTimeout(ttRef.current);ttRef.current=setTimeout(()=>setToast(""),2800);}

  // Sauvegarder dans Firestore + localStorage
  function setDbSync(newDb){
    setDb(newDb);
    // localStorage fallback
    try{localStorage.setItem("ws_r1",JSON.stringify(newDb));}catch{}
    // Firestore sync
    if(docId&&fbReady){
      localRef.current=true;
      const{fsdb,doc,setDoc}=window._firebase;
      const ref=doc(fsdb,"households",docId);
      setDoc(ref,{
        items:newDb.items||[],
        productHistory:newDb.productHistory||{},
        recipes:newDb.recipes||[],
        shoppingHistory:newDb.shoppingHistory||[],
        priceDB:newDb.priceDB||{},
        budget:newDb.budget||{monthly:0,sessions:[]},
        folders:newDb.folders||[],
        likedRecipes:newDb.likedRecipes||[],
        pantry:newDb.pantry||[],
        calendar:newDb.calendar||{}
      }).catch(e=>console.error("Sync error:",e));
    }
  }

  function handleLogin(id,name){
    setDocId(id);
    setPseudo(name||localStorage.getItem("ws_pseudo")||"");
  }

  function handleLogout(){
    localStorage.removeItem("ws_docid");
    localStorage.removeItem("ws_foyerid");
    // Ne pas supprimer ws_pseudo et ws_pwd_saved si "se souvenir" était coché
    setDocId(null);
    setDb(EMPTY_DB);
  }

  if(!fbReady){
    return(
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:TXT3,fontSize:14,fontWeight:600}}>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:40,marginBottom:12}}>🛒</div>
          Chargement…
        </div>
      </div>
    );
  }

  if(!docId){
    return <LoginScreen onLogin={handleLogin}/>;
  }

  return(
    <div style={{minHeight:"100vh",maxWidth:480,margin:"0 auto",fontFamily:"'Plus Jakarta Sans',sans-serif",color:TXT,position:"relative",overflowX:"hidden"}}>
      {/* HEADER */}
      <div style={{padding:"18px 18px 0",position:"relative"}}>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 80% 20%, rgba(255,255,255,.12) 0%, transparent 60%)",pointerEvents:"none"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",position:"relative"}}>
          <div>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:900,color:"white",letterSpacing:-.3}}>🍽️ Wisely Food <span style={{fontSize:10,fontWeight:600,background:"rgba(255,255,255,.25)",borderRadius:6,padding:"2px 7px",letterSpacing:.5,verticalAlign:"middle"}}>Phase 8</span></div>
            {pseudo?<div style={{fontSize:11,color:"rgba(255,255,255,.75)",marginTop:2,fontWeight:600}}>Bonjour {pseudo} 👋</div>
            :<div style={{fontSize:10,color:"rgba(255,255,255,.6)",marginTop:2,fontWeight:600}}>Synchronisé en temps réel ☁️</div>}
          </div>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <button style={{background:"rgba(255,255,255,.2)",border:"1.5px solid rgba(255,255,255,.35)",color:"white",borderRadius:12,padding:"7px 10px",fontFamily:"'Plus Jakarta Sans',sans-serif",fontWeight:700,fontSize:10,cursor:"pointer"}} title="Clé API Anthropic"
              onClick={()=>setShowApiKeyGlobal(true)}>🔑</button>
            <button style={{background:"rgba(255,255,255,.2)",border:"1.5px solid rgba(255,255,255,.35)",color:"white",borderRadius:12,padding:"7px 10px",fontFamily:"'Plus Jakarta Sans',sans-serif",fontWeight:700,fontSize:10,cursor:"pointer"}}
              onClick={()=>{
                const fid=localStorage.getItem("ws_foyerid");
                if(fid){const link=`${window.location.origin}${window.location.pathname}?invite=${fid}`;navigator.clipboard.writeText(link).then(()=>showToast("🔗 Lien copié !"));}
              }}>🔗</button>
            <button style={{background:"rgba(255,255,255,.2)",border:"1.5px solid rgba(255,255,255,.35)",color:"white",borderRadius:12,padding:"7px 12px",fontFamily:"'Plus Jakarta Sans',sans-serif",fontWeight:700,fontSize:11,cursor:"pointer"}} onClick={handleLogout}>🔒 Déco.</button>
          </div>
        </div>
        {/* NAV TABS */}
        <div style={{display:"flex",marginTop:14,gap:2,paddingBottom:0}}>
          {[{id:"liste",icon:"📋",label:"Liste"},{id:"recettes",icon:"🍽️",label:"Recettes"},{id:"prix",icon:"🧾",label:"Prix"},{id:"placard",icon:"📦",label:"Placard"},{id:"calendrier",icon:"📅",label:"Planning"},{id:"historique",icon:"🕐",label:"Historique"}].map(t=>(
            <div key={t.id} style={{flex:1,padding:"9px 3px",textAlign:"center",fontSize:9,fontWeight:700,letterSpacing:.5,textTransform:"uppercase",color:page===t.id?"white":"rgba(255,255,255,.55)",cursor:"pointer",borderBottom:page===t.id?"2.5px solid white":"2.5px solid transparent",transition:"all .2s",userSelect:"none"}} onClick={()=>setPage(t.id)}>
              <span style={{fontSize:15,display:"block",marginBottom:2}}>{t.icon}</span>{t.label}
            </div>
          ))}
        </div>
      </div>
      {/* PAGE CONTENT */}
      <div style={{background:"rgba(255,255,255,.04)",minHeight:"calc(100vh - 120px)"}}>
        {page==="liste"&&<PageListe db={db} setDb={setDbSync} showToast={showToast}/>}
        {page==="recettes"&&<PageRecettes db={db} setDb={setDbSync} showToast={showToast}/>}
        {page==="prix"&&<PagePrix db={db} setDb={setDbSync} showToast={showToast}/>}
        {page==="placard"&&<PagePlacard db={db} setDb={setDbSync} showToast={showToast} goToRecettes={()=>setPage("recettes")} goToListe={()=>setPage("liste")}/>}
        {page==="calendrier"&&<PageCalendrier db={db} setDb={setDbSync} showToast={showToast} goToRecettes={()=>setPage("recettes")} goToListe={()=>setPage("liste")}/>}
        {page==="historique"&&<PageHistorique db={db} setDb={setDbSync} showToast={showToast} goToListe={()=>setPage("liste")}/>}
      </div>
      <Toast msg={toast}/>
      {showApiKeyGlobal&&<ApiKeyModal open onSave={()=>setShowApiKeyGlobal(false)} onClose={()=>setShowApiKeyGlobal(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{regs.forEach(r=>r.unregister());});
}
</script>
</body>
</html>
