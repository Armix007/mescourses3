// SYNC FIREBASE
// ═══════════════════════════════════════════════════════════════
function hashPassword(pwd){
  let h=0;for(let i=0;i<pwd.length;i++){h=((h<<5)-h)+pwd.charCodeAt(i);h|=0;}
  return Math.abs(h).toString(36);
}

// Génère un ID unique aléatoire pour un nouveau foyer
function genFoyerId(){
  const chars="abcdefghijklmnopqrstuvwxyz0123456789";
  let id="";for(let i=0;i<10;i++)id+=chars[Math.floor(Math.random()*chars.length)];
  return id;
}

// Récupère le code d'invitation depuis l'URL (?invite=xxx)
function getInviteFromUrl(){
  const p=new URLSearchParams(window.location.search);
  return p.get("invite")||null;
}

function LoginScreen({onLogin}){
  const inviteCode=getInviteFromUrl();
  const [mode,setMode]=useState(inviteCode?"rejoindre":"choix"); // choix | creer | rejoindre
  const [pseudo,setPseudo]=useState(()=>localStorage.getItem("ws_pseudo")||"");
  const [pwd,setPwd]=useState(()=>localStorage.getItem("ws_pwd_saved")||"");
  const [remember,setRemember]=useState(!!localStorage.getItem("ws_pwd_saved"));
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const [inviteLink,setInviteLink]=useState("");
  const [showInvite,setShowInvite]=useState(false);
  const [copied,setCopied]=useState(false);

  async function creerFoyer(){
    if(!pseudo.trim()){setErr("Entrez votre prénom");return;}
    if(!pwd.trim()||pwd.length<4){setErr("Mot de passe trop court (min. 4 caractères)");return;}
    setLoading(true);setErr("");
    const foyerId=genFoyerId();
    const docId="foyer_"+foyerId+"_"+hashPassword(pwd.trim());
    try{
      const{fsdb,doc,setDoc}=window._firebase;
      const ref=doc(fsdb,"households",docId);
      await setDoc(ref,{items:[],productHistory:{},recipes:[],shoppingHistory:[],foyerId,createdAt:Date.now(),members:[pseudo.trim()]});
      localStorage.setItem("ws_pseudo",pseudo.trim());
      localStorage.setItem("ws_docid",docId);
      localStorage.setItem("ws_foyerid",foyerId);
      if(remember){localStorage.setItem("ws_pwd_saved",pwd.trim());}else{localStorage.removeItem("ws_pwd_saved");}
      // Afficher le lien d'invitation
      const link=`${window.location.origin}${window.location.pathname}?invite=${foyerId}`;
      setInviteLink(link);
      setShowInvite(true);
      onLogin(docId,pseudo.trim());
    }catch(e){setErr("Erreur : "+e.message);}
    setLoading(false);
  }

  async function rejoindre(){
    if(!pseudo.trim()){setErr("Entrez votre prénom");return;}
    if(!pwd.trim()||pwd.length<4){setErr("Mot de passe trop court (min. 4 caractères)");return;}
    const fid=inviteCode||"";
    if(!fid){setErr("Code d'invitation manquant");return;}
    setLoading(true);setErr("");
    const docId="foyer_"+fid+"_"+hashPassword(pwd.trim());
    try{
      const{fsdb,doc,getDoc,setDoc}=window._firebase;
      const ref=doc(fsdb,"households",docId);
      const snap=await getDoc(ref);
      if(!snap.exists()){setErr("Mot de passe incorrect ou lien invalide");setLoading(false);return;}
      // Ajouter le membre si pas déjà présent
      const data=snap.data();
      const members=[...(data.members||[])];
      if(!members.includes(pseudo.trim()))members.push(pseudo.trim());
      await setDoc(ref,{...data,members},{merge:true});
      localStorage.setItem("ws_pseudo",pseudo.trim());
      localStorage.setItem("ws_docid",docId);
      localStorage.setItem("ws_foyerid",fid);
      if(remember){localStorage.setItem("ws_pwd_saved",pwd.trim());}else{localStorage.removeItem("ws_pwd_saved");}
      onLogin(docId,pseudo.trim());
    }catch(e){setErr("Erreur : "+e.message);}
    setLoading(false);
  }

  function copyLink(){
    navigator.clipboard.writeText(inviteLink).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
  }

  // Écran lien partagé (après création)
  if(showInvite){
    return(
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:"rgba(255,255,255,.95)",borderRadius:24,padding:32,width:"100%",maxWidth:380,border:`1px solid ${BDR}`,boxShadow:"0 20px 60px rgba(160,90,40,.15)"}}>
          <div style={{textAlign:"center",marginBottom:20}}>
            <div style={{fontSize:44,marginBottom:8}}>🎉</div>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:22,color:CARAMEL,fontWeight:900}}>Foyer créé !</div>
            <div style={{fontSize:12,color:TXT3,marginTop:6}}>Partagez ce lien avec votre foyer pour qu'ils rejoignent votre liste</div>
          </div>
          <div style={{background:CREAM2,border:`1.5px solid ${BDR}`,borderRadius:14,padding:"12px 14px",marginBottom:12,wordBreak:"break-all",fontSize:11,color:TXT2,lineHeight:1.6}}>{inviteLink}</div>
          <button style={{...btn("acc"),width:"100%",justifyContent:"center",marginBottom:10,fontSize:13}} onClick={copyLink}>
            {copied?"✅ Lien copié !":"📋 Copier le lien d'invitation"}
          </button>
          <div style={{fontSize:10,color:TXT3,textAlign:"center",lineHeight:1.6}}>⚠️ Ce lien + votre mot de passe permettent d'accéder au foyer. Partagez-les uniquement avec les personnes de confiance.</div>
        </div>
      </div>
    );
  }

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"rgba(255,255,255,.92)",borderRadius:24,padding:28,width:"100%",maxWidth:380,border:`1px solid ${BDR}`,boxShadow:"0 20px 60px rgba(160,90,40,.15)"}}>

        {/* Logo */}
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontSize:48,marginBottom:8}}>🛒</div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:28,color:CARAMEL,fontWeight:900,letterSpacing:-.5}}>Wisely Food</div>
          <div style={{fontSize:12,color:TXT3,marginTop:4,fontWeight:500}}>Votre assistant du quotidien pour le foyer</div>
        </div>

        {/* Choix initial */}
        {mode==="choix"&&(
          <>
            <button style={{...btn("acc"),width:"100%",justifyContent:"center",marginBottom:10,fontSize:13,padding:"13px"}} onClick={()=>setMode("creer")}>
              🏠 Créer un nouveau foyer
            </button>
            <button style={{...btn("out"),width:"100%",justifyContent:"center",fontSize:13,padding:"13px"}} onClick={()=>setMode("rejoindre")}>
              🔗 Rejoindre via un lien
            </button>
            <div style={{fontSize:11,color:TXT3,textAlign:"center",marginTop:14,lineHeight:1.7}}>
              Pour rejoindre le foyer de quelqu'un,<br/>utilisez le lien d'invitation qu'il vous a partagé.
            </div>
          </>
        )}

        {/* Créer un foyer */}
        {mode==="creer"&&(
          <>
            <div style={{fontSize:13,fontWeight:700,color:TXT,marginBottom:14}}>🏠 Créer votre foyer</div>
            <span style={lbl}>Votre prénom</span>
            <input style={{...inp,marginBottom:10}} placeholder="Ex: Thomas" value={pseudo} onChange={e=>setPseudo(e.target.value)}/>
            <span style={lbl}>Mot de passe du foyer</span>
            <input style={{...inp,marginBottom:4,letterSpacing:2}} type="password" placeholder="Min. 4 caractères" value={pwd} onChange={e=>setPwd(e.target.value)} onKeyDown={e=>e.key==="Enter"&&creerFoyer()}/>
            <div style={{fontSize:10,color:TXT3,marginBottom:12,lineHeight:1.5}}>Ce mot de passe sera demandé à chaque membre qui rejoint votre foyer.</div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,cursor:"pointer"}} onClick={()=>setRemember(!remember)}>
              <div style={{width:18,height:18,borderRadius:5,border:`2px solid ${remember?CARAMEL:BDR}`,background:remember?CARAMEL:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                {remember&&<span style={{color:"white",fontSize:10,fontWeight:800}}>✓</span>}
              </div>
              <span style={{fontSize:12,color:TXT2,fontWeight:500}}>Se souvenir de moi sur cet appareil</span>
            </div>
            {err&&<div style={{fontSize:12,color:DNG,marginBottom:8,fontWeight:600}}>{err}</div>}
            <button style={{...btn("acc"),width:"100%",justifyContent:"center",marginBottom:8,fontSize:13,padding:"13px"}} onClick={creerFoyer} disabled={loading}>
              {loading?"Création…":"✨ Créer mon foyer"}
            </button>
            <button style={{...btn("gh"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>setMode("choix")}>← Retour</button>
          </>
        )}

        {/* Rejoindre via lien */}
        {mode==="rejoindre"&&(
          <>
            <div style={{fontSize:13,fontWeight:700,color:TXT,marginBottom:14}}>🔗 Rejoindre un foyer</div>
            {inviteCode
              ?<div style={{background:CREAM2,border:`1px solid ${BDR}`,borderRadius:10,padding:"8px 12px",marginBottom:12,fontSize:11,color:TXT2}}>🔗 Code d'invitation détecté : <strong style={{color:CARAMEL}}>{inviteCode}</strong></div>
              :<div style={{background:"rgba(212,96,74,.08)",border:`1px solid rgba(212,96,74,.2)`,borderRadius:10,padding:"8px 12px",marginBottom:12,fontSize:11,color:DNG}}>⚠️ Aucun lien d'invitation détecté. Utilisez le lien complet partagé par votre foyer.</div>
            }
            <span style={lbl}>Votre prénom</span>
            <input style={{...inp,marginBottom:10}} placeholder="Ex: Sophie" value={pseudo} onChange={e=>setPseudo(e.target.value)}/>
            <span style={lbl}>Mot de passe du foyer</span>
            <input style={{...inp,marginBottom:4,letterSpacing:2}} type="password" placeholder="••••••••" value={pwd} onChange={e=>setPwd(e.target.value)} onKeyDown={e=>e.key==="Enter"&&rejoindre()}/>
            <div style={{fontSize:10,color:TXT3,marginBottom:12,lineHeight:1.5}}>Le mot de passe vous a été communiqué par la personne qui a créé le foyer.</div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,cursor:"pointer"}} onClick={()=>setRemember(!remember)}>
              <div style={{width:18,height:18,borderRadius:5,border:`2px solid ${remember?CARAMEL:BDR}`,background:remember?CARAMEL:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                {remember&&<span style={{color:"white",fontSize:10,fontWeight:800}}>✓</span>}
              </div>
              <span style={{fontSize:12,color:TXT2,fontWeight:500}}>Se souvenir de moi sur cet appareil</span>
            </div>
            {err&&<div style={{fontSize:12,color:DNG,marginBottom:8,fontWeight:600}}>{err}</div>}
            <button style={{...btn("acc"),width:"100%",justifyContent:"center",marginBottom:8,fontSize:13,padding:"13px"}} onClick={rejoindre} disabled={loading||!inviteCode}>
              {loading?"Connexion…":"🔓 Rejoindre le foyer"}
            </button>
            <button style={{...btn("gh"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>setMode("choix")}>← Retour</button>
          </>
        )}

      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// PAGE PRIX — Scan ticket + Base de prix
// ═══════════════════════════════════════════════════════════════
function PagePrix({db,setDb,showToast}){
  const [tab,setTab]=useState("scanner");
  const [scanPhotos,setScanPhotos]=useState([]);
  const [scanning,setScanning]=useState(false);
  const [scanResult,setScanResult]=useState(null);
  const [scanMsg,setScanMsg]=useState("");
  const [scanStatus,setScanStatus]=useState("idle");
  const [shopName,setShopName]=useState("");
  const [shopAuto,setShopAuto]=useState(false);
  const [showBudgetEdit,setShowBudgetEdit]=useState(false);
  const [budgetInput,setBudgetInput]=useState("");
  const [searchPrice,setSearchPrice]=useState("");
  const [filterShop,setFilterShop]=useState("Tous");
  const [showPriceVisible,setShowPriceVisible]=useState(()=>localStorage.getItem("ws_prices_visible")!=="false");
  const [listening,setListening]=useState(false);
  const [showApiKey,setShowApiKey]=useState(false);
  const [confirmShop,setConfirmShop]=useState(false);
  const [deleteTicket,setDeleteTicket]=useState(null);
  const scanRef=useRef();
  const recognitionRef=useRef(null);

  function togglePriceVisible(){const v=!showPriceVisible;setShowPriceVisible(v);localStorage.setItem("ws_prices_visible",String(v));}

  function handleScanFile(e){
    const file=e.target.files[0];if(!file)return;
    const mt=file.type||"image/jpeg";
    const r=new FileReader();r.onload=ev=>setScanPhotos(prev=>[...prev,{dataUrl:ev.target.result,mt,id:Date.now()}]);
    r.readAsDataURL(file);e.target.value="";
  }

  function addManualItem(){setScanResult(prev=>[...(prev||[]),{genericName:"",originalName:"",price:0,qty:"",unit:"",selected:true,manual:true,confidence:"high"}]);}

  function editItem(i,field,val){setScanResult(prev=>prev.map((it,j)=>j===i?{...it,[field]:field==="price"?parseFloat(val)||0:val,confirmed:field!=="selected"?true:it.confirmed}:it));}

  function startVoice(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){showToast("⚠️ Reconnaissance vocale non supportée");return;}
    const recog=new SR();recog.lang="fr-FR";recog.continuous=false;recog.interimResults=false;
    recog.onstart=()=>setListening(true);recog.onend=()=>setListening(false);
    recog.onresult=(e)=>{
      const text=e.results[0][0].transcript.trim().toLowerCase();
      const match=text.match(/^(.+?)\s+([\d.,]+)\s*€?\s*$/);
      if(match){
        const name=match[1].trim();const price=parseFloat(match[2].replace(",","."))||0;
        setScanResult(prev=>[...(prev||[]),{genericName:name,originalName:name,price,qty:"",unit:"",selected:true,manual:true,confidence:"high",confirmed:true}]);
        showToast(`🎤 "${name}" ajouté`);
      }else{
        setScanResult(prev=>[...(prev||[]),{genericName:text,originalName:text,price:0,qty:"",unit:"",selected:true,manual:true,confidence:"medium",confirmed:false}]);
        showToast(`🎤 "${text}" ajouté — vérifiez le prix`);
      }
    };
    recog.onerror=()=>{setListening(false);showToast("❌ Erreur micro");};
    recognitionRef.current=recog;recog.start();
  }

  async function doTicketScan(){
    if(!scanPhotos.length){showToast("⚠️ Ajoutez au moins une photo du ticket");return;}
    const apiKey=localStorage.getItem("ws_apikey")||"";
    if(!apiKey){setShowApiKey(true);return;}
    setScanning(true);setScanMsg("");setScanStatus("idle");setScanResult(null);setShopAuto(false);
    const n=scanPhotos.length;
    const prompt=`Tu es un expert en lecture de tickets de caisse. ${n>1?`On t'envoie ${n} photos d'un même ticket.`:"Analyse ce ticket."}

MISSION 1 — MAGASIN : Détecte le nom du magasin (souvent en haut du ticket en gros : CARREFOUR, LIDL, ALDI, CASINO, MONOPRIX, INTERMARCHÉ, etc.). Si absent ou illisible, shopName:"".

MISSION 2 — ARTICLES : Extrais TOUS les articles achetés dans l'ordre exact du ticket.
Pour chaque article :
- genericName : nom générique français sans marque (ex: "beurre doux", "poulet entier", "lait demi-écrémé")
- originalName : texte exact lu sur le ticket
- price : prix payé (décimal, ex: 1.89)
- qty : grammage/volume si visible (ex: "250", "1.5"), sinon ""
- unit : g, kg, ml, cl, L, pièce, tranche, sachet, boîte, bouteille, paquet selon ticket, sinon ""
- confidence : "high" si tu es sûr, "medium" si doute modéré, "low" si très incertain
- failed : true UNIQUEMENT si tu ne peux pas du tout lire l'article

RÈGLES :
- Ignore totaux, sous-totaux, TVA, remises globales, numéros de caisse
- Ne confonds JAMAIS le code article avec le prix
- Un prix ne peut pas être négatif ni supérieur à 200€ pour un article courant
- Si un article a confidence "low", mets quand même ta meilleure estimation dans genericName

RETOURNE UNIQUEMENT ce JSON valide (sans markdown, sans backtick) :
{"shopName":"","items":[{"genericName":"","originalName":"","price":0,"qty":"","unit":"","confidence":"high","failed":false}]}`;
    try{
      const content=[
        ...scanPhotos.map((p,i)=>[
          ...(n>1?[{type:"text",text:`Photo ${i+1}/${n} :`}]:[]),
          {type:"image",source:{type:"base64",media_type:p.mt,data:p.dataUrl.split(",")[1]}}
        ]).flat(),
        {type:"text",text:prompt}
      ];
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:5000,messages:[{role:"user",content}]})
      });
      if(!resp.ok){const e=await resp.json().catch(()=>({}));throw new Error("Erreur "+resp.status+(e.error?.message?" : "+e.error.message:""));}
      const data=await resp.json();
      let text=(data.content||[]).map(c=>c.text||"").join("").trim();
      text=text.replace(/^```[a-z]*\n?/i,"").replace(/\n?```$/i,"").trim();
      const p=JSON.parse(text);
      if(p.shopName&&p.shopName.trim()){setShopName(p.shopName.trim());setShopAuto(true);}
      const items=(p.items||[]);
      const low=items.filter(i=>i.confidence==="low"||i.failed).length;
      setScanResult(items.map(i=>({...i,selected:!i.failed,genericName:i.failed?"":i.genericName,confirmed:i.confidence==="high"&&!i.failed})));
      setScanMsg(`✅ ${items.length} article${items.length>1?"s":""} détecté${items.length>1?"s":""}${low>0?` · ⚠️ ${low} à vérifier`:""}`);
      setScanStatus("ok");
    }catch(err){console.error(err);setScanMsg("❌ "+err.message);setScanStatus("error");}
    setScanning(false);
  }

  function toggleItem(i){setScanResult(prev=>prev.map((it,j)=>j===i?{...it,selected:!it.selected}:it));}
  function removeItem(i){setScanResult(prev=>prev.filter((_,j)=>j!==i));}
  function confirmItem(i){setScanResult(prev=>prev.map((it,j)=>j===i?{...it,confirmed:true,confidence:"high"}:it));}

  function doSavePrices(shop){
    if(!scanResult?.length)return;
    const selected=scanResult.filter(i=>i.selected&&i.genericName.trim()&&i.price>0);
    if(!selected.length){showToast("⚠️ Aucun article valide sélectionné");return;}
    const now=Date.now();
    const newPriceDB={...(db.priceDB||{})};
    selected.forEach(item=>{
      const key=item.genericName.toLowerCase().trim();
      if(!newPriceDB[key])newPriceDB[key]={shops:{}};
      const ref=pricePerKg(item.price,item.qty,item.unit);
      newPriceDB[key].shops[shop]={price:item.price,qty:item.qty||"",unit:item.unit||"",priceRef:ref,updatedAt:now,originalName:item.originalName,category:guessCat(key)};
    });
    const total=selected.reduce((s,i)=>s+i.price,0);
    const sessions=[{date:new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long"}),shop,total:Math.round(total*100)/100,count:selected.length,ts:now,items:selected.map(i=>i.genericName)},...(db.budget?.sessions||[])].slice(0,50);
    const nd={...db,priceDB:newPriceDB,budget:{...(db.budget||{}),sessions}};setDb(nd);saveDB(nd);
    showToast(`💾 ${selected.length} prix sauvegardés !`);
    setScanResult(null);setScanPhotos([]);setScanMsg("");setScanStatus("idle");setShopName("");setShopAuto(false);setTab("base");
  }

  function savePrices(){
    const shop=shopName.trim();
    if(!shop){setConfirmShop(true);return;}
    const needsConfirm=scanResult?.some(i=>i.selected&&!i.confirmed&&(i.confidence==="low"||i.failed));
    if(needsConfirm){showToast("⚠️ Confirmez ou corrigez les articles en orange avant d'enregistrer");return;}
    doSavePrices(shop);
  }

  function deletePriceItem(key){
    const nd={...db,priceDB:Object.fromEntries(Object.entries(db.priceDB||{}).filter(([k])=>k!==key))};
    setDb(nd);saveDB(nd);showToast("🗑️ Article supprimé de la base");
  }

  function deleteShopPrice(key,shop){
    const newDB={...db.priceDB};
    if(!newDB[key])return;
    delete newDB[key].shops[shop];
    if(!Object.keys(newDB[key].shops).length)delete newDB[key];
    const nd={...db,priceDB:newDB};setDb(nd);saveDB(nd);showToast("🗑️ Prix supprimé");
  }

  function removeTicket(idx,removeFromPrices){
    const s=db.budget.sessions[idx];
    let newPriceDB={...(db.priceDB||{})};
    if(removeFromPrices&&s.items?.length){
      s.items.forEach(name=>{
        const key=name.toLowerCase().trim();
        if(newPriceDB[key]&&s.shop){
          delete newPriceDB[key].shops[s.shop];
          if(!Object.keys(newPriceDB[key].shops||{}).length)delete newPriceDB[key];
        }
      });
    }
    const sessions=db.budget.sessions.filter((_,i)=>i!==idx);
    const nd={...db,priceDB:newPriceDB,budget:{...db.budget,sessions}};setDb(nd);saveDB(nd);
    setDeleteTicket(null);showToast("🗑️ Ticket supprimé");
  }

  // Catégories base prix
  const CAT_ORDER=["🍎 Fruits","🥦 Légumes","🥩 Viande","🐟 Poisson","🥛 Laitiers","🧀 Fromage","🥚 Oeufs","🍞 Boulangerie","🥫 Épicerie sèche","🫙 Conserves","🧊 Surgelés","🍷 Boissons","🧴 Hygiène","🧹 Entretien","🍬 Confiseries","❓ Autre"];
  const priceEntries=Object.entries(db.priceDB||{}).filter(([k])=>!searchPrice||k.includes(searchPrice.toLowerCase()));
  const allShops=[...new Set(priceEntries.flatMap(([,d])=>Object.keys(d.shops||{})))];
  const filteredEntries=filterShop==="Tous"?priceEntries:priceEntries.filter(([,d])=>d.shops?.[filterShop]);
  const byCat={};
  filteredEntries.forEach(([name,data])=>{
    const shops=Object.entries(data.shops||{});if(!shops.length)return;
    const cat=shops[0]?.[1]?.category||guessCat(name)||"❓ Autre";
    if(!byCat[cat])byCat[cat]=[];
    byCat[cat].push([name,data]);
  });
  const catsSorted=[...CAT_ORDER.filter(c=>byCat[c]),...Object.keys(byCat).filter(c=>!CAT_ORDER.includes(c))];

  const sessions=db.budget?.sessions||[];
  const monthlyBudget=db.budget?.monthly||0;
  const now2=new Date();
  const thisMonthTotal=sessions.filter(s=>{const d=new Date(s.ts);return d.getMonth()===now2.getMonth()&&d.getFullYear()===now2.getFullYear();}).reduce((s,i)=>s+i.total,0);
  const budgetPct=monthlyBudget>0?Math.min(100,Math.round(thisMonthTotal/monthlyBudget*100)):0;
  const budgetColor=budgetPct>90?DNG:budgetPct>70?"#c8843a":SUC;
  const currentMonth=now2.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  const needsConfirmCount=scanResult?.filter(i=>i.selected&&!i.confirmed&&(i.confidence==="low"||i.failed)).length||0;

  return(
    <div style={{padding:14,paddingBottom:90}}>
      <div style={{display:"flex",gap:4,marginBottom:14,background:"rgba(255,255,255,.6)",borderRadius:14,padding:4}}>
        {[{id:"scanner",label:"📷 Scanner"},{id:"base",label:"💰 Base prix"},{id:"budget",label:"📊 Budget"}].map(t=>(
          <div key={t.id} style={{flex:1,padding:"8px 4px",textAlign:"center",fontSize:11,fontWeight:700,borderRadius:10,background:tab===t.id?SURF:"transparent",color:tab===t.id?CARAMEL:TXT3,cursor:"pointer",transition:"all .2s",boxShadow:tab===t.id?"0 2px 8px rgba(160,90,40,.1)":"none"}} onClick={()=>setTab(t.id)}>
            {t.label}
          </div>
        ))}
      </div>

      {tab==="scanner"&&(
        <>
          {!localStorage.getItem("ws_apikey")&&(
            <div style={{fontSize:11,color:TXT2,padding:"8px 12px",background:"rgba(200,132,90,.08)",borderRadius:10,border:`1px solid ${CARAMEL2}`,marginBottom:10,display:"flex",alignItems:"center",gap:8}}>
              <span>🔑</span><span style={{flex:1}}>Clé API requise pour scanner</span>
              <span style={{color:CARAMEL2,fontWeight:700,cursor:"pointer",textDecoration:"underline"}} onClick={()=>setShowApiKey(true)}>Configurer</span>
            </div>
          )}
          {/* Magasin */}
          <div style={{...card,background:"rgba(255,255,255,.9)"}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
              <span style={{...lbl,marginBottom:0,flex:1}}>Magasin</span>
              {shopAuto&&<span style={{fontSize:9,color:SUC,fontWeight:700,background:"rgba(90,138,58,.1)",padding:"2px 7px",borderRadius:20}}>🤖 Détecté auto</span>}
              <span style={{fontSize:10,color:TXT3}}>Optionnel</span>
            </div>
            <input style={inp} placeholder="Ex: Carrefour, Lidl, Monoprix… (détecté auto si possible)" value={shopName} onChange={e=>{setShopName(e.target.value);setShopAuto(false);}}/>
          </div>
          {/* Photos */}
          <div style={{...card,background:"rgba(255,255,255,.9)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <span style={{...lbl,marginBottom:0}}>Photos du ticket</span>
              <span style={{fontSize:10,color:TXT3}}>Plusieurs si ticket long</span>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
              {scanPhotos.map((p,i)=>(
                <div key={p.id} style={{position:"relative",width:64,height:64}}>
                  <img src={p.dataUrl} style={{width:64,height:64,objectFit:"cover",borderRadius:10,border:`2px solid ${CARAMEL2}`}} alt={`T${i+1}`}/>
                  <div style={{position:"absolute",top:-4,right:-4,width:18,height:18,borderRadius:"50%",background:DNG,color:"white",fontSize:10,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}} onClick={()=>setScanPhotos(prev=>prev.filter(x=>x.id!==p.id))}>✕</div>
                  <div style={{position:"absolute",bottom:2,left:2,background:"rgba(0,0,0,.5)",color:"white",fontSize:8,borderRadius:4,padding:"1px 4px",fontWeight:700}}>{i+1}</div>
                </div>
              ))}
              <div style={{width:64,height:64,border:`2px dashed ${CARAMEL2}`,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",background:SURF,flexDirection:"column",gap:2}} onClick={()=>scanRef.current.click()}>
                <div style={{fontSize:22}}>📷</div>
                <div style={{fontSize:8,color:TXT3,fontWeight:600}}>Photo</div>
              </div>
            </div>
            <input ref={scanRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleScanFile} capture="environment"/>
            {scanPhotos.length>0&&(
              <button style={{...btn("acc"),width:"100%",justifyContent:"center",fontSize:13}} onClick={doTicketScan} disabled={scanning}>
                {scanning?"⏳ Analyse en cours…":`🔍 Analyser ${scanPhotos.length} photo${scanPhotos.length>1?"s":""}`}
              </button>
            )}
          </div>
          {scanMsg&&<div style={{fontSize:12,textAlign:"center",padding:"8px 12px",borderRadius:10,background:scanStatus==="ok"?"rgba(90,138,58,.1)":"rgba(212,96,74,.1)",color:scanStatus==="ok"?SUC:DNG,marginBottom:10,fontWeight:600}}>{scanMsg}</div>}

          {(scanResult||[]).length>0&&(
            <div style={{...card,background:"rgba(255,255,255,.95)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <div style={{fontFamily:"'Fraunces',serif",fontSize:15,color:TXT}}>Valider les articles</div>
                <div style={{display:"flex",gap:5}}>
                  <button style={{...btn("gh"),fontSize:10,padding:"4px 8px"}} onClick={()=>setScanResult(prev=>prev.map(i=>({...i,selected:true})))}>Tout</button>
                  <button style={{...btn("gh"),fontSize:10,padding:"4px 8px"}} onClick={()=>setScanResult(prev=>prev.map(i=>({...i,selected:false})))}>Aucun</button>
                </div>
              </div>
              {needsConfirmCount>0&&<div style={{fontSize:11,color:"#c8603a",background:"rgba(200,96,58,.08)",borderRadius:8,padding:"6px 10px",marginBottom:8,fontWeight:600}}>⚠️ {needsConfirmCount} article{needsConfirmCount>1?"s":""} à confirmer obligatoirement avant d'enregistrer</div>}
              <div style={{maxHeight:420,overflowY:"auto"}}>
                {scanResult.map((item,i)=>{
                  const isLow=item.confidence==="low"||item.failed;
                  const isMed=item.confidence==="medium";
                  const needsOk=isLow&&!item.confirmed;
                  const catEmoji=item.genericName?guessCat(item.genericName).split(" ")[0]:"❓";
                  return(
                    <div key={i} style={{padding:"8px 0",borderBottom:i<scanResult.length-1?`1px solid ${BDR}`:"none",background:needsOk?"rgba(200,96,58,.05)":isMed&&!item.confirmed?"rgba(200,160,58,.04)":"transparent",borderRadius:6}}>
                      {item.originalName&&<div style={{fontSize:9,color:TXT3,marginBottom:2,fontStyle:"italic",paddingLeft:30}}>{item.originalName}</div>}
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        {/* Checkbox */}
                        <div style={{width:18,height:18,borderRadius:5,border:`2px solid ${item.selected?CARAMEL:BDR}`,background:item.selected?CARAMEL:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,cursor:"pointer"}} onClick={()=>toggleItem(i)}>
                          {item.selected&&<span style={{color:"white",fontSize:10,fontWeight:800}}>✓</span>}
                        </div>
                        {/* Emoji catégorie */}
                        <span style={{fontSize:18,flexShrink:0}}>{catEmoji}</span>
                        <div style={{flex:1,minWidth:0}}>
                          {/* Badge confiance */}
                          {needsOk&&<div style={{fontSize:9,color:"#c8603a",fontWeight:700,marginBottom:2}}>⚠️ À confirmer</div>}
                          {isMed&&!item.confirmed&&<div style={{fontSize:9,color:"#b8903a",fontWeight:700,marginBottom:2}}>🟡 Vérifiez</div>}
                          <input
                            style={{width:"100%",background:needsOk?"rgba(200,96,58,.08)":isMed&&!item.confirmed?"rgba(200,160,58,.07)":"transparent",border:needsOk?`1.5px solid rgba(200,96,58,.4)`:isMed&&!item.confirmed?`1px dashed rgba(200,160,58,.5)`:"none",borderRadius:6,color:TXT,fontFamily:"inherit",fontSize:13,fontWeight:700,outline:"none",padding:needsOk||isMed?"3px 6px":"0"}}
                            placeholder={item.failed?item.originalName||"Article non reconnu — saisissez le nom":"Nom de l'article"}
                            value={item.genericName}
                            onChange={e=>editItem(i,"genericName",e.target.value)}
                          />
                          <div style={{display:"flex",gap:4,marginTop:3}}>
                            <input style={{width:44,background:"rgba(0,0,0,.04)",border:"none",borderRadius:5,padding:"2px 4px",fontSize:10,color:TXT2,fontFamily:"inherit",outline:"none",textAlign:"center"}} placeholder="Qté" value={item.qty} onChange={e=>editItem(i,"qty",e.target.value)}/>
                            <select style={{background:"rgba(0,0,0,.04)",border:"none",borderRadius:5,padding:"2px 4px",fontSize:10,color:TXT2,fontFamily:"inherit",outline:"none"}} value={item.unit} onChange={e=>editItem(i,"unit",e.target.value)}>
                              <option value="">—</option>
                              {["g","kg","ml","cl","L","pièce","tranche","sachet","boîte","bouteille","paquet","botte"].map(u=><option key={u} value={u}>{u}</option>)}
                            </select>
                            {needsOk&&<button style={{...btn("suc"),fontSize:9,padding:"2px 8px",lineHeight:1}} onClick={()=>confirmItem(i)}>✓ Confirmer</button>}
                          </div>
                        </div>
                        <div style={{display:"flex",alignItems:"center",gap:2,flexShrink:0}}>
                          <input style={{width:52,background:"rgba(184,112,58,.06)",border:"none",borderRadius:6,padding:"4px 5px",fontSize:13,fontWeight:800,color:CARAMEL,fontFamily:"inherit",textAlign:"right",outline:"none"}} type="number" step="0.01" min="0" value={item.price||""} onChange={e=>editItem(i,"price",e.target.value)}/>
                          <span style={{fontSize:11,color:CARAMEL2,fontWeight:700}}>€</span>
                        </div>
                        <button style={{background:"none",border:"none",color:TXT3,cursor:"pointer",fontSize:13,padding:"0 2px",flexShrink:0}} onClick={()=>removeItem(i)}>✕</button>
                      </div>
                      {item.qty&&item.unit&&item.price>0&&<div style={{fontSize:9,color:TXT3,paddingLeft:64,marginTop:2}}>{fmtPriceRef(item.price,item.qty,item.unit)||""}</div>}
                    </div>
                  );
                })}
              </div>
              <div style={{borderTop:`1px solid ${BDR}`,marginTop:8,paddingTop:8}}>
                <div style={{display:"flex",gap:6,marginBottom:8}}>
                  <button style={{...btn("gh"),flex:1,fontSize:11}} onClick={addManualItem}>+ Manuel</button>
                  <button style={{...btn("gh"),flex:1,fontSize:11,background:listening?"rgba(212,96,74,.1)":"",color:listening?DNG:undefined}} onClick={startVoice} disabled={listening}>{listening?"🎤 Écoute…":"🎤 Vocal"}</button>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{fontSize:12,color:TXT2,fontWeight:600}}>
                    {scanResult.filter(i=>i.selected&&i.genericName).length} art. · <strong style={{color:CARAMEL}}>{scanResult.filter(i=>i.selected).reduce((s,i)=>s+i.price,0).toFixed(2)}€</strong>
                  </div>
                  <button style={{...btn(needsConfirmCount>0?"gh":"acc"),fontSize:12}} onClick={savePrices} disabled={needsConfirmCount>0}>
                    {needsConfirmCount>0?`⚠️ ${needsConfirmCount} à confirmer`:"💾 Enregistrer"}
                  </button>
                </div>
              </div>
            </div>
          )}
          {!scanResult&&!scanning&&(
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <button style={{...btn("gh"),flex:1,fontSize:11}} onClick={()=>{setScanResult([]);addManualItem();}}>+ Saisie manuelle</button>
              <button style={{...btn("gh"),flex:1,fontSize:11,background:listening?"rgba(212,96,74,.1)":"",color:listening?DNG:undefined}} onClick={()=>{setScanResult([]);startVoice();}} disabled={listening}>{listening?"🎤 Écoute…":"🎤 Vocal"}</button>
            </div>
          )}
        </>
      )}

      {tab==="base"&&(
        <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:18,color:TXT}}>Ma base de prix</div>
            <button style={{...btn("gh"),fontSize:11,padding:"5px 10px"}} onClick={togglePriceVisible}>{showPriceVisible?"🙈 Masquer":"👁️ Afficher"} dans liste</button>
          </div>
          {Object.keys(db.priceDB||{}).length===0?(
            <div style={{textAlign:"center",padding:"40px 20px"}}>
              <div style={{fontSize:40,marginBottom:10}}>💰</div>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:16,color:TXT,marginBottom:6}}>Aucun prix enregistré</div>
              <div style={{fontSize:12,color:TXT3}}>Scannez un ticket pour commencer</div>
            </div>
          ):(
            <>
              <input style={{...inp,marginBottom:8}} placeholder="🔍 Rechercher un produit…" value={searchPrice} onChange={e=>setSearchPrice(e.target.value)}/>
              {allShops.length>1&&(
                <div style={{display:"flex",gap:5,overflowX:"auto",marginBottom:10,paddingBottom:4,scrollbarWidth:"none"}}>
                  {["Tous",...allShops].map(s=>(
                    <div key={s} style={{flexShrink:0,padding:"4px 10px",borderRadius:20,fontSize:11,fontWeight:700,background:filterShop===s?CARAMEL2:"rgba(255,255,255,.75)",color:filterShop===s?"white":TXT2,cursor:"pointer",border:`1px solid ${filterShop===s?CARAMEL2:BDR}`,whiteSpace:"nowrap"}} onClick={()=>setFilterShop(s)}>{s}</div>
                  ))}
                </div>
              )}
              {catsSorted.length===0&&searchPrice?(
                <div style={{textAlign:"center",padding:"24px",color:TXT3,fontSize:12}}>
                  <div style={{fontSize:28,marginBottom:8}}>🔍</div>
                  Aucun produit trouvé pour «&nbsp;<strong style={{color:TXT2}}>{searchPrice}</strong>&nbsp;»
                </div>
              ):catsSorted.map(cat=>(
                <div key={cat} style={{marginBottom:12}}>
                  <div style={{fontSize:11,fontWeight:800,color:TXT2,letterSpacing:.5,textTransform:"uppercase",marginBottom:6,paddingLeft:4}}>{cat}</div>
                  {(byCat[cat]||[]).map(([name,data])=>{
                    const shops=Object.entries(data.shops||{});if(!shops.length)return null;
                    const best=shops.sort((a,b)=>(a[1].priceRef?.value??a[1].price)-(b[1].priceRef?.value??b[1].price))[0];
                    const catEmoji=(Object.values(data.shops||{})[0]?.category||guessCat(name)).split(" ")[0];
                    return(
                      <PriceItemCard key={name} name={name} data={data} best={best} catEmoji={catEmoji}
                        onDelete={()=>deletePriceItem(name)}
                        onDeleteShop={shop=>deleteShopPrice(name,shop)}
                        onUpdateShop={(shop,newInfo)=>{
                          const ref=pricePerKg(newInfo.price,newInfo.qty,newInfo.unit);
                          const newDB={...db.priceDB,[name]:{...data,shops:{...data.shops,[shop]:{...data.shops[shop],...newInfo,priceRef:ref,updatedAt:Date.now()}}}};
                          const nd={...db,priceDB:newDB};setDb(nd);saveDB(nd);showToast("✅ Prix mis à jour");
                        }}
                        onUpdateCat={newCat=>{
                          const newDB={...db.priceDB,[name]:{...data,shops:Object.fromEntries(Object.entries(data.shops).map(([s,i])=>[s,{...i,category:newCat}]))}};
                          const nd={...db,priceDB:newDB};setDb(nd);saveDB(nd);
                        }}
                      />
                    );
                  })}
                </div>
              ))}
            </>
          )}
        </>
      )}

      {tab==="budget"&&(
        <>
          <div style={{...card,background:"rgba(255,255,255,.9)",marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:16,color:TXT}}>Budget {currentMonth}</div>
              <button style={{...btn("gh"),fontSize:11,padding:"5px 10px"}} onClick={()=>{setBudgetInput(String(monthlyBudget||""));setShowBudgetEdit(true);}}>✏️ Modifier</button>
            </div>
            {monthlyBudget>0?(
              <>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                  <span style={{fontSize:13,color:TXT2}}>Dépensé ce mois</span>
                  <span style={{fontSize:14,fontWeight:800,color:budgetColor}}>{thisMonthTotal.toFixed(2)}€ / {monthlyBudget}€</span>
                </div>
                <div style={{height:8,background:CREAM2,borderRadius:4,overflow:"hidden"}}>
                  <div style={{height:"100%",width:budgetPct+"%",background:`linear-gradient(90deg,${SUC},${budgetColor})`,borderRadius:4,transition:"width .4s"}}/>
                </div>
                <div style={{fontSize:10,color:TXT3,marginTop:4,textAlign:"right"}}>{budgetPct}% · {Math.max(0,monthlyBudget-thisMonthTotal).toFixed(2)}€ restant</div>
              </>
            ):(
              <div style={{fontSize:12,color:TXT3,textAlign:"center",padding:"8px 0"}}>Définissez une enveloppe mensuelle pour suivre votre budget</div>
            )}
          </div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:16,color:TXT,marginBottom:10}}>Historique des courses</div>
          {sessions.length===0?(
            <div style={{textAlign:"center",padding:"30px 20px",color:TXT3,fontSize:12}}>Aucune course enregistrée</div>
          ):(
            sessions.map((s,i)=>(
              <BudgetSessionCard key={i} session={s} onDelete={()=>setDeleteTicket({idx:i,session:s})}/>
            ))
          )}
        </>
      )}

      {/* Modal budget mensuel */}
      <Modal open={showBudgetEdit} onClose={()=>setShowBudgetEdit(false)}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:10,color:TXT}}>💰 Budget mensuel</div>
        <span style={lbl}>Enveloppe en euros</span>
        <input style={{...inp,marginBottom:14,fontSize:16,textAlign:"center"}} type="number" min="0" placeholder="Ex: 400" value={budgetInput} onChange={e=>setBudgetInput(e.target.value)}/>
        <div style={{display:"flex",gap:8}}>
          <button style={{...btn("gh"),flex:1}} onClick={()=>setShowBudgetEdit(false)}>Annuler</button>
          <button style={{...btn("acc"),flex:1}} onClick={()=>{const v=parseFloat(budgetInput)||0;const nd={...db,budget:{...(db.budget||{}),monthly:v}};setDb(nd);saveDB(nd);setShowBudgetEdit(false);showToast("💰 Budget mis à jour");}}>Enregistrer</button>
        </div>
      </Modal>

      {/* Modal confirmation magasin absent */}
      <Modal open={confirmShop} onClose={()=>setConfirmShop(false)}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:17,marginBottom:8,color:TXT}}>Magasin non renseigné</div>
        <div style={{fontSize:13,color:TXT2,marginBottom:14}}>Le nom du magasin n'est pas renseigné. Il sera enregistré comme "Inconnu". Vous pourrez le modifier plus tard dans la base de prix.</div>
        <input style={{...inp,marginBottom:14}} placeholder="Nom du magasin (optionnel)" value={shopName} onChange={e=>setShopName(e.target.value)} autoFocus/>
        <div style={{display:"flex",gap:8}}>
          <button style={{...btn("gh"),flex:1}} onClick={()=>setConfirmShop(false)}>Annuler</button>
          <button style={{...btn("acc"),flex:1}} onClick={()=>{setConfirmShop(false);doSavePrices(shopName.trim()||"Inconnu");}}>Enregistrer quand même</button>
        </div>
      </Modal>

      {/* Modal suppression ticket budget */}
      {deleteTicket&&<Modal open onClose={()=>setDeleteTicket(null)}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:17,marginBottom:8,color:TXT}}>🗑️ Supprimer ce ticket ?</div>
        <div style={{fontSize:13,color:TXT2,marginBottom:6}}><strong>{deleteTicket.session.shop||"Magasin inconnu"}</strong> — {deleteTicket.session.date} — {deleteTicket.session.total?.toFixed(2)}€</div>
        <div style={{fontSize:12,color:TXT3,marginBottom:16}}>Choisissez ce que vous souhaitez supprimer :</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <button style={{...btn("gh"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>removeTicket(deleteTicket.idx,false)}>
            Retirer du budget uniquement
          </button>
          <button style={{...btn("dng"),width:"100%",justifyContent:"center",fontSize:12}} onClick={()=>removeTicket(deleteTicket.idx,true)}>
            Retirer du budget ET de la base de prix
          </button>
          <button style={{...btn("gh"),width:"100%",justifyContent:"center",fontSize:12,color:TXT3}} onClick={()=>setDeleteTicket(null)}>Annuler</button>
        </div>
      </Modal>}

      {showApiKey&&<ApiKeyModal open onSave={()=>setShowApiKey(false)} onClose={()=>setShowApiKey(false)}/>}
    </div>
  );
}

// PAGE PLACARD — ANTI-GASPI & INVENTAIRE
// ═══════════════════════════════════════════════════════════════
function PagePlacard({db,setDb,showToast,goToRecettes,goToListe}){
  const [tab,setTab]=useState("inventaire"); // inventaire | recettes
  const [showAdd,setShowAdd]=useState(false);
  const [showScan,setShowScan]=useState(false);
  const [filterSignal,setFilterSignal]=useState("tous");
  const [showAIFromPantry,setShowAIFromPantry]=useState(false);
  const [pantryAILoading,setPantryAILoading]=useState(false);
  const pantry=db.pantry||[];
  const redItems=pantry.filter(i=>i.signal==="red");

  async function generateRecipeFromPantry(){
    const apiKey=localStorage.getItem("ws_apikey");if(!apiKey){showToast("⚠️ Clé API requise dans Maison > Paramètres");return;}
    const ingredientList=pantry.map(i=>i.name).join(", ");
    setPantryAILoading(true);
    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:`Je dispose des ingrédients suivants dans mon placard : ${ingredientList}. Génère une recette en utilisant principalement ces ingrédients. Réponds UNIQUEMENT en JSON, sans markdown. Format: {"name":"...","ingredients":[{"name":"...","qty":1,"unit":"g"}],"steps":["..."],"duration":"30 min","persons":2,"difficulty":"easy"}`}]})});
      const data=await resp.json();const text=data.content?.[0]?.text||"";
      const clean=text.replace(/```json|```/g,"").trim();
      const recipe=JSON.parse(clean);
      recipe.id=Date.now();recipe.source="ai";recipe.date=new Date().toLocaleDateString("fr-FR");
      const nd={...db,recipes:[...db.recipes,recipe]};setDb(nd);saveDB(nd);
      setShowAIFromPantry(false);
      showToast("🤖 Recette créée : "+recipe.name);
      goToRecettes();
    }catch(e){showToast("❌ Erreur IA : "+e.message);}
    setPantryAILoading(false);
  }

  function delItem(id){
    const nd={...db,pantry:pantry.filter(i=>i.id!==id)};setDb(nd);showToast("🗑️ Article supprimé");
  }
  function updateSignal(id,signal){
    const nd={...db,pantry:pantry.map(i=>i.id===id?{...i,signal}:i)};setDb(nd);
  }
  function addToListe(item){
    const ni=mergeItem(db.items,item.name,1,"","manuel",item.category||guessCat(item.name));
    const nd={...db,items:ni};setDb(nd);showToast(`✅ ${item.name} ajouté à la liste`);goToListe();
  }

  // Score faisabilité recette basé sur l'inventaire
  function recipeScore(recipe){
    if(!pantry.length||!recipe.ingredients?.length)return null;
    const pantryNames=pantry.map(i=>i.name.toLowerCase());
    const matched=recipe.ingredients.filter(ing=>pantryNames.some(p=>p.includes(ing.name.toLowerCase())||ing.name.toLowerCase().includes(p)));
    return{matched:matched.length,total:recipe.ingredients.length,pct:Math.round(matched.length/recipe.ingredients.length*100)};
  }

  const filtered=filterSignal==="tous"?pantry:pantry.filter(i=>i.signal===filterSignal);
  const byCat={};filtered.forEach(item=>{const c=item.category||guessCat(item.name);if(!byCat[c])byCat[c]=[];byCat[c].push(item);});

  // Recettes triées par score faisabilité
  const recipesWithScore=(db.recipes||[]).map(r=>({...r,score:recipeScore(r)})).filter(r=>r.score&&r.score.matched>0).sort((a,b)=>b.score.pct-a.score.pct);

  return(
    <div style={{padding:14,paddingBottom:90}}>
      {/* Header stats */}
      <div style={{...card,background:"rgba(255,255,255,.88)",padding:"14px 16px",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:20,color:TXT}}>📦 Mon Placard</div>
          <button style={{...btn("acc"),fontSize:12,padding:"7px 12px"}} onClick={()=>setShowAdd(true)}>+ Ajouter</button>
        </div>
        <div style={{display:"flex",gap:8}}>
          {SIGNALS.map(s=>{
            const count=pantry.filter(i=>i.signal===s.id).length;
            return(
              <div key={s.id} style={{flex:1,textAlign:"center",padding:"8px 4px",borderRadius:10,background:s.bg,border:`1px solid ${s.color}22`,cursor:"pointer",opacity:filterSignal!=="tous"&&filterSignal!==s.id?.4:1}} onClick={()=>setFilterSignal(filterSignal===s.id?"tous":s.id)}>
                <div style={{fontSize:18}}>{s.label.split(" ")[0]}</div>
                <div style={{fontSize:16,fontWeight:900,color:s.color,fontFamily:"'Fraunces',serif"}}>{count}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Alerte anti-gaspi */}
      {redItems.length>0&&(
        <div style={{background:"rgba(212,96,74,.1)",border:`1.5px solid rgba(212,96,74,.3)`,borderRadius:12,padding:"10px 14px",marginBottom:12,display:"flex",gap:10,alignItems:"flex-start"}}>
          <span style={{fontSize:20,flexShrink:0}}>⚠️</span>
          <div>
            <div style={{fontSize:13,fontWeight:700,color:DNG,marginBottom:3}}>À utiliser rapidement !</div>
            <div style={{fontSize:11,color:TXT2}}>{redItems.map(i=>i.name).join(", ")}</div>
            <div style={{fontSize:11,color:TXT3,marginTop:4,cursor:"pointer",fontWeight:600,textDecoration:"underline"}} onClick={()=>setTab("recettes")}>
              Voir les recettes suggérées →
            </div>
          </div>
        </div>
      )}

      {/* Onglets */}
      <div style={{display:"flex",gap:4,background:"rgba(255,255,255,.6)",borderRadius:12,padding:3,marginBottom:12}}>
        {[{id:"inventaire",label:"📦 Inventaire"},{id:"recettes",label:"🍽️ Recettes faisables"}].map(t=>(
          <div key={t.id} style={{flex:1,padding:"8px 4px",textAlign:"center",fontSize:11,fontWeight:700,borderRadius:9,background:tab===t.id?SURF:"transparent",color:tab===t.id?CARAMEL:TXT3,cursor:"pointer"}} onClick={()=>setTab(t.id)}>
            {t.label}{t.id==="recettes"&&recipesWithScore.length>0&&<span style={{marginLeft:4,background:CARAMEL2,color:"white",borderRadius:10,padding:"1px 6px",fontSize:9}}>{recipesWithScore.length}</span>}
          </div>
        ))}
      </div>

      {/* TAB INVENTAIRE */}
      {tab==="inventaire"&&(
        <>
          {pantry.length===0?(
            <div style={{textAlign:"center",padding:"48px 20px"}}>
              <div style={{fontSize:48,marginBottom:12}}>📦</div>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:6,color:TXT}}>Placard vide</div>
              <div style={{fontSize:13,color:TXT3,marginBottom:16}}>Ajoutez vos produits pour suivre votre stock et éviter le gaspillage</div>
              <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
                <button style={{...btn("acc"),fontSize:12}} onClick={()=>setShowAdd(true)}>✏️ Ajouter manuellement</button>
                <button style={{...btn("out"),fontSize:12}} onClick={()=>setShowScan(true)}>📷 Scanner une photo</button>
              </div>
            </div>
          ):(
            <>
              {/* Filtre signal */}
              <div style={{display:"flex",gap:5,marginBottom:10,overflowX:"auto",scrollbarWidth:"none"}}>
                {[{id:"tous",label:"Tous",count:pantry.length},...SIGNALS.map(s=>({id:s.id,label:s.label,count:pantry.filter(i=>i.signal===s.id).length}))].map(f=>(
                  <div key={f.id} style={{flexShrink:0,padding:"4px 10px",borderRadius:20,fontSize:11,fontWeight:700,background:filterSignal===f.id?CARAMEL2:"rgba(255,255,255,.8)",color:filterSignal===f.id?"white":TXT2,cursor:"pointer",border:`1px solid ${filterSignal===f.id?CARAMEL2:BDR}`,whiteSpace:"nowrap"}} onClick={()=>setFilterSignal(f.id)}>
                    {f.label} ({f.count})
                  </div>
                ))}
              </div>
              {Object.keys(byCat).length===0?(
                <div style={{textAlign:"center",padding:"24px",color:TXT3,fontSize:12}}>Aucun article dans cette catégorie</div>
              ):Object.entries(byCat).map(([cat,items])=>(
                <div key={cat}>
                  <SecTitle>{cat}</SecTitle>
                  {items.map(item=>(
                    <PantryItem key={item.id} item={item} onDel={delItem} onSignal={updateSignal} onAddToListe={addToListe}/>
                  ))}
                </div>
              ))}
              <button style={{...btn("gh"),width:"100%",fontSize:11,marginTop:8,justifyContent:"center"}} onClick={()=>setShowAdd(true)}>+ Ajouter un article</button>
              <button style={{...btn("gh"),width:"100%",fontSize:11,marginTop:6,justifyContent:"center"}} onClick={()=>setShowScan(true)}>📷 Scanner une photo</button>
            </>
          )}
        </>
      )}

      {/* TAB RECETTES FAISABLES */}
      {tab==="recettes"&&(
        <>
          {recipesWithScore.length===0?(
            <div style={{textAlign:"center",padding:"40px 20px"}}>
              <div style={{fontSize:40,marginBottom:10}}>🍽️</div>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:16,color:TXT,marginBottom:6}}>Aucune recette trouvée</div>
              <div style={{fontSize:12,color:TXT3,marginBottom:14}}>Ajoutez des produits à votre placard pour voir les recettes réalisables</div>
              <button style={{...btn("gh"),fontSize:12,marginBottom:8}} onClick={()=>setTab("inventaire")}>← Retour à l'inventaire</button>
              <button style={{...btn("acc"),fontSize:12,width:"100%",justifyContent:"center",marginTop:4}} onClick={()=>setShowAIFromPantry(true)}>🤖 Créer une recette avec mon placard</button>
            </div>
          ):(
            <>
              <div style={{fontSize:12,color:TXT2,marginBottom:8}}>Recettes triées par ingrédients disponibles dans votre placard :</div>
              <button style={{...btn("acc"),width:"100%",justifyContent:"center",fontSize:11,marginBottom:10,padding:"8px"}} onClick={()=>setShowAIFromPantry(true)}>🤖 Créer une recette IA avec mon placard</button>
              {recipesWithScore.map(recipe=>(
                <div key={recipe.id} style={{...card,background:"rgba(255,255,255,.9)",marginBottom:8}}>
                  <div style={{display:"flex",gap:10,alignItems:"center"}}>
                    <div style={{width:44,height:44,borderRadius:10,background:`linear-gradient(135deg,${CREAM2},${BDR})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,flexShrink:0}}>{guessRecipeEmoji(recipe.name)}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:700,color:TXT,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{recipe.name}</div>
                      <div style={{fontSize:11,color:TXT2,marginTop:2}}>
                        {recipe.duration&&<span style={{marginRight:8}}>⏱️ {recipe.duration}</span>}
                        {recipe.persons&&<span>👥 {recipe.persons} pers.</span>}
                      </div>
                    </div>
                    <div style={{textAlign:"center",flexShrink:0}}>
                      <div style={{fontSize:15,fontWeight:900,color:recipe.score.pct>=70?SUC:recipe.score.pct>=40?CARAMEL:TXT3,fontFamily:"'Fraunces',serif"}}>{recipe.score.pct}%</div>
                      <div style={{fontSize:9,color:TXT3,fontWeight:600}}>{recipe.score.matched}/{recipe.score.total}</div>
                    </div>
                  </div>
                  <div style={{height:4,background:CREAM2,borderRadius:2,marginTop:8,overflow:"hidden"}}>
                    <div style={{height:"100%",width:recipe.score.pct+"%",background:recipe.score.pct>=70?SUC:recipe.score.pct>=40?CARAMEL:TXT3,borderRadius:2,transition:"width .3s"}}/>
                  </div>
                  <button style={{...btn("out"),width:"100%",fontSize:11,justifyContent:"center",marginTop:8,padding:"7px"}} onClick={goToRecettes}>
                    Voir la recette →
                  </button>
                </div>
              ))}
            </>
          )}
        </>
      )}

      {showAdd&&<AddPantryItemModal onClose={()=>setShowAdd(false)} onSave={(item)=>{const nd={...db,pantry:[...pantry,{id:Date.now()+Math.random(),...item}]};setDb(nd);setShowAdd(false);showToast("✅ "+item.name+" ajouté au placard");}} showToast={showToast}/>}
      {showScan&&<ScanPantryModal onClose={()=>setShowScan(false)} onSave={(items)=>{const nd={...db,pantry:[...pantry,...items.map(i=>({id:Date.now()+Math.random(),...i}))]};setDb(nd);setShowScan(false);showToast(`✅ ${items.length} article${items.length>1?"s":""} ajouté${items.length>1?"s":""}`);}} showToast={showToast}/>}
      {showAIFromPantry&&(
        <Modal open onClose={()=>setShowAIFromPantry(false)}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:18,marginBottom:8,color:TXT}}>🤖 Recette depuis le placard</div>
          <div style={{fontSize:12,color:TXT2,marginBottom:12,lineHeight:1.5}}>
            L'IA va analyser les <strong>{pantry.length} produits</strong> de votre placard et créer une recette sur mesure.
          </div>
          <div style={{background:CREAM2,borderRadius:10,padding:"10px 12px",marginBottom:16,fontSize:11,color:TXT3}}>
            <strong>Ingrédients utilisables :</strong><br/>{pantry.slice(0,8).map(i=>i.name).join(", ")}{pantry.length>8&&` … +${pantry.length-8} autres`}
          </div>
          {pantryAILoading?(
            <div style={{textAlign:"center",padding:"16px",fontSize:13,color:TXT3}}>⏳ Création de la recette en cours…</div>
          ):(
            <div style={{display:"flex",flexDirection:"column",gap:8}}>

function ScanPantryModal({onClose,onSave,showToast}){

    const apiKey=localStorage.getItem("ws_apikey")||"";

Pour chaque produit détecté, évalue son état apparent :

Exemples de noms génériques : "lait", "œufs", "beurre", "carottes", "yaourt nature"`;

function getWeekDates(offset){
  const now=new Date();
  const day=now.getDay();
  const monday=new Date(now);
  monday.setDate(now.getDate()-(day===0?6:day-1)+(offset||0)*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d;});
}
